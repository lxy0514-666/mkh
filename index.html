*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--text);
  font-family:var(--sans);font-size:16px;line-height:1.65;
  overflow-x:hidden;
}
body.mod-open{background:var(--paper)}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ================= 封面 ================= */
.hero{
  position:relative;isolation:isolate;
  height:82vh;height:82svh;min-height:520px;max-height:760px;
  display:flex;flex-direction:column;justify-content:space-between;
  overflow:hidden;background:var(--ink);
}
.hero-media{
  position:absolute;inset:0;z-index:-2;
  background-image:var(--hero);background-size:cover;background-position:center 46%;
  filter:brightness(1.26) contrast(1.06) saturate(.95);
}
.hero::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:
    linear-gradient(180deg,rgba(11,14,16,.74) 0%,rgba(11,14,16,.12) 22%,rgba(11,14,16,.20) 52%,rgba(11,14,16,.88) 88%,#0B0E10 100%),
    radial-gradient(95% 62% at 50% 64%,rgba(228,169,58,.15),rgba(11,14,16,0) 72%);
}
.hero-top{
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(18px + env(safe-area-inset-top)) 20px 0;
  font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:#D7DBD6;
}
.hero-top .dim{color:#9AA1A0}
.hero-top .dot{color:var(--amber)}
.hero-main{padding:0 20px 0}
.hero-kicker{
  margin:0 0 14px;font-size:12px;letter-spacing:.16em;color:#C8CDC7;
  display:flex;align-items:center;gap:10px;
}
.hero-kicker .rule{width:26px;height:1px;background:var(--amber);flex:none}
h1.hero-title{margin:0;font-weight:800;letter-spacing:-.015em;line-height:1.1;color:#F4F5F1}
h1.hero-title .l1{display:block;font-size:clamp(34px,11.6vw,54px)}
h1.hero-title .l2{display:block;margin-top:8px;font-size:clamp(19px,5.6vw,26px);font-weight:600;letter-spacing:.01em;color:#E7E9E4}
.hero-sub{
  margin:16px 0 0;max-width:28em;font-size:13px;line-height:1.75;color:#B9BFBA;
}
.hero-stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  margin:22px 0 0;border-top:1px solid rgba(228,169,58,.34);border-bottom:1px solid rgba(255,255,255,.14);
}
.hero-stats div{padding:12px 0 11px;border-right:1px solid rgba(255,255,255,.10)}
.hero-stats div:last-child{border-right:0;padding-left:12px}
.hero-stats div:first-child{padding-left:0}
.hero-stats .n{display:block;font-family:var(--mono);font-size:24px;line-height:1.1;color:#F4F5F1;font-variant-numeric:tabular-nums}
.hero-stats .k{margin-top:4px;display:block;font-size:10.5px;letter-spacing:.08em;color:#A8AFA9}
.hero-foot{
  padding:0 20px calc(22px + env(safe-area-inset-bottom));
}
.hero-cta{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;padding:15px 18px;background:var(--amber);color:#14100A;
  font-size:15px;font-weight:700;letter-spacing:.02em;border-radius:2px;
  box-shadow:0 10px 30px -12px rgba(228,169,58,.55);
}
.hero-cta:active{transform:translateY(1px);background:#D69C2D}
.hero-cta .lbl{display:flex;flex-direction:column;gap:2px}
.hero-cta .lbl small{font-weight:500;font-size:11px;letter-spacing:.06em;color:#5B4615}
.hero-cta svg{flex:none;width:20px;height:20px}
.hero-scroll{
  margin-top:14px;display:flex;align-items:center;gap:8px;
  font-size:10.5px;letter-spacing:.12em;color:#7E8783;
}
.hero-scroll .bar{width:1px;height:16px;background:linear-gradient(#7E8783,transparent);animation:drop 2.4s ease-in-out infinite}
@keyframes drop{0%,100%{opacity:.35;transform:translateY(-3px)}50%{opacity:1;transform:translateY(2px)}}

/* ================= 目录 ================= */
.dir{padding:0 0 40px;background:var(--paper)}
.seam{height:4px;background:var(--ink);position:relative}
.seam::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--amber);opacity:.65}
.dir-head{
  position:sticky;top:0;z-index:20;background:rgba(233,235,230,.94);
  border-bottom:1px solid var(--line);
  padding:14px 20px 12px;
}
@supports (-webkit-backdrop-filter:blur(8px)) or (backdrop-filter:blur(8px)){
  .dir-head{background:rgba(233,235,230,.86);-webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1)}
}
.dir-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.dir-title .t{font-size:17px;font-weight:800;letter-spacing:.01em}
.dir-title .c{font-family:var(--mono);font-size:11px;color:var(--text-2);letter-spacing:.05em}
.search-wrap{position:relative;display:flex;align-items:center}
.search-ico{position:absolute;left:12px;width:16px;height:16px;color:var(--text-3);pointer-events:none}
#q{
  width:100%;height:44px;padding:0 44px 0 36px;font-size:16px;font-family:var(--sans);
  color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:2px;
  -webkit-appearance:none;appearance:none;
}
#q::placeholder{color:#8E969A;font-size:13.5px}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;display:none}
#q:focus{border-color:var(--ink);outline:none;background:#FAFAF6}
.search-clear{
  position:absolute;right:6px;width:34px;height:34px;display:none;
  align-items:center;justify-content:center;color:var(--text-2);font-size:18px;
}
.search-clear.on{display:flex}
.search-tip{margin:8px 0 0;font-size:11px;color:var(--text-3);letter-spacing:.02em}

.parts{padding:14px 14px 0}
.part{
  border:1px solid var(--line);border-bottom-width:0;background:var(--card);
}
.part:last-of-type{border-bottom-width:1px}
.part + .part{margin-top:0}
.part[data-open="1"]{background:#F7F8F4}
.part-hd{
  display:grid;grid-template-columns:44px 1fr 26px;align-items:center;gap:10px;
  width:100%;padding:15px 12px 15px 0;
}
.part-no{
  font-family:var(--mono);font-size:22px;font-weight:600;line-height:1;color:var(--ink);
  padding-left:13px;letter-spacing:-.02em;
}
.part-hd[data-open="0"] .part-no{}
.part[data-open="0"] .part-no{color:var(--ink-3)}
.p-main{min-width:0}
.p-name{display:block;font-size:16.5px;font-weight:700;line-height:1.3;letter-spacing:.01em}
.p-meta{display:block;margin-top:4px;font-family:var(--mono);font-size:11px;color:var(--text-2);letter-spacing:.03em}
.p-ico{position:relative;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;justify-self:end}
.p-ico::before,.p-ico::after{content:"";position:absolute;background:var(--text);transition:transform .24s ease}
.p-ico::before{left:50%;top:50%;width:9px;height:1.5px;transform:translate(-50%,-50%)}
.p-ico::after{left:50%;top:50%;width:1.5px;height:9px;transform:translate(-50%,-50%)}
.part[data-open="1"] .p-ico{background:var(--ink);border-color:var(--ink)}
.part[data-open="1"] .p-ico::before,.part[data-open="1"] .p-ico::after{background:var(--amber)}
.part[data-open="1"] .p-ico::after{transform:translate(-50%,-50%) scaleY(0)}
.part-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.72,.2,1)}
.part[data-open="1"] .part-body{grid-template-rows:1fr}
.pb-inner{overflow:hidden;min-height:0}
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:1px dashed var(--line)}
.grp-hd{
  display:grid;grid-template-columns:3px 1fr auto 22px;align-items:center;gap:11px;
  width:100%;padding:13px 12px 13px 0;padding-left:0;
}
.grp-rail{grid-column:1;width:3px;height:22px;align-self:center}
.grp-hd[data-lv="A"] .grp-rail{background:var(--red)}
.grp-hd[data-lv="B"] .grp-rail{background:var(--orange)}
.grp-hd[data-lv="C"] .grp-rail{background:var(--blue)}
.grp-name{font-size:14px;font-weight:600;letter-spacing:.01em;padding-left:0}
.grp-hd[data-lv="A"] .grp-name{color:var(--red)}
.grp-hd[data-lv="B"] .grp-name{color:var(--orange)}
.grp-hd[data-lv="C"] .grp-name{color:var(--blue)}
.grp-n{font-family:var(--mono);font-size:11px;color:var(--text-2);padding-right:2px}
.chev{width:7px;height:7px;border-right:1.5px solid var(--text-2);border-bottom:1.5px solid var(--text-2);transform:rotate(45deg) translate(-1px,-1px);transition:transform .24s ease}
.grp[data-open="1"] .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.grp-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.2,.72,.2,1)}
.grp[data-open="1"] .grp-body{grid-template-rows:1fr}
.mod-list{list-style:none;margin:0;padding:0 0 4px;overflow:hidden;min-height:0}
.mod{
  display:block;border-top:1px solid rgba(196,200,192,.7);
  border-left:3px solid transparent;
}
.mod a{
  display:grid;grid-template-columns:auto 1fr 14px;align-items:center;gap:10px;
  padding:13px 12px 13px 14px;min-height:52px;
}
.mod:active{background:rgba(11,14,16,.05)}
.mod-code{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--text-2);
  align-self:start;margin-top:3px;padding:1px 6px;border:1px solid var(--line);border-radius:1px;background:#EAEBE5;
}
.mod-name{font-size:14px;line-height:1.5;font-weight:500;color:var(--text)}
.mod-go{font-size:16px;color:var(--text-3);justify-self:end;line-height:1}
.mod[data-lv="A"] .mod-code{color:var(--red);border-color:#D9BEB9;background:var(--red-soft)}
.mod[data-lv="B"] .mod-code{color:var(--orange);border-color:#DFC7A6;background:var(--orange-soft)}
.mod[data-lv="C"] .mod-code{color:var(--blue);border-color:#B6C9DA;background:var(--blue-soft)}

/* 搜索结果 */
.results{padding:6px 14px 0}
.res-group{margin-bottom:20px}
.res-bc{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0 0 7px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.05em;color:var(--text-3);
}
.res-bc .rv{font-size:10.5px}
.res-bc .rv[data-lv="A"]{color:var(--red)}
.res-bc .rv[data-lv="B"]{color:var(--orange)}
.res-bc .rv[data-lv="C"]{color:var(--blue)}
.res-item{display:block;border-top:1px solid var(--line);padding:12px 2px 13px}
.res-item .rn{display:flex;gap:8px;align-items:baseline}
.res-item .rc{font-family:var(--mono);font-size:11px;color:var(--text-2);flex:none}
.res-item .rt{font-size:14.5px;font-weight:600;line-height:1.45}
.res-item .rx{
  margin-top:7px;font-size:12.5px;line-height:1.7;color:var(--text-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.res-item .rx mark{background:rgba(228,169,58,.35);color:inherit;padding:0 1px}
.empty{padding:46px 20px;text-align:center;color:var(--text-2);font-size:13.5px;line-height:1.9}
.empty .big{display:block;font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px}

/* ================= 正文 ================= */
.doc{background:var(--paper)}
.doc-bar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(9px + env(safe-area-inset-top)) 14px 9px;
  background:var(--ink);color:#E9EBE6;border-bottom:1px solid rgba(228,169,58,.38);
}
.doc-bar .back{display:flex;align-items:center;gap:5px;font-size:13px;color:#DDE1DC;padding:6px 2px;flex:none}
.doc-bar .back svg{width:15px;height:15px}
.doc-bar .bar-code{font-family:var(--mono);font-size:11.5px;color:var(--amber);letter-spacing:.05em;margin-left:auto}
.badge{
  font-size:10.5px;font-family:var(--mono);letter-spacing:.04em;padding:3px 7px;border-radius:1px;
}
.badge[data-lv="A"]{background:rgba(176,51,42,.18);color:#F0B7B1;border:1px solid rgba(176,51,42,.5)}
.badge[data-lv="B"]{background:rgba(192,106,24,.18);color:#F2CE9F;border:1px solid rgba(192,106,24,.5)}
.badge[data-lv="C"]{background:rgba(27,87,142,.20);color:#B7CFE6;border:1px solid rgba(27,87,142,.55)}

.doc-hero{padding:26px 20px 18px;border-bottom:1px solid var(--line)}
.doc-title{margin:0;font-size:clamp(21px,6.2vw,27px);font-weight:800;line-height:1.36;letter-spacing:-.01em}
.doc-title .code{display:block;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--text-2);margin-bottom:9px}
.doc-meta{margin:12px 0 0;font-family:var(--mono);font-size:11px;color:var(--text-2);letter-spacing:.03em;line-height:1.9}
.doc-nav{
  display:flex;gap:0;margin:16px -20px -18px;padding:0 20px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.doc-nav::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:11px 12px 12px;margin-right:14px;font-size:12px;color:var(--text-2);
  font-family:var(--mono);letter-spacing:.02em;border-bottom:2px solid transparent;white-space:nowrap;
}
.chip.on{color:var(--text);font-weight:700;border-bottom-color:var(--amber)}

.doc-body{padding:8px 20px 30px}
.chapter{border-bottom:1px solid var(--line);padding-bottom:8px}
.chapter:last-child{border-bottom:0}
.chap-hd{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  width:100%;padding:24px 0 12px;border-bottom:1px solid var(--ink);margin-bottom:2px;
}
.chap-hd .ct{font-size:16px;font-weight:800;letter-spacing:.01em;line-height:1.4}
.chap-hd .cn{font-family:var(--mono);font-size:10.5px;color:var(--text-3);flex:none}
.chap-body{padding-top:4px}
.chap[data-open="0"] .chap-body{display:none}
.sec{margin:20px 0 0}
.sec:first-child{margin-top:6px}
.sec-hd{display:flex;align-items:center;gap:9px;margin:0 0 9px}
.sec-hd .mark{width:5px;height:5px;background:var(--ink);flex:none;transform:rotate(45deg)}
.sec-hd .st{font-size:14.5px;font-weight:700;letter-spacing:.02em}
.paras{margin:0}
.p{margin:0 0 9px;font-size:16px;line-height:1.85;color:#222A2E;letter-spacing:.005em;word-wrap:break-word;overflow-wrap:break-word}
.p.li{padding-left:1.62em;position:relative}
.p.li .no{position:absolute;left:0;top:0;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-2);line-height:2.3}
.p .lead{font-weight:700}
.p.flow{font-size:14.5px;line-height:2.05;padding:12px 14px;background:#E2E4DE;border-left:3px solid var(--amber);color:#232B2F}
.p.tight{margin-bottom:4px}

.doc-foot{
  margin:6px 20px 0;padding:18px 0 calc(86px + env(safe-area-inset-bottom));border-top:1px solid var(--ink);
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.doc-foot a{
  display:block;padding:13px 12px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;line-height:1.6;min-height:70px;
}
.doc-foot a.next{text-align:right}
.doc-foot .k{display:block;font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.06em;margin-bottom:4px}
.doc-foot .v{display:block;font-weight:600}
.doc-foot a.dis{opacity:.45;pointer-events:none}

.fab{
  position:fixed;right:14px;
  bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;
  display:flex;align-items:center;gap:6px;padding:10px 14px;
  background:rgba(11,14,16,.93);color:#EDEFEA;font-size:12.5px;letter-spacing:.03em;
  border-radius:2px;box-shadow:0 12px 30px -12px rgba(0,0,0,.6);
}
.fab svg{width:14px;height:14px;color:var(--amber)}
.fab:active{transform:translateY(1px)}

/* 目录底部信息 */
.foot{padding:34px 20px 46px;border-top:1px solid var(--line);margin-top:22px}
.foot .ft{font-size:11px;font-family:var(--mono);letter-spacing:.08em;color:var(--text-3)}
.foot p{margin:8px 0 0;font-size:12px;line-height:1.9;color:var(--text-2)}

@media (min-width:768px){
  .hero-inner{max-width:640px;margin:0 auto;width:100%}
  .hero-top,.hero-main,.hero-foot{max-width:640px;margin-left:auto;margin-right:auto;width:100%}
  .hero{height:78vh;min-height:620px;max-height:820px}
  .hero-kicker{margin-bottom:18px}
  .hero-sub{font-size:14px;line-height:1.8}
  .hero-stats .n{font-size:30px}
  .hero-cta{padding:17px 20px;font-size:16px}
  .parts{padding:20px 24px 0;max-width:720px;margin:0 auto}
  .dir-head,.doc-hero,.doc-body,.doc-foot,.results{max-width:720px;margin-left:auto;margin-right:auto}
  .mod:hover{background:rgba(11,14,16,.04)}
  .part-hd:hover .p-name{text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:4px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;animation-iteration-count:1 !important}
}
</style>
</head>
<body>

<!-- ================= 封面 ================= -->
<header class="hero" id="top">
  <div class="hero-media" aria-hidden="true"></div>
  <div class="hero-top">
    <span class="mono">2026 / 中煤新登郑州煤业有限公司</span>
    <span class="mono dim">六大专业 <span class="dot">·</span> 三级风险</span>
  </div>
  <div class="hero-inner">
    <div class="hero-main">
      <p class="hero-kicker"><span class="rule"></span>作业模块化管理</p>
      <h1 class="hero-title">
        <span class="l1">作业模块化</span>
        <span class="l2">流程及管控措施汇编</span>
      </h1>
      <p class="hero-sub">包括采煤、掘进、维修、机电、运输、通风六大专业</p>
      <div class="hero-stats">
        <div><span class="n">6</span><span class="k">专业方向</span></div>
        <div><span class="n">3</span><span class="k">风险等级</span></div>
        <div><span class="n">104</span><span class="k">作业模块</span></div>
      </div>
    </div>
    <div class="hero-foot">
      <a class="hero-cta" href="#catalog">
        <span class="lbl">按专业选择模块<small>点击展开风险分级 → 进入作业模块</small></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg>
      </a>
      <div class="hero-scroll"><span class="bar"></span>向下选择专业</div>
    </div>
  </div>
</header>

<!-- ================= 目录 ================= -->
<section class="dir" id="catalog">
  <div class="seam" aria-hidden="true"></div>
  <div class="dir-head">
    <div class="dir-title">
      <span class="t">作业模块目录</span>
      <span class="c" id="dirCount">104 个模块</span>
    </div>
    <div class="search-wrap">
      <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="搜编号或作业名称，如 支架、停送电" aria-label="搜索作业模块">
      <button class="search-clear" id="qClear" aria-label="清空搜索">×</button>
    </div>
    <p class="search-tip" id="searchTip">输入编号（如 CM-A-01）或作业名称，可直接定位</p>
  </div>
  <div class="parts" id="parts"></div>
  <div class="results" id="results" hidden></div>
  <section class="foot">
    <div class="ft">使用说明</div>
    <p>点开专业 → 点开风险分级 → 点击模块名称，进入该模块的完整流程与管控措施。</p>
    <p>在搜索框输入关键词进行检索。</p>
  </section>
</section>

<!-- ================= 正文 ================= -->
<main class="doc" id="doc" hidden>
  <div class="doc-bar">
    <a class="back" href="#" id="backTop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5L8 12l7 7"/></svg>
      目录
    </a>
    <span class="badge" id="docBadge" data-lv="A">高风险</span>
    <span class="bar-code" id="docBarCode">CM-A-01</span>
  </div>
  <div class="doc-hero">
    <h1 class="doc-title" id="docTitle"></h1>
    <p class="doc-meta" id="docMeta"></p>
    <nav class="doc-nav" id="docNav" aria-label="章节导航"></nav>
  </div>
  <div class="doc-body" id="docBody"></div>
  <div class="doc-foot" id="docFoot"></div>
</main>
<a class="fab" id="fab" href="#" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  返回目录
</a>

<script>
const DATA = {"meta":{"title":"2026 作业模块化流程及管控措施汇编","parts":6,"groups":17,"modules":104,"chars":259189,"paras":5810,"dupCodes":[],"noChapter":[]},"parts":[{"t":"第一部分 采煤作业模块","g":[{"t":"一、高风险-红色-A段（6项）","lv":"A","m":[{"c":"CM-A-01","n":"超前液压支架安装","t":"CM-A-01 超前液压支架安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面超前液压支架安装作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝支架倾倒、管路喷液、构件坠落、吊装失稳、挤夹伤害等安全隐患，提升超前液压支架安装施工质量与现场安全管理水平，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面超前液压支架安装全过程作业及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先支护、后安装；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章   超前液压支架安装施工模块","s":[{"t":"一、模块概述","p":["模块编号：CMA-01","模块名称：超前液压支架安装","所属专业：采煤","适用范围：所有作业人员"]},{"t":"二、危险预知及防控","p":["1.支架倾倒、滑移伤人：安装前加固巷道支护，严禁在支架倾倒、滑移范围内停留、通行。","2.液压管路爆管、喷液伤人：高压胶管连接前确认系统卸压，接口对接到位再升压，严禁带压拆装、试压，高压出口严禁正对人员。","3.部件坠落、磕碰伤人：顶梁吊装位置牢靠，连接件紧固到位，人工假顶牢固可靠，禁止交叉作业。","4.销轴、连接件弹出伤人：安装销轴、螺栓时站位合理，使用专用工具，安装过程中销轴下方严禁站人。","5.起重吊装失稳伤人：手拉葫芦、固定装置完好可靠，严禁超载使用、现场班组长统一指挥。","6.顶板掉矸、片帮伤人：严格执行敲帮问顶，及时处理危岩活矸，单体液压支柱漏液或支护不到位严禁作业。","7.机械挤压、夹伤：支架调整、升降、推移时，手脚严禁伸入架体间隙、接触面及支架前方、两侧危险区。"]},{"t":"三、作业条件安全确认","p":["1.环境：顶板完整、无离层掉矸，煤壁无片帮；巷道断面、轨道、底板平整度满足安装要求；通风、照明充足；作业区域设置警戒。","2.设备：待安支架构件齐全完好；液压泵站、管路、阀组完好；起重设备、手拉葫芦、扳手、专用工具完好；索具、吊环、防倒装置检查合格。","3.材料：密封件、销轴、螺栓、连接附件、临时支护材料备齐到位。","4.人员：作业人数满足现场需要，明确互保联保、专人指挥、专人操作，全员熟知作业流程及风险。","5.施工方案：安装顺序、位置、吊装路线、对接精度、初撑力要求严格按专项措施执行。"]},{"t":"四、作业现场人员安全站位","p":["1.支架吊装、就位、调整时，人员站在安全侧，避开支架倾倒、滑移、构件滑落方向。","2.对接液压管路、销轴时，侧身站位，面部、身体严禁正对接口、销孔插接位置。","3.紧固螺栓、调整连接件时，双脚站稳，禁止站在构件受力、回弹范围内。","4.大件起吊、挪移、对接期间，无关人员撤离吊装危险区域，安排专职指挥。","5.支架升降、推移、调架时，人员严禁站在支架顶梁下，两立柱间隙及千斤顶行程范围内。"]},{"t":"五、标准化作业流程","p":["风险辨识→隐患整改→安全确认→支设“人工假顶”→固定起吊工具→运输液压支架底座→起吊液压支架顶梁（安装顶梁与连接杆销轴）→使用防护链捆绑（使用单体液压支柱加固顶梁）→安装双向立柱→安装高压胶管→安装立柱柱顶销→升紧双向立柱→检查液压支架顶梁与底座牢固→使用刮板链固定液压支架顶梁→支设护身单体液压支柱"]},{"t":"六、作业质量标准","p":["1.支架安装：位置、间距、直线度符合设计，偏差≤±50mm；底座平整、顶梁背实无悬空、倾斜。","2.连接装配：销轴齐全紧固，无松动、缺失；接口贴合到位，高压胶管密封完好无渗漏。","3.液压系统：管路连接正确、固定牢靠，无扭曲、挤压；试压无渗漏，阀组动作灵敏可靠。","4.支护性能：初撑力符合作业规程要求，接顶严密无空顶；防倒、防滑装置安装齐全、固定牢固。","5.现场文明：物料码放整齐，退路畅通，无杂物、无安全隐患。"]},{"t":"七、安全管控措施","p":["1.帮顶与退路管控：班组长检查帮顶完好，执行“敲帮问顶”，清理作业点前后5m杂物，确保退路畅通。","2.起吊机具管控：按部件重量选配手拉葫芦，挂于完好U型钢顶梁，逐台检查并试吊；吊钩及挂钩必须用150C刮板链+专用连接环+螺丝闭锁，严禁用钢丝绳、铁丝等代用；专人专工具，禁止1人操作多台。","3.支架固定管控：前端缠绕2根150C刮板链，后端销孔穿1根，前端分开吊挂（不得同链），后端用连接环螺丝固定销孔。","4.临时防护管控：超前支架起吊达2.0m时，须设不少于4根单体支柱（左右各≥2根，前后各≥1根）进行临时防护；未加固或未防护时，严禁人员从支架下方通过或作业。","5.单体支柱管控：加固时必须绑防倒绳，底板松软加鞋板；作临时支护时，支柱与顶梁间加木楔防滑。卸载须经班组长允许，确认手拉葫芦牢靠后，侧身用长工具操作。","6.肢体防护管控：安装销子时手指不得伸入销孔内；作业时手、脚严禁置于顶梁下方。","7.液压系统管控：使用后悬挂于支柱手柄，不用即摘，严禁卡在三用阀上；注液时枪阀固定牢靠，堵塞先关支管阀门、卸压后再处理；安装高压胶管前，必须关闭总阀、打开卸压阀确认无压后操作。","8.搬运协同管控：抬运单体支柱、π型钢梁等重物时，多人协同，轻抬轻放，防止碰伤砸伤。","9.验收闭环管控：施工结束后由相关责任单位进行验收，验收通过后方可正常使用。"]}]}],"w":2160,"cn":3,"sn":12},{"c":"CM-A-02","n":"超前液压支架拆卸","t":"CM-A-02 超前液压支架拆卸模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面超前液压支架拆卸作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝支架倾倒、管路喷液、物件坠落、吊装失稳等安全隐患，提升超前液压支架拆卸施工质量与现场安全管理水平，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面超前液压支架拆卸全过程作业及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后拆卸；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：施工安全技术措施编制、风险辨识、技术交底、安全技术措施落实、考核、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督、落实模块化内容，针对部分作业提出合理化建议。","班组长：落实模块化作业流程、配合副队长做好现场安全管理。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 超前液压支架拆卸模块","s":[{"t":"一、模块概述","p":["模块编号：CM-A-02","模块名称：超前液压支架拆卸","所属专业：采煤","适用范围：所有作业人员"]},{"t":"二、危险预知及防控","p":["1.支架倾倒、滑移伤人：拆卸前加固支护，设置防倒防滑装置，严禁在支架倾倒范围内停留、通行。","2.液压管路爆管、喷液伤人：拆管前彻底卸压，严禁带压拆装管路，液压管禁止正对人员。","3.物件坠落、磕碰伤人：大件捆绑牢固，吊装点合规，下方设置警戒区，禁止交叉作业。","4.销轴、连接件弹出伤人：拆卸销轴、销子时人员站位合理，使用专用工具，禁止正对销孔操作。","5.起重吊装失稳伤人：吊具、索具完好合规，严禁超载吊装，指挥信号统一规范。","6.顶板掉矸、片帮伤人：提前排查作业地点巷道支护完好状况，及时敲帮问顶，支护不到位严禁作业。","7.机械挤压、夹伤：调整支架姿态时，手脚严禁伸入构件间隙、接触面。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：顶板完整、无离层掉矸，煤壁无片帮；巷道空间满足拆卸、转运要求；通风、照明充足；作业区域设置警戒。","2.设备确认：待拆支架液压系统完好，液压泵站、管路无破损；手拉葫芦、手镐、撬棍等工具完好；索具、吊环、防倒装置检查合格。","3.材料确认：封堵堵头、密封件、捆绑绳索、临时支护材料、防滑木楔等备齐到位。","4.人员确认：作业人员持证上岗，不少于2人配合作业，明确互保联保、专人指挥，全员熟知作业流程及风险。","5.技术确认：拆卸顺序、吊装路线、临时固定方式严格按照专项安全技术措施执行。"]},{"t":"四、作业现场人员安全站位","p":["1.支架动作、吊装作业时，人员站在安全侧，避开支架倾倒、构件滑落、管路喷液方向。","2.拆装液压管路、销轴时，侧身站位，面部、身体严禁正对接口、销孔位置。","3.撬动、拆卸连接件时，双脚站稳，禁止站在构件受力、回弹范围内。","4.大件起吊、挪移期间，全员撤离吊装半径及危险区域，只留专职指挥人员。","5.调整支架位置、收放千斤顶时，手脚不得伸入架体间隙。"]},{"t":"五、标准化作业流程","p":["风险辨识→隐患整改→安全确认→加固“人工假顶”→固定起吊工具→固定支架顶梁→支设护身单体液压支柱→拆卸立柱柱顶销→拆卸双向立柱→使用单体液压支柱加固→运输液压支架底座→下落支架顶梁"]},{"t":"六、作业质量标准","p":["1.管路拆卸：所有接口封堵严实，无杂物进入阀体、油缸，密封件分类收纳完好。","2.构件拆卸：销轴、螺栓、配件齐全无损，分类编号摆放，无丢失、无变形损坏。","3.捆绑吊装：捆绑点位符合要求，手拉葫芦张紧均匀，构件无歪斜、磨损、变形。","4.临时固定：未转运部件防倒、防滑措施牢靠，摆放平稳，重心稳固。","5.现场文明：作业完毕物料码放整齐，巷道畅通，无杂物、无安全隐患。"]},{"t":"七、安全管控措施","p":["1.作业前帮顶与退路管控：班组长确认帮顶完好，无片帮、冒顶风险；全程执行“敲帮问顶”，清除活碴；清理作业点前后5m杂物，确保退路畅通。","2.起吊机具管控：按部件重量选用匹配手拉葫芦，挂于完好的U型钢顶梁；逐台检查并试吊，禁用不合格工具。吊钩及挂钩须用150C刮板链+专用连接环+螺丝闭锁，严禁用钢丝绳、铁丝等代替；专人专机，严禁1人操作多台葫芦。","3.单体支柱卸载管控：未经班组长允许不得私自卸载；卸载前必须确认葫芦固定牢靠，侧身使用长工具操作。","4.人员防护管控：严禁将手、脚置于顶梁下方，防止砸伤。","5.注液枪使用管控：用后悬挂于支柱手柄，不用时及时摘掉，严禁卡在三用阀上；注液时枪与阀固定牢靠，枪口堵塞须先关闭支管阀门、卸压后再处理，严禁带压操作。","6.高压胶管拆卸管控：先关闭总阀门，打开卸压阀完全卸压并确认无压力后方可拆卸。","7.搬运协同管控：抬运单体支柱、π型钢梁等重物时，多人协同，轻抬轻放，防止碰伤砸伤。","8.验收闭环管控：施工结束后由相关责任单位进行验收，验收通过后方可正常使用。"]}]}],"w":1940,"cn":3,"sn":12},{"c":"CM-A-03","n":"采煤机滚筒更换","t":"CM-A-03 采煤机滚筒更换模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面采煤机滚筒更换作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝滚筒坠落、吊装失稳、机械挤压、管路喷液、顶板掉矸、构件弹出等安全隐患，提升滚筒更换施工质量与现场安全管理水平，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面采煤机滚筒拆卸、安装、全过程作业及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后施工；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 采煤机滚筒更换模块","s":[{"t":"一、模块概述","p":["模块编号：CMA-03","模块名称：采煤机滚筒更换","所属专业：采煤","适用范围：所有作业人员"]},{"t":"二、危险预知及防控","p":["1.滚筒坠落、滑移伤人：吊装前检查起吊工具、索具，全程保持葫芦预紧受力，滚筒起落、挪移平稳，人员严禁处于滚筒下方及运行路线内。","2.带电作业触电伤人：作业前严格断电、闭锁、挂牌、严禁带电拆装、检修设备，停电后上锁。","3.液压系统喷液伤人：拆装端盖、管路前彻底释放系统压力，严禁带压拆卸液压部件，油液喷射方向禁止正对人员。","4.销轴、螺栓、构件弹出伤人：拆装连接件使用专用工具，合理选择站位。","5.吊装失稳、斜拉歪吊伤人：禁止超载起吊、斜向牵拉，统一指挥信号，吊物摆动范围内严禁站人。","6.顶板掉矸、煤壁片帮伤人：作业前后全程敲帮问顶，及时处理危岩、活矸及片帮煤，空顶区域禁止作业。","7.机械挤压、磕碰伤人：摇臂摆动、滚筒对位、设备挪移时，手脚及身体严禁伸入摇臂、滚筒与支架、煤壁间隙处。","8.设备转动误伤：试运转前确认人员全部撤离危险区域，点动试转，禁止人员触碰转动部件。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：采煤机停放在顶板完好、支护齐全、底板平缓，便于安装、运输地段；作业区域无浮煤、浮矸，巷道空间满足吊装、拆装要求；通风、照明良好，作业区设置警戒、滚筒更换间高度、宽度符合更换要求。","2.支护确认：工作面液压支架护帮板（伸缩梁）全部伸出并接顶严实，超前支护到位，无空顶、危帮。","3.工具、设备确认：采煤机断电闭锁、挂牌、上锁；手拉葫芦、专用工具、撬棍等工具齐全完好、起吊工具性能完好，能正常使用。","4.配件确认：新滚筒型号、旋转方向与设备匹配，齿座、截齿、焊缝、连接孔完好；螺栓、定位销、密封件、端盖等附属配件配齐。","5.人员确认：作业人员全部持培训合格证上岗，作业小组人数满足更换要求，明确现场专人指挥、专人吊装、专人拆装，落实互保联保，全员掌握作业流程及风险点。","6.技术措施确认：严格按照专项安全技术措施确定拆装顺序、吊装路线、更换方式。"]},{"t":"四、作业现场人员安全站位","p":["1.滚筒起吊、下落、挪移过程中，所有人员撤离吊装半径及滚筒运行区域，仅留操作人员及专职指挥人员。","2.拆卸、安装销轴、螺栓、端盖时，人员应站在安全地点进行操作。","3.使用撬棍、作业时，双脚站稳，避开工具回弹、滑脱方向。","4.摇臂调整、滚筒对位时，人员站在设备安全侧，严禁站在滚筒与煤壁、支架之间。","5.设备点动试运转时，全员退至安全地点，禁止靠近滚筒、摇臂等转动部位。","6.紧固连接螺栓时，站在平稳牢固位置，不得踩踏设备悬空部位作业。"]},{"t":"五、标准化作业流程","p":["1.拆滚筒施工工序","风险辨识→隐患排查→隐患整改→安全确认→作业地点顶板加固→采煤机停到指定位置→调整滚筒高度→停电闭锁、挂牌、上锁→固定手拉葫芦→固定采煤机滚筒→拆滚筒螺丝→使用单体液压支柱将滚筒顶出（使用伸缩梁将滚筒带出）→移采煤机→外运滚筒","2.安装滚筒施工工序","风险辨识→隐患排查→隐患整改→安全确认→运采煤机滚筒→使用手拉葫芦将滚筒吊起→移采煤机使滚筒位于摇臂前→调整采煤机摇臂位置与滚筒安装位置一致→使用单体液压支柱将滚筒顶入（使用伸缩梁将滚筒带入）→固定滚筒螺丝→摘除手拉葫芦→解锁、摘牌、送电，启动采煤机调试→停电闭锁→清理作业地点杂物"]},{"t":"六、作业质量标准","p":["1.滚筒装配：滚筒旋向、型号与采煤机匹配，安装无偏斜、卡阻。","2.连接部件：螺栓、定位销、端盖齐全完好，按照对角顺序分次紧固，力矩符合设备技术要求，无松动、缺失。","3.截齿组件：截齿、齿座完好齐全，安装牢固，无缺损、松动、丢失。","4.液压系统：端盖密封完好，无渗漏油液，管路排布规整，无挤压、扭曲。","5.运转状态：转动灵活，无卡滞、异响；试运转时滚筒无异常摆动、震动，转向正确。","6.现场文明：旧滚筒、废旧配件、工具分类摆放整齐，作业区域浮煤杂物清理干净，作业地点安全退路畅通。"]},{"t":"七、安全管控措施","p":["1.作业前准备与停电闭锁管控：煤壁、顶板未加固不得作业；必须对刮板输送机、采煤机停电、闭锁、挂牌、上锁，未经班组长同意严禁送电；严格执行“敲帮问顶”，清除活煤、矸块。","2.起吊要求：起吊前全面检查手拉葫芦，发现问题先处理；起吊、安装滚筒须使用不少于2台手拉葫芦配合使用，1台起吊1台调向，且必须固定在支架顶梁下方。","3.单体液压支柱使用：支设π型钢梁或单体支柱后，必须用防倒绳捆绑固定；用单体支柱顶滚筒时，支柱必须固定在支架或电缆槽上，并采用远距离操作。","4.风动扳手：高压胶管接头必须使用合格U型卡固定，严禁用铁丝、尼龙绳代替，拆卸前必须对管路完全卸压。","5.下落滚筒：下落前由班组长检查下落方向，并撤离该方向无关人员。","6.完工清理：更换完成后，清理作业地点工具，人员全部撤离后方可送电调试。"]}]}],"w":2309,"cn":3,"sn":12},{"c":"CM-A-04","n":"采煤机行走部更换","t":"CM-A-04 采煤机行走部更换模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面采煤机行走部拆卸、安装等作业行为，统一施工流程、风险防控要点与质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化。防范行走部坠落、吊装失稳、机械挤压、液压喷液、顶板掉矸、部件弹出、设备误动作等安全隐患，全面提升行走部更换施工质量与现场安全管控水平，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面采煤机行走部更换全过程作业及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后施工；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 采煤机行走部更换模块","s":[{"t":"一、模块概述","p":["模块编号：CM-A-04","模块名称：采煤机行走部更换","所属专业： 采煤","适用范围： 所有作业人员"]},{"t":"二、危险预知及防控","p":["1.行走部坠落、滑移伤人：吊装前全面检查吊具、索具、手拉葫芦，全程保持吊具预紧受力，起落、挪移动作平缓，人员严禁停留在行走部正下方（两侧）及运行路线内。","2.带电作业触电伤人：作业前严格执行断电、闭锁、挂牌、上锁流程，严禁带电拆装、检修设备。","3.液压系统喷液、管路崩脱伤人：拆接液压管路、阀件前彻底释放系统压力，严禁带压拆装管路、接头，油液喷射方向不得正对人员。","4.销轴、螺栓、连接件弹出伤人：拆装大型销轴、连接螺栓时使用专用工具，合理选择站位，身体、面部严禁正对孔位及部件弹出方向。","5.吊装失稳伤人：严禁超载起吊，作业指挥信号统一规范，吊物摆动除作业人员以外禁止站人。","6.顶板掉矸、煤壁片帮伤人：作业全过程落实敲帮问顶制度，及时清理危岩、活矸及片帮煤，空顶、危帮区域严禁开展作业。","7.机械挤压、磕碰伤人：行走部挪移、对位、对接过程中，手脚及身体严禁伸入行走部、机身、滑靴与液压支架、煤壁之间的间隙位置。","8.传动部件转动误伤：试运转前全员撤离危险区域，执行点动操作，禁止人员靠近行走轮、齿轮、轴体等转动部件。","9.润滑油渗漏、滑落摔伤：拆装过程中防止油脂洒落，及时清理地面油污，避免人员滑倒摔伤。","10.使用刮板输送机运输期间伤人：行走部放在刮板输送机上运输时，使用刮板链（钢丝绳）对行走部进行捆绑固定；运输期间除作业人员以外其他无关人员应撤离运输路线以外，由班组长现场进行盯守。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：采煤机停放位置应顶板完整、支护牢固可靠；作业区域清理干净浮煤、浮矸，空间满足吊装、拆装及转运要求；通风、照明充足，作业区域设置警戒。","2.支护确认：工作面液压支架护帮板(伸缩梁）接顶严实，超前支护到位，无空顶、离层及片帮风险。","3.设备确认：采煤机严格断电、闭锁、上锁并悬挂警示牌；整机液压系统、润滑系统完全卸压；采煤机可靠固定，防止滑移；手拉葫芦、吊带、重型套筒、扳手、撬棍等工具齐全完好、起吊设备工况正常。","4.配件确认：新行走部型号、规格与采煤机匹配，壳体、齿轮、轴体、油路、密封件、驱动轮完好无损；配套销轴、螺栓、油管、密封垫、紧固件、滑靴等附属配件备齐到位。","5.人员确认：作业人员全部持培训合格证上岗，明确专人指挥、起重、拆装人员，落实互保联保，全员熟知作业流程、风险点及应急处置方式。","6.技术措施确认：严格按照专项安全技术措施执行运输、拆装顺序、吊装路线进行作业。"]},{"t":"四、作业现场人员安全站位","p":["1.行走部起吊、下落、挪移、转运期间，无关人员撤离吊装半径及设备运行区域，仅保留专职指挥人员。","2.拆装销轴、连接螺栓、液压管路时，人员侧身站立，面部、身体避开接口、销孔及管路泄压喷射方向。","3.使用撬棍、大锤作业时，双脚站稳，避开工具回弹、滑脱、锤击反弹范围。","4.行走部与机身对位、对接过程中，人员站在设备安全侧，严禁处于行走部与机身、支架、煤壁之间。","5.设备点动、空载试运转时，无关人员退至安全区域，严禁靠近行走轮、齿轮等转动部位。","6.设备底部、内侧拆装作业时，选择稳固支撑，防止设备意外移动挤压伤人。"]},{"t":"五、标准化作业流程","p":["风险辨识→隐患排查→隐患整改→安全确认→作业地点顶板煤壁加固→停电闭锁、挂牌、上锁→拆电缆槽（防护电缆）→拆齿轨销→加固采煤机机身→固定手拉葫芦→拆行走部螺丝→起吊旧行走部→运输新行走部→更换新行走部→外运行旧走部→调试"]},{"t":"六、作业质量标准","p":["1.本体装配：行走部型号、规格匹配无误，与采煤机机身对接贴合紧密，无错位、偏斜、卡阻现象；驱动轮与销轨啮合良好。","2.连接部件：连接销轴、固定螺栓、锁件齐全完好，按对角顺序分次紧固，无松动、缺失、变形。","3.管路系统：液压管、润滑管连接正确、排布规整，无扭曲、挤压、弯折；接头密封完好，全程无渗漏油、漏水现象。","4.运行状态：试运转时行走、制动动作灵敏可靠，整机无异常振动、异响，行走平稳无跑偏、啃轨。","5.防护及附属件：护罩、盖板、滑靴、导向件安装齐全到位，防护完好。","6.现场文明：旧行走部、废旧配件、油脂、工具分类码放整齐，作业区域杂物、油污清理干净，安全退路顺畅。"]},{"t":"七、安全管控措施","p":["1.起吊前检查与定人定设备：班组长逐一检查手拉葫芦完好，每台由专人操作，严禁一人操作多台；每次起吊前必须重新检查固定点，不牢立即更换。","2.起吊管控：使用绳扣（刮板链）连接，禁止将吊钩直接钩在行走部边沿，防止起吊中脱钩。起吊时，除操作人员外，其他无关人员一律撤离现场。","3.打压泵作业管控：须安排2人配合，作业中保持安全退路畅通。","4.防坠及肢体防护管控：拆除过程中当剩余最后3根螺丝时，必须再次确认手拉葫芦固定可靠，防止行走部突然掉落；拆除过程中严禁手指插入螺孔。","5.刮板机运输管控：运输前必须设警戒，由持证司机操作，司机不得离开按钮。","6.起吊防倾倒管控：行走部运至指定位置后，先闭锁刮板机，再起吊；吊运后应水平摆放并采取防倒措施。","7.刮板机闭锁联动管控：起吊或下落行走部时，刮板机必须停机闭锁，严禁边开机边作业；开机前须经班组长安全确认。"]}]}],"w":2501,"cn":3,"sn":12},{"c":"CM-A-05","n":"采煤机摇臂更换","t":"CM-A-05 采煤机摇臂更换模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面采煤机摇臂拆卸、运输、安装及试运转作业行为，统一施工流程、风险防控要点与质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化。防范摇臂坠落、吊装失稳、机械挤压、液压喷液、顶板掉矸、部件弹出、设备误动作等安全隐患，全面提升摇臂更换施工质量与现场安全管控水平，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面采煤机摇臂更换全过程作业及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后施工；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 采煤机摇臂更换模块","s":[{"t":"一、模块概述","p":["模块编号：CMA-05","模块名称：采煤机摇臂更换","所属专业：采煤","适用范围：所有作业人员"]},{"t":"二、危险预知及防控","p":["1.摇臂坠落、滑移伤人：吊装前全面检查吊具、索具、手拉葫芦，全程保持吊具预紧受力，起落、挪移动作平缓，人员严禁停留在摇臂正下方及运行路线内。","2.带电作业触电伤人：作业前严格执行断电、闭锁、挂牌、上锁，严禁带电拆装、检修设备。","3.液压系统喷液、管路崩脱伤人：拆接液压管路、阀件前彻底释放系统压力，严禁带压拆装管路、接头，油液喷射方向不得正对人员。","4.销轴、螺栓、连接件弹出伤人：拆装销轴、连接螺栓时使用专用工具，合理选择站位，身体、面部严禁正对孔位及部件弹出方向。","5.吊装失稳、斜拉歪吊伤人：严禁超载起吊，作业指挥信号统一规范，吊物摆动范围内禁止站人。","6.顶板掉矸、煤壁片帮伤人：作业全过程落实敲帮问顶制度，及时清理危岩、活矸及片帮煤，空顶、危帮区域严禁开展作业。","7.机械挤压、磕碰伤人：摇臂摆动、对位、挪移过程中，手脚及身体严禁伸入摇臂、机身、摇臂与刮板输送机、煤壁之间的间隙位置。","8.传动部件转动误伤：试运转前全员撤离危险区域，执行点动操作，禁止人员触碰齿轮、轴体、摇臂等转动部件。","9.润滑油渗漏、滑落摔伤：拆装过程中防止油脂洒落，及时清理地面油污，避免人员滑倒摔伤。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：采煤机停放在顶板完整、支护牢固的地段；作业区域清理干净浮煤、浮矸，空间满足吊装、拆装及转运要求；通风、照明充足，作业区域设置警戒。","2.支护确认：工作面液压支架护帮板（伸缩梁）伸出并接顶严实，超前支护到位，无空顶、片帮隐患。","3.设备确认：采煤机严格执行断电、闭锁、挂牌并上锁；整机液压系统、润滑系统完全卸压；手拉葫芦、吊具、扳手、撬棍等工具齐全完好；起吊设备工况正常。","4.配件确认：新摇臂型号、规格与采煤机匹配，壳体、齿轮、轴体、油路、密封件完好无损；配套销轴、螺栓、油管、密封垫、紧固件等附属配件备齐到位。","5.人员确认：作业人员全部持证上岗，作业人数满足要求，明确专职指挥、起吊、拆装人员，落实互保联保，全员熟知作业流程、风险点及应急处置方式。","6.技术措施确认：严格按照专项安全技术措施执行拆装顺序、吊装路线、螺栓紧固力矩及管路连接标准。"]},{"t":"四、作业现场人员安全站位","p":["1.摇臂起吊、下落、挪移、转运期间，无关人员撤离吊装及设备运行区域，仅保留专职指挥人员。","2.拆装销轴、连接螺栓、液压管路时，人员侧身站立，面部、身体避开接口、销孔及管路泄压喷射方向。","3.使用撬棍、大锤作业时，双脚站稳，避开工具回弹、滑脱、锤击反弹范围。","4.摇臂与机身对位、对接过程中，人员站在设备安全侧，严禁处于摇臂与机身、煤壁之间。","5.设备点动、空载试运转时，全体人员退至安全区域，严禁靠近摇臂、摇臂等转动部位。","6.紧固配件检修作业时，站立位置平稳牢固，不得踩踏设备悬空部位。"]},{"t":"五、标准化作业流程","p":["1.拆摇臂施工工序","风险辨识→隐患排查→隐患整改→安全确认→作业地点顶板加固→采煤机停到指定位置→调整摇臂高度→停电闭锁、挂牌、上锁→固定手拉葫芦→固定采煤机摇臂→拆螺丝→去铰轴→拆摇臂→外运摇臂","2.安装摇臂施工工序","风险辨识→隐患排查→隐患整改→安全确认→运采煤机摇摆→安装摇臂→移动采煤机使摇臂位于摇臂前→使用手拉葫芦将摇臂吊起→安装铰轴→固定螺丝→摘除手拉葫芦→启动采煤机调试→停电闭锁→清理作业地点杂物"]},{"t":"六、作业质量标准","p":["1.本体装配：摇臂型号、规格匹配无误，与采煤机机身对接贴合紧密，无错位、偏斜、卡阻现象。","2.连接部件：固定螺栓、锁件齐全完好，按对角顺序分次紧固，力矩符合设备技术要求，无松动、缺失、变形。","3.管路系统：液压管、润滑管连接正确、排布规整，无扭曲、挤压、弯折；接头密封完好，全程无渗漏油、漏水现象。","4.运行状态：试运转时摇臂升降、摆动动作灵敏可靠，整机无异常振动、异响，摇臂转向符合要求。","5.防护及附属件：护罩、盖板、紧固件安装齐全到位，防护完好。","6.现场文明：旧摇臂、废旧配件、油脂、工具分类码放整齐，作业区域杂物、油污清理干净，巷道通行顺畅。"]},{"t":"七、安全管控措施","p":["1.起吊前检查与操作管控：起吊前由班组长检查手拉葫芦完好，每次起吊前复查固定点，不牢立即更换；每台葫芦专人操作，严禁一人多台；禁止吊钩钩在摇臂边沿内防脱钩；起吊时无关人员全部撤离。","2.工具接头与拆卸防护管控：风动扳手胶管接头须用合格U型卡固定，严禁铁丝、尼龙绳代用；拆除螺丝时严禁手指伸入螺孔。","3.刮板机运输警戒与操作管控：运输前开空刮板机，设警戒，由持证司机操作；运输中司机不得离开按钮，班组长在旁观察，遇问题立即急停；摇臂运至指定位置后，先闭锁刮板机，方可起吊。","4.摆放与开机确认管控：摇臂运到后，放平稳防止倾倒；起吊或下落摇臂时，刮板机必须停机闭锁，严禁边开机边作业；开机前须经班组长安全确认。"]}]}],"w":2384,"cn":3,"sn":12},{"c":"CM-A-06","n":"综采工作面处理片帮冒顶操作","t":"CM-A-06 综采工作面处理片帮冒顶操作模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面片帮、局部冒顶隐患处置全流程操作行为，统一隐患处置流程、风险防控要点、支护管控及质量验收标准，实现操作标准化、风险可控化、验收闭环化，防止处置过程中二次片帮、冒顶砸伤、设备挤压、高压液压伤人、瓦斯超限等事故，快速控制围岩隐患，保障工作面设备与人员安全，特制定本模块化作业方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面煤壁片帮、顶板局部掉矸、小范围冒顶隐患排查、临时控顶护帮、清理矸石、支架加固、隐患整改、完工验收全过程作业及现场安全管控。"]},{"t":"三、管理原则","p":["1.先确认、后施工；先控顶、后清矸；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 采煤模块","s":[{"t":"一、模块概述","p":["模块编号：CMA-06","模块名称：工作面处理片帮冒顶作业","所属专业：采煤","适用范围：工作面所有现场处置人员"]},{"t":"二、危险预知及防控","p":["1.二次片帮、冒落矸石砸伤：处置全程持续敲帮问顶，先加固控顶设施，严禁人员站在无防护空顶、破碎煤壁下方。","2.支架、护帮板动作挤夹伤人：调整支架、伸收护帮前全域预警，禁止身体、工具伸入支架与煤壁、顶板间隙。","3.液压管路高压喷液伤人：处置前检查支架千斤顶、管路、U型销完好，破损渗漏立即停机更换，高压管口严禁对人。","4.大块矸石滚落撞击伤人：清理垮落矸石由上至下分层清理，禁止从下方掏挖、硬撬悬矸。","5.支架误动作挤压伤人：隐患处置区域支架全部闭锁挂牌，无关人员禁止触碰操作阀组。","6.瓦斯、粉尘职业危害：清矸、敲帮问顶全程开启喷雾，瓦斯浓度≥0.5%立即停工断电撤人。","7.刮板输送机剐蹭伤人：清理机道垮落矸石时停机断电闭锁，禁止在设备运行状态下掏矸。"]},{"t":"三、作业条件安全确认","p":["1.环境条件：工作面通风稳定，瓦斯浓度≤0.5%；作业点喷雾装置完好可正常投用；隐患区域上下两端设置警戒，禁止无关人员进入；巷道照明充足，人行道畅通，无杂物阻挡避险通道。","2.设备条件：液压支架顶梁、护帮板无变形开裂；立柱、护帮千斤顶伸缩灵敏，无窜液漏液；液压管路、U型销齐全紧固；支架闭锁装置完好；刮板输送机、转载机断电闭锁到位；声光联络信号清晰有效。","3.人员条件：作业人员持证上岗，处置小组不少于2人，互保联保责任明确；无疲劳、酒后、带病上岗人员。","4.联动条件：与三机司机、巡检人员统一预警、停机、完工信号，处置前全线喊话告知。"]},{"t":"四、作业现场人员安全站位","p":["1.敲帮问顶、观察片帮冒顶区域时，人员站在完整支护支架立柱人行道侧，侧身远离悬空矸石掉落正下方。","2.加固支架、伸出护帮板控帮时，操作人员站在支架操作阀一侧，避开顶梁、护帮板伸缩挤压范围。","3.分层清理垮落矸石时，人员站在矸石堆上方安全位置，严禁站在矸石下坡、悬空矸石正下方掏挖。","4.检修液压管路、处理卡阻矸石时，关闭支架进液、闭锁手柄挂牌，站在设备侧面操作。","5.处置预警阶段，确认隐患区域前后无人员、无设备阻挡，设置警戒后方可开展作业。"]},{"t":"五、标准化作业流程","p":["班前片帮冒顶处置专项交底→划定隐患区域、设置安全警戒→全线停机、刮板输送机断电闭锁挂牌→开启全域喷雾降尘→逐架闭锁处置区域支架→反复敲帮问顶，标记悬空危矸→优先调整支架、伸出护帮板临时控顶控帮→由上至下分层清理垮落矸石杂物→逐步移架、升实支架保证顶梁接顶严实→持续观测煤壁顶板围岩稳定性→隐患消除后检查支架支护状态→回收工具、清理机道与人行通道积矸→解除支架闭锁、恢复设备信号联络→班组长验收闭环"]},{"t":"六、作业质量标准","p":["1.围岩管控标准：处置后无悬空危矸、无松动煤块，煤壁无明显裂隙外鼓，顶板无空顶、离层。","2.支架支护标准：支架顶梁完全接顶，初撑力达到规程要求；护帮板紧贴煤壁，无大面积空隙；立柱无泄压、漏液。","3.构件管路标准：支架顶梁、护帮无变形破损；千斤顶动作平稳无卡滞；液压管路无挤压破损，U型销齐全不缺失。","4.清矸标准：隐患区域、机道、人行道垮落矸石清理干净，无堆积大块矸石阻挡通行与设备运行。","5.闭锁管控标准：处置全程设备闭锁可靠，完工确认无人员后方可解除闭锁。","6.文明作业标准：作业区域浮矸废料清理干净；喷雾全程开启，粉尘达标；液压管线、电缆排布整齐无挤压弯折。"]},{"t":"七、安全管控措施","p":["1.停机闭锁：处理前必须将刮板输送机停电闭锁、挂牌上锁，采煤机停至作业点10m外顶帮完好处，严禁擅自送电开机。","2.安全确认：作业前检查顶板完好性、支架牢固度及安全退路；先加固冒顶区周围支护，用长柄工具清除顶部矸石，严禁冒险作业。","3.现场监护：班组长或副队长现场指挥，无关人员严禁靠近作业区域。"]}]}],"w":1983,"cn":3,"sn":12}],"os":"一","rn":"高风险","rc":"红","rg":"A","n":6,"label":"高风险 · 红色 A段"},{"t":"二、中风险-橙色-B段（2项）","lv":"B","m":[{"c":"CM-B-01","n":"综采工作面闭帮操作","t":"CM-B-01 综采工作面闭帮操作模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面闭帮作业全流程操作行为，统一施工流程、风险防控要点、现场管控及质量验收标准，实现操作标准化、风险可控化、验收闭环化，杜绝煤壁片帮、矸石掉落、支架误动作挤伤、设备磕碰、粉尘瓦斯伤害等安全隐患，有效封堵煤壁、阻挡矸石滚落，保障工作面通行与设备运行安全，特制定本模块化作业方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面闭帮、护帮板调整、收放护帮、隐患处理、日常检查全过程作业及现场安全管控。"]},{"t":"三、管理原则","p":["1.先确认、后施工；先护顶、后闭帮；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 综采工作面闭帮作业模块","s":[{"t":"一、模块概述","p":["模块编号：CMB-01","模块名称：综采工作面闭帮作业","所属专业：采煤","适用范围：闭帮现场所有作业人员"]},{"t":"二、危险预知及防控","p":["1.煤壁片帮、悬矸掉落砸伤：人员进入煤壁前必须敲帮问顶，清理松动浮煤矸石，禁止在无护帮遮挡的破碎煤壁下方停留。","2.护帮板动作挤夹伤人：护帮板（伸缩梁）伸收过程严禁人员将身体、工具伸入护帮板（伸缩梁）与煤壁间隙。","3.液压管路高压喷液伤人：操作前检查护帮（伸缩梁）液压管路、接头无破损渗漏，禁止高压管口正对人员。","4.支架误动作挤压伤人：相邻支架操作时提前告知移动范围内作业人员，作业区域支架操作手柄闭锁，防止误操作。","5.电气漏电、触电伤害：支架控制器、电缆外皮完好无破损，严禁带电拆改电控部件。","6.瓦斯、粉尘职业危害：处理片帮、清理浮煤时下风侧喷雾正常开启，瓦斯浓度达到0.5%时立即停机撤人。","7.护帮板磕碰设备：伸护帮前确认煤壁无突出大块煤矸，防止护帮板挤压、损坏刮板输送机及管线。"]},{"t":"三、作业条件安全确认","p":["1.环境条件：工作面通风稳定，瓦斯浓度≤0.5%；作业点喷雾装置完好可正常投用；工作面顶板支护严实，无空顶、无悬矸；煤壁大块松动煤矸提前清理；巷道照明充足，支架人行道畅通，无浮煤杂物堆积。","2.设备条件：液压支架护帮板无变形、开裂、缺失；护帮千斤顶动作灵敏，无窜液、漏液；液压管路、U型销齐全完好，接头紧固；支架操作阀组、闭锁装置完好；控制器、信号线缆吊挂规范无破损；工作面声光联络信号清晰有效。","3.人员条件：液压支架工持培训合格证上岗，每组作业不少于2人，互保联保责任明确；无疲劳上岗、酒后、带病作业人员。","4.联动条件：与刮板输送机司机、采煤机司机、作业人员协调一致。"]},{"t":"四、作业现场人员安全站位","p":["1.敲帮问顶、清理浮矸时，人员站在已支护完好支架立柱人行道侧，侧身面向煤壁，避开松动煤矸掉落范围。","2.伸收护帮板（伸缩梁）操作时，操作人员站在支架阀组操作侧，身体远离护帮板，严禁正对护帮板伸出方向。","3.观察护帮贴合状态、处理卡阻煤块时，与护帮板保持安全距离，禁止伸手探入护帮缝隙清理煤矸。","4.检修护帮千斤顶、更换液压管件时，关闭对应支架进液、站在管线侧面安全位置操作。","5.操作预警阶段，确认作业段前后无人员滞留、无工具杂物摆放，方可操作护帮机构。"]},{"t":"五、标准化作业流程","p":["班前闭帮专项交底→作业区域敲帮问顶、安全条件确认→开启现场喷雾降尘→检查护帮板（伸缩梁）、千斤顶、管路完好情况→支架操作手柄闭锁检查→缓慢伸出护帮板（伸缩梁）贴合煤壁→观察贴合状态、调整角度消除空隙→作业过程动态巡检→需要收护帮时提前预警、缓慢收回护帮板→操作完成后复位阀组、闭锁支架操作手柄→清理支架间浮煤杂物→检查护帮液压系统有无渗漏→班组长验收闭环"]},{"t":"六、作业质量标准","p":["1.煤壁预处理标准：护帮操作前清除所有松动浮煤、悬矸，煤壁无突出大块障碍物，无悬空裂隙。","2.护帮贴合标准：护帮板完全伸出后紧贴煤壁，无明显空隙、无局部悬空，有效遮挡煤壁矸石。","3.护帮构件标准：护帮板无扭曲、开裂、缺损；千斤顶伸缩平稳无卡滞，无窜液、渗漏；U型销齐全不缺失，管路无挤压破损。","4.操作工况标准：护帮伸收动作平缓无冲击、无剧烈抖动；阀组操作灵活，闭锁装置可靠有效。","5.防护管控标准：护帮持续保持伸出状态，割煤、移架后及时恢复护帮，不得长期空敞煤壁。","6.文明作业标准：支架行人通道无积煤、矸石堆积；作业全程喷雾开启，粉尘达标；液压管线、电缆排布整齐无挤压弯折。"]},{"t":"七、安全管控措施","p":["1.操作顺序：先清浮矸后伸护帮；煤壁破碎时提前减速，严禁强行顶压大块煤矸。","2.操作规范：伸收护帮全程缓慢，禁止猛开猛关；卡阻时立即停止，清理障碍后再动作，严禁千斤顶硬顶。","3.单人作业：单人检修或长时间观察煤壁时，必须闭锁对应支架手柄并挂牌，非作业人员禁止触碰阀组。","4.管路检查：每班检查护帮管路及接头渗漏，破损、脱落立即停机更换，高压胶管严禁对人。","5.环境要求：作业期间同步开启喷雾降尘；瓦斯浓度≥0.5%时立即停止操作，断电并撤至新鲜风流。","6.验收交接：每班完工后由班组长验收；浮矸未清、护帮不贴实、管路渗漏、积煤不达标等，严禁交接班，全部整改合格后方可闭环。"]}]}],"w":2118,"cn":3,"sn":12},{"c":"CM-B-02","n":"刮板输送机溜槽更换","t":"CM-B-02 刮板输送机溜槽更换模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面溜槽更换作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝溜槽滑落、吊装失稳、机械挤压、链条弹崩、顶板掉矸、设备窜动、构件磕碰等安全隐患，提升溜槽更换施工质量、设备运行稳定性与现场安全管理水平，特制定本方案"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面刮板输送机溜槽的拆卸、更换、安装全过程施工作业及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后施工；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 刮板输送机溜槽更换模块","s":[{"t":"一、模块概述","p":["模块编号：CMB-02","模块名称：刮板输送机溜槽更换","所属专业：采煤","适用范围：所有作业人员"]},{"t":"二、危险预知及防控","p":["1.溜槽坠落、滑移伤人：吊装前检查吊具、索具，全程保持葫芦预紧受力，溜槽起落、挪移平稳，人员严禁处于溜槽下方及运行路线内。","2.带电作业伤人：作业前刮板输送机严格停电、闭锁、挂牌上锁，严禁带电拆装、检修设备，停电后专人看护开关。","3.链条弹崩、刮板甩动伤人：拆接链条前使用阻链器锁紧链条、释放张力，人员避开链条回弹、刮板甩动方向。","4.销轴、螺栓、构件弹出伤人：拆装连接件使用专用工具，合理选择站位，身体严禁正对销孔、螺栓孔。","5.吊装失稳、斜拉歪吊伤人：禁止超载起吊、斜向牵拉，统一指挥信号，吊物摆动范围内严禁站人。","6.顶板掉矸、煤壁片帮伤人：作业前后全程敲帮问顶，及时处理危岩、活矸及片帮煤，空顶区域禁止作业。","7.机械挤压、磕碰伤人：溜槽起吊、对位、挪移时，手脚及身体严禁伸入溜槽、支架、煤壁间隙位置。","8.设备转动误伤：试运转前确认人员全部撤离机道及危险区域，点动试转，禁止人员靠近链轮、链条转动部件。"]},{"t":"三、作业条件安全确认","p":["1.环境：作业区域清理干净浮煤、浮矸，空间满足溜槽吊装、拆装要求；通风、照明良好，作业区设置警戒。","2.支护：工作面液压支架护帮板、护顶梁全部伸出并接顶严实，超前支护到位，无空顶、危帮。","3.设备：刮板输送机断电闭锁、挂牌上锁；液压系统完全卸压；安装阻链器锁紧刮板链条；手拉葫芦、吊带、撬棍、重型套筒、大锤等工具齐全完好、检验合格；起重设备性能正常。","4.配件：新溜槽型号规格与设备匹配，槽体无变形、开裂；销轨、挡煤板、连接销轴、螺栓、密封件等附属配件配齐。","5.人员：作业人员全部持证上岗，作业小组不少于3人，明确专人指挥、专人吊装、专人拆装，落实互保联保，全员掌握作业流程及风险点。","6.技术措施：严格按照专项安全技术措施确定拆装顺序、吊装路线、对接调平及螺栓紧固力矩标准。"]},{"t":"四、作业现场人员安全站位","p":["1.溜槽起吊、下落、挪移过程中，所有人员撤离吊装半径及溜槽运行区域，仅留专职指挥人员。","2.拆卸、安装销轴、螺栓、销轨、挡煤板时，人员侧身站立，面部和身体不得正对孔位与连接件弹出方向。","3.使用撬棍、大锤作业时，双脚站稳，避开工具回弹、滑脱方向。","4.溜槽对位对接时，人员站在设备安全侧，严禁站在溜槽与煤壁、支架之间。","5.设备点动试运转时，全员退至安全地点，禁止靠近链轮、链条等转动部位。","6.紧固连接螺栓、对接槽体时，站在平稳牢固位置，不得踩踏溜槽悬空部位作业。"]},{"t":"五、标准化作业流程","p":["风险辨识→隐患排查→隐患整改→安全确认→刮板输送机停电闭锁、挂牌、挂锁→固定刹车盘→断开刮板输送机链→外移刮板输送机机头→拆刮板输送机溜槽→外运刮板输送机溜槽→更换刮板输送机溜槽→合并刮板输送机机头→连接刮板链→收尾"]},{"t":"六、作业质量标准","p":["1.溜槽装配：溜槽型号规格匹配，对接平整无错茬台阶，无偏斜、卡阻，槽体无裂纹变形。","2.连接部件：连接销轴、螺栓齐全完好，按照对角顺序分次紧固，力矩符合设备技术要求，无松动、缺失。","3.链条刮板：链条接头装配到位，链条松紧适度，刮板齐全完好无变形缺失。","4.运转状态：手动盘动链条无卡滞、异响；试运转无飘链、跳链、刮卡，整机运行平稳。","5.现场文明：旧溜槽、废旧配件、工具分类摆放整齐，作业区域浮煤杂物清理干净，巷道安全退路畅通。"]},{"t":"七、安全管控措施","p":["1.作业前准备与停电闭锁管控：煤壁、顶板未加固不得作业；必须对刮板输送机、采煤机停电、闭锁、挂牌、上锁，未经班组长同意严禁送电；严格执行“敲帮问顶”，清除活煤、矸块；安设阻链器锁紧刮板链条，释放链条张力后方可开展拆卸作业。","2.起吊要求：起吊前全面检查手拉葫芦，发现问题先处理；起吊、安装溜槽须使用不少于2台手拉葫芦配合使用，1台起吊1台调向，且必须固定在支架完好起吊环/顶梁下方，严禁斜拉歪吊。","3.单体液压支柱使用：支设单体支柱辅助调移溜槽后，必须用防倒绳捆绑固定；使用单体支柱顶推溜槽时，支柱必须固定在支架底座或电缆槽上，并采用远距离操作。","4.风动扳手：高压胶管接头必须使用合格U型卡固定，严禁用铁丝、尼龙绳代替，拆卸前必须对管路完全卸压。","5.下落溜槽：下落前由班组长检查下落、滑移方向，并撤离该方向无关人员，吊物下方严禁站人。","6.完工清理：更换完成后，清理作业地点工具、旧配件及浮煤杂物，人员全部撤离刮板机机道及吊装危险区域后方可送电点动调试。"]}]}],"w":2218,"cn":3,"sn":12}],"os":"二","rn":"中风险","rc":"橙","rg":"B","n":2,"label":"中风险 · 橙色 B段"},{"t":"三、低风险-蓝色-C段（9项）","lv":"C","m":[{"c":"CM-C-01","n":"打钻、注水","t":"CM-C-01 打钻、注水模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面打钻、注水作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝钻机伤人、高压水伤人、注水失效等安全隐患，提升煤层注水防尘效果与钻孔施工质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面煤层打钻、注水、封孔、压力监测全过程作业及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先通风、后打钻；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组长：采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成员：班组长、安检员、打钻、注水人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 打钻注水模块","s":[{"t":"一、模块概述","p":["模块编号：CM-C-01","模块名称：综采打钻注水","所属专业：采煤","适用范围：打钻、注水人员"]},{"t":"二、危险预知及防控","p":["1.钻机旋转伤人：严禁戴线手套操作钻机，衣袖口应扎紧，作业过程中严禁触碰旋转部位。","2.钻杆弹出或折断伤人：按照施工要求配备作业人员，作业人员应扶稳钻机，匀速钻进严禁使用腹部顶钻机。","3.高压水射流伤人：注水前检查管路，注水过程中使用尼龙绳进行捆绑固定，卸压后侧身拆管，严禁人员正对封孔器。","4.片帮冒顶伤人：作业前，作业人员对帮顶牢固情况进行检查确认，确认帮顶完好无片帮、冒顶风险后作业。","5.瓦斯异常涌出：打钻前使用便携式甲烷检测报警仪检查瓦斯，作业中回风侧5m范围内悬挂便携式一氧化碳检测报警仪和甲烷检测报警仪持续监测，超限立即停钻。","6.高压胶管脱落伤人：钻机与高压胶管连接处使用配套且合格U型卡进行连接，并使用尼龙绳或铁丝进行捆绑固定，拆除高压胶管前应对关闭支管阀门，扳动钻机操作阀卸压后方可拆卸。","7.刮板输送机运行伤人：打钻、注水前，班组长安排人员将前部刮板输送机停电、闭锁、挂牌、上锁，并确认安全后方可组织人员作业。"]},{"t":"三、作业条件安全确认","p":["1.环境：顶板稳定，煤壁无片帮，通风良好，瓦斯小于0.5%，作业区照明充足。","2.设备：钻机完好，固定牢固，管路畅通，阀门灵活，高压胶管连接牢固，确认刮板输送机停电、闭锁、挂牌、上锁。","3.材料：钻杆、钻头规格正确，封孔器完好备齐，注水水质合格。","4.人员：持培训合格证上岗，多人配合作业，互保联保明确。","5.钻孔设计：孔位、孔深、角度符合作业规程设计要求。"]},{"t":"四、作业现场人员安全站位","p":["1.钻机运行时，人员避开钻杆旋转方向和后退方向。","2.拆装钻杆时，手不握钻杆接口处，侧身站位。","3.注水期间，人员避开管路接头正对方向。","4.卸压拆管时，侧身操作，面部避开接头。"]},{"t":"五、标准化作业流程","p":["风险辨识→隐患排查→安全确认→钻孔定位→钻机稳固→开钻前检查→打钻→清孔→钻孔验收→下封孔器→连接注水管路→试压检查→固定封孔器→注水（压力、流量控制）→保压→卸压→拆除管路→验收确认"]},{"t":"六、作业质量标准","p":["1.钻孔参数：孔深、孔距、角度符合设计，误差：深度±0.5m，角度±1°","2.钻孔直径：根据封孔器规格确定，一般为42mm。","3.注水压力：注水压力不小于8MPa，煤层预裂后注水压力控制在3～5MPa。","4.注水时间、水量：达到设计注水量或煤壁出水为止，单孔注水时间≥2h。","5.湿润半径：经验收检查，煤体湿润效果明显，无干孔。"]},{"t":"七、安全管控措施","p":["（一）打钻安全管控要点","1.人员与工具：打钻工须持培训合格证上岗，熟悉钻机性能；气动钻机启停开关灵敏可靠，高压胶管连接处必须使用合格U型卡固定，跨越输送机的胶管须悬挂。","2.作业前准备：脱掉线手套，扎紧袖口；检查顶板及支架，确认安全后方可作业；在钻孔回风侧5m范围内悬挂甲烷和一氧化碳检测报警仪。","3.操作规范：禁止用手或戴线手套扶托钻杆，点动后启动，托稳钻机均匀推进。","4.环境要求：打钻期间刮板输送机必须闭锁，严禁启动；沿供风管路由远及近作业，并时刻注意煤壁、液压支架及输送机上方情况，防止杂物碰伤。","5.移动钻机：远距离移动须摘掉供风高压胶管U型卡，轻拿轻放。","6.禁止打钻、立即停钻情形：风流中甲烷浓度≥0.5%；连续响煤炮声或大量瓦斯涌出；透水预兆（煤层变潮、挂红挂汗、雾气、水叫、淋水增大、空气变冷）。突遇压力水流出；顶板来压、片帮严重；控顶距离超规定；支护不全或不牢固。","7.完工整理：确认关闭高压胶管阀门并卸压，拆下钻机，将钻机、钻杆、胶管、风管等整齐摆放在安全地点。","（二）注水安全管控要点","1.注水前：班组长确认煤壁完好，无片帮风险；松软、裂缝处须先闭帮。人员确认支架伸缩梁紧贴煤壁、退路畅通。","2.封孔器与胶管：封孔器与高压胶管连接必须使用专用配套U型卡（严禁铁丝或单脚固定）；每根封孔器末端胶管用尼龙绳固定，防止脱落。","3.注水期间：发现煤壁外鼓、大面积片帮，立即撤离人员，由班组长现场盯守，从远及近控顶；班组长、注水工不定时巡查煤壁，发现片帮须先关闭注水阀门、处理后再注；严格执行“敲帮问顶”；需安装水量检测装置和压力表，确保达到设计要求。","4.注水后：班组长确认煤壁完好，若有片帮冒顶风险时及时闭帮、控顶，并伸出支架伸缩梁紧贴煤壁。","5.拆除：必须先关闭支管阀门，观察封孔器收缩、胶管不带压后方可拆除。","6.现场监督与验收：每班有班组长现场监督；注水后由副队长、班组长、瓦检员、安检员共同验收签字。","7.时间保障：注水时间不足2小时须汇报调度室并调整劳动组织或延长注水时间，严禁无注水或效果不良作业。"]}]}],"w":2254,"cn":3,"sn":12},{"c":"CM-C-02","n":"采煤机操作","t":"CM-C-02 采煤机操作模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面采煤机操作行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝采煤机截割伤人、设备碰撞、煤壁片帮、瓦斯积聚等安全隐患，提升采煤效率与作业安全系数，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面采煤机开机、割煤、移机、停机、检修全过程作业及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先检查、后开机；不安全、不操作。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长： 采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 采煤模块","s":[{"t":"一、模块概述","p":["模块编号：CMC-02","模块名称：综采采煤机操作","所属专业： 采煤","适用范围： 采煤机司机及现场作业人员"]},{"t":"二、危险预知及防控","p":["1.截割滚筒伤人：滚筒转动时严禁靠近，人员站在安全距离外，禁止跨越机身。","2.设备碰撞：割煤前确认支架间距、溜槽平直，控制牵引速度，严禁硬拉硬拽，遇见铁器应及时处理。","3.煤壁片帮、掉矸伤人：割煤前检查煤壁稳定性，及时护帮，人员避开片帮掉落方向，割煤距离超过作业规程规定及时停机。","4.瓦斯异常涌出：割煤前、割煤中持续监测瓦斯，超限立即停机撤人。","5.电缆拖移伤人、破损：对电缆进行看护，避免挤压、拖拽，严禁碾压电缆。","6.液压油、高压水喷射伤人：开机前检查管路密封，严禁带压检修，卸压后处理故障。"]},{"t":"三、作业条件安全确认","p":["1.环境：顶板完整无冒落、煤壁无片帮、通风良好、瓦斯小于0.5%、作业区照明充足、无杂物堆积。","2.设备：采煤机完好，截齿齐全、滚筒无裂纹、牵引系统正常；液压管路无渗漏、压力表正常；刮板机、支架完好，溜槽平直；电缆无破损、固定牢固、机载断电仪正常、供电系统正常。","3.人员：持采煤机司机证上岗，安排2人配合作业，互保联保明确，无疲劳、酒后上岗。","4.支护：超前支护到位、支架接顶严实、护帮板（伸缩梁）伸出，支护强度符合要求。"]},{"t":"四、作业现场人员安全站位","p":["1.采煤机运行时，人员站在支架顶梁行人道内，避开滚筒旋转范围、机身两侧及牵引方向，除采煤机司机以外5m范围内无其他人员。","2.割煤时，采煤机司机应站在机身中部，避开采煤机前后滚筒旋转部位，严禁跨入煤壁侧进行作业，有人员通过时必须停机。","3.推移刮板机、拉架时，与采煤机滚筒保持15-30m间距，距离超过规定时必须停止割煤。","4.处理滚筒缠绕、截齿故障时，采煤机司机停机，通知机电维修工进行停电，闭锁、挂牌、上锁确认后通知采煤机司机或班组长进行处置，处置时专人观山，作业人员站在支护完好无片帮、冒顶风险地点，确认安全后方可作业。","5.开机试运转前，其他人员撤离至5m外安全区域，采煤机司机确认无人员后方可开机。"]},{"t":"五、标准化作业流程","p":["风险辨识 → 安全确认 → 作业环境安全检查 → 运行装置安全检查 → 试运转安全操作 → 截割安全操作 → 停机安全操作 → 收工安全操作 → 现场清理 → 验收确认"]},{"t":"六、作业质量标准","p":["1.采高控制：符合设计要求，采高不大于2.2m、不小于1.7m。","2.割煤质量：煤壁平直，无凹凸、无伞檐；截割平整，无大块煤矸，便于拉架、推溜。","3.牵引速度：根据煤质硬度控制，0～12.7m/min，平稳调速，无急停、急加速。","4.滚筒操作：升降平稳，无冲击；截齿齐全，无缺失、磨损严重现象。","5.支护同步：割煤后及时拉架，距离超过30m停止割煤进行移架，支架前梁距煤壁≤0.34m，护帮板（伸缩梁）及时伸出，无空顶、空帮。","6.文明作业：电缆排列整齐、电缆夹无挤压；电缆槽齿轨无杂物、浮煤清理干净。"]},{"t":"七、安全管控措施","p":["1.严格按照操作规程作业，认真执行岗位责任制，持证上岗。","2.开机前先开水、停机后及时关水，无水禁止割煤。","3.开机前先发出开机信号，需要返刀时，发出返刀信号，严禁突然返刀。","4.采煤机上必须有能停止采面输送机的闭锁装置。","5.采煤机司机应两人协同作业，严禁一人操作，司机要时刻注意观察顶板、煤壁的变化情况及输送机的运行情况，发现意外及时停机处理，同时采煤机、输送机停电闭锁。","6.没有特殊情况，必须做到煤壁直，顶底板割平，不留伞檐、台阶，不超高、不过底、不漂刀、不捎底，达到“三直一平”。","7.采煤机割煤时，采煤机上下5m内不准作业行走，斜切进刀长度保证30m，割三角煤时适当放慢速度。","8.采面遇断层及其它地质构造时，必须按有关措施执行，割煤时严禁人员在煤壁作业，如需作业时必须停机（采煤机、输送机闭锁），并架设必要的临时支护，背好帮顶。","9.采煤机运行时，应时刻注意电缆的拖移装置，不准卡住或出槽，以防止挂坏、挤坏电缆、水管等。","10.两名采煤机司机不能同时离开采煤机，停机时应有一人看管，防止他人乱动，造成事故，离开时必须将采煤机停电、闭锁。","11.采煤机割煤前应先检查齿轨及销子，确保无误后方可开机割煤。","12.采煤机牵引不动时，不能强行牵引，应停机处理。","13.采煤机机身上部有掉顶或片帮，有大块煤、矸块时应及时停机处理，严禁强行开机，绊坏机电设备。","14.采煤机割煤遇到采面遗留的钻杆等硬物时，必须及时停机并停电闭锁，人工取出或处理，严禁硬割。","15.采面前部输送机挡板、齿轨上不允许人员坐、行走。","16.采煤机停止运行、检修或更换零部件时，应打开离合器并停电闭锁。"]}]}],"w":2252,"cn":3,"sn":12},{"c":"CM-C-03","n":"液压支架操作","t":"CM-C-03 液压支架操作模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面液压支架操作行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝支架挤伤、倒架、漏液、顶板冒落、片帮伤人等安全隐患，提升支护质量与工作面安全稳定性，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面液压支架的升架、降架、移架、护帮、侧护、端头支护及维护全过程作业与现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先支护、后移架；不安全、不动作。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长： 采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 液压支架操作模块","s":[{"t":"一、模块概述","p":["模块编号：CMC-03","模块名称：综采液压支架操作","所属专业：采煤","适用范围：支架工及现场所有作业人员"]},{"t":"二、危险预知及防控","p":["1.支架挤伤/压伤：移架时严禁站在支架与煤壁、支架与刮板机之间，严禁跨越支架。","2.支架倒架、歪架：移架前检查支架姿态，降架高度适中，移架平稳，及时调架、侧护。","3.高压液喷射伤人：操作前检查管路、接头无破损漏液，严禁带压拆卸，卸压后处理故障。","4.顶板冒落、掉矸伤人：升架及时、接顶严实，空顶区及时支护，人员避开冒落区下方。","5.煤壁片帮、护帮板弹击：护帮板收回、伸出平稳，严禁猛收猛放，人员避开护帮板前方。","6.支架咬架、刮卡设备：控制移架步距，与采煤机、刮板机保持安全距离，防止剐蹭。"]},{"t":"三、作业条件安全确认","p":["1.环境：顶板完整、无裂隙离层，煤壁稳定无片帮，通风良好，瓦斯≤0.5%，照明充足，无杂物堆积。","2.设备：液压支架完好，立柱、千斤顶伸缩正常，管路无渗漏、接头牢固，安全阀、压力表灵敏可靠；刮板机平直、无错茬，采煤机位置安全。","3.人员：持培训合格证上岗，≥2人配合作业，互保联保明确，无疲劳、酒后上岗。","4.支护：前探梁、护帮板完好，相邻支架间距达标，端头支护齐全牢固。"]},{"t":"四、作业现场人员安全站位","p":["1.移架时，人员站在相邻已支护支架立柱之间，避开支架底座、护帮板、侧护板动作范围。","2.降架、升架时，严禁站在支架顶梁下方、立柱正前方、煤壁与支架之间。","4.操作阀组时，侧身站位，面部避开阀组及管路接头正对方向。","5.处理支架漏液、卡阻故障时，关闭截止阀、卸压后操作，远离高压喷射方向。","6.端头支护、调架时，人员站在安全支护区内，严禁站在无支护空顶区。"]},{"t":"五、标准化作业流程","p":["班前交底→安全条件确认→支架全面检查→收回护帮板/侧护板→降架（适度）→移架（同步跟机）→升架（接顶严实）→伸出护帮板/侧护板→调整支架姿态→清理浮煤杂物→验收确认。"]},{"t":"六、作业质量标准","p":["1.初撑力：达到设计值，不低于24Mpa，压力表显示正常。","2.支架间距：中心距符合设计，偏差≤±100mm，无咬架、挤架现象。","3.移架步距：与采煤机截深匹配，误差≤±50mm，平直排列，无歪架、斜架。","4.接顶质量：顶梁与顶板严密接触，无间隙、无悬空，前探梁及时伸出护顶。","5.护帮质量：护帮板紧贴煤壁，无空隙、无歪斜，防止片帮掉落。","6.支架姿态：垂直工作面，无前倾后仰、左右倾斜，侧护板伸缩灵活、密封良好。","7.文明作业：支架周围无浮煤、杂物，管路排列整齐、无挤压弯折。"]},{"t":"七、安全管控措施","p":["（一）操作前检查","1.持证上岗，熟悉支架性能、构造及液压系统，严格按规程操作。","2.操作前须检查支架左右5m范围内煤壁、顶板及作业环境，确认安全方可操作。","3.操作前核对操作阀标识与按钮一致，防止误操作。","4.检查操纵阀按钮是否处于关闭位置，确认后打开总液压截止阀。","（二）移架操作规范","1.移架前检查高压胶管及信号线，确认无误方可操作。","2.收回伸缩梁，可与移架同步进行；移架时2人配合（1人操作、1人观察顶板及管线）。","3.移架中保持支架平衡，发现微倾斜及时用抬底千斤顶调整，防止倾斜或下滑。","4.升架后利用调架装置和侧护板，使顶梁、底座与邻架对齐，防止咬架、下滑。","5.升降高度控制在1.7—2.2m，顶梁上下摆动角度≤15°（地质变化时），防止损坏支架或压死。","6.操作立柱升降时，须同步操作平衡千斤顶，保持顶梁水平。","（三）支撑与压力要求","1.移架后立即升起立柱支撑顶板，立柱压力≥24MPa，不足时进行二次补液。","2.临时支护冒顶区时降低顶梁高度，确保采煤机正常运行。","（四）异常处理","1.移架阻力过大时，严禁强行移架，查清原因处理后再作业。","2.发现高压胶管破损、阀组损坏或安全阀损坏，及时更换；更换胶管及阀组必须在卸压状态下进行，出液口前方严禁站人。","3.不准随意拆除或调整安全阀。","（五）特殊部位检修","1.检修机头、机尾过渡支架护帮板时：先闭锁检修支架操作阀，检查护帮板固定情况，确认安全方可作业；使用刮板链牵引，2人配合（1人操作、1人观察），发现问题及时处理。","（六）操作结束","1.操作结束后及时闭合防护罩，防止误操作。","2.损坏的阀组、千斤顶未更换前，该支架不得操作使用。"]}]}],"w":2091,"cn":3,"sn":12},{"c":"CM-C-04","n":"刮板输送机操作","t":"CM-C-04 刮板输送机操作模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面刮板输送机操作行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝断链、飘链、卡链、挤伤、机电伤人、设备损坏等安全隐患，保障运输畅通、稳定可靠，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面刮板输送机开机、运行、停机、紧链、处理故障、日常维护全过程作业及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后启动；先检查、后运转；不安全、不开机。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章   采煤模块","s":[{"t":"一、模块概述","p":["模块编号：CMC-04","模块名称：刮板输送机操作","所属专业：采煤","适用范围：刮板输送机司机及现场所有作业人员"]},{"t":"二、危险预知及防控","p":["1.刮板链挤伤、断链伤人：运行时严禁靠近机头、机尾、链轮及链条，严禁跨越、乘坐刮板机。","2.机头、机尾滚筒绞伤：严禁清理滚筒、链轮浮煤，严禁伸手探入运转部位。","3.大块煤矸卡链、崩飞伤人：控制入料块度，发现卡链立即停机，处理时防止煤矸崩飞。","4.设备顶翻、倾倒伤人：机头、机尾固定牢固，锚固可靠，防止拉翻。","5.瓦斯、粉尘危害：保持通风、喷雾正常，瓦斯超限立即停机撤人。"]},{"t":"三、作业条件安全确认","p":["1.环境：工作面通风良好、瓦斯≤0.5%、粉尘喷雾开启；机头机尾支护完好、无片帮冒顶；照明充足、无杂物堆积、通道畅通。","2.设备：刮板机平直、无错茬；刮板链松紧适度、无缺刮板、无严重磨损；机头机尾固定牢固、锚固可靠；电机、减速器、联轴器完好，无异响、无渗漏；开关、保护装置灵敏可靠；电缆完好、吊挂规范；喷雾降尘系统畅通有效。","3.人员：持培训合格证上岗，≥2人配合作业，互保联保明确，无疲劳、酒后上岗。","4.联动：与采煤机、液压支架、转载机、破碎机信号联络畅通，启停信号明确。"]},{"t":"四、作业现场人员安全站位","p":["1.刮板机运行时，人员站在支架立柱之间、人行道侧，严禁站在机头、机尾、链轮、链条正上方及运转方向。","2.清理浮煤、观察运行时，侧身站位，距机头/机尾≥1.5m，严禁正对链轮、链条。","3.处理卡链、掉链、断链时，停机、断电、闭锁、挂牌、上锁后操作，站在侧面安全位置，防止煤矸、刮板崩飞。","4.紧链、拆接链时，人员避开紧链器、链条反弹方向，严禁站在链条受力侧。","5.开机前，全员撤离至安全区域，确认机头、机尾及机道无人后，方可发信号开机。"]},{"t":"五、标准化作业流程","p":["班前交底→安全条件确认→设备全面检查→信号确认、预警→空载点动试运转→空载正常运行→带载运行（均匀给料、观察工况）→运行监护（听、看、闻、摸）→停机（正常/紧急）→断电闭锁→清理检查→维护保养→验收确认。"]},{"t":"六、作业质量标准","p":["1.平直度：刮板机铺设平直，水平、垂直弯曲度符合规定，无明显起伏、错茬。","2.刮板链：松紧适度，下垂度符合要求；刮板齐全、无变形、无缺失；螺栓紧固、无松动。","3.运行状态：运转平稳、无跑偏、无飘链、无跳链、无刮卡；无异响、无剧烈振动；无严重漏煤、撒煤。","4.机头机尾：固定牢固、锚固可靠；链轮磨损正常、无严重啃齿；无过热。","5.保护装置：急停、闭锁保护齐全灵敏，动作可靠。","6.文明作业：机道无积煤、无杂物；喷雾降尘正常；电缆、管线吊挂整齐。"]},{"t":"七、安全管控措施","p":["1.司机必须持证上岗，严格遵照操作规程作业。","2.开机前全面检查、确认安全，按由前向后顺序传递开机信号；司机在安全位置集中操作，全程紧盯设备、随时处置异常；停机逐级传递信号，分段有序停机。","3.设备开机前逐项排查部件缺损、隐患问题，隐患未整改严禁开机。","4.停机前必须清空机道煤矸，设备空载停机，禁止带载停机。","5.设备安装严格执行三平、三直、一稳标准：机槽、电机减速底座平整；机头、机槽、机尾及设备轴芯、链轮平直；整机安装稳固无摇摆，机尾盖板齐全完好。","6.保证刮板螺丝齐全紧固、链条松紧适度、机头搭接合规，挡煤板、人行过桥完好，声光信号灵敏，机头机尾压柱锚固牢固。","7.作业区域顶帮支护存在安全隐患时，立即上报班组长，隐患处置完毕后方可开机。","8.日常及时清理电机、减速箱表面浮煤杂物，保障设备散热，防范高温故障。","9.设备运行期间，严禁人员跨越机头、清理转动部位浮煤、徒手调整刮板链条。","10.设备故障检修时，必须执行断电、闭锁、挂牌、上锁制度。","11.掐链、接链、调链作业必须使用阻链器，作业人员避开链条受力、反弹方向；设备运行时司机严禁正对运行方向，防范断链伤人。","12.严禁刮板输送机载人；工作面每15m设置一组灵敏可靠的急停按钮，突发险情可紧急停机。","13.刮板输送机铺设与煤壁保持平直规整，成一条直线。","14.过渡槽、中间槽、机尾搭接平缓，弯曲超标及时调整；磨损刮板及时更换。","15.定期排查溜槽、刮板磨损情况，磨损严重部件及时更换，保障设备运行工况。"]}]}],"w":2070,"cn":3,"sn":12},{"c":"CM-C-05","n":"转载机操作","t":"CM-C-05 转载机操作模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面转载机开机、运行、停机、紧链、故障处理、日常维护全流程操作行为，统一作业流程、风险防控要点、质量验收标准，实现操作标准化、风险可控化、验收闭环化，杜绝断链、飘链、卡矸、挤伤人员、机电设备损坏、漏煤冲巷等安全隐患，保障工作面煤炭转运连续稳定，特制定本模块化作业方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井全部综采工作面转载机空载启动、带载转运、停机检修、紧链、处理卡堵、日常巡检维护全过程作业及现场安全管控。"]},{"t":"三、管理原则","p":["1.先确认、后启动；先检查、后运转；不安全、不开机。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长： 采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 转载机操作模块","s":[{"t":"一、模块概述","p":["模块编号：CMC-05","模块名称：转载机操作","所属专业： 采煤","适用范围： 转载机司机及现场所有作业人员"]},{"t":"二、危险预知及防控","p":["1.刮板链条挤伤、断链弹飞伤人：设备运行期间严禁靠近机头、机尾、链轮、中部槽链条区域，禁止跨越、搭乘转载机。","2.机头滚筒、链轮绞伤：运转状态下禁止清理滚筒、链轮处积煤矸石，严禁将手、工具伸入运转部位。","3.大块矸石、煤块卡堵崩飞伤人：控制工作面落煤块度，出现卡堵立即停机断电，处理时防范物料飞溅伤人。","4.电气漏电、触电伤害：每班检查电机、开关、电缆绝缘层完好，严禁带电开盖、带电检修设备。","5.机头机尾锚固失效倾倒伤人：机头、机尾锚固装置每班检查，保证固定牢靠，防止拉拽翻倒设备。","6.瓦斯、粉尘职业危害：作业期间喷雾降尘系统正常开启，瓦斯浓度超标立即停机断电、全员撤离。","7.破碎机联动伤人：转载机与破碎机联动作业时，禁止人员站在进料口、出料口正对位置，防止物料喷射。"]},{"t":"三、作业条件安全确认","p":["1.环境条件：巷道通风稳定，瓦斯浓度≤0.5%；全断面喷雾正常投用，粉尘治理达标；转载机机头、机尾、巷道两侧支护完整，无片帮、冒顶风险；巷道照明充足，设备两侧通道无杂物、积煤堵塞，人行通道畅通。","2.设备条件：转载机中部槽铺设平直，无错茬、无变形；刮板链松紧适宜，刮板无缺失、无严重磨损、变形，连接螺栓齐全紧固；机头、机尾锚固、压柱齐全牢固；电机、减速器、联轴器无渗漏、无异响、温度正常；急停、闭锁、过载、断链等保护装置灵敏可靠；电缆吊挂规范、外皮无破损；喷雾降尘管路畅通，喷头无堵塞；与破碎机、皮带机、刮板输送机联动信号装置完好。","3.人员条件：操作人员持证上岗，每班不少于2人员配合作业，互保联保责任明确；无疲劳上岗、酒后上岗、带病作业人员。","4.联动条件：与工作面刮板输送机、液压支架、破碎机、顺槽皮带机声光信号联络清晰，启停、故障预警信号统一规范。"]},{"t":"四、作业现场人员安全站位","p":["1.转载机运行期间，人员必须站在巷道人行侧、支架/巷道立柱间隙，严禁站在机头、机尾、链轮、链条正上方及物料运转正对方向。","2.巡检、清理浮煤时侧身站立，与机头、机尾滚筒保持不小于1.5m安全距离，禁止正对链轮与出料口。","3.处理卡矸、掉链、断链故障时，执行停机、断电、闭锁、挂牌四项措施，人员站在设备侧面避险位置，规避煤矸、刮板反弹冲击。"]},{"t":"五、标准化作业流程","p":["班前交底→作业环境安全确认→整机逐项设备检查→联动信号测试、开机预警→空载点动试运转→空载稳定运行检查→带载均匀转运物料→常态化运行巡检→正常停机/紧急故障停机→停电闭锁挂牌上锁→清理机道积煤杂物→设备巡检保养润滑→班组长验收闭环。"]},{"t":"六、作业质量标准","p":["1.中部槽平直度：转载机整体铺设平直，水平、垂直弯曲符合规程要求，无高低起伏、无明显错茬，对接间隙合规。","2.刮板链条：链条松紧适度，下垂量符合设备规定；刮板齐全无缺损、无扭曲变形，连接螺栓全部紧固无松动。","3.运行工况：整机运转平稳，无飘链、跳链、刮卡、跑偏现象；无剧烈振动、无周期性异响；中部槽、机头无大面积漏煤、撒煤。","4.机头机尾标准：锚固压柱齐全牢固，无松动失效；链轮磨损量在允许范围，无啃齿、卡齿；无过热、漏油现象。","5.保护装置：沿线急停、断电闭锁保护齐全完好，触发动作灵敏可靠，严禁随意拆除、短接保护。","6.文明作业标准：转载机机道无厚层积煤、大块杂物堆积；喷雾装置全程开启，巷道粉尘达标；电缆、液压管路、防尘管线吊挂整齐规范。"]},{"t":"七、安全管控措施","p":["1.设备运行行人管控：设备运行期间，行人必须走专用过桥，严禁跨越转载机、站立在槽体盖板上。","2.转载机用途管控：转载机仅限运输煤矸，严禁运送各类物料、铁器杂物。","3.机头机尾与故障处理管控：设备运行时机头、机尾严禁人员靠近，禁止身体探入落煤位置；故障处理必须断电闭锁、按下急停按钮。","4.紧链作业安全距离管控：紧链作业必须使用配套阻链器，人员保持≥3m安全距离，严禁正对机头、机尾作业，严防链条断裂、阻链器失效伤人。","5.设备检修停电闭锁管控：设备检修由熟练人员作业，作业前断电归零、闭锁挂牌上锁，严格执行谁上锁、谁解锁制度，杜绝误送电伤人。","6.液压配件检修卸压管控：液压配件检修更换前，手柄归零、彻底卸压，确认无压力后方可施工。","7.设备散热清理管控：司机定期清理电机、减速机、焊接罩浮煤杂物，保障散热，防范设备高温起火。","8.溜槽作业与悬空段加固管控：设备运行中严禁人员进入溜槽内侧作业；清理悬空段底煤时，禁止站在悬空段下方，作业前必须使用不少于2根单体支柱加固悬空段。"]}]}],"w":2273,"cn":3,"sn":12},{"c":"CM-C-06","n":"带式输送机操作","t":"CM-C-06 带式输送机操作模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下带式输送机开机、运行、停机、调偏、处理堵料、日常检修维护全流程操作行为，统一作业流程、风险防控要点、质量验收标准，实现操作标准化、风险可控化、验收闭环化，杜绝皮带跑偏撕裂、滚筒绞伤、物料飞溅、机电触电、设备损坏等安全隐患，保障原煤连续稳定转运，特制定本模块化作业方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井综采顺槽、巷道所有带式输送机空载启动、带载运煤、停机检修、调偏处理堵料、日常巡检维护全过程作业及现场安全管控。"]},{"t":"三、管理原则","p":["1.先确认、后启动；先检查、后运转；不安全、不开机。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 采煤模块","s":[{"t":"一、模块概述","p":["模块编号：CMC-06","模块名称：带式输送机操作","所属专业： 采煤","适用范围： 带式输送机司机及现场所有作业人员"]},{"t":"二、危险预知及防控","p":["1.滚筒、托辊绞碾伤人：设备运行期间严禁伸手清理滚筒、托辊积煤，禁止跨越、钻行、乘坐皮带。","2.皮带撕裂、跑偏剐蹭伤人：皮带严重跑偏、撕裂立即停机、闭锁、挂牌、上锁并处理，防止皮带剐蹭、反弹伤人。","3.大块煤矸堵料飞溅伤人：控制入料块度，发生堵料立即停机停机，处理时防范物料崩飞。","4.电气漏电、触电伤害：每班检查电机、开关、电缆绝缘完好，严禁带电开盖、带电检修电气设备。","5.皮带机架失稳倾倒伤人：机头、机尾、中间架支腿齐全牢固，锚固可靠，防止设备倾倒。","6.瓦斯、粉尘职业危害：作业全程喷雾降尘同步开启，瓦斯浓度超标立即停机断电、全员撤离新鲜风流。","7.清扫器、拉紧装置挤压伤人：调紧拉紧、更换清扫器必须停机闭锁，防止挤压夹伤。"]},{"t":"三、作业条件安全确认","p":["1.环境条件：巷道通风稳定，瓦斯浓度≤0.5%；机头、机尾、转载点喷雾完好投用，粉尘达标；巷道顶板两帮支护完整，无悬矸、片帮、冒顶；巷道照明充足，皮带两侧人行通道无积煤杂物堵塞，撤离通道畅通。","2.设备条件：皮带机架平直稳固，支腿无缺失、变形；皮带无撕裂、破损、严重老化，接头完好；上下托辊、缓冲托辊齐全转动灵活；滚筒包胶完好无破损；拉紧装置调节适度；清扫器、挡煤板完好贴合皮带；电机、减速器、联轴器无渗漏、无异响、温度正常；急停、跑偏、撕裂、堆煤、超温、烟雾保护，齐全灵敏；电缆吊挂规范无破损；喷雾管路畅通无堵塞；与转载机、破碎机声光联动信号完好清晰。","3.人员条件：皮带司机持证上岗，每班不少于2人配合作业，互保联保责任明确；无疲劳、酒后、带病上岗人员。","4.联动条件：与转载机、破碎机、工作面设备启停、预警、故障信号统一规范，联络无盲区。"]},{"t":"四、作业现场人员安全站位","p":["1.皮带运行期间，人员站在巷道人行侧，严禁站在机头、机尾滚筒、皮带上下方、皮带正前方。","2.巡检、清理浮煤时侧身站立，与机头滚筒保持≥1.5m安全距离，禁止正对出料、落料点。","3.调偏、处理堵料、更换托辊、检修清扫器时，执行停机、断电、闭锁、挂牌、上锁，人员站在设备侧面安全位置。","4.调整拉紧装置、处理皮带跑偏时，避开拉紧油缸、重锤坠坨下落、回弹范围。","5.开机预警阶段，机头、机尾、皮带沿线、转载点全部人员撤离，确认无人员滞留后方可发送开机信号。"]},{"t":"五、标准化作业流程","p":["班前专项交底→作业环境安全确认→整机机架、皮带、保护系统逐项检查→联动信号测试、全域开机预警→空载点动试运转→空载稳定运行检查跑偏、异响→带载均匀上料转运→动态巡检→正常停机/故障紧急停机→断电闭锁挂牌上锁→清理机头机尾及沿线积煤杂物→设备调偏、润滑、紧固保养→班组长验收闭环"]},{"t":"六、作业质量标准","p":["1.机架平直标准：皮带中间架、机头机尾铺设平直，支腿齐全稳固，无倾斜、悬空、变形，机架对接间隙合规。","2.皮带运行标准：皮带无跑偏、无刮磨机架、无撕裂破损；接头平整牢固，无开胶、起皮；上下皮带无严重撒煤、漏煤。","3.托辊滚筒标准：所有托辊转动灵活无卡滞；滚筒完好，无尖锐磨损；无过热、漏油。","4.拉紧清扫标准：皮带松紧适度，无打滑、松弛；清扫器与皮带贴合紧密，残煤清理干净；挡煤板密封完好，无大面积撒料。","5.保护装置标准：沿线急停、跑偏、撕裂、堆煤、烟雾、温度保护齐全完好，动作灵敏可靠，严禁私自拆除、短接各类保护。","6.文明作业标准：皮带沿线无厚层积煤、矸石堆积；转载点喷雾全程开启，粉尘达标；动力电缆、防尘管线吊挂整齐规范。"]},{"t":"七、安全管控措施","p":["1.上岗资质与作业纪律管控：经培训持证上岗，依规操作设备；落实岗位制度，杜绝违章操作。","2.设备安装与保护装置管控：机身平、直、稳、转动顺畅；堆煤、打滑、跑偏、撕裂保护，测温、烟雾、洒水灭火装置齐全有效。","3.开机规范管控：先发信号，三次点试运转后再正式开机。","4.运行行为管控：运转时禁止徒手调校托辊、清理滚筒煤泥，不得清理机头、机尾浮煤杂物；及时校正胶带跑偏，规避摩擦升温起火风险。","5.运输与行人管控：禁止运料、人员搭乘皮带；严禁翻越、乘坐皮带；通行必须走带防护栏杆的专用行人过桥。","6.急停设施与应急管控：沿线布设拉线急停，间距≤100m，装置灵敏，禁止铁丝替代拉线；险情立刻拉动急停停机。","7.设备管护与检修管控：常态化维保，及时处置故障、更换配件，保障设备稳定运行。"]}]}],"w":2223,"cn":3,"sn":12},{"c":"CM-C-07","n":"回柱绞车操作","t":"CM-C-07 回柱绞车操作模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下回柱绞车开机、牵引、停机、紧固锚固、处理钢丝绳故障、日常维护全流程操作行为，统一作业流程、风险防控要点、质量验收标准，实现操作标准化、风险可控化、验收闭环化，杜绝断绳弹甩、绞车拉翻、钢丝绳挤伤、机电漏电、设备损坏等安全隐患，保障井下物料转运、设备拖拽作业安全连续开展，特制定本模块化作业方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井井下所有回柱绞车空载试运转、物料拖曳转运、停机检修、处理钢丝绳缠绳、更换绳卡、日常巡检维护全过程作业及现场安全管控。"]},{"t":"三、管理原则","p":["1.先确认、后启动；先检查、后运转；不安全、不开机。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 回柱绞车操作模块","s":[{"t":"一、模块概述","p":["模块编号：CMC-07","模块名称：回柱绞车操作","所属专业： 采煤","适用范围： 回柱绞车司机及现场所有作业人员"]},{"t":"二、危险预知及防控","p":["1.钢丝绳断丝、断绳弹甩伤人：作业前全面检查钢丝绳磨损、锈蚀、断丝、扭结缺陷，严禁超载牵引，所有人员避开钢丝绳受力回弹方向。","2.滚筒缠绳、闸体绞挤伤人：绞车运转期间禁止伸手清理滚筒乱绳和闸体间隙，衣服袖口衣扣扎紧，严禁跨越、踩踏运行中的钢丝绳。","3.绞车锚固失效拉翻伤人：压柱、戗柱、地锚或基座固定螺栓，每班检查，严禁斜拉、歪拉、硬拽重物，防止绞车移位翻倒。","4.电气漏电、触电伤害：每班检查电机、开关、电缆绝缘完好，严禁带电开盖、带电检修电气设备。","5.轨道不实矿车侧翻伤人：每班运输前对运输范围内轨道进行检查确认，发现轨道不实及时处理后方可运输。","6.运输过程中人员走动伤人：运输过程中严格执行“行车不行人，行人不行车”。"]},{"t":"三、作业条件安全确认","p":["1.环境条件：巷道顶板、两帮支护完整，无悬矸、片帮、冒顶风险；巷道照明充足，绞车两侧人行通道无积煤、杂物堵塞，撤离通道畅通。","2.设备条件：绞车底座压柱、戗柱、地锚齐全，紧固无松动；钢丝绳规格满足作业要求。无严重断丝、锈蚀、扭结，绳卡数量、间距、紧固力矩符合规程；制动闸、离合闸操作灵活，闸瓦间隙合规，制动可靠；电机、减速箱无渗漏油、无异响，轴承温度正常；急停、断电闭锁、过载保护装置灵敏可靠；电缆吊挂规范、外皮无破损漏电；导向滑轮锚固牢固、转动灵活无变形；转运声光信号装置完好清晰。","3.人员条件：绞车司机持证上岗，作业人数满足要求，互保联保责任明确；无疲劳上岗、酒后上岗、带病作业人员。","4.联动条件：绞车司机、信号工和其他作业人员配合到位，规范作业，联络清晰无盲区。"]},{"t":"四、作业现场人员安全站位","p":["1.绞车运行牵引期间，司机站在绞车侧面掩护安全位置，身体避开滚筒出绳、钢丝绳弹甩范围，严禁正对滚筒出绳方向。","2.拖拽转运物料时，所有人员全部撤至安全区域，严禁站在钢丝绳、重物正前方。","3.处理缠绳、更换绳卡、检查钢丝绳故障时，执行停机、断电、闭锁、挂牌、上锁措施，人员站在滚筒侧面安全位置。","4.牵引、紧绳作业过程中，全员避开钢丝绳拉紧受力回弹一侧，禁止跨越、踩踏钢丝绳绳道。","5.开机预警阶段，绞车前后、转运通道、滑轮周边全部人员撤离至安全区域，确认无人员滞留后方可发送开车信号。"]},{"t":"五、标准化作业流程","p":["作业区域环境安全确认→绞车锚固、钢丝绳、制动系统逐项检查→设置警戒线→联动信号测试→全域开机预警→开车转运物料→正常停机→断电闭锁、上开关锁→清理绞车周边杂物"]},{"t":"六、作业质量标准","p":["1.绞车锚固标准：压柱垂直顶底板，无歪斜；戗柱与底板形成夹角，无悬空；地锚螺栓紧固无松动，绞车机身无倾斜、移位，牵引过程无明显晃动。","2.钢丝绳标准：钢丝绳在滚筒排列整齐无挤压、扭结；断丝、直径磨损量不超过规程限值；绳卡数量充足、间距合规、全部紧固无滑绳；禁止放绳至绳头，钢丝绳与滚筒连接固定，剩余钢丝绳不少于3圈。","3.制动系统标准：制动闸操作轻便灵活，闸瓦贴合紧密，制动可靠，牵引及停机后无溜绳、滑绳现象。","4.运行工况标准：绞车运转平稳无剧烈震动、无异响；减速箱、电机无渗漏油。","5.保护装置标准：开关过载保护齐全完好，触发动作灵敏可靠，严禁私自拆除、短接各类保护装置，。","6.安全设施、绳头、","7.文明作业标准：绞车底座、绳道无厚层积煤、矸石杂物堆积；喷雾装置全程开启，作业区域粉尘达标；动力电缆、防尘管线吊挂整齐规范。"]},{"t":"七、安全管控措施","p":["1.人员与设施要求：持证上岗，严禁无证操作。开机前全面检查声光信号、主绳、压柱、戗柱等设施，确保符合“三固定、四保险”要求，严禁带病运行。","2.防护与警戒：绞车前方须支设护身点柱或防护网，防止断绳回弹伤人。运行期间，绳道两侧严禁有人，严格执行“行人不开车，开车不行人”。运输路线上无关人员全部撤至安全地点，上下或其他行人出入口设警戒，警戒未解除严禁任何进入。","3.操作规范：每次拉车数量符合绞车运载能力，严禁超负荷。信号规定：一声停、二声提、三声放，司机听清后方可操作。钢丝绳须与矿车专用连接销连接，严禁用其他物件代替。开机前所有人员撤离绳道，撤至绞车后方。","4.停机管理：停机后开关打至零位，停电闭锁、上按钮锁。"]}]}],"w":2175,"cn":3,"sn":12},{"c":"CM-C-08","n":"综采工作面电气设备检修","t":"CM-C-08 综采工作面电气设备检修模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面电气设备检修，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝瓦斯高值、触电伤人、登高作业防护不当伤人、机械旋转伤害等安全隐患，提升检修质量与操作人员人身安全，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面电气设备检修维护全过程作业与现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不操作。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长： 采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章   采煤电气设备检修模块","s":[{"t":"一、模块概述","p":["模块编号：CMC-08","模块名称：电气设备检修","所属专业： 采煤","适用范围： 电气检修人员"]},{"t":"二、危险预知及防控","p":["1.未确认作业环境：造成人员伤害风险。","2.瓦斯：未检测瓦斯，可能存在瓦斯超限，造成瓦斯风险","3.触电伤害：误送电/反送电、未验电放电、未挂接地线、拆线时触碰带电体、约时停送电，造成人员触电风险","4.登高作业防护不当：造成人员坠落风险"]},{"t":"三、作业条件安全确认","p":["1.环境：顶板完整、无裂隙离层，煤壁稳定无片帮，通风良好，瓦斯＜0.5%，照明充足，保证安全退路畅通。","2.工具：确认作业工具器及劳动防护用品齐全完好。","3.停电：确认检修设备上级电源停电闭锁挂牌上锁。"]},{"t":"四、作业现场人员安全站位","p":["1.检修时，站在周围环境完好的地点。","2.避开设备倾倒、坠落的区域。","3.设备运行时，保持安全距离，站在避开设备转动部位。"]},{"t":"五、标准化作业流程","p":["班前交底 → 现场安全条件确认 → 检测瓦斯浓度 → 对上级开关停电闭锁、挂牌上锁 → 验电、放电、打接地线 → 检修设备 → 清理现场杂物，收拾工器具 → 确认安全后送上级电源 → 设备试运行，填写检修记录"]},{"t":"六、作业质量标准","p":["1.设备外观：设备外观完好，各紧固件完好齐全。","2.设备外壳：无开焊变形，符合防爆要求。","3.密封装置：齐全完好，符合防爆标准。","4.防爆面：无锈蚀无划痕，专用油涂抹均匀。","5.腔内检查：设备内腔无杂物，无铜丝头等。","6.接线工艺：长度合适，无毛刺，压接牢固，深入器壁符合规定。","7.保护元件：功能齐全、灵敏、可靠。","8.防爆管理：严格执行电气管理制度，杜绝失爆。"]},{"t":"七、安全管控措施","p":["（一）操作前检查","1.持证上岗，熟悉设备性能、原理、作用，严格按规程操作。","2.操作前须检查设备5m范围内煤壁、顶板及作业环境，确认安全方可操作。","3.确认设备电气名称、线路一致。","（二）操作规范","1.打开防爆设备时保护好防爆接合面，防止磕碰、划伤、沾染煤尘；禁止损坏密封圈、垫圈、挡板。","2.电缆接头处理规范，芯线连接牢固，绝缘包扎完好，密封圈尺寸匹配，不得割开、套多层密封圈。","3.检修中严禁改变设备原有防爆结构，不得拆除、短接保护装置（漏电、过流、接地保护）。","4.零部件安装到位，螺栓紧固齐全，弹簧垫齐全，防爆间隙符合标准，杜绝失爆隐患。","5.作业现场文明施工，工具配件摆放整齐，煤尘杂物及时清理。","6.检修期间专人监护，一人操作、一人监护，发现顶板、瓦斯异常立即停止作业撤离至安全地点。","（三）操作结束","1.清点工具、配件，清理作业现场杂物。","2.按停送电制度送电，点动试运转，观察设备运行电流、温度、声音。","3.试运行正常，方可移交投入使用；存在故障重新停电处理。","4.设备遗留问题，及时进行汇报。","5.做好检修记录，写明检修内容、隐患、试验情况、检修人员、时间。"]}]}],"w":1499,"cn":3,"sn":12},{"c":"CM-C-09","n":"综采工作面两顺槽超前液压支架","t":"CM-C-09 综采工作面两顺槽超前液压支架模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面两顺槽超前液压支架，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝顶板伤人、机械伤人等安全隐患，提升作业质量与操作人员人身安全，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面两顺槽超前液压支架操作全过程作业与现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不操作。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、事事有确认。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长： 采煤队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章   采煤模块","s":[{"t":"一、模块概述","p":["模块编号：CMC-09","模块名称：两顺槽超前液压支架","所属专业： 采煤","适用范围：支架工及现场所有作业人员"]},{"t":"二、危险预知及防控","p":["1.人员误入伤害：移架作业区域严禁无关人员进入，防止支架动作挤伤、碰伤人员。","2.支架挤压伤人：移架、调架时，无关人员严禁站在支架与巷帮、支架与设备之间，严禁跨越运行支架及支架动作范围。","3.倒架、歪架：严格控制降架高度，移架平稳缓慢，及时调架扶正，防止支架倾斜、倾倒。","4.高压液喷射伤人：作业前检查液压管路、接头、阀组完好，严禁带压拆卸配件，有故障必须卸压处理。","5.顶板冒落、掉矸伤人：支架及时升架接顶背实，空顶区域严禁人员停留作业，破碎顶板提前加强支护。","6.片帮冒顶风险：落架、移架过程易诱发巷帮片帮、顶板掉顶，必须少降快移、及时支护。","7.设备刮卡损坏：移架严控步距，与电缆、管路保持安全距离，防止刮蹭、挤压设备。","8.支护失效、巷道变形：实时观察顶板下沉、巷帮鼓出，发现压力异常及时补强支护。"]},{"t":"三、作业条件安全确认","p":["1.环境条件：作业区域顶板、巷帮稳定，无离层、片帮、掉矸；通风良好，瓦斯浓度小于0.5%；照明充足，巷道无堆积杂物、无积水，断面满足作业要求。","2.设备条件：超前支架完好、千斤顶伸缩灵活；液压管路无破损、无漏液、接头牢固；阀组、安全阀、压力表灵敏可靠；设备无障碍，满足移架条件。","3.人员条件：作业人员经过专项培训；作业人数满足需要，互保联保到位，无酒后、疲劳、带病作业，劳保穿戴齐全。","4.支护条件：原有巷道支护完好、无失效构件；超前支架排列规整、间距合理；端头、拐点支护牢固，空顶区临时支护到位。","5.警戒设置：移架作业前封闭作业区域，设置警戒线，严禁无关人员进入作业危险区域。"]},{"t":"四、作业现场人员安全站位","p":["1.移架、调架必须站在已支护完好的安全区域内，无关人员全部撤离支架动作范围。","2.操作阀组必须侧身站位，避开高压管路、接头正对方向，防止喷液伤人。","3.处理漏液时，必须关闭截止阀、彻底卸压，人员远离出液方向。","4.多人作业统一口令、专人指挥，保持安全距离，禁止交叉危险作业。"]},{"t":"五、标准化作业流程","p":["作业环境安全确认→设备停电、闭锁、挂牌、上锁→作业区域设置警戒→一侧适度落架→平稳移架→升架→另一侧适度落架→平稳移架→升架→回收尾巷→前端降架→背顶→升架→压力检查、二次补压→整理管线、清理浮煤杂物→质量验收闭环→对相应设备进行解锁，解除警戒。"]},{"t":"六、作业质量标准","p":["1.初撑力标准：支架初撑力达标，立柱压力≥12MPa，压力不足必须二次补液。","2.移架步距及超前距：移架步距均匀合规，工作面超前支护距离不小于20m。","3.支护姿态：支架排列整齐、无歪架、挤架，接顶严实，支架迎山有力、不歪斜。","4.文明生产：支护范围内无浮煤、无矸石、无杂物，巷道通行畅通、干净整洁。"]},{"t":"七、安全管控措施","p":["（一）操作前检查管控","1.作业人员熟知设备性能及操作规程，严禁违章作业。","2.班前检查作业点5m范围顶板、巷帮围岩情况，确认无片帮、冒顶风险方可开工。","3.核对阀组操作功能，确认手柄归零，再开启总液压截止阀，杜绝误操作。","4.全面检查管路、阀组、千斤顶、安全阀，设备损坏、漏液及时处理。","5.清理作业区域障碍物，保证移架空间及行人通道畅通。","（二）移架操作规范","1.移架前检查液压管路、线路完好，确认无隐患方可作业。","2.严禁单人移架作业，一人操作、有人观察监护，。","3.移架做到慢降、慢移、稳升，严禁强行、硬挤，遇卡阻立即停机处理。","4.移架到位后及时调架、扶正、调平，保证支架整齐、受力均匀。","5.升降架高度合理，顶梁平稳，防止支护不实。","（三）支撑与压力管控要求","1.移架到位立即升架支护、及时补液，确保立柱压力≥12MPa，压力不足反复补压至稳定达标。","2.顶板破碎、压力异常地段，加强观测、及时补强支护，保证巷道稳定。","3.合理调整顶梁高度，在保障安全支护前提下，满足通风、行人、设备运行要求。"]}]}],"w":1946,"cn":3,"sn":12}],"os":"三","rn":"低风险","rc":"蓝","rg":"C","n":9,"label":"低风险 · 蓝色 C段"}],"no":"01","name":"采煤作业模块"},{"t":"第二部分 掘进作业模块","g":[{"t":"一、高风险-红色-A段（11项）","lv":"A","m":[{"c":"JJ-A-01","n":"掘进工作面贯通","t":"JJ-A-01 掘进工作面贯通模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范掘进工作面相向、单向贯通全工序作业行为，统一施工流程、一通三防、顶板、水害风险防控、贯通验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝瓦斯超限、冒顶片帮、通风短路、透水、巷道跑偏等隐患，保障贯通施工安全成型，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有巷道贯通作业，覆盖贯通预报、停掘、施工、通风调整、隐患治理、验收全流程。"]},{"t":"三、管理原则","p":["1.先预报、后掘进；先停掘、后贯通；先调风、再生产；不安全、不生产。","2. 流程一步不省、标准一点不降、风险一项不漏。","3. 班班有交底、班班有验收、班班有闭环、月月有考核。第二章 组织机构及职责"]},{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、综掘司机、安检员、瓦斯检查员、延线员"]},{"t":"二、核心职责","p":["队长、支部书记：贯通工程整体统筹、人员调配、考核管理。","安全技术副队长：贯通措施编制、技术交底、水 / 瓦斯隐患督办、模块优化。","跟班副队长：贯通期间现场盯守，小进尺施工全程管控。","班组长：当班循环管控、瓦斯 / 顶板动态观测、班组自检。","综掘司机：严格小进尺截割，严禁强震动大开挖。","瓦斯检查员：不间断检测贯通两端瓦斯，超限立即撤人。","安检员：高风险贯通全程监督，制止违章、闭环隐患。","延线员：每日复测贯通剩余距离，校核中线腰线。"]}]},{"t":"第三章  掘进工作面贯通模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-A-01","模块名称：掘进工作面贯通施工","所属专业：掘进、一通三防、地测防治水","适用范围：贯通全体作业人员"]},{"t":"一、危险预知及防控","p":["1.贯通冒顶片帮伤人：贯通前后 10m 加密支护，严控单次进尺","2.瓦斯积聚、超限爆炸：贯通前后按要求进行瓦斯检查，提前构筑调风设施","3.通风短路风流紊乱：贯通立即停工，专业人员调风","4.老空积水突水伤人：贯通前超前探水，有水先疏放","5.巷道跑偏错层：延线员每日复测中线腰线","6.截割震动崩矸伤人：慢速截割，专人观山"]},{"t":"二、作业条件安全确认","p":["1.环境确认：贯通两端前后 20m 支护完好，破碎区域提前补强；局部通风机、风筒无破损，风量充足；排水系统畅通，无积水老空；贯通警戒、栅栏、警示设置到位。","2.监测：甲烷便携仪、固定传感器校验合格，通讯电话、应急广播畅通。","3.设备确认：综掘机、运输机完好，消防器材、临时支护材料备足。","4.人员确认：瓦检员、安检员、区队长、主管领导现场在岗，作业人员培训交底合格。","5.技术确认：贯通通知单下发到位，专项措施审批，剩余距离精准标定。"]},{"t":"三、作业现场人员安全站位","p":["1.贯通施工人员站新鲜风流支护完好区域，远离贯通薄煤岩墙。","2.瓦检员、观山人员分两侧站位，禁止正对贯通薄弱煤体。","3.调风作业站上风侧，防止有毒气体侵袭。","4.截割时人员远离迎头崩矸飞溅范围，严禁站综掘机前方。"]},{"t":"四、标准化作业流程","p":["地测下发贯通通知单→贯通前 50m 停对头掘进→全线隐患联合排查→全员专项交底→贯通段加密补强支护→每日复测剩余距离→小进尺单向截割贯通→贯通立即停机撤人→通风科调整通风系统→瓦斯、顶板、水害全面排查→补强贯通段支护→班组自检→多部门联合验收→资料归档恢复正常掘进"]},{"t":"五、作业质量标准","p":["1.距离管控：综掘相距 50m 必须停一头，剩余 10m 一掘一支。","2.支护标准：贯通前后 10m 缩小棚距，加密锚杆锚索，临时支护紧跟迎头。","3.巷道线型：贯通中线腰线偏差≤50mm，无错台、超欠挖。","4.通风标准：调风后无微风、无风、短路区域，回风流瓦斯≤0.5%。","5.隐患标准：贯通积水全部疏放，浮矸杂物清理，支护无松动失效。"]},{"t":"六、安全管控措施","p":["1.距离刚性管控：地测每日复测，超距违规双掘立即停工整改。","2.一通三防管控：贯通全程瓦检员在岗，瓦斯≥0.5% 立即停掘撤人；贯通第一时间停机，通风科到场调风，达标后方可复工。","3.顶板管控：贯通应力集中区加密支护，每循环敲帮问顶，专人盯顶板，掉渣立即补强。","4.水害管控：贯通前存在老空、低阻异常必须超前探放水，未疏放彻底不得贯通。","5.截割管控：剩余 10m 低速小进尺，禁止强力震动截割，防止大面积片帮冒顶。","6.警戒管控：停掘工作面永久栅栏，严禁人员私自进入贯通危险区。","7.验收闭环管控：贯通、调风、支护全部完成后，班组自检 + 通风 / 地测 / 安监联合验收，所有隐患当班整改闭环。"]}]}],"w":1649,"cn":2,"sn":12},{"c":"JJ-A-02","n":"掘进工作面开口","t":"JJ-A-02 掘进工作面开口模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范顺槽、联络巷、车场开口、成型支护全工序作业行为，统一施工流程、顶板瓦斯水害防控、支护质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝开口冒顶、巷道跑偏、支护失效等隐患，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有巷道新开工作面、联络巷、绕道开口施工，覆盖前期筹备、开口、成型、加强支护、竣工验收全过程。"]},{"t":"三、管理原则","p":["1.先加固、后开口；先临时、后永久；先控顶、后扩刷；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、支护工、安检员、瓦斯检查员、测量员"]},{"t":"二、核心职责","p":["队长、支部书记：开口工程全面管理，物资协调考核。","安全技术副队长：开口设计交底、专项措施编制、隐患督办。","跟班副队长：开口高风险作业现场全程盯守。","班组长：循环管控、开口前后顶板检查、班组自检。","支护工：严格小断面分次破口，及时架设临时支护。","瓦检员：持续监测开口瓦斯。","安检员：开口全过程安全监督，制止空顶、违章扩刷。","测量员：提前标定中线腰线，施工中及时校核。"]}]},{"t":"第三章  巷道开口模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-A-02","模块名称：掘进工作面开口施工","所属专业：掘进","适用范围：开口全体作业人员"]},{"t":"二、危险预知及防控","p":["1.开口应力集中冒顶：开口前后 10m 提前加固，小断面分次破口","2.片帮活矸砸人：全程敲帮问顶，专人观山","3.瓦斯积聚超限：开口前通风设施到位，不间断检测","4.巷道跑偏成型差：延线员校核中线腰线","5.空顶作业伤人：临时支护紧跟，严禁空顶作业"]},{"t":"三、作业条件安全确认","p":["1.环境确认：开口前后 10m 巷道支护补强完成，浮煤杂物清理，通道畅通；局部通风、喷雾降尘、消防设施、照明、通讯、视频监视、压风自救、供水施救设施齐全；排水系统完好无积水。","2.材料确认：前探梁、U 棚、锚杆、网片、锚固剂足量合格，工作平台、临时支护材料备足。","3.设备确认：风镐、锚杆钻机、运输设备、掘进设备完好，便携气体检测仪悬挂到位。","4.人员确认：持证上岗，每班不少于 6 人，互保联保到位，培训交底合格。","5.技术确认：开口图纸、专项措施会审归档，中线腰线现场标定完毕。"]},{"t":"四、作业现场人员安全站位","p":["1.作业人员站开口外侧完好支护区域，禁止停留在开口空顶正下方。","2.扩刷破口时人员站矸石滚落侧面。","3.架设前探梁、站棚时避开棚体倾倒方向，高空搭设稳固平台。"]},{"t":"五、标准化作业流程","p":["地测标定开口中线腰线→开口前后巷道加固→场地规整警戒设置→分次小断面初次破口→敲帮问顶架设临时支护→分层扩刷成型→永久加强支护施工→矿压观测→班组自检→现场清理闭环"]},{"t":"六、作业质量标准","p":["1.开口标准：分次分层扩刷，单次进尺控制在允许空顶距内，严禁一次性大断面开挖。","2.支护标准：开口10m范围内加强支护，临时支护全覆盖空顶区，背板严实无空顶。","3.线型标准：中线腰线偏差≤50mm，断面符合设计无超欠挖。","4.文明标准：物料分区码放，管线防护完好，通道无浮矸积水"]},{"t":"七、安全管控措施","p":["1.开口加固管控：施工前必须对开口原有巷道补强，破损棚更换，松动锚杆复紧。","2.开口施工管控：严格小进尺分层施工，随扩随护，空顶区域必须临时支护封闭，严禁空顶作业。","3.顶板管控：每循环、交接班全面敲帮问顶，破碎段增设钎椽超前控顶，顶板异常立即停工撤人。","4.一通三防管控：开口下风侧悬挂气体检测仪，瓦斯≥0.5% 停工处理，及时洒水防尘。","5.人员行为管控：架棚不少于 7 人配合作业，统一口令，禁止单人高空、破口作业，劳保齐全。","6.闭环管控：分次成型班组自检、支护完工副队长验收，开口成型、支护、顶板隐患当班整改闭环。"]}]}],"w":1428,"cn":3,"sn":12},{"c":"JJ-A-03","n":"掘进机搬家","t":"JJ-A-03 掘进机搬家模块化流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范 EBZ-135 掘进机拆机、转运、组装、调试全流程作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝起吊坠落、轨道掉道、设备挤压、电气失爆、巷道棚体剐蹭等安全隐患，保障设备完好、运输安全、一次投产达标，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井掘进机回撤、井下转运、新工作面安装调试全工序、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后拆解；先加固、再起吊；不安全、不生产。","2. 流程一步不省、标准一点不降、风险一项不漏。","3. 班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：班组长、安检员、电钳工、起重工、辅助工"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责掘进机搬家全流程模块化管理。","机电副队长：技术交底、技术指导、设备验收。","安全技术副队长：标准卡制定、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会专项交底、现场全过程组织协调、高风险起吊 / 运输全程监督。","班组长：当班工序管控、设备清点、自检复检、现场隐患及时上报。","电钳工：设备断电闭锁、分级拆解、液压 / 电气复原、整机调试。","安检员：全流程安全条件确认、违章制止、起吊 / 运输工序标准监督。","操作人员：按模块标准卡作业，落实互保联保，设备轻拆轻放，做好文明施工。"]}]},{"t":"第三章  掘进机搬家模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-A-03","模块名称：EBZ-135 掘进机拆装转运","所属专业：掘进、机电运输","适用范围：搬家全体作业人员"]},{"t":"二、危险预知及防控","p":["1.起吊大件坠落、挤压伤人：吊具提前检验，严禁超载歪拉斜吊，下方禁止站人","2.轨道运输掉道、车辆溜车伤人：轨道提前整修，规范捆绑，执行辅助运输管理规定","3.设备部件倾倒、磕碰挤伤：拆解分步固定，装车垫木防滑，多人同步抬运","4.电气失爆、触电伤人：严格停电验电闭锁，电缆封堵防护","5.巷道棚体、管线剐蹭损坏设备：运输两侧预留安全间隙，拐弯专人瞭望","6.液压管路高压喷溅伤人：拆管先泄压，封堵油口"]},{"t":"三、作业条件安全确认","p":["1.环境确认：运输全线巷道支护完好，变形棚提前补强，巷道两侧间隙≥500mm；轨道平整无悬空、轨距 600mm 达标，风门、拐弯空间满足大件通行；沿途杂物、浮煤清理干净，退路畅通。","2.设备确认：5t/10t 手拉葫芦、平板车、防滑垫木、防爆工具、密封堵头、钢丝绳齐全完好；绞车、钢丝绳、一坡三挡防护完好。","3.电气确认：开关停电、验电、挂牌上锁，防爆配件储备充足。","4.人员确认：绞车、机电人员全部持证上岗，每班不少于 6 人，互保联保分工明确。","5.技术确认：搬家专项措施会审完毕，全线路况排查闭环，全员培训合格。"]},{"t":"四、作业现场人员安全站位","p":["1.起吊作业：人员站吊物两侧安全支护区，严禁吊具、重物正下方站立。","2.轨道装车 / 卸料：平板车两侧站位，车身前后 3m 禁止无关人员逗留。","3.绞车运输：绳道、三角区严禁站人，人员撤至躲避硐 / 巷道外侧。","4.拆解设备：避开部件倾倒、液压管路喷射方向。","5.巷道拐弯运输：瞭望人员站巷道宽敞侧，禁止站在小圈。"]},{"t":"五、标准化作业流程","p":["前期路况联合排查→专项培训交底→设备停机断电闭锁→分级拆解小件→主体大件起吊拆分→配件编号防护→平板车垫木居中装车→封车捆绑→绞车分段转运→新工作面卸料分区存放→设备找平组装→液压电气系统复原→分步空载点动调试→短距离负载试运行→班组自检 + 多部门联合验收→现场清理闭环"]},{"t":"六、作业质量标准","p":["1.拆解标准：遵循先辅后主、由上至下，最大单件≤8t，所有油口、电缆封堵防尘，配件编号台账齐全。","2.装车标准：大件居中摆放，底部防滑，棱角胶皮防护，不少于 3 道钢丝绳捆绑，松紧适度。","3.轨道运输：平板车单独编组，斜巷一坡三挡完好，连接销、保险绳齐全。","4.组装标准：各销轴扭矩达标，液压无渗漏，电缆吊挂规范，所有防护护罩齐全，各类保护动作灵敏。","5.调试标准：行走、截割、刮板、喷雾系统运转无异响，无漏油漏电，负载运行稳定。"]},{"t":"七、安全管控措施","p":["1.断电闭锁管控：设备拆解、电气作业必须执行停电、验电、放电、挂牌上锁，严禁带电操作。","2.起吊作业管控：起吊锚杆 / 棚梁提前加固，吊具每班检查，统一指挥、专人监护，单件不超额定荷载。","3.轨道运输管控：绞车钢丝绳、保险绳定期检查，不合格立即更换；全线提前整改轨道隐患，大件单独运输，拐弯、风门专人警戒，严格落实 “行车不行人”。","4.拆解组装管控：严禁野蛮硬撬，液压管路先泄压再拆卸，拆解配件分类存放，组装按编号对接，严禁使用损坏配件。","5.巷道防护管控：运输前清理巷道突出管线、杂物，两侧预留安全间隙，防止剐蹭棚体与设备。","6.人员行为管控：起吊、转运不少于 2 人配合，单人禁止吊装大件；全员佩戴安全帽、防护手套等劳保用品，杜绝三违。","7.验收闭环管控：拆机、装车、转运、组装、调试分阶段班组自检，机电科总验收，设备、轨道、巷道隐患当班整改闭环。"]}]}],"w":1947,"cn":3,"sn":12},{"c":"JJ-A-04","n":"掘进工作面过老空老巷","t":"JJ-A-04 掘进工作面过老空老巷模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范掘进工作面揭露老巷、采空区、废弃巷道全流程标准化作业，统一顶板、瓦斯、水害、漏风、机电风险管控流程、施工工序、支护质量、验收闭环标准，杜绝冒顶、瓦斯超限、突水、巷道垮塌、截割火花引爆等事故，落实高风险作业专项管控要求，结合本矿掘进巷道、老巷斜交 / 平交 / 立交施工实际，依据《煤矿安全规程》编制本模块化方案。"]},{"t":"二、适用范围","p":["适用于全矿所有掘进巷道，揭露废弃老巷、采空区的超前探测、加固、掘进、充填、支护、通风治理、收尾全工序模块化作业；涵盖近探验证、超前加固、分层掘进、老巷充填、永久补强、气体监测全过程。"]},{"t":"三、管理原则","p":["1. 先探后掘、先加固后开挖、先治理再生产；不安全不施工。","2. 风险一项不漏、流程一步不省、标准一点不降。","3. 班前交底、班中全程盯守、班后自检、分级验收、隐患当班闭环、月度考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、专职探钻工、支护工、辅助工、安检员、瓦检员、电钳工"]},{"t":"二、核心职责","p":["队长、支部书记：过老空整体统筹、资源调配、风险统筹、考核管理。","安全技术副队长：模块化标准编制、措施贯彻、超前钻探措施编制、矿压观测、隐患督办、方案修订。","跟班副队长：高风险作业现场全程盯守，每班开工安全确认，全过程工序管控，异常立即组织撤人。","班组长：当班工序组织、敲帮问顶、物料备料、班组自检、人员互保管理。","钻探工：按设计施工超前探测孔。","支护工：落实超前控顶、前探梁、加密棚、连锁加固等标准。","瓦检员：按要求检测瓦斯、CO、CO₂等有害气体，气体超标立即叫停撤人。","安检员：监督高风险作业落实，制止三违，跟踪隐患整改闭环。","电钳工：现场机电设备防爆、设备检修、排水系统维护。"]}]},{"t":"第三章  掘进过老空老巷模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-A-04","模块名称：掘进工作面过老空老巷施工","所属专业：掘进、通防、地测防治水","适用范围：所有过空巷作业人员"]},{"t":"二、危险预知及防控","p":["1.老空瓦斯、CO积聚：超前探孔检测，接近空巷小断面揭露，严禁大面积开挖贯通","2.顶板破碎大面积冒顶：超前控顶、缩小棚距、连锁加固","3.老空积水突水：按设计超前钻探，有积水先疏放再掘进","4.漏风造成采空自燃：揭露前后测风，喷浆 / 风筒布封堵漏风通道","5.老巷遗留工字钢、铁器截割产生火花：人工拆除旧支护，禁用掘进机硬割","6.空巷片帮滚落矸石：分层掘进，随掘随背实、充填","7.人员误入废弃老巷：老巷口设置警戒绳、警示牌"]},{"t":"三、作业条件安全确认","p":["1.环境确认：掘进迎头 20m范围支护完整，破碎段提前加密加固；安全退路畅通，无浮矸杂物；老巷交岔点设置警戒、禁入标识。","2.通防确认：局部通风机供风稳定，风筒无破口；便携多参数检测仪、固定传感器校验合格，备用风筒、封堵风筒布到位。","3.探测确认：地测下发过空巷通知单，超前探测孔施工完毕，积水、气体数据达标；排水设施到位。","4.支护材料确认：前探梁、铁钎椽、荆笆、道木、连锁工字钢、棚、木鞋足量存放于迎头 50m 内。","5.设备确认：掘进机、风镐、钻机防爆完好，无失爆；工作平台搭设牢固。","6.人员确认：每班不少于9人，配备专职瓦检、安检；全员培训过空巷专项措施，互保联保划分到位。","7.技术确认：过空巷专项措施贯彻签字齐全，中腰线标定完成。"]},{"t":"四、作业现场人员安全站位","p":["1.掘进、探钻人员站新鲜风流永久支护区域，严禁站空巷侧、空顶下方。","2.揭露老巷小断面施工时，人员避开矸石滚落、气体涌出方向。","3.拆除老巷支护时，所有人员撤离至支护完好安全侧，禁止正对支护倾倒方向。","4.钻探施工人员站在钻机侧面，禁止正对钻杆前端。","5.瓦检员、观山人员分两侧站位，实时观测顶板与气体变化。","6.处理涌水时人员侧身操作，防止高压水冲击伤人。"]},{"t":"五、标准化作业流程","p":["地测下发过空预警通知单→超前钻探（气体 + 积水探测）→探测数据研判→迎头巷道加固（缩小棚距或连锁梁）→班前风险交底 + 开工安全确认→超前控顶→小断面揭露老巷→瓦检气体复核→拆除老巷旧支护（先支后拆）→加密永久支护或连锁加固→漏风处理→矿压观测、气体动态监测→班组自检→恢复正常掘进"]},{"t":"六、作业质量标准","p":["1.超前探测：按设计施工探测孔，循环探测，完整记录积水、瓦斯、CO 数值。","2.支护加密：过空巷前5.0m 棚距缩小；U 型钢卡缆≥7 个，扭矩≥150N・m。","3.超前控顶：双侧 3mπ 型前探梁，每根 3 道卡，全程不少于 2 个支点；铁钎椽探入煤壁≥800mm，间距≤300mm。","4.老巷充填：空巷空间采用煤袋、道木分层充填。","5.旧支护拆除：执行先支后拆，严禁一次性大面积拆棚。","6.通风：揭露前后及时测风，风量满足需求，漏风通道全部封堵，无微风、无风区。","7.工程线型：中线、腰线偏差≤100mm，柱窝站在实底，杜绝棚腿钻底。"]},{"t":"七、安全管控措施","p":["1.高风险盯守管控：距老巷 10m 起，每班掘进队副队长 + 安监员双岗现场盯守，开工前填写高风险安全确认单。","2.瓦斯通防刚性管控：瓦斯≥0.5%或波动超过0.2%、CO≥24ppm 立即停工全员撤人；剩余 1m 小断面贯通老巷，禁止大面积一次揭露。","3.顶板管控：全程敲帮问顶，专人观山；严禁超控顶距。","4.水害管控：探孔见积水立即停掘，铺设专用排水管路，疏放完毕方可向前施工。","5.旧支护拆除管控：严禁掘进机直接切割老巷支护，分步拆除，拆除区域设置警戒。","6.应急管控：作业人员熟知避灾路线，出现冒顶、瓦斯异常、突水第一时间撤人上报调度室。","7.验收闭环：班组自检、跟班副队长验收，工程质量不合格不得进入下一循环，隐患当班整改闭环。"]}]}],"w":2159,"cn":3,"sn":12},{"c":"JJ-A-05","n":"掘进过立交巷道","t":"JJ-A-05 掘进过立交巷道模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["规范掘进巷道下穿、上跨、斜交立交工程施工作业，解决立交层间距小、双层巷道相互扰动、底板破碎、支护挤压、跨皮带运输等风险，统一套棚、连锁加固、底板硬化、管线防护标准化工序，杜绝下层巷道变形垮塌、高空坠物、管线破损、支架失稳事故，形成闭环模块化管控。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有掘进巷道立交施工（上跨运输机巷、轨道巷、副巷立交），涵盖下层巷道预先套棚加固、上层掘进、立交连锁、底板硬化、管线防护、跨皮带作业全流程。"]},{"t":"三、管理原则","p":["1.先加固下层、再掘进上层；先防护管线、再开挖；先临时支护、永久加固；不安全不施工。","2.风险一项不漏、流程一步不省、标准一点不降。","3.班班交底、现场双岗盯守、分段验收、隐患当日闭环。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、架棚工、机电工、安检员、瓦检员"]},{"t":"二、核心职责","p":["队长、书记：立交工程整体统筹，人力物料协调。","安全技术副队长：立交加固设计、管线防护方案、模块化标准、措施贯彻。","跟班副队长：立交高风险作业全程现场指挥，每班开工安全确认。","班组长：当班架棚、底板施工、管线保护、班组自检。","架棚工：套棚、连锁梁、抬棚架设，严格支护标准。","电钳工：立交段电缆、压风、抽放管路落地防护，皮带过桥搭设。","安检员：监督双层巷道防护、制止三违行为。","瓦检员：立交区域及时气体检测。","皮带司机：跨立交皮带停机管控，配合搭设行人过桥。"]}]},{"t":"第三章  掘进过立交模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-A-05","模块名称：掘进巷道过立交施工","所属专业：掘进、机电运输、通防","适用范围：立交全体作业人员"]},{"t":"二、危险预知及防控","p":["1.立交层间距小，上层掘进压垮下层巷道：下层提前套棚 + 工字钢连锁","2.巷道电缆、压风管路被砸破损：落地防护、软管改造","3.底板松软棚腿钻底：立交段整体混凝土硬化","4.立交段矿压集中支架变形：加密棚距、增设抬棚","5.巷道漏风、瓦斯积聚：立交喷浆封闭裂隙"]},{"t":"三、作业条件安全确认","p":["1.巷道确认：立交前后 5m 全部套棚加固，连锁梁安装到位，无变形失稳棚。","2.管线确认：立交段行人侧电缆落地入防护槽，非行人侧高压管路更换软管落底。","3.支护物料确认：29U 套棚、连锁梁、道木足量存放。","4.作业平台确认：作业平台搭设牢固，防护齐全。","5.通风确认：立交段风筒无破损，气体检测仪悬挂到位。","6.人员确认：每班不少于9人，配备安检人员，措施培训合格。","7.技术确认：立交专项图纸、安全措施贯彻签字齐全。"]},{"t":"四、作业现场人员安全站位","p":["1.掘进工作面施工期间，立交点严禁人员、车辆通过。","2.立交点加固时，禁止同时掘进。","3.搬运工字钢、棚材避开巷道管线，防止挤压管路喷溅介质伤人。"]},{"t":"五、标准化作业流程","p":["立交层间距地质核查→立交管线改造落地防护→立交巷道套棚加固或连锁→班前风险交底 + 开工确认→搭设作业平台→巷道掘进（缩小棚距或连锁加固）→巷帮裂隙封堵漏风→清理管线恢复吊挂→矿压持续观测→班组自检、验收"]},{"t":"六、作业质量标准","p":["1.套棚：立交前后各5m套棚，顶帮连锁。","2.支护：立交掘进段棚距不超过措施规定，卡缆扭矩≥150N・m。","3.管线防护：动力、信号电缆分槽隔离，高压管路全部改用软管落地保护。","4.作业平台：钢管框架 + 厚木板，间隙≤50mm。"]},{"t":"七、安全管控措施","p":["1.双层分区管控：上下巷道禁止平行同时作业，设置警戒。","2.管线管控：施工前全部改造防护，施工完成验收后方可恢复吊挂，严禁砸破电缆、抽放管路。","3.支护管控：立交全程缩小棚距，所有连锁必须有效，不合格不得进入下个循环。","4.盯守管控：立交施工全程跟班副队长、安检员双岗盯守，每班开工安全确认。","5.验收闭环：班组自检、跟班副队长验收，架棚质量不合格不得进入下一循环，隐患当班整改闭环。"]}]}],"w":1421,"cn":3,"sn":12},{"c":"JJ-A-06","n":"掘进工作面沿空掘进","t":"JJ-A-06 掘进工作面沿空掘进模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范掘进工作面沿空（沿老巷、窄煤柱沿采空区）掘进作业行为，统一超前探查、瓦斯管控、顶板支护、防漏风、矿压观测标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝瓦斯涌出超限、顶板冒落片帮、老空透水、采空区遗煤自燃等重大隐患，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有掘进工作面沿空（沿老巷、窄煤柱沿采空区）掘进全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先探查、后掘进；先支护、后掘进；先监测、后作业；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、掘进机司机、掘工、辅助工、安检员、瓦检员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责沿空掘进模块化管理，重大风险管控资源协调。","安全技术副队长：沿空掘进专项措施编制贯彻、超前探查设计、防漏风方案落实、矿压观测资料收集上报、模块修订优化。","跟班副队长：班前会交底、开工安全确认、现场全过程组织协调、高风险工序全程盯守。","班组长：便携仪悬挂检查、敲帮问顶组织、支护质量自检复检、隐患上报。","掘进机司机：按操作规程截割、配合探查、异常停机。","掘工、辅助工：临时支护、架棚、钎椽控顶、防冒顶材料使用，落实互保联保。","安检员：安全条件确认、风险防控监督、违章制止。","瓦检员：沿空区域瓦斯、一氧化碳等有毒有害气体检查，钻探期间孔内气体检测。"]}]},{"t":"第三章  掘进工作面沿空掘进模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-A-06","模块名称：掘进工作面沿空掘进","所属专业：掘进、通防","适用范围：沿空掘进全体作业人员"]},{"t":"二、危险预知及防控","p":["1.采空区瓦斯及有害气体涌出：超前探查到位、便携仪全程监测，瓦斯≥0.5%或波动达0.2%、CO≥0.0024%立即停工撤人","2.沿空侧围岩破碎冒顶片帮：加强敲帮问顶、临时支护紧跟迎头，严禁空顶作业","3.老空积水透水：坚持超前钻探、先探后掘，查明残存积水及时疏放","4.向采空区漏风引发遗煤自燃：分段测风判定漏风，挂帘、喷涂、充填封闭，CO异常立即撤人","5.煤尘积聚爆炸：截割、运输综合防尘，隔爆水袋齐全有效"]},{"t":"三、作业条件安全确认","p":["1.环境确认：顶板、煤帮稳定，敲帮问顶完成，瓦斯≤0.5%、CO≤0.0024%，
