A-07","模块名称：水仓清挖","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["1.片帮掉矸伤人。","2.缺氧窒息风险。","3.清挖时发生煤泥滑坡。","4.清仓机挤压风险。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：清仓机、风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在顶板完好，无危矸顶板下。","2.与清仓机保持安全距离。","3.站在通风良好的地点作业，严禁进入无风区域。"]},{"t":"五、标准化作业流程","p":["风险辨识、隐患排查→安全确认→敲帮问顶→开启清仓机→喂料→推进清仓机"]},{"t":"六、安全管控措施","p":["1.敲帮问顶管控：每班作业前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板稳定后方可作业；作业过程中随时观察顶板变化，发现异常立即撤人。","2.风量管控：保证工作面风量充足，严禁无风作业。","3.机械管控：与设备转动部位保持安全距离。","4.人员行为管控：严禁单人独立支护作业，必须2 人及以上配合作业、互保联保到位；作业人员必须佩戴齐全劳动保护用品，严禁先从底部掏槽进行清挖。"]}]}],"w":903,"cn":3,"sn":11}],"os":"一","rn":"高风险","rc":"红","rg":"A","n":7,"label":"高风险 · 红色 A段"},{"t":"二、中风险-橙色-B段（7项）","lv":"B","m":[{"c":"WX-B-01","n":"回撤通道扩刷","t":"WX-B-01 回撤通道扩刷模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范回撤通道扩刷作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝冒顶、片帮伤人、支护失效等安全隐患，提升巷道扩刷安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有回撤通道扩刷全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先顶后帮、先上后下；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 回撤通道扩刷模块","s":[{"t":"一、模块概述","p":["模块编号：WX-B-01","模块名称：回撤通道扩刷","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["（一）片帮、冒顶、掉矸伤人：","1.临时支护不到位，空顶作业，顶板冒落；","2.超空顶距作业，顶板冒落，掉矸伤人。","3.作业前“敲帮问顶”执行不到位，没有除掉帮顶活矸危岩","（二）高压管路伤人：","1.风镐管路拆装过程中压力释放不到位，高压回弹伤人；","2.注液枪管路拆装过程中压力释放不到位，高压回弹伤人。","（三）输送机伤人：","1.跨越运行中的输送机掉落伤人；","2.作业过程中不小心掉入输送机上。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：运输设备、风镐、手镐风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在无活矸危岩顶板支护良好的空间下作业。","2.抬运物料避开倾倒滚落方向，禁止站重物正下方。","3.拆风水管时侧身站，防止带压风、水管伤人。","4.上棚梁、立棚腿时，人员远离棚架内侧、正下方。","5.打楔、背帮侧身站立，防止落矸伤人。"]},{"t":"五、标准化作业流程","p":["风险辨识、隐患排查→安全确认→敲帮问顶→剔顶→临时支护→架设顶梁→背顶→刷帮→临时支护→挖柱窝→站棚腿→打帮→收尾→验收工程质量"]},{"t":"六、安全管控措施","p":["（一）空顶管控：","1.严格执行 “先控顶、后支护、先顶后帮、先上后下” 规定；","2.严禁超循环作业；临时支护必须紧跟迎头，空顶区严禁站人、严禁堆放物料、严禁任何人员逗留。","（二）敲帮问顶管控：","1.每班作业前、支护前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；","2.作业过程中随时观察顶板变化，发现异常立即撤人。","（三）输送机管控：","1.刮板输送机司机必须经培训考试合格，持证上岗，严格按照操作规程操作；","2.扩刷作业地点必须安装刮板输送机信号急停装置，出现问题立即停机。","3.作业地点安装行人过桥，输送机运行时必须走过桥。","（四）管路高压管控：","1.高压管路接头完好，杜绝破损、裂纹，严禁使用不合格软管；","2.拆装高压管路，必须先泄压，严禁带压拆卸；"]}]}],"w":1291,"cn":3,"sn":11},{"c":"WX-B-02","n":"切眼扩刷","t":"WX-B-02 切眼扩刷模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范切眼扩刷作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝冒顶、片帮伤人、支护失效等安全隐患，提升巷道扩刷安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有切眼扩刷全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先顶后帮、先上后下；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 切眼扩刷模块","s":[{"t":"一、模块概述","p":["模块编号：WX-B-02","模块名称：切眼扩刷","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["（一）片帮、冒顶、掉矸伤人：","1.临时支护不到位，空顶作业，顶板冒落；","2.超空顶距作业，顶板冒落，掉矸伤人。","3.作业前“敲帮问顶”执行不到位，没有除掉帮顶活矸危岩","（二）回旧棚、架新棚物料坠落伤人：","1.更换棚梁时棚梁掉落伤人；","2.斜巷运料，滑到物料掉落伤人；","（三）高压管路伤人：","1.风镐管路拆装过程中压力释放不到位，高压回弹伤人；","2.注液枪管路拆装过程中压力释放不到位，高压回弹伤人。","（四）手拉葫芦甩钩伤人：","回老棚使用手拉葫芦起吊，吊具损坏、断链、脱钩伤人。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：手拉葫芦、手镐、风镐、风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在无活矸危岩顶板支护良好下的空间下作业。","2.拆风水管时侧身站，防止带压风水管伤人。","3.抬运棚材避开倾倒滚落方向，禁止站重物正下方。","4.上棚梁、立棚腿时，人员远离棚架内侧、正下方。","5.打楔、背帮侧身站立，防止落矸伤人。","6.拉老棚站在断链、甩钩、脱钩波及不到的地方"]},{"t":"五、标准化作业流程","p":["风险辨识、隐患排查→安全确认→敲帮问顶→剔顶→临时支护→拉老棚→架设顶梁→背顶→刷帮→临时支护→挖柱窝→站棚腿→打帮→收尾→验收工程质量"]},{"t":"六、安全管控措施","p":["（一）空顶管控：","1.严格执行 “先控顶、后支护、先顶后帮、先上后下” 规定；","2.严禁超循环作业；临时支护必须紧跟迎头，空顶区严禁站人、严禁堆放物料、严禁任何人员逗留。","（二）敲帮问顶管控：","1.每班作业前、支护前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；","2.作业过程中随时观察顶板变化，发现异常立即撤人。","（三）输送机管控：","1.刮板输送机司机必须经培训考试合格，持证上岗，严格按照操作规程操作；","2.扩刷作业地点必须安装刮板输送机信号急停装置，出现问题立即停机。","（四）管路高压管控：","1.高压管路接头完好，杜绝破损、裂纹，严禁使用不合格软管；","2.拆装高压管路，必须先泄压，严禁带压拆卸；"]}]}],"w":1329,"cn":3,"sn":11},{"c":"WX-B-03","n":"刮板输送机安装","t":"WX-B-03 刮板输送机安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范刮板输送机安装作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝起重伤害、链条挤伤、设备倾倒、触电、部件弹崩等安全隐患，确保设备安装合格、运行稳定，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有刮板输送机安装全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 维修模块","s":[{"t":"一、模块概述","p":["模块编号：WX-B-03","模块名称：刮板输送机安装","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["（一）片帮掉矸伤人","作业地点“敲帮问顶”制度执行不到位，帮、顶存在活矸危岩，发生片帮冒顶、掉渣伤人风险。","（二）触电伤人","开关、电机接线时没有执行停电闭锁，触电风险。","（三）吊装风险","1. 起吊葫芦、起吊索具破损、超负荷起吊，构件坠落砸人；","2.人员站在重物下方、吊件摆动范围内。","（四）溜槽、机头机尾倾倒挤压伤人","临时支撑固定不牢固牢固，发生滑动伤人。","（五）刮板链条弹崩、夹手伤人","接链、紧链不规范操作，链条崩断伤人"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：手拉葫芦、紧链器、扳手、撬棍、索具、风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在顶板完好，无危矸顶板下。","2.起吊作业时，严禁站在吊物正下方及索具两侧受力位置。","3.对接溜槽、组装机头机尾时，手脚远离溜槽接缝、设备结合部位。","4.紧链、接链作业时，人员站在链条侧面，禁止正对链条受力方向。","5.设备上方作业时，下方设置警戒，禁止人员通行逗留。","6.试运转时，人员远离链轮、链条等转动部位。"]},{"t":"五、标准化作业流程","p":["技术交底 + 标定安装中线 → 巷道清理 + 底板平整 → 断电闭锁 + 安全警戒布设 → 起吊安装机头总成 → 依次铺设对接中部溜槽 → 起吊安装机尾总成 → 铺设、对接刮板链条 → 使用紧链器调整链条张紧度 → 安装电机、减速器、传动部件 → 安装护罩、挡煤板、防滑装置 → 电气接线 + 完善综合保护 → 人工盘车检查 → 空载试运转调试 → 自检 + 清理现场"]},{"t":"六、安全管控措施","p":["（一）敲帮问顶管控：每班作业前、支护前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；作业过程中随时观察顶板变化，发现异常立即撤人。","（二）设备组装管控：溜槽、机头机尾就位必须先做临时支撑固定，再进行连接，防止倾倒。","（三）接链紧链管控：必须使用专用紧链工具，禁止使用撬棍、锚杆等替代；紧链时人员避开链条回弹范围。","（四）吊装管控：起吊大件时，人员要站在手拉葫芦断链、脱钩影响不到的安全位置。起吊件下方和起吊件掉落后涉及的区域严禁有人。"]}]}],"w":1382,"cn":3,"sn":11},{"c":"WX-B-04","n":"刮板输送机拆除","t":"WX-B-04 刮板输送机拆除模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范刮板输送机拆除作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝起重伤害、链条挤伤、设备倾倒、触电、部件弹崩等安全隐患，确保设备完好、现场规范，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有刮板输送机拆除全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后拆解；先固定、后拆卸；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 刮板输送机拆除模块","s":[{"t":"一、模块概述","p":["模块编号：WX-B-04","模块名称：刮板输送机拆除","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["（一）片帮掉矸伤人","作业地点“敲帮问顶”制度执行不到位，帮、顶存在活矸危岩，发生片帮冒顶、掉渣伤人风险。","（二）触电伤人","拆除开关、电机时没有执行停电闭锁，触电风险。","（三）吊装风险","1.起吊葫芦、起吊索具破损、超负荷起吊，构件坠落砸人；","2.人员站在重物下方、吊件摆动范围内。","（四）溜槽、机头机尾倾倒挤压伤人","临时支撑固定不牢固牢固，发生滑动伤人。","（五）刮板链条弹崩、夹手伤人","拆链不规范操作，链条崩断伤人"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：手拉葫芦、风炮、风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.全体人员站在支护完好区域，远离设备倾倒、滑落范围。","2.断链、拆链作业时，人员站在链条两侧，严禁正对链条回弹方向。","3.拆解溜槽、机头机尾时，手脚不得伸入设备间隙及对接面。","4.起吊、下放大件时，禁止站在吊物正下方、索具摆动范围内。","5.传递配件时错位站立，禁止面对面抛掷零部件。","6.设备解体后摆放平稳，人员不在部件倾斜侧停留。"]},{"t":"五、标准化作业流程","p":["技术交底 + 设置安全警戒 → 整机停机 + 断电验电 + 挂牌闭锁 → 拆除电气线路、开关及保护装置 → 拆除电机、减速器、传动护罩 → 使用专用工具断链、拆除刮板链条 → 拆除挡煤板、附属装置 → 分段拆解中部溜槽、逐段落地码放 → 临时固定后拆解机尾总成 → 临时固定后拆解机头总成 → 所有设备、配件分类清点、捆绑 → 设备大件及配件转运 → 全面自检 + 清理巷道现场"]},{"t":"六、安全管控措施","p":["（一）敲帮问顶管控：每班作业前、支护前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；作业过程中随时观察顶板变化，发现异常立即撤人。","（二）断链拆链管控：必须使用专用紧链、断链工具，禁止使用锚杆、钢管等替代；作业时专人监护，防范链条回弹。","（三）溜槽拆解管控：每拆解一节溜槽先做临时固定，再解除连接，防止溜槽侧翻、滑落。","（四）转运管控：设备、配件捆绑牢固，井下运输严格执行运输管理规定，防止掉落。","（五）大件起吊管控：起吊机具每班检查，大件分次起吊、缓慢下放，统一指挥、专人监护。","（六）断电闭锁管控：设备断电后必须验电、挂牌、专人监护，全程严禁带电作业。"]}]}],"w":1447,"cn":3,"sn":11},{"c":"WX-B-05","n":"带式输送机安装","t":"WX-B-05 带式输送机安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下带式输送机安装作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝起重伤害、机械挤压、触电、物件滚落、支护失稳等安全隐患，保障设备安装质量与运行安全，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于井下带式输送机整机、部件安装、调试、试运转全工序作业及现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 带式输送机安装模块","s":[{"t":"一、模块概述","p":["模块编号：WX-B-05","模块名称：带式输送机安装","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["（一）片帮掉矸伤人","作业地点“敲帮问顶”制度执行不到位，帮、顶存在活矸危岩，发生片帮冒顶、掉渣伤人风险。","（二）触电伤人","开关、电机接线时没有执行停电闭锁，触电风险。","（三）吊装风险","1. 起吊葫芦、起吊索具破损、超负荷起吊，构件坠落砸人；","2.人员站在重物下方、吊件摆动范围内。","（四）皮带跑偏、部件滑动伤人","安装找平找正，临时固定牢固","（五）皮带下滑风险","倾斜巷道铺设皮带，皮带滑动过快造成事故。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：手拉葫芦、风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.作业人员站在支护完好、无危矸的安全区域。","2.起吊作业时，人员严禁站在吊物正下方、吊具受力两侧。","3.设备对接、就位时，手脚不得伸入设备缝隙、对接面之间。","4.牵拉、展放皮带时，人员站在皮带侧面，禁止跨站、骑站皮带。","5.高处安装作业必须站在稳固平台内，下方设置警戒，禁止人员逗留。","6.转动部件安装调试时，远离滚筒、传动部位运转范围。"]},{"t":"五、标准化作业流程","p":["技术交底 + 现场放线标定中线 → 巷道清理 + 基础修整 → 停送电闭锁 + 安全设施布设 → 起吊安装机头架、机尾架 → 铺设安装中间机架 → 安装滚筒、托辊、缓冲装置 → 展放、对接、张紧输送带 → 安装电机、减速器、防护装置 → 敷设接线、完善电气保护 → 人工试转 + 逐项调试 → 空载试运转 → 自检 + 清理现场"]},{"t":"六、安全管控措施","p":["（一）敲帮问顶管控：每班作业前、支护前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；作业过程中随时观察顶板变化，发现异常立即撤人。","（二）起吊作业管控：起吊点必须牢固，索具、葫芦定期检查，统一指挥、专人监护；严禁超载、歪拉斜吊，吊物悬空状态下人员禁止穿越。","（三）停送电管控：严格执行 “停电、验电、放电、挂牌、闭锁” 制度，专人看管开关，严禁带电作业。","（四）部件安装管控：设备对接、对位专人指挥，严禁将手脚伸入结合面；大件挪移平稳缓慢，防止倾倒、滑动。","（五）皮带展放管控：展放皮带统一口令、同步操作，禁止人员踩踏、跨越待对接皮带。"]}]}],"w":1413,"cn":3,"sn":11},{"c":"WX-B-06","n":"带式输送机拆除","t":"WX-B-06 带式输送机拆除模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下带式输送机拆除作业行为，统一施工流程、安全风险防控、质量及物料管控标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝物件坠落、挤压伤人、触电、设备倾倒、皮带弹甩等隐患，做到安全拆除、物料完好、现场整洁，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于井下带式输送机整机、部件、输送带拆除、拆解、转运全工序及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后拆除；先固定、后拆解；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 维修模块","s":[{"t":"一、模块概述","p":["模块编号：WX-B-06","模块名称：带式输送机拆除","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["（一）片帮掉矸伤人","作业地点“敲帮问顶”制度执行不到位，帮、顶存在活矸危岩，发生片帮冒顶、掉渣伤人风险。","（二）触电伤人","开关、电机接线时没有执行停电闭锁，触电风险。","（三）吊装风险","1.起吊葫芦、起吊索具破损、超负荷起吊，构件坠落砸人；","2.人员站在重物下方、吊件摆动范围内。","（四）皮带跑偏、部件滑动伤人","安装找平找正，临时固定牢固","（五）皮带下滑风险","倾斜巷道回收皮带，皮带滑动过快造成事故。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：手拉葫芦、风炮、风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在支护完好、远离设备倾倒及坠落范围的安全区域。","2.拆解皮带时，人员站在皮带两侧，禁止跨立、正对皮带卷收方向。","3.起吊、下放部件时，严禁站在吊物正下方及摆动范围。","4.拆卸机头、机尾大件时，人员避开设备滑落、倾倒方向。","5.高处拆解作业，人员在平台内作业，下方设警戒禁止通行。","6.传递零部件禁止正对他人，防止物件磕碰。"]},{"t":"五、标准化作业流程","p":["技术交底 + 现场安全警戒 → 整机断电闭锁 + 验电确认 → 拆除电气线路、开关及保护装置 → 拆除传动部件、电机、减速器 → 分段放松、捆绑、拆解输送带 → 逐段拆除托辊、附属防护设施 → 拆解中间机架并分类码放 → 起吊拆除机尾架 → 起吊拆除机头架 → 所有配件、部件分类清点、捆绑转运 → 全面自检 + 巷道清理"]},{"t":"六、安全管控措施","p":["1.敲帮问顶管控：每班作业前、支护前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；作业过程中随时观察顶板变化，发现异常立即撤人。","2.电气管控：全程执行断电闭锁制度，拆接线由持证电工操作，严禁带电作业。","3.皮带拆解管控：必须分段固定后再松放、拖拽，多人同步操作，禁止猛然松放皮带。","4.大件拆解管控：机头、机尾、机架拆解前必须捆绑加固，使用葫芦缓慢下放，防止倾倒、滚落。","5.起吊转运管控：吊具每班班前检查，轻吊慢放，统一指挥；大件转运严格执行巷道运输规定。","6.部件管控：所有零配件专人收集、分类存放，严禁抛掷、踩踏设备部件。"]}]}],"w":1412,"cn":3,"sn":11},{"c":"WX-B-07","n":"密闭、风门砌筑","t":"WX-B-07 密闭、风门砌筑模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范密闭、风门砌筑作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝冒顶、片帮伤人、高空坠落等安全隐患，提升密闭、风门砌筑安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有密闭、风门砌筑全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 密闭、风门砌筑模块","s":[{"t":"一、模块概述","p":["模块编号：WX-B-07","模块名称：密闭、风门砌筑","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["1.片帮掉矸伤人。","2.登高作业防坠 。","3.缺氧窒息风险。","4.掏槽时容易发生片帮伤人。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在顶板完好，无危矸顶板下。","2.拆风水管时侧身站，防止带压风水管伤人。","3.站在通风良好的地点作业，严禁进入盲巷"]},{"t":"五、标准化作业流程","p":["风险辨识、隐患排查→安全确认→敲帮问顶→平整地基→掏槽→砌筑施工→工程验收"]},{"t":"六、安全管控措施","p":["1.空顶管控：掏槽施工，对帮顶比较破碎段，及时进行临时支护。","2.敲帮问顶管控：每班作业前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；作业过程中随时观察顶板变化，发现异常立即撤人。","3.人员行为管控：严禁单人独立支护作业，必须2 人及以上配合作业、互保联保到位；作业人员必须佩戴齐全劳动保护用品，严禁进入盲巷。","4.登高管控：登高超过2米时必须使用安全带。"]}]}],"w":912,"cn":3,"sn":11}],"os":"二","rn":"中风险","rc":"橙","rg":"B","n":7,"label":"中风险 · 橙色 B段"},{"t":"三、低风险-蓝色-C段（5项）","lv":"C","m":[{"c":"WX-C-01","n":"临时泵坑施工","t":"WX-C-01 临时泵坑施工模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范临时泵坑施工作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝冒顶、片帮伤人等安全隐患，提升临时泵坑施工安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有临时泵坑施工全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 临时泵坑施工模块","s":[{"t":"一、模块概述","p":["模块编号：WX-C-01","模块名称：临时泵坑施工","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["1.片帮掉矸伤人。","2.高压管路伤人。","3.坠落伤人。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：风镐、手镐、风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在顶板完好，无危矸顶板下。","2.拆风水管时侧身站，防止带压风水管伤人。"]},{"t":"五、标准化作业流程","p":["风险辨识、隐患排查→安全确认→敲帮问顶→挖掘施工→清运杂物→泵坑加固→制作盖板→工程验收"]},{"t":"六、安全管控措施","p":["1.敲帮问顶管控：每班作业前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；作业过程中随时观察顶板变化，发现异常立即撤人。","2.滚石管控：施工挖出的煤、矸及时清理运走，防止滑落到基坑里。","3.带压管路管控：施工人员必须对风镐完好情况、风管的连接情况、是否漏气等方面进行全面检查，高压管路连接必须专用防脱U型卡，严禁使用铁丝或其他物品代替，风镐与风管连接处应进行连接加固。带压（液压、气压）管路拆、装时，必须先进行泄压，检查确认安全后方可进行拆、装作业。","4.坠落管控：在施工地点设置警戒，人员通过时与施工人员取得联系；不施工时，及时用木板严格作业地点，避免人员坠落。"]}]}],"w":992,"cn":3,"sn":11},{"c":"WX-C-02","n":"抽放管路拆除","t":"WX-C-02 抽放管路拆除模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范抽放管路拆除作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝机械伤害、冒顶伤人等安全隐患，提升抽放管路拆除安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有抽放管路拆除全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。" 站重物正下方。"]},{"t":"五、标准化作业流程","p":["风险辨识、隐患排查→安全确认→地面平整→混凝土搅拌→混凝土铺设→地面养护→工程验收"]},{"t":"六、安全管控措施","p":["1.敲帮问顶管控：每班作业前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；作业过程中随时观察顶板变化，发现异常立即撤人。","2.车辆管控：车辆停车卸料时必须用阻车器将车稳牢。","3.带压管路管控：施工人员必须对风镐完好情况、风管的连接情况、是否漏气等方面进行全面检查，高压管路连接必须专用防脱U型卡，严禁使用铁丝或其他物品代替，风镐与风管连接处应进行连接加固。带压（液压、气压）管路拆、装时，必须先进行泄压，检查确认安全后方可进行拆、装作业。","4.人员行为管控：严禁单人独立支护作业，必须2 人及以上配合作业、互保联保到位；作业人员必须佩戴齐全劳动保护用品，严禁违章指挥、违章作业、违反劳动纪律。"]}]}],"w":1023,"cn":3,"sn":11},{"c":"WX-C-04","n":"巷道落底施工","t":"WX-C-04 巷道落底施工模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范巷道落底施工作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝机械伤害、冒顶伤人等安全隐患，提升巷道落底安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有巷道落底全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 巷道落底施工模块","s":[{"t":"一、模块概述","p":["模块编号：WX-C-04","模块名称：巷道落底施工","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["1.片帮掉矸伤人。","2.高压管路伤人。","3.车辆运输伤人。","4.运输机伤人。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：风镐、手镐、风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在顶板完好，无危矸顶板下。","2.拆风水管时侧身站，防止带压风水管伤人。","3.与运输机旋转部位保持安全距离。"]},{"t":"五、标准化作业流程","p":["风险辨识、隐患排查→安全确认→敲帮问顶→挖掘施工→清运杂物→工程验收"]},{"t":"六、安全管控措施","p":["1.敲帮问顶管控：每班作业前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；作业过程中随时观察顶板变化，发现异常立即撤人。","2.车辆管控：车辆停车装料时必须用阻车器将车稳牢。","3.带压管路管控：施工人员必须对风镐完好情况、风管的连接情况、是否漏气等方面进行全面检查，高压管路连接必须专用防脱U型卡，严禁使用铁丝或其他物品代替，风镐与风管连接处应进行连接加固。带压（液压、气压）管路拆、装时，必须先进行泄压，检查确认安全后方可进行拆、装作业。","4.运输机管控：在运输机下落底时必须停机闭锁。","5.人员行为管控：严禁单人独立支护作业，必须2 人及以上配合作业、互保联保到位；作业人员必须佩戴齐全劳动保护用品，严禁违章指挥、违章作业、违反劳动纪律。"]}]}],"w":1044,"cn":3,"sn":11},{"c":"WX-C-05","n":"巷道造白施工","t":"WX-C-05 巷道造白施工模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范巷道落底施工作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝机械伤害、冒顶伤人等安全隐患，提升巷道造白安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有巷道造白全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 巷道造白施工模块","s":[{"t":"一、模块概述","p":["模块编号：WX-C-05","模块名称：巷道造白施工","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["1.片帮掉矸伤人。","2.高压管路伤人。","3.滑倒摔伤。","4.机车撞人。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2人配合作业，互保联保明确；","2.设备确认：喷漆机、风压/水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在顶板完好，无危矸顶板下。","2.拆风水管时侧身站，防止带压风水管伤人。","3.站在造白点的上风侧。"]},{"t":"五、标准化作业流程","p":["风险辨识、隐患排查→安全确认→设置警戒→掩盖电缆→调漆→巷道造白"]},{"t":"六、安全管控措施","p":["1.敲帮问顶管控：每班作业前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；作业过程中随时观察顶板变化，发现异常立即撤人。","2.车辆管控：在作业地点前后20米处设置警戒，所有车辆通过时必须与作业人员取得联系。","3.带压管路管控：带压（液压、气压）管路拆、装时，必须先进行泄压，检查确认安全后方可进行拆、装作业。","4.人员行为管控：严禁单人独立支护作业，必须2 人及以上配合作业、互保联保到位；作业人员必须佩戴齐全劳动保护用品，站在作业地点上风侧施工，走路避开湿滑路段。"]}]}],"w":943,"cn":3,"sn":11}],"os":"三","rn":"低风险","rc":"蓝","rg":"C","n":5,"label":"低风险 · 蓝色 C段"}],"no":"03","name":"维修作业模块"},{"t":"第四部分 机电作业模块","g":[{"t":"一、高风险-红色-A段（4项）","lv":"A","m":[{"c":"JD-A-01","n":"地面高压供电系统停送电","t":"JD-A-01 地面高压供电系统停送电模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿地面35kV、6kV高压供电系统停送电作业，统一操作流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生误操作、误送电、人员触电等安全事故，确保地面高压供电系统停送电全过程安全，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于地面35kV、6kV高压供电系统停送电操作、检修配合及运行维护全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏、两票一项不少。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电运输副矿长","副组长：机电副总工程师、机电运输科科长、机电队队长、支部书记","成  员：主管副队长、安全技术副队长、班组长、现场操作人员"]},{"t":"二、核心职责","p":["机电运输副矿长：负责地面高压供电系统停送电管理的总体部署、跨部门协调、工作票审批及安全责任落实，对停送电作业安全负全面领导责任。","机电副总工程师：负责停送电技术标准制定、重大操作方案审核、技术措施审批、工作票审批、继电保护及运行方式变更的技术把关，协调解决重大技术问题。","机电运输科科长：负责停送电管理制度制定与监督执行、工作票审批、操作票与工作票管理的监督检查、停送电档案管理、与上级供电部门的协调联系。","机电队队长、支部书记：负责停送电作业的组织实施、人员调配、现场协调及考核落实，检修与停送电工作的总体安排，对作业现场安全负直接管理责任。","主管副队长：负责停送电计划编制、现场作业组织协调、操作质量管控、进度把控，审核操作票及工作票，组织班前安全交底。","安全技术副队长：负责停送电安全技术措施编制、技术交底、现场隐患督办、“两票”执行情况的监督检查、模块修订优化及安全培训。","班组长：负责当班停送电操作任务的接收与分配、操作票执行过程的监护、班组人员管理、现场安全确认、操作质量复检及问题上报。","现场操作人员：严格按操作票及工作票要求执行停送电操作、落实互保联保、执行安全确认、自检自查、规范填写记录、文明操作。"]}]},{"t":"第三章 地面高压供电系统停送电模块化模块","s":[{"t":"一、模块概述","p":["模块编号：JD-A-01","模块名称：地面高压供电系统停送电操作","所属专业：机电","适用范围：适用于参与矿井地面35kV、6kV高压供电系统停送电操作、检修配合及运行维护的所有人员"]},{"t":"二、危险预知及防控","p":["1.误操作导致带负荷拉合隔离开关：高压停送电操作必须严格执行停送电制度及工作票、操作票制度。操作前必须核对设备名称、编号和位置，确认无误后方可操作。操作高压开关柜时，必须严格按照先分闸断路器、再拉隔离开关操作；送电操作顺序与此相反。严禁带负荷拉合隔离开关。","2.误送电、反送电伤人：高压停、送电操作必须依据经审批的工作票和操作票，或依照电力调度指令执行，严禁无票操作、口头约时停送电。停电后必须断开断路器和隔离开关，将手车开关拉至试验位置或检修位置，操作机构必须闭锁，悬挂“有人工作，不准送电”警示牌。严格执行“谁停电、谁送电”原则。","3.触电伤害：操作高压电气设备时，操作人员必须戴绝缘手套，穿绝缘靴，站在绝缘垫上。验电时，必须使用相应电压等级且试验合格的验电器，在设备的进出线两侧各相分别验电。验电前，应先在有电设备上进行试验，确证验电器良好。","4.电弧灼伤：操作断路器、隔离开关时，人员应站在开关柜侧面，严禁正对开关柜操作孔或观察窗。操作过程中发现异常情况应立即停止操作，查明原因并处理后方可继续。人员身体与带电部分保持足够安全距离（35kV≥1.0m，6kV≥0.7m）。","5.误入带电间隔：高压开关柜必须具备完善的“五防”功能：防止误分、误合断路器，防止带负荷分、合隔离开关，防止带电挂接地线，防止带接地线合闸，防止误入带电间隔。操作前必须确认操作间隔无误，且开关柜门已关闭闭锁。检修期间，带电间隔必须装设临时警戒，非工作人员禁止入内。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：区域通风良好，无积水、无易燃易爆物堆积，照明充足，应急照明完好；消防设施齐全有效，消防通道畅通。","2.人员确认：所有作业人员精神状态良好，经培训考试合格，持有电工特种作业操作证；熟悉现场设备、接线方式及运行方式；工作票所列工作参与人员与实际相符。","3.工器具确认：绝缘手套、绝缘靴、绝缘操作杆、验电器、接地线等安全工器具经试验合格，在有效期内，外观检查无破损、裂纹、老化等缺陷；仪器仪表完好，刻度指示正确，数值显示正确；操作票、工作票填写正确、审批手续完备。","4.技术确认：停送电操作任务明确，操作票已根据工作票及调度指令填写完毕并审核无误；安全措施已落实。","5.设备确认：操作前必须认真核对设备双重名称（设备名称和编号），确认待操作设备状态与操作票一致；高压开关柜带电显示装置指示正确，断路器、隔离开关、接地刀闸位置指示正确；微机五防系统运行正常，模拟预演通过。"]},{"t":"四、作业现场人员安全站位","p":["1.操作人：站在绝缘垫上，位于开关柜正面操作机构的侧面位置，保持与带电部位足够的安全距离（35kV≥1.0m，6kV≥0.7m），操作过程中严禁摘下绝缘手套。","2.监护人：站在操作人员侧后方，能同时监视操作人员动作及设备状态的位置，保持足够安全距离，全程监护、及时提醒，严禁参与操作。"]},{"t":"五、标准化作业流程","p":["（一）停电操作流程","1.前期准备工作：","（1）班组长提出停送电工作申请，办理工作票，经机电运输副矿长（机电副总工程师、机电运输科科长）审批。","（2）安全技术副队长负责编制检修停送电安全技术措施，组织全体参与人员贯彻学习并签字确认。","（3）值班人员根据工作票内容填写操作票，经班组长、主管副队长审核批准后生效。","（4）值班人员、班组长、主管副队长共同完成现场安全确认，确认具备操作条件。","（5）值班人员检查绝缘手套、绝缘靴、验电器、接地线、绝缘垫、绝缘操作杆等，检查外观完好、试验合格且在有效期内。","（6）值班人员按操作票顺序逐项模拟，核对系统运行方式、设备名称编号及实际状态，确认无误。","2.停电操作步骤：","（1）操作人上传“电子操作票”至电力五防系统。","（2）操作人、监护人进入操作现场，共同核对设备双重名称，确认待操作设备与操作票一致。","（3）操作人操作断路器控制开关分闸，检查断路器确在断开位置，机械位置指示、电气指示、带电显示均对应一致。（监护人唱票，操作人复诵，监护人确认）","（3）操作人确认断路器确在断开位置后，将开关柜手车平稳拉至试验位置。（监护人唱票，操作人复诵，监护人确认）","（4）验电：操作人使用与电压等级相符验电器，在设备进线侧、出线侧逐相分别验电；验电前，先在有电设备上试验验电器良好。（监护人确认）","（5）装设接地线：操作人验明确无电压后，立即装设接地线。先接接地端，后接导体端，且必须接触良好、连接可靠。线路侧无作业时，不涉及。（监护人唱票，操作人复诵，监护人确认）","（6）悬挂警示牌：操作人在已停电的断路器、隔离开关操作把手上悬挂“有人工作，不准送电”警示牌，悬挂“停电”状态牌。","（7）操作票终结：操作人、监护人全面复查操作项目无误后，分别在操作票上签字，汇报现场负责人。（班组长确认）","（二）送电操作流程","1.前期准备工作：","（1）班组长确认全部工作已完毕、全部人员已撤离、全部工具材料已清点、全部接地线已拆除，向现场负责人提出工作终结申请。","（2）班组长、主管副队长到现场验收，确认设备状态正常、安全措施已全部拆除、现场无遗留物。","（3）班组长、主管副队长双方确认无误后，值班人员在操作票上填写终结时间，值班人员、班组长分别签名。","（4）值班人员根据现场负责人指令，填写送电操作票，操作任务、设备双重名称、操作步骤准确无误。（班组长确认）","（5）值班人员按操作票顺序逐项模拟，核对系统方式、设备状态，确认无误。","2.送电操作步骤：","（1）操作人上传“电子操作票”至电力五防系统。","（2）操作人、监护人进入操作现场，共同核对设备双重名称，确认设备状态与操作票一致。","（3）操作人摘除停电期间悬挂的“有人工作，不准送电”警示牌，“停电”状态牌。（监护人确认）","（3）操作人拆除接地线（或拉开接地刀闸）：先拆导体端，后拆接地端；核对拆除接地线的地点、组数、编号与操作票记录一致，严禁遗漏。（监护人唱票，操作人复诵，监护人确认）","（4）操作人将隔离小车摇入至工作位置，触头位置指示正确。（监护人确认）","（5）操作人合上断路器，检查断路器确在合闸位置，机械指示、电气指示正确，带电显示装置指示正常，35kV/6kV母线电压指示正常。（监护人确认）","（6）操作人、监护人全面复查无误后，分别在操作票上签字，汇报现场负责人。","（7）班组长、主管副队长安排监视设备运行状态，检查电压、电流、功率等参数是否正常，确认无异常后方可离开。"]},{"t":"六、作业质量标准","p":["1.高压开关柜：设备清洁，完成开关柜一、二次设备清扫除尘，螺栓紧固。断路器操作机构（弹簧、电磁）储能完好，动作灵活，真空开关外壳光亮、清洁无裂纹。五防闭锁功能正常。","2.电力电缆：电缆终端头、中间接头无过热、无放电，绝缘套无破损；外护层完好，铠装无锈蚀，固定卡箍无松动。测量电缆的绝缘电阻，符合规定要求。电缆沟无积水、无杂物，防火封堵完好。","3.变压器：油位、油温正常，无渗漏油，硅胶颜色蓝色，呼吸器通畅。套管无裂纹、放电痕迹，接线端子紧固，连接引线无过热。分接开关位置正确，操作机构灵活，接触电阻合格。接地系统完好。","4.继电保护装置：清扫保护屏，各插件连接牢固，无过热变色，保护定值与定值通知单一致，二次接线端子良好，故障录波功能正常。","5.接线与端子排：接线牢靠，清扫灰尘，进行必要的封堵；端子排完好。","6.作业现场：高压配电室清洁整齐，无杂物，无积水；电缆沟盖板齐全完好；通风、照明设施完好；消防设施、器材配备齐全；安全工器具存放符合要求，试验标签完好。"]},{"t":"七、安全管控措施","p":["1.停送电刚性管控：严格执行停送电管理制度及工作票、操作票制度。严禁无票作业、无监护操作。停电操作必须按调度指令和操作票顺序执行，操作前模拟预演，操作中“唱票复诵”，操作后逐项打“√”。","2.接地线管控：装设接地线必须纳入操作票管理，接地线的装设地点、组数、编号必须在操作票中明确记录。每组接地线均应编号，并存放在固定地点。装拆接地线必须做好记录，交接班时应交代清楚。","3.工作许可与终结管控：主管副队长、班组长必须到现场检查所做的安全措施，指明带电设备位置和注意事项，并分别在工作票上签名后方可开始工作。工作终结时，班组长必须确认全部工作已完毕、全部人员已撤离、全部安全措施已拆除，与主管副队长共同验收无误后，方可办理工作票终结手续。","4.作业区域隔离管控：高压停送电作业期间，作业区域设置警戒，悬挂警示标识，安排专职监护人全程值守，严禁非作业人员进入警戒范围，监护人不得参与直接操作，全程专注监控作业人员动作和现场状态。","5.工具材料清点管控：检修完成后，必须清点工具、材料、接地线数量，严禁遗漏在设备内部或母线上。恢复送电前，由工作负责人全面检查一遍，确认所有人员撤离至安全区域，方可申请送电。","6.档案闭环管控：建立检修档案，每次检修后记录检修内容、更换配件、试验数据、发现问题及处理结果，由检修班组长整理归档，主管副队长审核后，经安全技术副队长汇总统一交机电运输科保存，作为设备全生命周期管理依据。"]}]}],"w":4467,"cn":3,"sn":12},{"c":"JD-A-02","n":"矿井主要通风机检修","t":"JD-A-02 矿井主要通风机检修模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范矿井主要通风机检修作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生机械伤害、电气触电、误操作停风、瓦斯超限等安全隐患，提升检修期间安全保障能力与工程质量，确保矿井通风系统安全可靠运行，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井主要通风机（含机械部分、电气部分）检修作业、倒机操作及现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏、两票一项不少。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：总工程师、机电运输副矿长","副组长：通风副总工程师、机电副总工程师、通风科科长","机电运输科科长、机电队队长、","成  员：主管副队长、安全技术副队长、班组长、","通风机司机、机械检修工、电气检修工"]},{"t":"二、核心职责","p":["总工程师：负责主通风机检修技术方案审批、重大技术问题决策、检修期间通风系统调整及停风措施的技术把关，对检修安全负技术领导责任。","机电运输副矿长：负责主通风机检修总体部署、跨部门协调、工作票审批及安全责任落实，对检修作业安全负全面领导责任。","通风副总工程师：负责通风系统技术方案审核、风量调配方案审批、瓦斯治理措施的技术把关，协调解决通风相关重大技术问题。","机电副总工程师：负责机电检修技术标准制定、重大操作方案审核、技术措施审批、工作票审批、继电保护及运行方式变更的技术把关。","通风科科长：负责检修期间通风系统管理、风量调配、瓦斯监测监控、停风措施审批及与通风相关的协调工作，对检修期间通风安全负直接管理责任。","机电运输科科长：负责检修管理制度制定与监督执行、工作票审批、停送电档案管理、检修质量监督检查及与上级部门的协调联系。","机电队队长：负责检修作业组织实施、人员调配、现场协调及考核落实，检修工作的总体安排，对作业现场安全负直接管理责任。","主管副队长：负责检修计划编制、现场作业组织协调、检修质量管控、进度把控，审核工作票及操作票，组织班前安全交底。","安全技术副队长：负责检修安全技术措施编制、技术交底、现场隐患督办、\"两票\"执行情况的监督检查、模块修订优化及安全培训。","班组长：负责当班检修任务的接收与分配、班组人员管理、现场安全条件确认、检修质量复检、工作票办理及问题上报。","通风机司机：负责主通风机班前检查、倒机操作、按指令规范操作设备、运行状态监视、设备日常维护保养及运行记录填写。","机械检修工：负责主通风机机械部分（叶轮、主轴、轴承、联轴器、风门、机体等）的拆卸、检修、回装、调试及质量自检。","电气检修工：负责主通风机电气部分（电动机、电控柜、变频器、保护装置、电缆等）的停电、验电、检修、试验、回装及质量自检。"]}]},{"t":"第三章 矿井主要通风机检修模块","s":[{"t":"一、模块概述","p":["模块编号：JD-A-02","模块名称：矿井主要通风机检修","所属专业：机电、通风","适用范围：适用于参与矿井主要通风机机械部分、电气部分检修及运行维护的所有人员"]},{"t":"二、危险预知及防控","p":["1.误操作导致停风或瓦斯超限：主通风机检修必须严格执行工作票、操作票制度及停送电制度。检修前必须启动备用风机并确认运行正常，方可停止运行风机。严禁随意停风。","2.机械转动部件伤人：检修机械部分前，必须切断电源、闭锁开关，并悬挂“有人工作，不准送电”警示牌。叶轮、联轴器、传动轴等转动部位必须做好可靠制动或机械固定，严禁在设备未完全停稳时开展检修作业。","3.触电伤害：检修电气部分时，必须严格执行“谁停电、谁送电”的原则。高压侧停电后，必须先验电、放电，再装设接地线；操作高压电气设备时，必须佩戴绝缘手套、穿绝缘靴，或站在绝缘垫上作业。严禁对电气设备进行带电检修。","4.高处坠落：主通风机机体、风道、电机上方检修属于高处作业，必须搭设稳固作业平台，超过2m时必须佩戴安全带。检修作业期间，检修人员严禁私自打开风门进入垂直风道内作业。","5.物体打击：工具、零部件严禁抛掷，必须手递手传递或系防坠绳。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：通风机房无积水、无油污、无杂物；照明充足，应急照明完好；消防设施齐全有效；作业区域上方无淋水。","2.人员确认：所有作业人员精神状态良好，经培训考试合格，持证上岗；熟悉现场设备、检修流程及应急处置方法。","3.工器具确认：机械检修工器具（扳手、撬棍、拉马、千斤顶等）齐全完好；电气检修工器具（绝缘手套、绝缘靴、验电器、接地线、万用表、兆欧表等）完好；起重工器具（手拉葫芦、钢丝绳、卸扣等）额定载荷满足要求、外观完好。","4.技术确认：检修任务明确，检修方案及安全技术措施经总工程师审批，全体参与人员完成贯彻学习并签字确认；工作票、操作票填写正确、审批手续完备。","5.设备确认：操作前核对设备双重名称，确认待检修风机与操作票一致；备用风机运行正常，风门开关到位，风量满足矿井通风需求；待检修风机电源已切断，开关把手闭锁并挂牌。"]},{"t":"四、作业现场人员安全站位","p":["1.班组长/主管副队长：站在作业现场退路畅通的安全区域，全程统筹作业流程，监督\"两票\"执行情况，不得擅自离岗。","2.机械检修工：严禁站在叶轮旋转方向、联轴器甩出方向及起吊物下方；高处作业时站在稳固平台上，安全带系挂在牢固构件上。","3.电气检修工：站在绝缘垫上操作高压开关柜，身体保持与带电部位足够的安全距离（6kV≥0.7m）；验电、放电时站在设备侧后方。"]},{"t":"五、标准化作业流程","p":["（一）前期准备与倒机操作","1.前期准备工作：","（1）主管副队长根据（年度）检修计划提出主通风机检修申请，班组长办理工作票，明确检修风机编号、检修内容、计划时间。","（2）安全技术副队长负责编制主通风机检修安全技术措施，组织全体参与人员贯彻学习并签字确认。","（3）值班人员根据工作票内容填写操作票，经班组长、主管副队长审核批准后生效。","（4）通风机司机、班组长、主管副队长共同完成现场安全确认，确认具备倒机及检修条件。","2.倒机操作步骤：","（1）通风机司机按操作票顺序，先启动备用风机，观察运行电流、振动、声响、风压等参数，确认备用风机运行正常。","（2）班组长确认备用风机运行稳定、风量满足要求后，通知通风机司机停止运行在用风机。","（3）通风机司机按操作票停止运行在用风机，通风机司机将确认检修风机断路器在断开位置后，将开关柜手车平稳拉至试验位置，装设接地线。在已停电的断路器、隔离开关操作把手上悬挂“有人工作，不准送电”警示牌，悬挂“停电”状态牌。（监护人唱票，操作人复诵，监护人确认）","（4）通风机司机、班组长全面复查倒机操作无误后，检修风机控制柜停电操作完成后，汇报主管副队长。","（二）检修流程","1.电气部分检修：","（1）电气检修工确认待检修风机高压开关柜已断开断路器，手车拉至试验位置，操作机构闭锁。","（2）电气检修工在高压开关柜进线侧、出线侧逐相验电，验电前在有电设备上试验验电器良好。（班组长确认）","（3）电气检修工对电缆、电机等设备逐相充分放电，验明确无电压后装设接地线，先接接地端，后接导体端。（班组长确认）","（4）电气检修工在检修区域设置临时警戒。","（5）电气检修工按要求对高压电动机、变频器、电控柜及保护装置、电缆及接线、接地系统等检查、维护、检修。（班组长确认）","2.机械部分","（1）机械检修工确认待检修风机已完全停止运转，叶轮无惯性转动。","（2）机械检修工在风机联轴器、叶轮等转动部位设置机械制动或固定装置，防止意外转动。","（3）班组长确认可靠后，允许开始机械部分检修。","（4）机械检修工根据检修项目，逐项对叶轮、主轴、轴承、联轴器、风门及执行机构、机体及基础固定螺栓，进行检查、维修、更换。（班组长确认）","（三）试运转与验收","1.试运转前检查：","（1）机械检修工、电气检修工共同确认机械部分、电气部分检修完毕，工具材料无遗漏，检修现场清理完毕。（机械检修工/电气检修工/班组长）","（2）班组长确认全部人员已撤离至安全区域，接地线已全部拆除，警示牌已全部摘除。（班组长/安检员）","2.单机试运转：","（1）值班人员填写送电操作票，经班组长审批后执行送电操作。","（2）通风机司机按指令点动试车，确认电机转向正确、无异响。","（3）通风机司机启动风机空载运行，机械检修工、电气检修工分别检查：轴承温升、振动值、声响、电流、电压等参数。","（4）空载运行30分钟，各项参数稳定且符合标准后，停止风机。（班组长/主管副队长确认）","3.倒机恢复与联合验收：","（1）按倒机操作流程，将检修风机投入运行，原备用风机停止备用。","（2）由通风科科长安排测定矿井总风量、负压及瓦斯浓度，确认通风系统恢复正常。","（3）机电运输科、通风科、机电队组织联合验收：机械部分检修质量、电气部分检修质量、试运转数据、保护动作可靠性、现场文明生产。"]},{"t":"六、作业质量标准","p":["1.高压开关柜：设备清洁，完成开关柜一、二次设备清扫除尘，螺栓紧固。断路器操作机构（弹簧、电磁）储能完好，动作灵活，真空开关外壳光亮、清洁无裂纹。五防闭锁功能正常。","2.电力电缆：电缆终端头、中间接头无过热、无放电，绝缘套无破损；外护层完好，固定卡箍无松动。测量电缆的绝缘电阻，符合规定要求。电缆沟无积水、无杂物，防火封堵完好。","3.主通风机：机壳、风道无变形，无严重开裂，密封严密，不漏风。","4.主通风机叶片：叶片顶部与外壳（机壳）单侧间隙应不小于2.5mm，且间隙应均匀一致。","5.电动机：电动机绝缘电阻符合要求。电动机定子温升不超过产品说明书规定。","6.防爆门：防爆门密封严密，配重符合标准，钢丝绳无锈蚀、断股。","7.检修现场：无油污、无废弃棉纱、旧配件统一回收；工具、备件归位。"]},{"t":"七、安全管控措施","p":["1.停风与倒机刚性管控：严格执行《煤矿安全规程》停风管理规定。主通风机检修必须提前制定专项安全技术措施，经总工程师审批。倒机前必须确认备用风机完好，倒机期间通风科加强瓦斯监测。严禁随意停风，严禁两台主通风机同时停止运行。","2.停送电刚性管控：严格执行停送电管理制度以及工作票、操作票制度。检修电气部件时必须办理停电作业票，高压操作落实一人操作、一人监护，操作过程执行“唱票复诵”制度。严格遵守“谁停电、谁送电”原则，严禁约时停送电。","3.高处作业管控：高处作业必须搭设稳固作业平台，高度超过2m时作业人员必须佩戴安全带。利用爬梯登高时，爬梯下方必须设专人扶梯，并对登高作业人员全程监护。利用脚手架登高作业时，若上方无可用位置挂设安全带，必须在脚手架上设置高度不低于1.2m的防护护栏。","4.试运转管控：试运转前必须确认机械、电气检修完毕，人员全部撤离，工具无遗漏。试运转时先点动确认转向，再空载运行，专人监测振动、温度、电流等参数，发现异常立即停机处理。","5.档案闭环管控：建立主通风机检修档案，记录检修内容、更换配件、试验数据、发现问题及处理结果，由班组长整理归档，主管副队长审核，经安全技术副队长汇总后交机电队及通风科保存，作为设备全生命周期管理及通风系统分析依据。"]}]}],"w":4309,"cn":3,"sn":12},{"c":"JD-A-03","n":"地面起吊作业","t":"JD-A-03 地面起吊作业模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿地面起重设备吊装作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生重物坠落、设备倾覆、碰撞挤压等安全事故，提升地面起重吊装作业安全保障能力与工程质量，确保起重机吊装全过程安全可控，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于门式起重机、桥式起重机、汽车起重机、电动葫芦，吊装作业、检修配合及日常运行维护全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先审批、后作业；先检查、后操作；先防护、后施工。","2.严格执行十不吊核心准则。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、指挥人员、起吊设备操作人员、司索工"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责地面起重设备吊装作业整体统筹、人员调配、现场协调及考核落实，对作业现场安全负直接管理责任。","主管副队长：负责日常吊装设备管理、吊装作业管控、负责督促落实人员规范操作。","安全技术副队长：负责现场隐患督办、特种设备法规执行情况监督检查、模块修订优化及安全培训。。","班组长：负责当班吊装任务的接收与分配、班组人员管理、现场安全条件确认、吊装作业过程监督，作为起吊作业现场负责人。负责合理安排起吊设备操作人员、指挥人员及司索工。","起吊设备操作人员：负责起重机作业前检查、试运转、按指挥信号规范操作设备、运行状态监视、设备日常维护保养及运行记录填写。","起重指挥人员：起吊前，对起吊作业范围环境安全检查确认。负责吊装全过程指挥、信号发出、吊物状态监视、人员站位确认、与司机及司索工协调配合，对指挥安全负直接责任。","司索工：负责吊具选用与检查、吊物绑扎与挂钩、吊物状态确认、就位辅助、摘钩及吊索具回收，对吊索具及绑扎安全负直接责任。"]}]},{"t":"第三章 地面起吊作业模块化检修模块","s":[{"t":"一、模块概述","p":["模块编号：JD-A-03","模块名称：地面起吊作业操作","所属专业：机电","适用范围：适用于门式起重机、桥式起重机、汽车起重机、电动葫芦吊装作业、检修配合及日常运行维护的所有人员"]},{"t":"二、危险预知及防控","p":["1.重物坠落伤人：严格执行\"十不吊\"规定。起吊前必须检查钢丝绳、吊钩、吊具完好情况，确认无断丝、变形、裂纹等缺陷；吊物必须绑扎牢固，重心平稳，棱角处加衬垫保护；起吊后试吊确认无误方可正式起吊；严禁超载、斜拉歪吊。","2.起重机倾覆或脱轨：作业前检查大车轨道、支腿、基础及运行区域，确认轨道无变形、无杂物、无沉降，限位器、缓冲器完好；门式起重机支腿必须稳固；严禁带故障运行，严禁在悬臂极限位置超载作业。汽车起重机使用前，起重机行驶和工作的场地应平坦坚实，保证在工作时不沉陷，应与沟渠、基坑保持必要的安全距离。必须给支腿垫好能承载的方木，并调整机体使回转支承面处于水平状态。","3.碰撞挤压伤人：吊装作业区域必须设置警戒隔离，非作业人员严禁入内；吊物运行路线下方严禁站人；吊物与周边设备、建（构）筑物保持安全距离；多人配合作业时必须统一指挥，信号明确。","4.制动失灵或限位失效：每班作业前必须进行空载试运行，检查起升机构、大车运行机构、小车运行机构制动器及起升高度限位器、大车行程限位器、小车行程限位器、超载限制器等安全保护装置，确认灵敏可靠后方可作业。","5.车辆伤害（汽车起重机）：汽车起重机行驶、转场时，吊臂必须回收到规定位置，吊钩固定牢固；在作业区行驶时，必须有专人指挥、监护，注意避让人员及设备；严禁在吊臂未回位状态下长距离行驶。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业区域场地平整坚实，无积水、无油污、无杂物；大车轨道两侧及运行通道畅通，无障碍物，视线良好。","2.人员确认：起吊设备操作人员、起重指挥人员、司索工精神状态良好，身体健康，无妨碍作业的疾病；起吊设备操作人员、起重指挥人员均经专业培训考试合格，持有《特种设备作业人员证》；熟悉现场设备性能、操作规程及应急处置方法。","3.工器具确认：钢丝绳、吊带、卸扣、吊钩等吊索具经检查合格，无断丝、断股、变形、裂纹、磨损超标等缺陷，额定起重量满足吊装要求。","4.技术确认：吊装任务明确，吊物重量、外形尺寸、重心位置已核实；吊装方案（10t以下可以口头传达），参与作业人员已贯彻学习。","5.设备确认：起重机设备完好；安全保护装置（限位器、制动器、超载限制器、防脱钩装置等）完好有效；大车轨道压板、螺栓无松动，轨道接头间隙及高差符合标准。汽车起重机支腿液压系统无渗漏，轮胎气压正常。"]},{"t":"四、作业现场人员安全站位","p":["1.起重指挥人员：站在司机可视范围内、吊物运行路线侧方的安全位置，避开吊物坠落半径，全程目视跟踪吊物状态，信号清晰准确，严禁站在吊物下方或死角位置指挥。","2.起吊设备操作人员：站在能够全局观察起吊作业位置，避开吊物坠落半径，全程目视跟踪吊物状态，手持控制器，操作期间专注设备操控，严格听从指挥人员统一指令，杜绝误操作。","3.司索工：严禁站在吊物摆动方向、吊物坠落半径内；挂钩时站在吊物侧面，摘钩时待吊物稳固放置后方可进行，严禁在吊物悬空状态下探身进入吊物下方。"]},{"t":"五、标准化作业流程","p":["（一）门式起重机、桥式起重机、电动葫芦起吊作业流程","1.前期准备工作：","（1）班组长根据吊装任务，选择合适起吊设备，安排起吊作业人员。","（2）起吊设备操作人员、司索工、起吊指挥人员共同完成设备班前检查及现场安全确认，确认具备作业条件。","（3）司索工准备符合对应起吊重物用的吊索具：钢丝绳、卸扣、吊带等，检查外观完好、额定载荷满足要求。","2.班前检查与试运转：","（1）起吊设备操作人员检查大车轨道：轨道无变形、无杂物、无沉降，压板螺栓紧固，轨道接头间隙符合要求。","（2）起吊设备操作人员检查金属结构：主梁、支腿、连接螺栓无变形、无裂纹、无松动。","（3）起吊设备操作人员检查安全装置：起升高度限位器、大车行程限位器、小车行程限位器、缓冲器、超载限制器、防脱钩装置等完好有效。","（4）起吊设备操作人员检查起升机构、大车运行机构、小车运行机构：钢丝绳无断丝、断股、扭结，吊钩无裂纹、变形，滑轮转动灵活，制动器灵敏可靠。","（5）空载试运转：起升、大车运行、小车运行分别进行点动试车，确认各机构动作正常、制动可靠、无异常声响。","3.挂钩与起吊：","（1）司索工根据吊物重量、外形及重心选用合适的吊索具，严禁超载使用。","（2）司索工将吊索具挂入吊钩，确认防脱钩装置有效；吊物绑扎牢固，棱角处加衬垫保护，吊物重心与吊钩中心在同一垂直线上。（起重指挥人员确认）","（3）起重指挥人员发出信号，确认吊物周围人员已撤离至安全区域。","（4）起吊设备操作人员按指挥信号缓慢起升吊钩，使吊索具缓慢受力绷紧。（起重指挥人员确认）","（5）试吊：吊物吊离地面100mm~200mm后停车，起重指挥人员、司索工共同检查吊物平衡状态、吊索具受力情况、制动器可靠性，确认无异常后方可正式起吊。（起重指挥人员/司索工/起吊设备操作人员确认）","4.运行与就位：","（1）起重指挥人员发出运行信号，起吊设备操作人员按信号平稳操作大车及小车运行，吊物起升高度必须超过运行路线上最高障碍物0.5m以上。","（2）运行过程中，起重指挥人员全程目视跟踪吊物，司索工牵引溜绳控制吊物方向，严禁吊物从人员上方通过，严禁吊物剧烈摆动或旋转。","（3）吊物运行至就位地点上方后，起重指挥人员发出下降信号，起吊设备操作人员缓慢下降吊钩，司索工辅助校正吊物方位，严禁快速下降或自由落体。","（4）吊物平稳放置于支承面，确认稳固后，司索工方可摘钩。（起重指挥人员确认）","5.摘钩与收尾：","（1）司索工在吊物稳固后，按顺序摘取吊索具，回收吊索具并定置摆放。","（2）起吊设备操作人员将吊钩起升至安全高度（距极限位置≥200mm），大车、小车停放到指定位置，作业结束。","（二）汽车起重机吊装作业流程","1.前期准备工作：","（1）班组长根据吊装任务，核实吊物重量、外形尺寸、作业半径，选择合适吨位的汽车起重机，安排起吊作业人员。（班组长/主管副队长）","（2）起重指挥人员、司索工、起吊设备操作人员共同勘察作业现场，确认场地承载力、空间障碍物、与沟渠基坑安全距离等满足要求。","（3）司索工准备符合对应起吊重物用的吊索具：钢丝绳、卸扣、吊带、方木/钢板等，检查外观完好、额定载荷满足要求。（班组长确认）","2.就位与支腿展开：","（1）起吊设备操作人员驾驶汽车起重机行驶至作业位置，吊臂回位、吊钩固定，拉好手刹。","（2）起吊设备操作人员伸出全部支腿，支腿下方垫好承载方木或钢板，确保支腿与地面接触坚实、受力均匀。","（3）起吊设备操作人员调整机体，观察水平仪，使回转支承面处于水平状态，误差不超过规定值。","（4）锁定支腿、轮胎离地，确认整机稳固无晃动。","3.班前检查与试运转：","（1）起吊设备操作人员检查液压系统：油箱油位正常，液压管路无渗漏，液压油无变质，各液压阀工作正常。","（2）起吊设备操作人员检查金属结构及吊臂：吊臂无变形、无裂纹、无严重锈蚀，伸缩机构灵活，变幅油缸无渗漏；连接销轴、挡板齐全可靠。","（3）起吊设备操作人员检查安全装置：起升高度限位器、幅度限位器、回转限位器、力矩限制器（超载限制器）、防脱钩装置、支腿锁定装置等完好有效。","（4）起吊设备操作人员检查起升、变幅、回转机构：钢丝绳无断丝、断股、扭结，吊钩无裂纹、变形，滑轮转动灵活，制动器灵敏可靠。","（5）空载试运转：起升、变幅、回转分别进行点动试车，确认各机构动作正常、制动可靠、无异常声响、液压系统无异常。","4.挂钩与起吊：","（1）司索工根据吊物重量、外形及重心选用合适的吊索具，严禁超载使用。（起重指挥人员确认）","（2）司索工将吊索具挂入吊钩，确认防脱钩装置有效；吊物绑扎牢固，棱角处加衬垫保护，吊物重心与吊钩中心在同一垂直线上。（起重指挥人员确认）","（3）起重指挥人员确认吊物周围人员已撤离至安全区域，发出预备信号。（起重指挥人员/班组长确认）","（4）起吊设备操作人员按指挥信号缓慢起升吊钩，使吊索具缓慢受力绷紧，观察支腿及机体稳定情况。（起重指挥人员确认）","（5）试吊：吊物吊离地面100mm~200mm后停车，起重指挥人员、司索工共同检查吊物平衡状态、吊索具受力情况、支腿下沉情况、制动器可靠性，确认无异常后方可正式起吊。（起重指挥人员/班组长确认）","5. 变幅、回转与就位：","（1）起重指挥人员发出信号，起吊设备操作人员按信号平稳操作变幅、回转及起升机构，吊物起升高度必须超过运行路线上最高障碍物0.5m以上。","（2）运行过程中，起重指挥人员全程目视跟踪吊物，司索工牵引溜绳控制吊物方向，严禁吊物从人员上方通过，严禁吊物剧烈摆动或旋转；起吊设备操作人员密切观察支腿及水平仪状态。","（3）吊物运行至就位地点上方后，起重指挥人员发出下降信号，起吊设备操作人员缓慢下降吊钩，司索工辅助校正吊物方位，严禁快速下降或自由落体。","（4）吊物平稳放置于支承面，确认稳固后，司索工方可摘钩。（起重指挥人员确认）","6.收车与收尾：","（1）司索工在吊物稳固后，按顺序摘取吊索具，回收吊索具并定置摆放。","（2）起吊设备操作人员将吊钩起升至安全位置，吊臂回收到规定角度并固定，收回支腿，拆除垫木。现场清理、工具清点。"]},{"t":"六、作业质量标准","p":["1.起重机金属结构：主梁、端梁、支腿、小车架无变形、无裂纹、无严重锈蚀；焊缝无开裂；连接螺栓紧固无松动。","2.起升机构：钢丝绳在卷筒上排列整齐，无断丝、断股、扭结、压扁，断丝数在一个捻距内不超过钢丝绳总丝数的10%；吊钩无裂纹、变形，危险截面磨损不超过原尺寸的10%，防脱钩装置完好有效；滑轮转动灵活，无裂纹、破损；制动器制动可靠，制动轮无裂纹，制动瓦衬磨损不超过原厚度的50%。","3.运行机构：大车、小车运行平稳，无啃轨、无卡阻；车轮无裂纹，轮缘磨损不超过原厚度的50%；减速机无渗漏油，运转平稳无异响；联轴器连接可靠，弹性圈完好。","4.安全保护装置：起升高度限位器、大车行程限位器、小车行程限位器、缓冲器、超载限制器、防脱钩装置、紧急停止开关等齐全完好，动作灵敏可靠，声光报警装置完好。","5.吊索具：钢丝绳、吊带、卸扣、吊钩等吊索具无断丝、断股、变形、裂纹。","6.电气系统：集电器（滑触线）或电缆卷筒供电可靠，无火花、无过热；绝缘电阻符合要求；信号装置完好。","7.作业现场：大车轨道两侧及运行通道畅通，无杂物；轨道压板、螺栓紧固；作业区域清洁整齐，吊索具、工具摆放规范。"]},{"t":"七、安全管控措施","p":["1.特种设备刚性管控：起重机必须取得《特种设备使用登记证》，在定期检验合格有效期内使用，严禁超期未检或检验不合格设备投入使用。起吊设备操作人员、起重指挥人员持证上岗，严禁无证操作或违章指挥。","2.“十不吊”刚性管控：严格执行“十不吊”规定：指挥信号不明或违章指挥不吊；超载或吊物重量不明不吊；吊索具不合格或捆绑不牢不吊；吊物上站人或放有活动物不吊；安全装置失灵不吊；埋在地下物或与其他物体钩连不吊；光线阴暗、视线不清不吊；斜拉歪吊不吊；棱刃物与钢丝绳直接接触无保护措施不吊；六级以上强风不吊。","3.汽车起重机支腿管控：汽车起重机作业前必须将全部支腿完全伸出，支腿下方垫好承载方木或钢板，调整机体使回转支承面处于水平状态。严禁支腿未完全伸出、未垫实或机体倾斜状态下进行吊装作业。作业过程中定时观察支腿下沉及水平仪变化，发现异常立即停止作业。","4.试吊确认管控：每次起吊必须坚持“试吊”制度，吊物吊离地面100mm~200mm后必须停车检查，确认吊物平衡、吊索具受力均匀、制动器可靠后方可正式起吊。试吊检查发现异常必须立即落钩整改，严禁强行起吊。","5.警戒隔离管控：吊装作业区域必须设置明显警戒标志和临时遮栏，安排专人监护，非作业人员严禁进入吊物坠落半径范围内。吊物运行路线下方严禁站人，吊物严禁从人员上方通过。","6.吊索具管控：严禁使用不完好吊索具。吊索具选用必须与吊物重量、外形匹配，严禁以小代大、混用代用。","JD-A-04 井下高压供电系统停送电模块化作业流程及管控措施"]}]},{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿井下高压供电停送电操作作业，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生设备误启动、电气失爆、人员触电等安全隐患，提升工作效率与工程质量，确保高压供电系统检修全过程安全，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿井下高压供电系统安装、检修、试验、维护作业过程中的停送电操作。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏、两票一项不少。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电运输副矿长","副组长：机电副总工程师、机电运输科科长、机电队队长、支部书记","成  员：主管副队长、安全技术副队长、班组长、安检员、现场操作人员（检修电工、操作人、监护人）"]},{"t":"二、核心职责","p":["机电运输副矿长：负责高压停送电作业的总体安全管理和组织协调，审批高压停送电工作票，对停送电作业安全负领导责任。","机电副总工程师：负责高压停送电作业的技术审核与安全措施审批，审批高压停送电工作票，对停送电技术安全负技术管理责任。","机电运输科科长：负责高压停送电作业的计划审核与现场监督检查，审批高压停送电工作票，对停送电作业规范执行负监督管理责任。","机电队队长、支部书记：负责高压停送电作业整体统筹、人员调配及考核落实，对高压停送电现场安全负直接管理责任。","主管副队长：负责高压停送电计划编制、现场作业组织协调、检修质量管控、进度把控，审核操作票，组织班前安全交底。","安全技术副队长：负责检修安全技术措施编制、技术交底、现场隐患督办、“两票”执行监督检查、模块修订优化。","班组长：负责当班检修任务分配、班组人员管理、现场安全条件确认、检修质量复检、工作票办理及问题上报。","安检员：负责作业期间安全巡查监督，制止违章行为，闭环隐患，监督“两票”及各项安全措施的落实。","现场操作人员：严格按照标准作业，落实互保联保要求，执行安全确认，开展自检自查，规范填写记录，落实文明施工要求。"]}]},{"t":"第三章 井下高压供电系统停送电模块","s":[{"t":"一、模块概述","p":["模块编号：JD-A-04","模块名称：井下高压供电系统停送电","所属专业：机电","适用范围：适用于参与矿井井下高压供电系统安装、检修、试验、维护的过程中停送电操作所有人员"]},{"t":"二、危险预知及防控","p":["1.设备误启动、误送电伤人：检修高压供电系统必须严格执行停送电制度及工作票、操作票制度。高压停、送电操作必须提交书面申请或依照调度指令，经批准后由专职电工执行。作业前需切断前一级开关电源，实行机械闭锁，悬挂“有人工作，不准送电”警示牌，并上锁，严禁约时停送电，作业过程必须有专人监护。","2. 触电伤害：操作高压电气设备主回路时，操作人员必须戴绝缘手套，穿电工绝缘靴或站在绝缘台上。严禁带电检修、搬迁电气设备。检修前，必须切断上级电源，检查瓦斯，在其巷道风流中甲烷浓度低于1.0%时，再用与电源电压相适应的验电笔检验，检验无电后，方可进行导体对地放电。切断电源后必须闭锁开关把手，悬挂“有人工作，不准送电”警示牌，并上锁。操作高压电气设备必须执行一人操作、一人监护制度。","3.工具使用不当伤人：正确使用扳手、验电器、兆欧表等工具，使用后应将其放入工具包或置于安全位置，防止工具坠落伤人。使用的验电器、接地线等必须经试验合格，不得有损坏、不完好等缺陷。","4.电气火灾：发生电气火灾时，必须切断就近电源，使用灭火器材灭火，并向调度汇报。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：瓦斯浓度≤1.0%，通风良好；作业区域无淋水、积水，顶板稳定，照明充足。","2.人员确认：所有作业人员精神状态良好，且经培训交底合格，持证上岗。","3.工器具确认：电工工具完好，验电器、绝缘手套、绝缘靴等经检查合格，满足作业要求。","4.技术确认：专项措施审批、贯彻到位，各项工作具备施工条件。","5.设备确认：检修前必须认真核对待停送电设备的编号，严格执行停送电制度及工作票、操作票制度。高压开关停电后，必须先分闸断路器，再拉机芯小车手柄。将前一级开关电源断电，拉出机芯小车，闭锁，挂“有人工作，不准送电”警示牌，并上锁。"]},{"t":"四、作业现场人员安全站位","p":["1.值班人员/检修电工：操作高压电气设备时，操作人员必须戴绝缘手套，穿电工绝缘靴或站在绝缘台上。验电、放电操作时，人员站在侧后方，与验电部位保持安全距离，严禁身体正对验电方向。在有轨道运输的巷道内作业时，必须在作业区域两端设置警戒标志，防止车辆误入。作业地点周围设置警戒，非工作人员禁止靠近。","2.班组长：站在作业现场退路畅通的安全区域，全程统筹作业流程，监督安全措施执行情况，不得擅自离岗。","3.安检员：站在能够全面观察作业现场的安全区域，与带电设备保持安全距离，全程监督作业人员安全操作行为、安全措施落实情况及“两票”执行情况，发现违章立即制止并纠正，不得擅自离岗。"]},{"t":"五、标准化作业流程","p":["（一）停电操作流程","1.前期准备工作：","（1）班组长根据检修计划提出停电申请，办理工作票，明确检修设备编号、检修内容及计划时间，经机电运输副矿长（或机电副总工程师、机电运输科科长）审批。","（2）安全技术副队长编制检修安全技术措施，组织全体参与人员贯彻学习并签字确认。","（3）值班人员根据工作票填写操作票，经班组长审核批准后生效。","（4）操作人、监护人、班组长共同完成现场安全确认及工器具检查。","2.停电操作步骤：","（1）操作人、监护人进入操作现场，共同核对设备双重名称，确认待操作设备与操作票一致。","（2）操作人分闸断路器，检查断路器确在断开位置，电气指示、带电显示均对应一致。（监护人确认）","（3）操作人确认断路器确在断开位置后，将机芯小车拉至检修位置，确认机械闭锁可靠，通过观察窗确认隔离插销已形成明确断开点。下级供电线路无检修作业时，本条不涉及。（监护人确认）","（4）操作人使用与电压等级相符的验电器，在设备进线侧、出线侧逐相分别验电。验电器使用前，按动试验按钮，确认验电器完好。（监护人确认）","（5）操作人验明确认无电后，装设接地线。先接接地端，后接导体端，且必须接触良好、连接可靠。（监护人确认）","（6）操作人在已停电的开关操作把手上悬挂“有人工作，不准送电”警示牌，并上锁。","（7）操作人、监护人全面复查无误后，汇报班组长。（班组长确认）","（二）安装、检修、试验作业步骤","1.安装作业步骤：","（1）现场负责人确认停电、验电、接地可靠后，组织开始安装作业。（班组长确认）","（2）高爆开关安装：检查设备外壳无变形、无裂纹，隔爆面完好；安装位置符合设计要求，基础稳固、水平度合格；开关进出线喇叭口密封良好，电缆引入装置符合防爆要求，密封圈、挡板、垫圈齐全完好；开关接地线连接可靠，接地电阻符合规定。","（3）变压器安装：检查变压器外壳完好；安装稳固，高低压侧接线正确、紧固；防爆面清洁、涂防锈油，隔爆间隙符合标准。","（4）高压电缆敷设：电缆悬挂规范，吊挂间距不大于3m；电缆弯曲半径符合规定，不得有绞拧、铠装压扁、护套断裂等机械损伤；电缆接线盒制作符合防爆工艺要求，密封可靠，吊挂牢固；固定敷设的高压电缆应悬挂电缆标志牌。","（5）保护装置安装：保护装置型号、规格与设计一致，安装牢固；二次回路接线正确、紧固，线号标识清晰；保护定值按审批后的整定通知单整定，不得随意更改。","（6）安装完成后，现场负责人逐项检查确认安装质量，清点工具材料。（班组长确认）","2.检修作业步骤：","（1）现场负责人确认停电、验电、接地可靠后，组织开始检修。（班组长确认）","（2）高爆开关检修：检查真空断路器真空管无裂纹、点蚀，清洁无污秽；检查隔爆面无锈蚀、砂眼、划伤，隔爆间隙符合《煤矿安全规程》规定，清洁后涂适量防锈油；检查接线腔内无杂物，接线端子紧固无松动、无过热变色；检查机械联锁、电气联锁装置动作灵活可靠，隔离开关处于合闸位置时箱门不能打开，只有当隔离开关分闸、闭锁到位，箱门才能打开；检查保护装置动作灵敏，具备故障记忆闭锁功能，短路、过负荷、接地、欠压释放保护、漏电保护装置完好，整定值正确，动作可靠。","（3）变压器检修：检查绕组绝缘无老化、无碳化；检查高低压套管无裂纹、无放电痕迹；检查防爆面完好，隔爆间隙符合标准。","（4）高压电缆检修：检查电缆外护套无损伤、无过热变色；检查电缆头、接线盒密封良好，无放电痕迹；检查电缆固定卡具齐全、牢固，悬挂整齐。","（5）接地系统检修：检查接地极、接地线连接可靠，无锈蚀、断裂；测量接地电阻值，符合《煤矿安全规程》规定；检查局部接地极、辅助接地极设置齐全、可靠。","（6）检修完成后，检修负责人逐项检查确认，清点工具材料。（班组长确认）","3.试验作业步骤：","（1）现场负责人确认安装或检修工作完毕、人员撤离至安全区域后，组织开始试验。（班组长确认）","（2）绝缘电阻测试：使用2500V兆欧表测量高压设备绝缘电阻，高爆开关主回路对地绝缘电阻值不低于规定值；高压电缆绝缘电阻值符合《煤矿安全规程》及设备技术要求；变压器绕组绝缘电阻值符合标准。测试前后必须对设备充分放电。","（3）真空断路器特性试验：测量断路器合闸时间、分闸时间、同期性，符合厂家技术文件要求；测量断路器触头接触电阻，符合标准规定。（预防性试验时，由有资质第三方试验）","（4）继电保护装置试验：对短路保护、过负荷保护、接地保护、欠压释放保护、漏电保护进行整组传动试验，保护动作值与整定通知单一致，动作时间符合要求；检查保护装置故障记忆、闭锁功能正常。（预防性试验时，由有资质第三方试验）","（5）接地电阻测试：使用接地电阻测试仪测量各接地装置接地电阻值，变电所主接地网接地电阻不大于2Ω，配电点局部接地极接地电阻不大于2Ω。","（6）试验完成后，检修负责人确认试验数据合格、设备状态正常，清点工具材料，拆除试验接线，恢复设备至检修前状态。（班组长确认）","（三）送电操作流程","（1）现场负责人确认全部工作完毕、人员撤离、工具材料清点齐全、接地线全部拆除，向班组长申请送电。（班组长确认）","（2）班组长现场验收，确认设备状态正常、安全措施全部拆除、现场无遗留物。","（3）操作人、监护人核对设备双重名称，操作人拆除接地线（先拆导体端，后拆接地端），摘除警示牌。（监护人确认）","（4）操作人将机芯小车推入工作位置，通过观察窗（或显示屏）观察确认触头接触良好，闭锁可靠。（监护人确认）","（5）操作人合闸断路器，检查确在合闸位置，带电显示正常，观察供电运行。（监护人确认）","（6）操作票终结，汇报班组长。（班组长确认）"]},{"t":"六、作业质量标准","p":["1.高爆开关：真空断路器真空管无裂纹、点蚀，清洁无污秽，紧固件齐全紧固、无损坏。配电装置具有安全可靠的机械、电气联锁。隔离开关处于合闸位置时箱门不能打开；只有当隔离开关分闸、闭锁到位，箱门才能打开。开关防爆面无锈蚀、砂眼、划伤等现象，防爆面清洁无污。接线腔内无任何杂物。","2.变压器：绕组绝缘良好，高低压接线柱无裂纹、无放电痕迹。防爆面完好，隔爆间隙符合标准。","3.保护装置：保护装置动作灵敏，具备故障记忆闭锁功能。高爆开关的短路、过负荷、接地、欠压释放保护、漏电保护装置应保持完好，整定值正确，动作可靠。","4.电缆：高压电缆无损伤、无过热现象，绝缘性能符合要求。电缆悬挂规范，吊挂间距不大于3m，所有电缆必须上电缆钩。电缆接线盒制作符合工艺要求，吊挂牢固可靠。固定敷设的高压电缆应悬挂电缆标志牌。","5.接地系统：各变电所、配电点设置可靠的接地。接地电阻值符合《煤矿安全规程》规定。接地装置连接可靠，无锈蚀、断裂现象。","6.检修现场：变电所、配电点无积水、无油垢、无杂物，电缆沟内卫生清洁；设备整洁，无油污、煤尘堆积。电缆悬挂整齐、规范。"]},{"t":"七、安全管控措施","p":["1.停送电刚性管控：严格执行停送电管理制度及工作票、操作票制度。高压开关停电时，必须先分闸断路器，再拉机芯小车手柄。将前一级开关电源断电、闭锁，拉出机芯小车，挂\"有人工作，不准送电\"警示牌，并上锁。严格执行\"谁停电、谁送电\"原则。","2.安全工器具管控：绝缘手套、绝缘靴、验电器等安全工器具必须经试验合格，且在有效期内使用，使用前需检查外观无破损、裂纹等缺陷，不合格的严禁投入使用。","3.检修区域隔离管控：检修期间，检修区域非作业人员严禁入内。","4.工具材料清点管控：检修完成后，必须清点工具、材料、接地线数量是否齐全，严禁遗漏在设备内部。恢复送电前，由工作负责人全面检查一遍，确认所有人员撤离至安全区域，方可申请送电。","5.档案闭环管控：建立检修档案，每次检修后记录检修内容、更换配件、试验数据、发现问题及处理结果，由检修班组长整理归档，主管副队长审核后，由安全技术副队长汇总统一交机电运输科保存，作为设备全生命周期管理依据。"]}]}],"w":10558,"cn":6,"sn":24}],"os":"一","rn":"高风险","rc":"红","rg":"A","n":3,"label":"高风险 · 红色 A段"},{"t":"二、中风险-橙色-B段（6项）","lv":"B","m":[{"c":"JD-B-01","n":"地面低压供电系统停送电","t":"JD-B-01 地面低压供电系统停送电模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿地面220V/380V/660V低压供电系统停送电作业，统一操作流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生误操作、误送电、人员触电等安全事故，确保地面低压供电系统停送电全过程安全，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿地面220V/380V/660V低压配电室、配电箱、配电柜等低压供电设备停送电操作、检修配合及运行维护全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、值班人员、检修电工"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责停送电作业整体统筹、人员调配、现场协调及考核落实，对作业现场安全负直接管理责任。","主管副队长：负责停送电沟通协调、现场作业组织协调、操作质量管控、进度把控，审批停电申请，组织班前安全交底。","安全技术副队长：负责技术交底、现场隐患督办、停送电执行情况的监督检查、模块修订优化及安全培训。","班组长：负责当班停送电操作任务的接收与分配、班组人员管理、现场安全条件确认、停送电操作质量复检、停电申请审批及问题上报。","值班人员：负责接受停送电指令、执行具体操作、设备状态监视、运行参数记录及现场安全确认。","检修电工：组织检修作业、确认人员撤离及工具清点、申请送电、对检修安全负直接责任。"]}]},{"t":"第三章 地面低压供电系统停送电模块化检修模块","s":[{"t":"一、模块概述","p":["模块编号：JD-B-01","模块名称：地面低压供电系统停送电操作","所属专业：机电","适用范围：适用于参与矿井地面220V/380V/660V低压供电系统停送电操作、检修配合及运行维护的所有人员"]},{"t":"二、危险预知及防控","p":["1.带负荷拉合隔离开关：操作前必须核对设备名称、编号和位置，确认无误后方可操作。停电时必须先断开断路器（断路器），再拉开隔离开关；送电时先合上隔离开关，再合上断路器（断路器）。严禁带负荷拉合隔离开关。","2.误送电、反送电伤人：严格执行停送电制度，停电后开关必须闭锁，悬挂“有人工作，禁止合闸”警示牌；严格执行“谁停电、谁送电”原则；严禁约时停送电。","3.触电伤害：验电时必须使用相应电压等级且试验合格的验电器或万用表，在设备进出线两侧各相分别验电。验电前，先在有电设备上试验验电器良好。严禁带电检修、搬迁电气设备。","4.电弧灼伤：操作断路器、隔离开关时，严禁脸部正对开关送电。操作过程中发现异常应立即停止操作，查明原因并处理后方可继续。","5.误入带电间隔：操作前必须确认操作间隔无误；停电设备的各端应有明显的断开点；带电部分必须设警戒。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：区域通风良好，无积水、无易燃易爆物堆积，照明充足，应急照明完好；消防设施齐全有效，消防通道畅通。","2.人员确认：所有作业人员精神状态良好，经培训考试合格，持有电工特种作业操作证；熟悉现场设备、接线方式及运行方式。","3.工器具确认：验电器、接地线等安全工器具经试验合格，在有效期内，外观检查无破损、裂纹、老化等缺陷。","4.技术确认：停送电操作任务明确，安全措施已落实。","5.设备确认：操作前必须认真核对设备双重名称（设备名称和编号），确认待操作设备与停电申请一致；低压配电柜指示灯指示正确。"]},{"t":"四、作业现场人员安全站位","p":["1.值班人员/检修电工：操作或检修时，保持与带电部位安全距离。","2.班组长：站在作业现场退路畅通的安全区域，全程统筹作业流程，监督安全措施执行情况，不得擅自离岗。"]},{"t":"五、标准化作业流程","p":["（一）停电操作流程","1.前期准备工作：","（1）班组长根据检修任务提出停电申请，明确停电设备名称、编号、停电范围、停电原因及计划停电时间，经主管副队长批准。","（2）值班电工根据停电申请，核对停电设备名称、编号，确认系统运行方式及设备实际状态。","（3）值班电工检查验电器、万用表、接地线等安全工器具，确认外观完好。","2.停电操作步骤：","（1）值班电工进入操作现场，核对设备双重名称，确认待操作设备与停电申请一致。","（2）断开断路器：操作断路器分闸，检查断路器确在断开位置。（值班电工）","（3）拉开隔离开关：确认断路器确在断开位置后，拉开隔离开关，检查隔离开关确在断开位置，触头断开距离符合要求。（值班电工）","（4）验电：使用与电压等级相符的低压验电器或万用表，在设备进线侧、出线侧逐相分别验电；验电前，先在有电设备上试验验电器良好。（值班电工）","（6）放电：逐相导体对地放电。（值班电工）","（7）装设接地线（或拆除负荷线）：验明确无电压后，立即装设接地线。先接接地端，后接导体端，且必须接触良好、连接可靠。线路侧无作业时，不涉及。（值班电工）","（8）悬挂警示牌：在已停电的断路器、隔离开关操作把手上悬挂\"有人工作，不准送电\"警示牌，并上锁。（值班电工）","（9）汇报确认：值班电工全面复查停电操作无误后，向班组长汇报，班组长现场确认。（值班电工/班组长）","（二）送电操作流程","1.前期准备工作：","（1）检修电工确认全部工作已完毕、全部人员已撤离、全部工具材料已清点、全部接地线已拆除，向班组长提出送电申请。（检修电工/班组长）","（2）班组长到现场验收，确认设备状态正常、安全措施已全部拆除、现场无遗留物。（班组长）","（3）班组长确认无误后，通知值班电工执行送电操作。（班组长/值班电工）","（4）值班电工核对送电设备名称、编号，确认设备状态与送电申请一致。（值班电工）","2.送电操作步骤：","（1）值班电工进入操作现场，核对设备双重名称，确认设备状态与送电申请一致。（值班电工）","（2）解除限位锁，摘除停电期间悬挂的\"有人工作，不准送电\"警示牌。（值班电工）","（3）拆除接地线（或恢复负荷侧接线）：先拆导体端，后拆接地端；核对拆除接地线的地点、组数与记录一致，严禁遗漏。（值班电工）","（4）合上隔离开关：检查断路器确在断开位置后，合上隔离开关，检查隔离开关确在合闸位置，触头接触良好。（值班电工）","（5）合上断路器：合上断路器，检查断路器确在合闸位置，指示灯显示正常，电压指示正常。（值班电工）","（6）汇报确认：值班电工全面复查送电操作无误后，向班组长汇报。班组长安排监视设备运行状态，检查电压、电流等参数是否正常，确认无异常，汇报主管副队长后，方可离开。（值班电工/班组长/主管副队长）"]},{"t":"六、作业质量标准","p":["1.低压配电柜：设备清洁，配电柜一、二次设备清扫除尘，螺栓紧固。断路器操作机构动作灵活，触头无烧蚀、无过热变色。隔离开关触头接触良好，无松动、无氧化。联锁闭锁功能正常。抽屉式开关柜抽屉推拉灵活，定位准确，触头接触可靠。","2.电力电缆：电缆终端头无过热、无放电，绝缘层无破损；外护层完好，固定卡箍无松动。测量电缆绝缘电阻，380V系统不低于0.5MΩ，660V系统不低于1MΩ。电缆沟无积水、无杂物，防火封堵完好。","3.接线与端子排：接线牢靠，无松动、无过热变色；端子排完好，清扫灰尘，进行必要的封堵；导线绝缘无老化、无破损。","4.保护装置：断路器过流保护、漏电保护装置动作灵敏可靠，整定值正确；热继电器整定值与设备额定电流匹配。","5.接地系统：接地装置连接可靠，无锈蚀、断裂现象；接地电阻值符合规定（低压系统接地电阻不大于4Ω）；PE线连接牢固，黄绿双色标识清晰。","6.作业现场：低压配电室清洁整齐，无杂物，无积水；电缆沟盖板齐全完好；通风、照明设施完好；消防设施、器材配备齐全；安全工器具存放符合要求，试验标签完好。"]},{"t":"七、安全管控措施","p":["1.停送电刚性管控：严格执行停送电管理制度。严禁口头约时停送电，严禁无申请停送电。停电操作必须按\"先断断路器、后拉隔离开关\"顺序执行，送电操作顺序相反。操作前核对设备双重名称，操作中核对确认，操作后逐项检查。","2.接地线管控：装设接地线必须做好记录，明确装设地点、组数。每组接地线编号清晰，存放在固定地点。装拆接地线严格执行\"先接接地端、后接导体端，拆除时相反\"的规定。交接班时交代清楚接地线装设情况。","3.工作许可与终结管控：班组长必须到现场检查安全措施落实情况，确认停电设备确无电压，指明带电设备位置，方可允许开始检修。工作终结时，工作负责人必须确认全部人员撤离、全部接地线拆除、现场无遗留物，班组长验收无误，汇报主管副队长后，方可申请送电。","4.作业区域隔离管控：低压停送电作业期间，作业区域设置警戒，悬挂警示标识，非作业人员严禁进入。带电设备与停电设备之间设置明显隔离措施。","5.工具材料清点管控：检修完成后，必须清点工具、材料、接地线数量，严禁遗漏在设备内部或母线上。恢复送电前，由工作负责人全面检查一遍，确认所有人员撤离至安全区域，方可申请送电。"]}]}],"w":3436,"cn":3,"sn":12},{"c":"JD-B-02","n":"地面动火作业","t":"JD-B-02 地面动火作业模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿地面动火作业（氧气乙炔气焊/气割、电焊机焊接/切割）行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生火灾、爆炸、容器爆裂、触电、灼烫、中毒等安全事故，确保地面动火作业全过程安全可控，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于地面大修车间日常服务生产用动火作业、地面其他地点检修、安装过程中使用氧气乙炔及电焊机进行的焊接、切割、烘烤、加热等动火作业全过程。。"]},{"t":"三、管理原则","p":["1.外围作业先审批、后作业；先检查、后操作；先防护、后施工。","2.外围作业无票不动火、无证不动火、无监护不动火、措施不落实不动火。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、指挥人员、起吊设备操作人员、司索工"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责地面动火作业整体统筹、人员调配、现场协调及考核落实，审核外出大修车间检修用动火作业票，对作业现场安全负直接管理责任。","主管副队长：负责外出大修车间检修用的动火计划审核、现场作业组织协调，组织班前安全交底。","安全技术副队长：负责动火作业票的报备审签、技术交底、现场隐患督办、动火票执行情况监督检查、模块修订优化及安全培训。","班组长：负责当班动火任务的接收与分配、班组人员管理、现场安全条件确认、动火作业过程监督，作为动火作业现场负责人。","现场操作人员（电焊工）：负责动火设备检查、规范操作、落实防火措施、作业后火种清理，对动火操作安全负直接责任。","监护人：负责动火全过程监护，检查防火措施落实情况，监视作业环境变化，发现异常立即制止作业并组织灭火，不得擅自离岗。"]}]},{"t":"第三章 地面动火作业模块化检修模块","s":[{"t":"一、模块概述","p":["模块编号：JD-B-02","模块名称：地面动火作业操作","所属专业：机电","适用范围：适用于矿井地面使用氧气乙炔及电焊机进行焊接、切割、烘烤等动火作业的所有人员。"]},{"t":"二、危险预知及防控","p":["1.火灾及爆炸：动火前必须清理作业点周围10m范围内的可燃物、易燃物，无法移除的采取覆盖阻燃材料、设置接火盆等隔离措施；配备不少于2具合格灭火器材；高处动火下方设接火挡板及监护人。外出大修车间动火作业必须办理动火作业票，经审批后方可作业。","2.氧气乙炔瓶爆炸：氧气瓶、乙炔瓶必须检验合格，安全附件（瓶帽、防震圈、减压器、回火防止器）齐全完好；两瓶间距不小于5m，距明火不小于10m；直立放置并固定牢靠，严禁倾倒、暴晒、撞击；乙炔瓶严禁卧放使用；氧气瓶及减压器严禁沾染油脂。","3.触电伤害：电焊机必须可靠接地，一、二次线绝缘完好无破损，接线端子防护罩齐全；焊钳绝缘良好，焊把线无裸露；雨天、潮湿环境严禁露天动火；严禁在带电设备上搭接焊把线。","4.弧光灼伤及飞溅伤人：焊工必须佩戴符合标准的防护面罩、电焊手套、阻燃防护服、绝缘鞋；设置遮光挡板，防止弧光伤害周围人员；清理焊渣时戴防护眼镜，防止焊渣飞溅灼伤。","5.有毒气体及烟尘中毒：作业场所通风良好，密闭空间动火必须采取强制通风；焊工佩戴防尘口罩。","6.气瓶泄漏及回火：连接气管前检查瓶阀、减压器、气管无泄漏；开启瓶阀应缓慢，严禁猛开猛关；焊炬、割炬必须安装回火防止器；作业中发生回火立即关闭乙炔阀，再关氧气阀。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业区域通风良好，无可燃气体积聚；动火点周围10m范围内无易燃物、可燃物、油污、煤尘、木质支护材料；消防器材（灭火器、消防沙、消防栓）齐全有效；消防通道畅通；高处作业下方无易燃物或已采取隔离措施。","2.人员确认：焊工、电焊工经专业培训考试合格，持有《特种作业操作证》（焊接与热切割作业）；监护人熟悉消防器材使用方法及应急处置程序；所有人员精神状态良好，班前安全交底完成，互保联保对子已落实。","3.工器具确认：氧气瓶、乙炔瓶检验合格且在有效期内，瓶帽、防震圈完好；减压器、回火防止器、焊炬、割炬、气管完好无泄漏；电焊机、焊钳、焊把线、接地线绝缘完好；灭火器等齐全有效。","4.技术确认：动火作业票已按程序审批；动火安全技术措施审批贯彻到位；应急灭火及疏散方案已明确。","5.设备确认：氧气瓶、乙炔瓶压力指示正常，无泄漏；电焊机接地可靠，一次线接漏电保护器，二次线接焊钳牢固；动火设备与作业票所列一致。"]},{"t":"四、作业现场人员安全站位","p":["1.电焊工：站在上风侧作业，避开烟雾及有毒气体聚集区；与氧气瓶、乙炔瓶保持安全距离（≥5m）；操作焊炬、割炬时，避开气管接头正面，防止回火或泄漏喷溅；高处作业时系好安全带，焊条头、熔渣不得随意抛掷。","2.监护人：站在动火点上风侧、能够全面观察动火点及周围环境的的安全位置，与动火点保持2m~5m距离，手持灭火器材，全程目视跟踪作业过程，不得参与作业、不得擅自离岗。","3.辅助人员/配合作业人员：站在警戒区域外，避开弧光、火花飞溅及热辐射方向；递送工具材料时从侧面接近，严禁在气瓶正面停留。","4.班组长：站在作业现场退路畅通、上风侧的安全区域，全程统筹动火流程，监督动火票执行、防火措施落实及人员站位。"]},{"t":"五、标准化作业流程","p":["（一）前期准备工作","（1）作业单位根据作业任务提出动火申请，明确动火地点、内容、方式（电焊/气割）、时间及防火措施，办理动火作业票，按要求审批。（作业单位）","（2）监护人、作业人员共同完成现场安全确认：清理动火点周围10m范围内可燃物、易燃物，无法移除的覆盖不燃性材料或设置接火盆；检查消防器材到位、消防通道畅通。（班组长确认）","（3）电焊工检查焊机、气瓶、减压器、气管、割炬、回火防止器等，确认完好。（电焊工）","（二）氧气乙炔气割作业步骤","1. 气瓶放置与连接：","（1）电焊工将氧气瓶、乙炔瓶运至作业点上风侧，直立放置于平整地面，使用支架或链条固定牢靠，防止倾倒。","（2）氧气瓶、乙炔瓶间距不小于5m，距明火及热源不小于10m；夏季防晒、冬季防冻，严禁在烈日下暴晒。（监护人确认）","（3）电焊工清除瓶阀口油脂，安装减压器（氧气用蓝色，乙炔用白色），连接牢固；连接气管及回火防止器，检查各接口无泄漏。","2. 点火与调节：","（1）电焊工微开氧气瓶阀，再微开乙炔瓶阀，观察减压器高压表压力正常（氧气≤15MPa，乙炔≤0.15MPa）。","（2）电焊工先微开焊炬/割炬氧气阀，再微开乙炔阀，用专用点火器点火（严禁用烟头点火），调节至所需火焰（中性焰、氧化焰或碳化焰）。","3. 作业操作：","（1）电焊工按工艺要求进行切割，保持割炬角度、速度、距离稳定，熔渣及飞溅方向避开人员及设备。","（2）作业中监护人全程监护，随时检查气管、瓶阀、减压器有无泄漏、过热、回火现象；发现异常立即通知停止作业。（监护人）","（3）电焊工严禁在带压容器、管道上直接动火；严禁用氧气吹扫衣物、身体或设备。","4. 熄火与关闭：","（1）作业完毕，电焊工先关闭割炬乙炔阀，再关闭氧气阀，火焰熄灭后关闭瓶阀，松开减压器调压手柄。","（2）电焊工拆除或关闭气管，瓶阀戴好瓶帽；乙炔瓶剩余压力不小于0.05MPa。（监护人确认）","（三）电焊机作业步骤","1.接线与检查：","（1）电焊机放置在干燥、通风处，距作业点不超过5m；一次线接漏电保护器，长度不超过5m；二次线、接地线连接牢固，绝缘完好。（电焊工/电工确认）","（2）电焊工检查焊钳绝缘无破损，焊把线与焊钳、焊机连接可靠；空载电压正常。","（3）电焊工在焊机旁放置灭火器材，设置遮光挡板，防止弧光伤害周围人员。","2.焊接操作：","（1）电焊工穿戴好防护面罩、电焊手套、阻燃防护服、绝缘鞋，启动焊机，调节电流至工艺参数。","（2）电焊工按焊接工艺规范引弧、施焊，保持电弧稳定，焊条角度正确，熔池控制得当。","（3）电焊工更换焊条时，避免焊钳与身体接触；清理焊渣时，敲渣方向避开人员，佩戴防护眼镜。","（4）作业中监护人全程监护，检查焊机温度、冒烟、异味及周围防火情况。（监护人）","3.收工与断电：","（1）焊接完毕，电焊工切断焊机电源，盘好焊把线，清理焊条头及焊渣，防止遗留火种。","（2）电焊工检查焊缝及周边有无阴燃，确认无异常后方可离开。（监护人确认）","（四）作业结束与现场恢复","1.动火作业结束后，电焊工清理现场，关闭气瓶阀门或切断焊机电源，清点工具。","2.监护人留守现场监护不少于30分钟，检查确认无残留火种、无阴燃、无异味后方可离开。（监护人/班组长确认）","3.拆除不燃性材料、接火盆等临时设施，恢复现场；若动火点周围有保温层、电缆夹层等隐蔽部位，延长监护时间并重点检查。（监护人/班组长）","4.班组长现场验收，确认无火灾隐患、现场清理完毕、工具材料无遗留，在动火作业票上签字终结。（班组长）","5.动火作业票由班组长整理归档，作业完成后，报保卫消防中心存档保存。（班组长）"]},{"t":"六、作业质量标准","p":["1.焊接质量：焊缝成形良好，宽度均匀，表面无裂纹、气孔、夹渣、咬边、未焊透等缺陷；焊接强度满足设计要求。切割面平整，切口无熔渣粘连，尺寸偏差符合标准。","2.气瓶管理：氧气瓶、乙炔瓶检验合格，在有效期内；瓶帽、防震圈齐全；减压器、回火防止器、气管完好无泄漏；瓶阀关闭严密，剩余压力符合要求。","3.电焊机状态：焊机外观完好，接地可靠；一、二次线绝缘无破损，接线端子紧固；焊钳绝缘良好，空载电压正常；漏电保护器灵敏有效。","4.防火措施落实：动火点周围10m范围内可燃物已清理或隔离；接火盆、灭火器材配置到位；高处动火下方隔离措施有效；作业后无遗留火种。","5.作业现场：无焊条头、无熔渣飞溅、无气瓶乱置；气管、焊把线盘放整齐；消防器材归位；现场清洁无油污。"]},{"t":"七、安全管控措施","p":["1.动火票刚性管控：严格执行动火作业票制度，无证不动火、无票不动火、无监护不动火、措施不落实不动火。动火票当次有效，超时、超范围必须重新办理。","2.气瓶安全管控：氧气瓶、乙炔瓶必须由国家定点厂家生产，检验合格且在有效期内。两瓶间距≥5m，距明火≥10m，直立固定，严禁倾倒、暴晒、撞击。氧气瓶、减压器及工具严禁沾染油脂。乙炔瓶严禁卧放使用，剩余压力不小于0.05MPa。","3.回火防止及泄漏管控：割炬必须安装合格的回火防止器；气管连接使用专用卡箍，作业前检漏；作业中发生回火立即关闭乙炔阀，再关氧气阀。","4.电焊机安全管控：电焊机必须\"一机一闸一漏一箱\"，接地可靠；一、二次线绝缘完好，长度符合规定；雨天、潮湿环境严禁露天动火；严禁在带压、带电、易燃易爆设备上直接动火。","5.防火防爆管控：动火前彻底清理可燃物，配备足够灭火器材（一般不少于2具8kg干粉灭火器），高处作业设接火挡板。动火结束后监护人留守不少于30分钟，确认无残留火种。涉及燃气、油管、煤尘区域动火，必须加盲板隔离、清洗置换、连续检测。","6.个人防护管控：电焊工必须穿戴防护面罩、电焊手套、阻燃防护服、绝缘鞋；高处作业系好安全带。监护人必须坚守岗位，不得擅离职守。","7.档案闭环管控：建立动火作业档案，保存动火作业票，报保卫消防中心存档保存，作为安全管理追溯依据。"]}]}],"w":4314,"cn":3,"sn":12},{"c":"JD-B-03","n":"地面压力容器检修","t":"JD-B-03 地面压力容器检修模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿地面压力容器（空气压缩机、储气罐、燃气锅炉）检修作业，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生压力容器爆炸、燃气泄漏中毒、高温烫伤、机械伤害等安全事故，确保压力容器安全运行及检修全过程受控，特制定本方案。。"]},{"t":"二、适用范围","p":["本方案适用于煤矿地面空气压缩机（含配套储气罐）及燃气锅炉等压力容器的定期检修、维护保养、安全附件校验、内部检验配合及故障处理全过程。"]},{"t":"三、管理原则","p":["1.先审批、后作业；先检查、后操作；先防护、后施工。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、安检员、现场操作人员（检修电工、机修工）"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责压力容器检修作业整体统筹、人员调配及考核落实，对作业现场安全负直接管理责任。","主管副队长：负责检修计划编制、现场作业组织协调、检修质量管控、进度把控，审批检修作业申请，组织班前安全交底。","安全技术副队长：负责压力容器检修安全技术措施编制、技术交底、现场隐患督办、特种设备法规执行情况监督检查、模块修订优化。","班组长：负责当班检修任务分配、班组人员管理、现场安全条件确认、检修质量复检、停送电及停气申请办理及问题上报。","现场操作人员：严格按照标准作业，落实互保联保要求，执行安全确认，开展自检自查，规范填写记录，落实文明施工要求。"]}]},{"t":"第三章 地面压力容器检修模块化检修模块","s":[{"t":"一、模块概述","p":["模块编号：JD-B-03","模块名称：地面压力容器检修操作","所属专业：机电","适用范围：适用于参与矿井地面空气压缩机、储气罐、燃气锅炉等压力容器检修、维护、检验的所有人员。"]},{"t":"二、危险预知及防控","p":["1.压力容器爆炸/超压伤人：检修前必须将压力容器内介质（压缩空气、蒸汽、燃气）完全泄放至零压，确认无残余压力后方可作业；严禁带压拆卸螺栓、阀门及安全附件；安全阀、压力表必须在校验有效期内。","2.燃气泄漏中毒/爆炸：燃气锅炉检修前必须切断燃气总阀，关闭燃烧器前阀门，打开放散阀通风换气；使用便携式可燃气体检测仪检测浓度，合格后方可作业；检修中使用防爆工具，严禁明火及电气焊（确需动火必须办理动火作业票）。","3.高温烫伤：锅炉、空压机缸体、储气罐、蒸汽管道温度高，检修前必须自然降温至40℃以下（蒸汽系统需确认无压力且温度降至常温），佩戴隔热手套，严禁徒手触摸高温部位。","4.触电伤害：检修电气控制系统、燃烧器电控部分时，严格执行停送电制度，切断电源、验电、放电、挂牌、上锁，严禁带电检修。","5.机械伤害：检修空压机传动机构、锅炉给水泵、风机等转动部位时，必须停电、挂牌、上锁，防护罩拆除后恢复方可试车；严禁在转动状态下进行清扫、紧固作业。","6.高处坠落：锅炉顶部、储气罐顶部、管道支架高处作业时，距离坠落基准面2米及以上必须系好安全带，使用梯子或脚手架，专人扶梯监护。","7.受限空间窒息：进入储气罐、锅炉锅筒等受限空间作业，必须办理受限空间作业票，先通风、再检测（氧含量19.5%~23.5%，有毒有害气体浓度合格）、后作业，设专人监护，配备应急救援装备。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：检修区域通风良好，无易燃易爆气体积聚；照明充足；消防器材齐全有效；动火作业区域配备灭火器材及接火盆；锅炉房、空压机房应急通道畅通。","2.人员确认：检修人员精神状态良好，持证上岗；班前安全交底完成，熟悉检修方案及应急预案；受限空间作业人员身体健康，无妨碍作业疾病。","3.工器具确认：检修工具、防爆工具、验电器、兆欧表、可燃气体检测仪、氧含量检测仪、压力表、安全带等完好。","4.技术确认：检修方案贯彻到位；设备图纸、使用说明书、历次检验报告齐全；安全阀、压力表校验日期在有效期内。","5.设备确认：压力容器已停运，介质已完全泄放至零压，温度降至常温；电源已切断，开关分闸闭锁，悬挂\"有人工作，不准送电\"警示牌并上锁；燃气阀门已关闭并加盲板或断开管道（动火时）；安全附件已拆除或隔离。"]},{"t":"四、作业现场人员安全站位","p":["1.检修工/操作工：检修压力容器本体时，站在侧面或安全平台，避开法兰、人孔、手孔正对面，防止残余介质或部件喷出伤人；拆卸螺栓时，身体避开螺栓弹出方向。高处作业时，人员站稳扶牢，安全带高挂低用。","2.电工：检修电气及燃烧器控制部分时，站在电控柜侧面安全位置，与带电部位保持安全距离；验电、放电时站在设备侧后方，严禁正对带电方向。","3.班组长：站在作业现场上风侧、退路畅通的安全区域，全程统筹检修流程，监督工艺执行及安全措施落实情况，不得擅自离岗。"]},{"t":"五、标准化作业流程","p":["（一）前期准备工作","（1）班组长根据检修计划提出作业申请，明确检修设备名称、编号、检修项目（机械、电气、安全附件、内部检验配合）及计划时间，经主管副队长审批。（班组长/主管副队长）","（2）安全技术副队长编制压力容器检修安全技术措施，组织全体参与人员贯彻学习并签字确认；涉及受限空间、动火、高处作业时，办理相应专项作业票。","（3）检修工准备工器具及备件：安全阀、压力表、密封垫、螺栓、润滑油、燃烧器配件等，确认规格型号正确。（检修工/班组长确认）","（4）电工检查验电器、兆欧表等，确认外观完好。","（5）班组长、检修工共同完成现场安全确认：介质已泄压至零、温度降至常温、电源已停电闭锁挂牌、燃气阀门已关闭、通风良好、消防器材到位。（班组长/检修工）","（二）空气压缩机及储气罐检修作业步骤","1.停机泄压：","（1）停止空压机运行，切断电源，分闸闭锁，悬挂\"有人工作，不准送电\"警示牌并上锁。（电工/班组长确认）","（2）打开储气罐排污阀、排气阀，将罐内压缩空气完全泄放至零压；确认压力表指针归零。（操作工/检修工）","（3）待空压机缸体、储气罐温度降至常温（≤40℃）后，方可开始作业。（检修工/班组长确认）","2.空压机机械检修：","（1）检查空气滤清器：清洁或更换滤芯，确保进气畅通。（检修工）","（2）检查润滑油系统：更换润滑油及油滤，清洗油冷却器，检查油位、油压、油温是否正常。（检修工）","（3）检查联轴器：联轴器对中良好，弹性圈完好，连接螺栓紧固。（检修工/班组长确认）","（4）检修工检查气缸、活塞、气阀：有无磨损、裂纹、积碳；气阀片、弹簧完好，密封良好。","（5）检修工检查冷却系统：冷却器管束清洁，无堵塞、无渗漏；冷却水流量、温度正常。","3.储气罐及管路检修：","（1）检修工检查罐体外表面：有无锈蚀、裂纹、变形、凹陷；油漆完好，铭牌清晰。","（2）检修工打开人孔，进入罐内检查：内壁有无腐蚀、裂纹、积水、油污；排污管畅通。进入罐内前必须办理受限空间作业票，通风检测合格，专人监护。（班组长确认）","（3）检修工检查安全阀：拆下送检或现场校验，开启压力、回座压力符合规定，铅封完好。","（4）检修工检查压力表：拆下送检，量程、精度符合要求，表盘清晰，指针灵敏，校验标签完好。","（5）检修工检查排污阀、截止阀、止回阀：开关灵活，无内漏、外漏，阀芯无损坏。","（6）检修工检查管路及法兰：无锈蚀、裂纹、漏气；法兰连接螺栓紧固，密封垫完好。（班组长确认）","4.电气及控制系统检修：","（1）检修电工检查电动机：接线紧固，绝缘电阻合格（≥0.5MΩ），轴承润滑良好，风扇罩完好。","（2）检修电工检查电控柜：隔爆面完好（防爆型），接线腔内无杂物；接触器、继电器触点无烧蚀；保护装置整定正确。","（3）检修电工检查压力开关、温度传感器：安装牢固，接线可靠，动作值准确，信号传输正常。（班组长确认）","（三）燃气锅炉检修作业步骤","1.停炉隔离：","（1）按操作规程停炉，切断燃气总阀，关闭燃烧器前阀门，打开放散阀将管内残余燃气排净。（司炉工/班组长确认）","（2）切断锅炉电源，分闸闭锁，悬挂\"有人工作，不准送电\"警示牌并上锁。（电工）","（3）待锅炉压力降至零、温度降至常温（锅筒壁温≤40℃）后，方可打开人孔、手孔。（司炉工/检修工/班组长确认）","（4）使用可燃气体检测仪检测锅炉房及烟道内燃气浓度，确认合格后方可作业。（检修工确认）","2.锅筒及受热面检修：","（1）检修工打开人孔、手孔，通风换气，检测氧含量及有毒有害气体浓度，办理受限空间作业票，专人监护。（班组长确认）","（2）检修工检查锅筒内壁：有无腐蚀、结垢、裂纹；汽水分离装置完好，排污管畅通。","（3）检修工检查水冷壁管、对流管束：有无鼓包、变形、裂纹、渗漏；清除管外积灰、结焦。","（4）检修工检查烟管/火管：有无堵塞、腐蚀、裂纹；烟箱清洁，烟道畅通。（班组长确认）","（5）检修工检查炉膛及耐火材料：炉墙无裂缝、脱落，耐火砖完好，保温层完整。","3.燃烧系统检修：","（1）检修工检查燃烧器：喷头无堵塞、无烧损，点火电极间隙正确，火焰检测器灵敏；风门、燃气阀调节灵活。","（2）检修工检查燃气管道及阀门：法兰、阀门无泄漏；过滤器清洁；电磁阀、比例阀动作可靠。（班组长确认）","（3）检修工检查送风系统：风机叶轮无积灰、无裂纹，轴承润滑良好，风量、风压正常。","4.安全附件及仪表检修：","（1）检修工水位计清洗检查：汽水连通管畅通，水位清晰，无泄漏；高低水位报警及联锁装置试验正常。（班组长确认）","（2）检修电工检查温度传感器、超温报警装置检查：安装牢固，接线可靠，整定值正确，动作灵敏。","5.水处理及给水系统检修：","（1）检修工检查给水泵：轴承、密封、叶轮完好，运行平稳，无渗漏；电机绝缘合格。（检修电工）","（2）检修工检查水处理设备：树脂、盐箱、管路完好，出水水质合格。","（3）检修工检查给水管道、阀门：无锈蚀、无泄漏，止回阀、截止阀开关灵活。（班组长确认）","（四）试压、调试与验收","1.水压试验（锅炉、储气罐按检验要求）：","（1）检修完成后，检修工关闭人孔、手孔，连接试压泵，缓慢升压至试验压力（一般为工作压力的1.25倍或按检验规程）。（班组长确认）","（2）升压过程中逐级检查法兰、阀门、焊缝、人孔有无渗漏、变形；达到试验压力后保压20~30分钟，压力降符合要求。（班组长确认）","（3）水压试验时，人员避开法兰、人孔正面，防止喷水伤人；试压区域设警戒，非作业人员禁止靠近。（班组长监督）","（4）试验合格后缓慢降压至零，排净积水，恢复系统。（检修工）","2.气密性试验（燃气系统）：","（1）燃气管道及阀门检修后，检修工使用压缩空气或惰性气体进行气密性试验，试验压力按设计或规范要求。","（2）检修工使用发泡剂或可燃气体检测仪检查各连接点，无泄漏为合格。（班组长确认）","3.调试与试运行：","（1）检修负责人确认全部工作完毕、人员撤离、工具材料清点齐全，向班组长申请送电、送气调试。","（2）班组长现场验收，确认检修质量合格、安全附件已恢复、现场无遗留物。","（3）空压机调试：点动试车，确认转向正确；空载运行30分钟，检查电流、电压、排气压力、温度、振动是否正常；逐步加载至额定压力，检查安全阀启跳压力、压力开关动作值。（班组长确认）","（4）锅炉调试：按操作规程点火，检查燃烧器火焰状态、配风情况；升压过程中检查各部位无渗漏；检查安全阀、压力表、水位计、报警联锁装置动作灵敏可靠；72小时试运行，各项参数稳定。（班组长确认）","（5）调试正常后，检修工填写检修记录、试验数据、安全阀及压力表校验记录，班组长审核签字后归档。（班组长）。"]},{"t":"六、作业质量标准","p":["1.空气压缩机：联轴器对中良好；润滑油清洁，油位正常；气缸、气阀无磨损、无积碳；冷却系统畅通；排气压力、温度、电流正常，无异常振动及声响。","2.储气罐：罐体无锈蚀、裂纹、变形；内壁清洁，无积水、油污；安全阀、压力表校验合格，铅封完好；排污阀、截止阀开关灵活，无内漏外漏；接地可靠，防腐涂层完好。","3.燃气锅炉：锅筒、受热面清洁，无腐蚀、结垢、裂纹；炉墙、耐火材料完好；燃烧器喷头清洁，点火可靠，火焰稳定；安全阀、压力表、水位计、报警联锁装置齐全有效；燃气系统无泄漏；给水系统运行正常，水质合格。","4.管路及阀门：管道无锈蚀、裂纹、泄漏；法兰连接螺栓紧固，密封垫完好；阀门开关灵活，标志清晰；支吊架牢固。","5.电气及控制系统：电动机绝缘合格，接线紧固；电控柜清洁，元器件完好；保护装置整定正确，动作灵敏；压力、温度、水位传感器信号准确，显示正常。","6.安全附件：安全阀开启压力、回座压力符合规定；压力表量程、精度符合要求，校验标签在有效期内；水位计清晰、无泄漏；高低水位、超压、超温报警及联锁装置动作可靠。","7.检修现场：设备整洁，无油污、积灰；工具材料定置摆放；人孔、手孔密封良好；检修记录、试验数据完整准确。"]},{"t":"七、安全管控措施","p":["1.特种设备刚性管控：压力容器必须取得《特种设备使用登记证》，在定期检验合格有效期内使用，严禁超期未检或检验不合格设备投入运行。压力容器作业人员必须持证上岗，严禁无证操作。","2.带压禁修管控：严格执行\"带压不修\"原则，检修前必须将压力容器内介质完全泄放至零压，确认压力表归零、温度降至常温后方可作业。严禁带压拆卸螺栓、阀门及安全附件。","3.燃气系统隔离管控：燃气锅炉检修前必须切断燃气总阀，关闭燃烧器前阀门，打开放散阀通风；动火作业必须办理动火票，加盲板或断开管道隔离，检测可燃气体浓度合格后方可作业。","4.受限空间作业管控：进入储气罐、锅筒等受限空间必须办理受限空间作业票，严格执行\"先通风、再检测、后作业\"原则，氧含量保持在19.5%~23.5%，有毒有害气体浓度合格；设专人监护，配备安全绳、呼吸器及应急救援装备；作业时间符合规定，严禁单独作业。","5.安全附件管控：安全阀、压力表必须按期送有资质机构校验，铅封完好，严禁私自调整开启压力或铅封损坏后继续使用。水位计、报警联锁装置定期试验，确保灵敏可靠。","6.停送电刚性管控：严格执行停送电管理制度。检修电气及控制系统前必须切断电源，验电、放电、挂牌、上锁。严禁带电检修，严格执行\"谁停电、谁送电\"原则。","7.试压作业管控：水压试验、气密性试验必须缓慢升压，设专人指挥，人员避开法兰、人孔正面；试压区域设警戒，严禁非作业人员进入；试压过程中发现渗漏严禁带压紧固螺栓。","8.档案闭环管控：建立压力容器检修档案，记录检修内容、更换配件、试验数据、安全阀及压力表校验报告、发现问题及处理结果，由检修班组长整理归档，主管副队长审核后，统一交机电运输科保存，作为设备全生命周期管理依据。","JD-B-04 井下低压供电系统停送电模块化作业流程及管控措施"]}]},{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿井下低压供电系统停送电作业，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生设备误启动、电气失爆、人员触电等安全隐患，确保低压供电系统检修全过程安全，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿井下低压供电系统检修、试验、维护作业过程中停送电操作。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组　长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成　员：班组长、安检员、现场操作人员（检修电工、值班电工）"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责停送电作业整体统筹、人员调配及考核落实，对停送电现场安全负直接管理责任。","主管副队长：负责停送电计划编制、组织协调，组织班前安全交底。","安全技术副队长：负责现场隐患督办、停送电执行情况监督检查、模块修订优化。","班组长：负责当班停送电任务分配、班组人员管理、现场安全条件确认，向调度室报备停送电影响范围。","安检员：负责作业期间安全巡查监督，制止违章行为，闭环隐患，监督安全措施落实。","现场操作人员：严格按标准作业、落实互保联保、自检自查、规范填写记录、文明施工。"]}]},{"t":"第三章 井下低压供电系统停送电模块","s":[{"t":"一、模块概述","p":["模块编号：JD-B-04","模块名称：井下低压供电系统停送电","所属专业：机电","适用范围：适用于参与矿井井下低压供电系统检修、试验、维护过程中停送电操作所有人员"]},{"t":"二、危险预知及防控","p":["1.设备误启动、误送电伤人：检修低压供电系统必须严格执行停送电制度。低压停、送电操作必须采用可靠联系方式。将前一级开关电源切断，实行机械闭锁，挂\"有人工作，不准送电\"警示牌，并上锁。严禁约时停送电。","2.触电伤害：严禁带电检修、搬迁电气设备。检修或搬迁前，必须切断上级电源，检查瓦斯，在其巷道风流中甲烷浓度低于1.0%时，再用与电源电压相适应的验电笔检验，检验无电后，方可进行导体对地放电。开关把手在切断电源时必须闭锁，并悬挂\"有人工作，不准送电\"警示牌，并上锁。","3.工具使用不当伤人：正确使用扳手、验电器、兆欧表等工具，使用后应将其放入工具包或置于安全位置，防止工具坠落伤人。使用的验电器、接地线等必须经试验合格，不得有损坏、不完好等缺陷。","4.电气火灾：发生电气火灾时，必须切断就近电源，使用灭火器材灭火，并向调度汇报。"]},{"t":"三、作业条件安全确认","p":["1. 环境确认：瓦斯浓度≤1.0%，通风良好；作业区域无淋水、积水，顶板稳定。","2.人员确认：所有作业人员精神状态良好，且经培训交底合格，持证上岗。","3.工器具确认：电工工具完好，验电器经检查合格，满足作业要求。","4.技术确认：检修方案贯彻到位，各项工作具备施工条件。","5.设备确认：检修前必须认真核对待检修设备的编号，严格执行停送电制度。将前一级开关电源断电、闭锁，挂\"有人工作，不准送电\"警示牌，并上锁。"]},{"t":"四、作业现场人员安全站位","p":["1.值班人员/检修电工：验电、放电操作时，人员站在侧后方，与验电部位保持安全距离，严禁身体正对验电方向。在有轨道运输的巷道内作业时，必须在作业区域两端设置警戒标志，防止车辆误入。非工作人员禁止靠近。","2.班组长：站在作业现场退路畅通的安全区域，全程统筹作业流程，监督安全措施执行情况，不得擅自离岗。","3.安检员：站在能够全面观察作业现场的安全区域，与带电设备保持安全距离，全程监督作业人员安全操作行为，发现违章立即制止并纠正。"]},{"t":"五、标准化作业流程","p":["（一）停电操作流程","1. 前期准备工作：","（1）班组长根据安装、检修计划提出停电申请，明确检修设备编号、检修内容及计划时间，报主管副队长。","（2）电工根据停电申请，核对停电设备名称、编号，确认系统运行方式及设备实际状态。","（3）电工检查验电笔、接地线等安全工器具，确认外观完好、试验合格且在有效期内。","2. 停电操作步骤：","（1）电工进入操作现场，核对设备双重名称，确认待操作设备与停电申请一致。","（2）断开断路器：分闸断路器，检查断路器确在断开位置。","（3）验电：使用与电源电压等级相适应的验电笔，在设备进线侧、出线侧逐相分别验电。","（4）放电：逐相导体对地放电。","（5）装设接地线：验明确无电压后，装设接地线。先接接地端，后接导体端，且必须接触良好、连接可靠。","（6）悬挂警示牌：开关把手在切断电源时必须闭锁，悬挂\"有人工作，不准送电\"警示牌，并上锁。","（7）汇报确认：电工全面复查停电操作无误后，向班组长汇报，班组长现场确认。","（二）检修作业步骤","（1）检修负责人确认停电、验电、接地可靠后，组织开始检修。（检修负责人/班组长）","（2）检修电工对低压开关进行检修：检查真空断路器真空管、隔爆面、接线腔、保护装置等。（检修电工）","（3）检修电工对电缆进行绝缘测试及外观检查。（检修电工/班组长确认）","（4）检修电工对接地系统进行检查维护。（检修电工）","（5）检修完成后，检修负责人逐项检查确认，清点工具材料。（检修负责人）","（三）送电操作流程","（1）检修负责人确认全部工作完毕、人员撤离、工具材料清点齐全、接地线全部拆除。","（2）电工核对送电设备名称、编号，确认设备状态与送电申请一致。（值班电工）","（3）摘除停电期间悬挂的\"有人工作，不准送电\"警示牌，解除闭锁。（值班电工）","（4）电工合闸开关，指示灯显示正常，电压指示正常。（值班电工）","（5）汇报确认：电工全面复查送电操作，监视设备运行状态，观察电压、电流等参数是否正常，确认无异常，向调度室汇报后，方可离开。"]},{"t":"六、作业质量标准","p":["1.低压开关：真空断路器真空管无裂纹、点蚀，清洁无污秽，紧固件齐全紧固、无损坏。具有安全可靠的机械闭锁。开关防爆面无锈蚀、砂眼、划伤等现象，防爆面清洁无污。接线腔内无任何杂物。检查各接线头（柱）、插头，接头要牢固可靠，无放电、无裂纹、无损伤现象。","2.保护装置：保护装置动作灵敏，显示屏正常，具备故障记忆闭锁功能。开关的短路、过负荷、漏电等保护装置应保持完好，整定值正确，动作可靠。","3.电缆：电缆无损伤、无过热现象，绝缘性能符合要求。电缆悬挂规范，吊挂间距不大于3m，所有电缆必须上电缆钩。电缆接线盒制作符合工艺要求，吊挂牢固可靠。按规定要求粘贴电缆标志牌。","4.接地系统：各配电点设置可靠的局部接地极。接地电阻值符合《煤矿安全规程》规定。接地装置连接可靠，无锈蚀、断裂现象。","5.检修现场：检修后，现场设备整洁，无油污、煤尘堆积。电缆悬挂整齐、规范。"]},{"t":"七、安全管控措施","p":["1.停送电刚性管控：严格执行停送电管理制度。将前一级开关电源断电、闭锁，挂\"有人工作，不准送电\"警示牌，并上锁。严格执行\"谁停电、谁送电\"原则。","2.安全工器具管控：所有安全工器具必须经试验合格，在有效期内使用，使用前检查外观无破损、裂纹等缺陷，不合格的严禁投入使用。","3.检修区域隔离管控：检修期间，检修区域非作业人员禁止靠近。","4.工具材料清点管控：检修完成后，必须清点工具、材料、接地线数量，严禁遗漏在设备内部。恢复送电前，由工作负责人全面检查一遍，确认所有人员撤离，方可申请送电。","5.档案闭环管控：建立检修档案，每次检修后记录检修内容、发现问题及处理结果，由检修班组长整理归档，主管副队长审核后，统一交机电运输科保存，作为设备全生命周期管理依据。"]}]}],"w":8594,"cn":6,"sn":24},{"c":"JD-B-05","n":"带式输送机机械部分安装","t":"JD-B-05 带式输送机机械部分安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿带式输送机设备安装作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生设备吊装伤人、机械伤害等安全隐患，提升安装效率与工程质量，确保带式输送机安全可靠运行，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿所有带式输送机设备机械部分安装作业、现场管理全过程，包括地面煤楼、井下主运输大巷、采区运输巷等各类地点的固定式、可伸缩式带式输送机机械部分安装。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、安检员、现场操作人员"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责安装管理的组织实施、人员调配及考核落实，检修工作总体安排。","主管副队长：负责安装计划编制、现场作业组织协调、安装质量管控、进度把控。","安全技术副队长：负责安装标准制定、安全技术措施编制、技术交底、现场隐患督办、模块修订优化。","班组长：当班自检复检、问题上报、班组人员管理、现场安全管控。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","现场操作人员：严格按标准作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 带式输送机机械部分安装模块","s":[{"t":"一、模块概述","p":["模块编号：JD-B-05","模块名称：带式输送机机械部分安装","所属专业：机电","适用范围：适用于参与带式输送机机械部分安装所有人员"]},{"t":"二、危险预知及防控","p":["1.巷道顶板、支护不完好，片帮掉矸伤人：作业前安全确认，敲帮问顶，清理活矸危岩，作业地点支护必须完好、牢固，无浮煤、杂物，否则必须经处理安全后，方准进行工作。","2.登高作业坠落伤人：距离坠落基准面2米及以上登高作业必须系好安全带。登高作业时，必须使用梯子或脚手架，并安排专人扶梯监护，严禁在无防护措施的情况下登高作业。","3.物体打击伤害：搬运、组装设备部件时，操作人员应站在安全位置，防止设备部件、工具坠落伤人。多人共同搬运较大设备部件时，专人指挥，动作协调，同起同落。","4.起吊作业伤害：吊运减速机、滚筒等重物时，必须使用经检查确认合格的起重设备及吊具，由专人指挥，严禁在起吊物下方站立或作业。","5.工具使用不当伤人：正确使用扳手、大锤等工具，使用后应将其放入工具包或置于安全位置，防止工具高空坠落。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：瓦斯浓度≤1.0%，通风良好；作业区域顶板稳定、无淋水，作业平台稳固，照明充足。","2.设备确认：H架、纵梁、滚筒、托辊、电机、减速器、联轴器、输送带、张紧绞车、地脚螺栓等规格符合设计，无变形、裂纹、破损。","3.人员确认：所有作业人员均已现场在岗，且经培训交底合格。","4.技术确认：安装技术交底工作已完成，各项工作具备施工条件。","5.工器具确认：起重设备、扳手、水平仪等工器具完好，满足安装要求。"]},{"t":"四、作业现场人员安全站位","p":["1.班组长：站在作业现场退路畅通的安全区域，全程统筹作业流程，监督安全措施执行情况，不得进入起吊危险区域。","2.安检员：站在能够全面观察作业现场的安全区域，与起吊物保持安全距离，全程监督作业人员安全操作行为、起吊及登高安全措施落实情况，发现违章立即制止并纠正。","3.机修工：安装机架、滚筒、驱动部件时，严禁站在正下方、受力方向及倾倒范围内。","4.其他参与作业人员：严禁站在设备正下方、受力方向及倾倒范围内。拖拽、展放输送带时，错开站位。"]},{"t":"五、标准化作业流程","p":["（一）前期准备工作","（1）主管副队长、班组长根据生产工作安排，确定安装计划，明确安装地点、设备型号及计划时间。","（2）安全技术副队长编制安装安全技术措施，组织全体参与人员贯彻学习并签字确认。","（3）班组长、安检员、现场操作人员共同完成现场安全确认，确认顶板支护完好、起吊点可靠。","（二）安装作业步骤","（1）检查起吊点及工具：参与作业施工区队班组长或安检员检查起吊点承载力，手拉葫芦、钢丝绳、吊环等工具完好可靠。","（2）安装机头架及驱动装置：强力带式输送机应采用混凝土基础，其他普通带式输送机采用打地锚拉紧的方式固定。机头驱动装置固定必须牢固、可靠，不晃动、不窜动。驱动装置原则上布置在巷道行人侧，便于安装检修。","（3）安装张紧装置及机尾架：张紧装置轨道平直，小车滑道无卡阻，运行灵活。重锤张紧时，配重块应排列整齐，无晃动、无脱落风险。张紧行程满足设计调整量要求。","（4）安装中间机身（H架、纵梁、托辊）：H架间距符合设计要求（一般3米一组），纵梁连接平直，托辊架与纵梁垂直。H架支腿应垂直于底板，底板松软处应垫实。","（5）展放、铺设输送带：输送带接头采用硫化或机械连接，接头强度不低于带体强度的85%，接头平直，无台阶、无裂口。","（6）安装上、下托辊组：上、下托辊齐全完好，转动灵活，无卡涩、无异响。槽形托辊槽角符合设计要求。托辊与输送带接触良好。","（7）调整输送带跑偏及张紧力：输送带张紧适度，空载运行时胶带不超出托辊边缘。","（8）清扫器与防护设施安装：安装机头、机尾清扫器，确认清扫器与输送带接触良好，刮料有效。在机头、机尾、驱动滚筒和改向滚筒处设置防护栏。"]},{"t":"六、作业质量标准","p":["1.机头架、驱动装置：强力带式输送机应采用混凝土基础，其他普通带式输送机采用打地锚拉紧的方式固定。机头驱动装置固定必须牢固、可靠，不晃动、不窜动。驱动装置原则上布置在巷道行人侧，便于安装检修。","2.张紧装置：张紧装置轨道平直，小车或重锤滑道无卡阻，运行灵活。重锤张紧时，配重块应排列整齐，无晃动、无脱落风险。张紧行程满足设计调整量要求。","3.中间机身：H架间距符合设计要求（一般3米一组），纵梁连接平直，托辊架与纵梁垂直。H架支腿应垂直于底板，底板松软处应垫实。","4.托辊组：上、下托辊齐全完好，转动灵活，无卡涩、无异响。槽形托辊槽角符合设计要求。托辊与输送带接触良好。","5.防跑偏装置：防跑偏保护装置在输送带发生跑偏时，应能使输送带自动纠偏，自动纠偏装置安装在带式输送机上的间隔应为上胶带50m一组、下胶带100m一组。","6.输送带：输送带接头采用硫化或机械连接，接头强度不低于带体强度的85%，接头平直，无台阶、无裂口。输送带铺设后无扭劲、无折叠，上、下覆盖胶无破损。输送带张紧适度，空载运行时胶带不超出托辊边缘。","7.机尾架：机尾架与搭接处机身中心线一致，机尾滚筒水平。机尾清扫器与输送带接触均匀，清扫有效。","8.安全防护装置：机头、机尾及所有转动部位防护罩、防护栏齐全牢固，警示标志齐全，符合《煤矿安全规程》要求。","9.安装现场：安装现场无积煤、浮煤及杂物堆积。设备整洁，无油污。剩余材料、工具摆放整齐，及时回收归位。"]},{"t":"七、安全管控措施","p":["1.起吊作业管控：起吊前必须由施工区队班组长或安检员检查起吊点承载力，手拉葫芦、钢丝绳、吊环等工具完好可靠。起吊物重量不得超过起吊工具额定载荷。起吊过程中设专人监护，发现异常立即停止。","2.登高作业管控：距离坠落基准面2米及以上登高作业必须系好安全带。登高作业时，必须使用梯子或脚手架，并安排专人扶梯监护。严禁在无防护措施情况下攀爬设备。","3.作业区域隔离管控：起吊、高处安装作业时，下方及可能坠落范围设置警戒区域，非作业人员严禁入内。机头、机尾安装区域与辅助运输系统隔离，防止车辆误入。","4.顶板帮部管控：安装期间班班检查顶板及两帮支护情况，发现离层、片帮、支护失效等隐患，立即停止作业，撤人至安全地点，汇报处理后方可恢复施工。","5.试运转管控：机械部分安装完成后，必须全面检查各部位连接螺栓紧固情况、防护装置完好情况、巷道内有无遗留工器具。确认无误后，方可进行空载试运转。试运转时，所有人员撤离至转动部位、输送带外侧安全位置，由专人操作、专人监护。","6.验收闭环管控：安装完成后，清点作业用的工具、用具，及时清理现场物料、工具，保持设备整洁。由班组长组织自检，安检员确认安全设施齐全有效，经机电运输科组织相关部门验收，验收通过后，方可正式运行。"]}]}],"w":3160,"cn":3,"sn":12},{"c":"JD-B-06","n":"带式输送机更换胶带","t":"JD-B-06 带式输送机更换胶带模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿带式输送机更换胶带作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生设备误启动伤人、机械伤害、触电、高处坠落、物体打击等安全隐患，提升更换效率与工程质量，确保胶带更换过程安全，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿所有在用带式输送机整卷胶带更换、局部胶带更换及接头重新制作等作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、安检员、现场操作人员"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责更换胶带管理的组织实施、人员调配及考核落实，检修工作总体安排。","主管副队长：负责更换胶带计划编制、现场作业组织协调、安装质量管控、进度把控。","安全技术副队长：负责更换胶带标准制定、安全技术措施编制、技术交底、现场隐患督办、模块修订优化。","班组长：当班自检复检、问题上报、班组人员管理、现场安全管控。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","现场操作人员：严格按标准作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 带式输送机更换胶带模块","s":[{"t":"一、模块概述","p":["模块编号：JD-B-06","模块名称：带式输送机更换胶带","所属专业：机电","适用范围：适用于参与带式输送机更换胶带所有人员"]},{"t":"二、危险预知及防控","p":["1.设备误启动伤人：更换胶带前必须切断电机电源，严格执行停送电制度，将带式输送机控制开关分闸，闭锁，挂警示牌，并上锁。严禁在设备运行中进行松张紧、抽穿胶带等作业。","2.机械伤害：抽穿胶带、盘卷旧带、展放新带时，严禁用手直接探入滚筒与胶带之间或托辊夹缝。","3.起吊作业伤害：吊运胶带等重物时，必须使用经检查确认合格的起重设备及吊具，由专人指挥，严禁在起吊物下方站立或作业。","4.高处坠落伤害：在机头、机尾及中间架高处进行断带、接带、穿带作业时，距离坠落基准面2米及以上必须系好安全带。登高作业时，必须使用梯子或脚手架，并安排专人扶梯监护。","5.物体打击伤害：抽穿胶带过程中，胶带可能突然弹起或回缩，作业人员应站在侧面，严禁站在胶带正前方或回弹方向。工具、配件采取防坠落措施。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业区域通风良好，瓦斯浓度≤1.0%（地面不涉及）；机道内无淋水、积水；顶板稳定，照明充足；作业区域两端设置警戒。","2.人员确认：作业人员精神状态良好；班前会安全交底完成，分工明确。","3.工器具确认：起吊设备、钢丝绳、吊带、卸扣、钉扣机等完好。","4.技术确认：更换方案贯彻到位；新胶带规格、长度、型号、强度等级与设计一致。","5.设备确认：控制开关电源已分闸，闭锁，悬挂\"有人工作，不准送电\"警示牌，并上锁。"]},{"t":"四、作业现场人员安全站位","p":["1.机修工：站在驱动滚筒、改向滚筒侧方安全位置，处理胶带接头时与转动部位保持安全距离，严禁站在滚筒正前方或胶带突然弹出的方向。","2.班组长：站在作业现场退路畅通的安全区域，全程统筹各环节进度及安全，不得擅自离岗。","3.安检员：站在能够全面观察胶带更换作业及起吊作业的安全区域，监督人员安全站位、停送电措施落实，发现违章立即制止。"]},{"t":"五、标准化作业流程","p":["（一）前期准备与旧带回收","（1）班组长根据更换计划提出停机申请，明确更换范围、更换地点及计划时间，汇报调度室。","（2）检修工切断控制开关电源，闭锁，悬挂\"有人工作，不准送电\"警示牌，并上锁。","（3）在机头、机尾及中间适当位置设置警戒标志，非作业人员禁止入内。","（4）松开张紧装置，释放胶带张力，将旧胶带逐段退出。","（5）在合适位置选定旧带断开点，使用刀具或断带工具断开旧胶带，使用绞车或人工逐段回收旧胶带，盘放整齐，做好标识。","（二）新带展放与接头制作","（1）将新胶带卷放置在机架合适位置，固定牢靠，确认展放方向正确。","（2）将新胶带头部与旧胶带牵引头可靠连接，连接强度满足牵引要求。","（3）使用绞车或人工拖动牵引，缓慢牵引新胶带沿机道展放，速度均匀，防止刮卡。","（4）沿线人员站在机身两侧，监护胶带展放过程，及时清理障碍物，防止胶带跑偏、扭转、刮擦机架。","（5）新胶带展放到位后，预留足够长度用于制作接头。（班组长确认）","（6）确定接头位置，做好划线标记后，使用钉扣机固定胶带接头卡子，穿入穿条，确保两个接头平滑对接。","（三）调试与试运转","（1）调整张紧装置，使胶带张力适当，不打滑、不跑偏；检查胶带中心线与机架中心线偏差。","（2）全面清理机道内工具、材料、边角料，清点数量，确认无遗留物。","（3）班组长验收接头质量、胶带跑偏调整情况及现场清理情况，确认具备送电条件。","（4）检修工摘除停电警示牌，解除闭锁，申请送电。","（5）点动试车，检查胶带运行是否跑偏，接头通过滚筒时是否异常跳动或异响。","（6）空载运行，观察胶带跑偏、各滚筒及托辊运转状态，观察运行中电流、电压。","（7）逐步加载试运行，确认胶带不打滑、接头无异常、保护装置正常后，方可投入正式运行。","（8）更换整卷新胶带后，及时向机电运输科报备更换情况。"]},{"t":"六、作业质量标准","p":["1.胶带：新胶带规格型号、强度等级符合设计要求，具有煤矿矿用产品安全标志。带体无划伤、无撕裂、无气泡、无分层，覆盖胶完好。展放后无扭劲、无折叠、无跑偏趋势。","2.胶带接头：机械接头连接牢固，卡扣或穿条无松动、无缺失，接头厚度与带体基本一致，通过滚筒时无明显冲击。","3.张紧装置：胶带张紧适度，空载运行时胶带不超出托辊边缘，不打滑。张紧行程在设计调整量范围内，张紧小车或重锤滑道无卡阻，配重块排列整齐，钢丝绳无断丝、无扭结。","4.作业现场：作业现场无积煤、浮煤及杂物堆积。旧带、废料及时回收。设备整洁，无油污。工具、剩余材料摆放整齐，及时归位。"]},{"t":"七、安全管控措施","p":["1.停送电管控：严格执行停送电制度。更换胶带前必须分闸带式输送机开关，闭锁，挂“有人工作 不准送电”警示牌，并上锁。送电前必须清点人数，确认人员全部撤离作业点。","2.转动部位管控：更换胶带期间，严禁在设备未可靠停电、闭锁、挂牌、上锁的情况下，进行松张紧、盘卷、抽穿胶带等作业。","3.起吊作业管控：吊运胶带等重物时，必须由施工区队班组长或安检员检查起吊点承载力及吊具完好情况。起吊物重量不得超过起吊工具额定载荷。","4.作业区域隔离管控：更换胶带期间，机头、机尾及抽穿胶带区域设警戒，非作业人员严禁入内。","5.验收闭环管控：更换完成后，清点作业用的工具、用具，及时清理现场物料、工具，保持设备整洁。由班组长检查验收，试运行正常，实现闭环管理。"]}]}],"w":2605,"cn":3,"sn":12}],"os":"二","rn":"中风险","rc":"橙","rg":"B","n":5,"label":"中风险 · 橙色 B段"},{"t":"三、低风险-蓝色-C段（9项）","lv":"C","m":[{"c":"JD-C-01","n":"井下电缆整理、吊挂、回收","t":"JD-C-01 井下电缆整理、吊挂、回收模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿井下电缆整理、吊挂、回收作业，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生电气失爆、人员触电、电缆脱落、登高坠落等安全隐患，确保电缆吊挂作业全过程安全，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿井下电缆整理、吊挂、回收作业及现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组　长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成　员：班组长、安检员、现场操作人员（电缆整理工、登高作业人员）"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责电缆整理、吊挂、回收作业整体统筹、人员调配及考核落实，对作业现场安全负直接管理责任。","主管副队长：负责作业计划编制、现场作业组织协调、质量管控、进度把控，审批作业申请，组织班前安全交底。","安全技术副队长：负责电缆吊挂标准制定、安全技术措施编制、技术交底、现场隐患督办、模块修订优化。","班组长：负责当班作业任务分配、班组人员管理、现场安全条件确认、作业质量复检及问题上报。","安检员：负责作业期间安全巡查监督，制止违章行为，闭环隐患，监督登高及停送电安全措施落实。","现场操作人员：严格按标准作业、落实互保联保、自检自查、规范填写记录、文明施工。"]}]},{"t":"第三章 井下电缆整理、吊挂、回收模块","s":[{"t":"一、模块概述","p":["模块编号：JD-C-01","模块名称：井下电缆整理、吊挂、回收","所属专业：机电","适用范围：适用于参与井下电缆整理、吊挂、回收的所有人员"]},{"t":"二、危险预知及防控","p":["1.巷道顶板、支护不完好，片帮掉矸伤人：作业前安全确认，敲帮问顶，清理活矸危岩，作业地点支护必须完好、牢固，无浮煤、杂物，否则必须经支护工处理安全后，方准进行工作。","2.登高作业坠落伤人：距离坠落基准面2米及以上登高作业必须系好安全带。登高作业时，必须使用专用梯子或脚手架，并安排专人扶梯监护，严禁在无防护措施的情况下登高作业。","3.触电伤害：电缆吊挂前必须确认电缆已停电，上级控制开关分闸闭锁，悬挂\"有人工作，不准送电\"警示牌，并上锁。严禁带电吊挂、移动电缆。","4.电缆坠落砸伤人员：吊挂电缆的电缆钩、钢绞线、夹子、卡箍等必须固定牢固可靠。电缆敷设应有适当的弛度，能在意外受力时自由坠落，其悬挂高度应保证电缆在矿车掉道时不受撞击。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：瓦斯浓度≤1.0%，通风良好；作业区域无淋水、积水，顶板稳定，照明充足。","2.电缆确认：电缆吊挂施工前，必须确认所涉及电缆已切断上级控制开关电源、闭锁，挂\"有人工作，不准送电\"警示牌，并上锁。","3.人员确认：所有作业人员均已现场在岗，且经培训交底合格，登高作业人员身体健康。","4.技术确认：作业方案交底已完成，各项工作具备施工条件。","5.设备确认：电缆钩固定牢固，梯子等工器具完好，数量满足作业需求。"]},{"t":"四、作业现场人员安全站位","p":["1.参与所有作业人员：站在顶板完好、无坠物风险的安全区域作业。吊挂、整理电缆时，人员站在电缆侧面操作，严禁站在电缆正下方或受力方向上，防止电缆坠落伤人。在有轨道运输的巷道内作业时，必须在作业区域两端设置警戒标志，防止车辆伤害。","2.登高作业人员：登高作业时，人员站稳扶牢，梯子下方设专人扶梯监护。","3.班组长：站在作业现场退路畅通的安全区域，全程统筹作业流程，监督安全措施执行情况，不得擅自离岗。","4.安检员：站在能够全面观察作业现场的安全区域，全程监督作业人员安全操作行为，发现违章立即制止并纠正，不得擅自离岗。"]},{"t":"五、标准化作业流程","p":["1.前期准备工作：","（1）班组长根据作业任务提出电缆整理、吊挂或回收申请，明确作业地点、电缆编号及计划时间，经主管副队长审批，主管副队长汇报调度室后，由调度室安排作业配合人员。","（2）截面积大于120mm²及长度超过300米的橡套或铠装电缆，需由安全技术副队长编制安全技术措施，组织全体参与人员贯彻学习并签字确认。（安全技术副队长/全体参与人员）","（3）班组长、安检员、现场操作人员共同完成现场安全确认，确认顶板支护完好、电缆已停电。（班组长/安检员/现场操作人员）","2.电缆整理、吊挂、回收操作步骤：","（1）确认电缆上级控制开关已分闸、闭锁、挂牌、上锁。（班组长确认）","（2）敷设安装电缆钩：按设计高度及间距敷设安装专用电缆钩，固定牢固可靠。","（3）整理电缆：将电缆理顺，消除交叉、盘圈、落地现象，按电压等级、用途分层吊挂。","（4）吊挂电缆：使用专用电缆钩将电缆固定在巷道上，吊挂间距不大于3m，高度符合规定，弛度适当。（班组长确认）","（5）对需回收电缆进行断电，从开关接线柱拆除，逐段回收，盘放整齐，做好标识。（电工/班组长确认）","（6）粘贴标志牌：在电缆拐弯处、分支点、接线盒两端、穿墙处及每隔200m设置标志牌，注明编号、用途、电压、截面。（电工）","（7）现场清理、工具清点、质量验收：作业完成后清理现场，清点工具，班组长组织验收。（班组长/安检员）"]},{"t":"六、作业质量标准","p":["1.电缆标准：电缆无损伤、无过热现象，绝缘性能符合要求。电缆主线芯截面必须满足供电线路负荷要求，且电缆应当带有供保护接地用的足够截面的导体。","2.吊挂标准：电缆应使用专用电缆钩吊挂。电缆吊挂后应有适当的弛度，并能在意外受力时自由坠落，其悬挂高度应保证电缆在矿车掉道时不受撞击，在电缆坠落时不落在轨道或输送机上。","3.电缆间距标准：高压电缆之间、低压电缆之间间距不小于50mm；高、低压电缆间距应大于100mm；通讯、信号电缆与动力电缆间距大于0.1m。电缆与压风管、供水管在巷道同一侧敷设时，必须敷设在管子上方，并保持0.3m以上的距离。在有瓦斯抽采管路的巷道内，电缆（包括通信电缆）必须与瓦斯抽采管路分挂在巷道两侧。","4.标志牌标准：井下巷道内的电缆，沿线每隔200米、拐弯处、分支点、连接不同直径电缆的接线盒两端以及穿墙电缆的墙的两侧，都应当设置标志牌。","5.文明生产标准：电缆吊挂整齐、美观，无交叉、盘圈、落地现象。电缆表面清洁，无积尘、油污。"]},{"t":"七、安全管控措施","p":["1.停送电管控：整理、吊挂、回收电缆前，必须确认电缆已停电，上级控制开关悬挂\"有人工作，不准送电\"警示牌，并上锁。严禁带电整理、吊挂、回收、移动电缆。","2.登高作业管控：距离坠落基准面2米及以上登高作业必须系好安全带。登高作业时，必须使用专用梯子或脚手架，并安排专人扶梯监护。","3.作业区域隔离管控：在有轨道运输的巷道内作业时，必须在作业区域两端设置警戒标志，防止车辆伤害。","4.验收闭环管控：电缆吊挂完成后，必须进行全面检查，确认符合标准后方可投入使用。","JD-C-02 井下多级泵检修模块化作业流程及管控措施"]}]},{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿井下多级泵检修作业，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生设备误启动、机械伤害、高压液体喷溅、触电、起吊伤害等安全隐患，提升检修效率与工程质量，确保多级泵检修全过程安全，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿井下主排水泵房、采区排水阵地等多级泵检修、维护及现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组　长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成　员：班组长、安检员、现场操作人员（泵修工、司泵工）"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责检修作业整体统筹、人员调配及考核落实，对检修现场安全负直接管理责任。","主管副队长：负责检修计划编制、现场作业组织协调、检修质量管控、进度把控，组织班前安全交底。","安全技术副队长：负责检修标准制定、技术交底、现场隐患督办、模块修订优化。","班组长：负责当班检修任务分配、班组人员管理、现场安全条件确认、检修质量复检、工作票办理及问题上报。","安检员：负责作业期间安全巡查监督，制止违章行为，闭环隐患，监督停送电、起吊、泄压等安全措施落实。","泵修工：负责多级泵机械部分拆卸、检修、回装、调试，包括密封、联轴器等部件的检查与更换，对机械检修质量负直接责任。","司泵工：负责停泵操作、运行状态确认、试运转配合及运行参数监视。"]}]},{"t":"第三章 井下多级泵检修模块","s":[{"t":"一、模块概述","p":["模块编号：JD-C-02","模块名称：井下多级泵检修","所属专业：机电","适用范围：适用于煤矿井下主排水泵房、采区排水阵地等多级泵检修、维护及现场管理全过程的所有人员"]},{"t":"二、危险预知及防控","p":["1.设备误启动、误送电伤人：检修多级泵前必须切断电机电源，严格执行停送电制度。将前一级开关电源分闸，闭锁，挂\"有人工作，不准送电\"警示牌，并上锁。水泵运行时，严禁进入或拆下防护罩。","2.机械伤害：多级泵拆除、装配过程中，拆装轴承、联轴器等转动部件时，必须使用专用工具，严禁用手直接探入设备内部。盘车时必须确认设备已可靠停电。","3.高压液体喷溅伤害：拆卸管路及阀门时，必须先确认进出口阀门已关闭、管路内无余压，压力表指示归零，并打开排气阀卸压确认，方可进行拆卸。严禁带压拆卸管路及阀门。","4.起吊作业伤害：吊运泵体及电动机等大型部件时，必须使用经检查确认合格的起重设备及吊具，由专人指挥，严禁在起吊物下方站立或作业。起吊前进行试吊，确认无误后方可正式起吊。","5.工具使用不当伤人：正确使用扳手、撬棍、锤子等工具，使用后应将其放入工具包或置于安全位置，防止工具坠落伤人。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：瓦斯浓度≤1.0%，通风良好；作业区域无淋水、积水，顶板稳定，照明充足。","2.人员确认：所有作业人员精神状态良好，且经培训交底合格，持证上岗。","3.工器具确认：泵修工具、起重工器具（手拉葫芦、钢丝绳、卸扣等）完好。","4.技术确认：检修方案贯彻到位，各项工作具备施工条件。","5.设备确认：检修前必须认真核对待检修多级泵编号，严格执行停送电制度。停泵后必须关闭进出口阀门，确认管路内介质已排空，泵体及管路内无余压；起吊设备额定载荷满足要求。"]},{"t":"四、作业现场人员安全站位","p":["1.班组长：站在作业现场退路畅通的安全区域，全程统筹作业流程，监督安全措施落实情况，不得擅自离岗、进入起吊危险区。","2.安检员：站在能够全面观察作业现场的安全区域，与带电设备及起吊物保持安全距离，全程监督作业人员安全操作行为、安全措施落实情况，发现违章立即制止并纠正，不得擅自离岗。","3.泵修工：拆卸、装配多级泵时，严禁站在泵体正下方、联轴器甩出方向及起吊物下方。"]},{"t":"五、标准化作业流程","p":["（一）停电操作流程","1.前期准备工作：","（1）班组长根据检修计划提出检修申请，明确检修水泵编号、检修内容及计划时间，报主管副队长。（班组长/主管副队长）","（2）泵修工、班组长共同完成现场安全确认及工器具检查。","（3）泵修工检修用的各种配件、工具等准备到位。司泵工掌握对应多级泵的管路阀门、开关位置等信息，做好停泵操作准备。","2.停电操作步骤：","（1）司泵工按操作规程停止水泵运行，关闭出水阀门。（班组长确认）","（2）司泵工在已停电的开关操作把手上悬挂\"有人工作，不准送电\"警示牌，并上锁。","（3）泵修工检查确认无误后，汇报班组长。（班组长确认）","（二）停泵泄压与能量隔离","（1）泵修工关闭检修水泵进水阀门、出水阀门，打开泵体排气阀，释放内部残余压力。","（2）泵修工观察压力表指示，确认压力归零、管路内无余压、介质已排空。","（三）机械拆卸作业步骤","（1）泵修工拆除水泵联轴器护罩，拆卸联轴器连接螺栓，分离电机与水泵联轴器，做好配对标记。","（2）泵修工拆卸水泵进出水管路法兰螺栓，拆除与泵体连接的管路；拆卸时缓慢松动螺栓，确认无余压喷出。","（3）泵修工拆卸泵体地脚螺栓、泵体连接螺栓。","（4）检修人员检查手拉葫芦、钢丝绳、卸扣等吊具完好，挂设吊具，试吊确认平衡后，缓慢吊运泵体至检修区域。（班组长确认）","（四）机械检修作业步骤","（1）泵修工检查轴承：滚动体无点蚀、无剥落，保持架完好，游隙符合要求；滑动轴承无裂纹、无严重磨损；轴承润滑脂清洁无变质。","（2）泵修工检查机械密封或填料密封：密封面无严重磨损、无裂纹，弹簧无失效；填料压盖松紧适度。","（3）泵修工清洗各零部件，更换损坏件。","（五）机械回装作业步骤","（1）泵修工按标记回装密封环、轴套、轴承等部件，配合间隙符合技术要求。（班组长确认）","（2）泵修工调整轴承间隙及紧力，按规定注入合格润滑脂，油量适中。（班组长确认）","（3）检修人员吊运泵体回装就位，泵修工连接进出水管路，紧固法兰螺栓，对称均匀拧紧。（班组长确认）","（4）泵修工连接联轴器，校正电机与水泵同轴度，径向跳动和端面跳动符合标准。（班组长确认）","（5）泵修工紧固泵体地脚螺栓，螺纹外露2～3扣。","（6）泵修工回装联轴器护罩、防护装置，确认无遗漏。（班组长确认）","（六）送电试运转流程","（1）泵修工确认全部机械检修完毕、人员撤离、工具材料清点齐全，向班组长申请试运行。","（2）班组长现场验收，确认设备状态正常，现场无遗留物。打开检修前关闭的控制闸阀。","（3）司泵工启动试车，确认电机转向正确、无异响。","（4）司泵工启动水泵，观察压力、流量、电流、振动、温升等参数，泵修工检查轴承温升、振动值、密封泄漏量、管路连接处无渗漏，运行15分钟无异常后，检修结束，汇报班组长。"]},{"t":"六、作业质量标准","p":["1.多级泵本体：泵壳体无裂纹、无砂眼，壳体结合面平整。拉紧螺栓完好、螺纹无损伤，紧固均匀到位，无松动；螺栓、螺母无缺失锈蚀。泵体底座完好，基础无开裂，地脚螺栓齐全紧固，垫铁布置合理，无松动窜动。泵体转向标识清晰完整。盘车转动灵活、无卡涩、无摩擦异响。手动盘联轴器转动轻快均匀。","2.密封：密封环无严重磨损，间隙符合要求。","3.轴承：滚动轴承径向游隙符合规定，轴承运行平稳，无异响，温升不超过40℃，最高温度不超过75℃。","4.联轴器：对轮间隙不小于2mm，不超过6mm；弹性圈完好无老化，柱销无弯曲磨损。护罩齐全紧固。","5.仪表：压力表、真空表齐全完好、校验有效，显示准确，表盘清晰。","6.管路阀门：管路连接无渗漏，阀门开关灵活，指示正确。法兰密封垫完好，螺栓齐全紧固。","7.检修现场：检修现场无积煤、浮煤及杂物堆积。设备整洁，无油污、煤尘堆积。工具、配件摆放整齐，使用后及时归位。"]},{"t":"七、安全管控措施","p":["1.停送电刚性管控：严格执行停送电管理制度。分闸水泵控制开关、闭锁，挂\"有人工作，不准送电\"警示牌，并上锁。严格执行\"谁停电、谁送电\"原则。","2.检修压力管控：检修前必须关闭水泵进出口阀门，打开排气阀，释放内部残余压力，确认压力表指示为零后方可进行检修作业。严禁带压检修、拆卸管路及阀门。","3.起吊作业管控：起吊前，设置警戒区域，严禁非作业人员进入。吊运泵体及电动机等大型部件时，必须使用经检查确认合格的起重设备及吊具，由专人指挥，严禁在起吊物下方站立或作业。起吊前进行试吊，确认平衡后方可正式起吊。","4.转动部位管控：检修联轴器、轴承等转动部位前，必须确认设备已可靠停电、闭锁、挂牌、上锁。严禁在设备运行中调整、维修或更换转动部件。","5.工具材料清点管控：检修完成后，必须清点工具、材料。","6.档案闭环管控：建立检修档案，每次检修后记录检修内容、更换配件、发现问题及处理结果，由检修班组长整理归档，主管副队长审核后，由安全技术副队长汇总统一交机电运输科保存，作为设备全生命周期管理依据。","JD-C-03 井下管路检修模块化作业流程及管控措施"]}]},{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿井下管路（含压风管路、供水管路、排水管路）检修作业，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生管路崩脱伤人、高压流体喷溅、物体打击、登高坠落等安全隐患，提升检修效率与工程质量，确保井下管路系统检修全过程安全，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿井下各类管路（压风管路、供水管路、排水管路等）的安装、检修、更换及日常维护现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、安检员、现场操作人员（泵修工）"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责检修作业整体统筹、人员调配及考核落实，对检修现场安全负直接管理责任。","主管副队长：负责检修计划编制、现场作业组织协调、检修质量管控、进度把控，审批检修申请，组织班前安全交底。","安全技术副队长：负责检修标准制定、技术交底、现场隐患督办、模块修订优化。","班组长：负责当班检修任务分配、班组人员管理、现场安全条件确认、检修质量复检及问题上报。","安检员：负责作业期间安全巡查监督，制止违章行为，闭环隐患，监督泄压、起吊及登高安全措施落实。","泵修工：负责管路的控制阀门关闭，泄压、拆卸、安装、对口、法兰连接、阀门更换等操作，对管路检修质量及密封性能负直接责任。"]}]},{"t":"第三章 井下管路检修模块","s":[{"t":"一、模块概述","p":["模块编号：JD-C-03","模块名称：井下管路检修","所属专业：机电","适用范围：适用于参与井下各类管路安装、检修、更换的所有人员"]},{"t":"二、危险预知及防控","p":["1.流体（气体、液体）喷溅伤害：检修管路前，必须确认上游阀门已关闭，管路内部压力已完全释放，压力表指示归零，并打开泄压阀或排气阀进行卸压确认，方可进行拆卸作业。严禁带压拆卸管路法兰、阀门及接头。压风管路检修前必须将管内余风放尽；供水管路检修前必须关闭来水方向阀门并打开放水阀卸压；排水管路检修前必须关闭来水阀门并打开低位放水阀排空。","2.管路崩脱伤人：管路连接必须使用合格配件，法兰连接时螺栓必须齐全、紧固到位，卡箍式连接必须卡入槽内、紧固到位。检修完成后必须进行压力试验，确认无渗漏、无松动。","3.物体打击伤害：拆卸、安装管路时，操作人员应站在安全位置，防止管路、管件、工具坠落伤人。倾斜巷道路管检修时，必须对上部管路进行可靠固定，防止管路滑脱。搬运管路时动作协调，专人指挥，同起同落。","4.登高坠落伤害：高处管路检修作业时，必须使用稳固的梯子或搭建可靠的操作平台，系好安全带，安全带应悬挂在牢固构件上。作业平台下方不得站人。","5.误操作伤害：关闭或开启管路阀门时，必须先确认所操作阀门与指令相符，缓慢操作，严禁猛开猛关。检修中的管路必须在来水（来气）方向阀门处挂\"有人工作，禁止开启\"警示牌。","6.起吊作业伤害：吊运管路、阀门等重型部件时，必须使用经检查确认合格的起重设备及吊具，由专人指挥，严禁在起吊物下方站立或作业。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：瓦斯浓度≤1.0%，通风良好；作业区域顶板稳定、无淋水，作业平台稳固，照明充足。","2.检修管路确认：检修前必须认真核对待检修管路的用途及介质，确认管路前端控制阀门位置。检修前必须关闭来水（来气）方向阀门，挂牌，打开泄压阀或排气阀，确认压力表归零、管路内无余压、介质已排空。","3.人员确认：所有作业人员均已现场在岗，且经培训交底合格。","4.技术确认：检修技术交底工作已完成，各项工作具备施工条件。","5.设备确认：管路、阀门、密封垫、螺栓等备件规格型号符合要求，外观无缺陷；起重工器具完好；梯子、脚手架稳固。"]},{"t":"四、作业现场人员安全站位","p":["1.班组长：站在作业现场退路畅通的安全区域，全程统筹作业流程，监督安全措施执行情况，不得进入流体喷溅危险区域。","2.安检员：站在能够全面观察作业现场的安全区域，与管路及起吊物保持安全距离，全程监督作业人员安全操作行为、泄压及安全措施落实情况，发现违章立即制止并纠正。","3.泵修工：拆卸法兰螺栓时，站在安全区域，防止余压喷溅。开启阀门时，站在阀门侧面，缓慢操作，严禁正对阀门丝杠或手轮。搬运管路时，站在管路两侧，统一指挥，同起同落，严禁站在管路下方或滚落方向。"]},{"t":"五、标准化作业流程","p":["（一）前期准备与停压泄压","1.前期准备工作：","（1）班组长根据检修计划提出管路检修申请，明确检修管路位置、介质、内容及计划时间，报主管副队长审批。","（2）班组长、安检员、现场操作人员共同完成现场安全确认，确认顶板支护完好、待检修管路已停压。","2.停压泄压操作步骤：","（1）泵修工确认待检修管路，关闭来水（来气）方向阀门，切断压力来源。在来水（来气）方向阀门处悬挂\"有人工作，禁止开启\"警示牌。","（2）泵修工打开管路末端泄压阀或排气阀，释放内部残余压力。泵修工观察压力表指示，确认压力归零、管路内无余压、介质已排空。（班组长确认）","（二）管路拆卸作业步骤","（1）泵修工拆卸管路法兰螺栓：站在法兰侧面，缓慢松动螺栓，确认无余压喷出后，全部拆除。","（2）如需拆卸卡箍连接管路，泵修工使用专用工具拆除卡箍，缓慢分离管口。","（3）泵修工清理法兰密封面、管口杂物，检查管路内壁腐蚀情况。","（三）管路检修/更换作业步骤","（1）泵修工检查新管路或修复后的管路：无裂纹、无砂眼、无严重腐蚀，长度、角度符合要求。","（2）泵修工检查阀门：开关灵活，密封良好，无内漏、无外漏，手轮完好，指示正确。","（3）泵修工检查法兰、密封垫：法兰面平整、无损伤，密封垫材质、规格符合介质要求，无老化、无破损。","（4）泵修工检查管路支架、吊架：支架稳固，间距符合设计要求。","（四）管路安装作业步骤","（1）新管路或阀门就位，泵修工辅助校正方位，严禁用手直接伸入管口或法兰间隙。","（2）泵修工连接法兰：两法兰面平行、同心，密封垫居中放置，不得偏移、挤出；螺栓对称穿入，均匀紧固，拧紧后露出2～3扣。","（3）泵修工连接卡箍：卡箍卡入管路沟槽内，紧固到位，密封圈无挤出、无破损。","（4）泵修工安装固定支架、管卡：支架与巷道支护或底板连接牢固，管路固定可靠，无晃动。","（5）泵修工安装或更换阀门：阀门方向正确（低进高出或按流向标识），手轮便于操作，法兰连接紧固无渗漏。","（五）压力试验与恢复运行","（1）泵修工确认检修段安装完毕，拆除检修区域内所有临时设施，清点工具材料。","（2）泵修工拆除\"有人工作，禁止开启\"警示牌，缓慢开启来水（来气）方向阀门，检查检修位置及各连接点无渗漏。","（3）发现渗漏时，泵修工立即关闭阀门，完全泄压后处理，严禁带压紧固。","（4）填写检修记录，清理现场。"]},{"t":"六、作业质量标准","p":["1.管路安装通用标准：井下管路必须吊挂平直、牢固。法兰连接时，两法兰面必须平行、同心，密封垫不得偏移、挤出。法兰螺栓连接时，螺栓长度拧紧后不得小于1扣。管路最低处应安装放水阀（放水三通），便于排水。","2.压风管路标准：压风自救系统主管道应采用金属管材，主管道应布置在进风井筒、进风巷道。主管道直径应不小于100mm，采掘工作面管道直径应不小于50mm。井口、井下管道起伏区域内的最低部位，应设置放水阀。避难硐室和补给站等避险设施内、采掘工作面的管路末端和安装压风自救装置的管路终端应设置压力表。","3.供水管路标准：供水管路应敷设到所有采掘工作面、转载点、卸载点等需防尘地点。带式输送机巷道管路每隔50m设一个三通阀门，其他巷道每隔100m设一个三通阀门。供水管路压力试验合格，阀门开关灵活，无跑冒滴漏。","4.排水管路标准：排水管路管径及排水能力满足矿井最大涌水量排水要求。管路必须有可靠的支吊架固定，排水管路最低处安装放水阀，排水管路与水泵出口连接处必须安装闸阀、逆止阀，确保排水系统可靠。","5.阀门安装标准：阀门安装方向正确，手轮操作灵活，开关状态标识清晰。法兰或螺纹连接紧固无渗漏，填料压盖松紧适度。","6.支架标准：管路支架间距符合设计要求，固定牢固，无锈蚀、无变形。管路距底板高度符合规定，不影响行人和运输。","7.检修现场：检修现场无积煤、浮煤及杂物堆积。剩余材料、废料及时回收。设备整洁，工具摆放整齐。"]},{"t":"七、安全管控措施","p":["1.管路泄压刚性管控：检修管路前必须确认管路内无余压、介质已排空，压力表指示归零，方可进行拆卸作业。严禁带压操作，严禁盲目拆卸。压风管路必须放尽余风，供水管路必须关闭来水阀并打开泄水阀，排水管路必须打开低位放水阀。","2.起吊作业管控：吊运管路、阀门等重物时，必须由班组长或安检员检查起吊点承载力及吊具完好情况。起吊物重量不得超过起吊工具额定载荷。起吊过程中设专人监护，发现异常立即停止。","3.登高作业管控：登高作业必须使用稳固的梯子或搭建可靠的操作平台，系好安全带（保险绳），高挂低用。严禁在无防护情况下攀爬管路，作业平台下方不得站人。","4.作业区域隔离管控：检修期间，检修区域设置警戒，非作业人员严禁入内。倾斜巷道检修时，上部管路必须可靠固定，防止管路滑脱滚落。","5.试运行管控：检修完成后，必须进行压力试验和试运行，确认无渗漏、无异常后方可投入运行。发现渗漏必须完全泄压后处理，严禁带压紧固螺栓或更换密封垫。","6.工具材料清点管控：检修完成后，必须清点工具、材料数量，严禁遗漏在设备内部或巷道内。由工作负责人全面检查一遍，确认所有人员撤离至安全区域。","7.档案闭环管控：建立检修档案，每次检修后记录检修内容、更换配件、发现问题及处理结果，由检修班组长整理归档。"]}]}],"w":9840,"cn":9,"sn":36},{"c":"JD-C-04","n":"监测监控设备检修","t":"JD-C-04 监测监控设备检修模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿监测监控设备（含安全监控系统、人员位置监测系统、视频监视系统、各类传感器、分站、断电控制器及线缆等）安装与检修作业，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生断电闭锁失效、监测数据失真、误报警、触电伤害等安全隐患，确保监测监控系统安全可靠运行，保障矿井安全生产，特制定本方案。"]},{"t"
