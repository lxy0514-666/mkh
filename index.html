通风正常，退路畅通。","2.探查确认：超前钻探（注水孔、探查孔）到位，孔内气体检测合格，无异常空洞，完工钻孔黄土封堵严密。","3.支护材料确认：荆笆不少于30片、木钎椽不少于20根、小圆木（φ≥0.1m、L≥1.5m）不少于20根、铁钎椽不少于6根及足量卡缆。","4.监测确认：便携式甲烷检测报警仪、多参数气体检测报警仪悬挂于迎头非风筒侧，距迎头不大于5m。","5.人员确认：作业人员持证上岗、班前精神状态确认合格，高风险作业开工确认表填写完毕。","6.技术确认：沿空掘进专项措施会审完毕、全员贯彻签字，过老空通知单及专项措施到位。"]},{"t":"四、作业现场人员安全站位","p":["1.严禁在沿空侧（邻近老巷、采空区一侧）煤帮下站人、作业。","2.截割、刷帮期间设专人观山，人员站支护完好、退路畅通侧。","3.探查孔、注水孔口侧身操作，避开孔内气体喷出方向。","4.排钎椽、上棚梁期间人员同起同放，避开钎椽滑落、棚梁旋转范围。"]},{"t":"五、标准化作业流程","p":["班前会交底+开工安全确认→悬挂便携仪→敲帮问顶→超前钻探探查（老空范围、积水、气体）→孔内气体检测、无异常封孔→掘进机截割→敲帮问顶→临时支护（前探梁或钎椽配合荆芭撞楔控顶）→永久支护（架棚、背顶闭帮）→矿压观测→防漏风处理（充填、封闭）→清理浮煤进入下一循环→班组自检验收"]},{"t":"六、作业质量标准","p":["1.循环进度：顶板较完好时执行“一掘两支”，截割前临时支护距迎头≤0.3m，截割后永久支护距迎头≤1.5m；顶板破碎易漏冒时执行“一掘一支”，截割前临时支护距迎头≤0.3m，截割后永久支护距迎头≤0.9m。","2.支护质量：U型钢支架站在实底、迎山有力，卡缆数量齐全（搭接处各3个、拱部1个），卡缆螺栓紧固扭矩不小于150N·m，每班作业前对上一班卡缆全面复紧一次。","3.钎椽控顶：钎椽以铁钎椽为主、木钎椽配合，规格不小于φ30mm×1200mm，间距不超过200mm，挺入深度不小于800mm，与巷道坡度夹角8—10°，铁钎椽用防脱绳捆绑固定。","4.矿压观测：顶底板移近量或巷帮移近量超过100mm、或日移近量超过10mm时停止作业、上报分析，采取缩小棚距（600mm改500mm）、工字钢联锁或架设抬棚加强支护；棚距500mm时永久支护紧跟迎头，临时支护距迎头300—800mm。","5.防漏风标准：沿空区域每100m设一个测风点，每月分段测风一次，首末测点风量差超过50m³/min判定漏风，采取挂帘（抗静电、不延燃风筒布吊挂）、喷涂（沿空侧及顶部采空区侧1/2宽度喷浆）、充填（水泥砂浆或高分子材料注浆封堵）措施。"]},{"t":"七、安全管控措施","p":["1.瓦斯管控：施工地点悬挂便携式甲烷、多参数气体检测报警仪，瓦斯浓度达0.5%或波动达0.2%、CO达0.0024%时立即停止施工、撤人汇报，待浓度降至规定值以下且持续稳定10min以上经调度同意方可复工；探查孔内发现高浓度瓦斯、有害气体时立即停止掘进、严禁私自延伸风筒排放，汇报调度室、通风科由专业人员处理。","2.揭露老空管控：掘进临近探明空洞位置0.9m左右时控制掘进机缓慢截割，先掘开0.3—0.5㎡小断面，由瓦检工检测老空内有毒有害气体，确认指标符合要求后方可继续掘进；揭露采空区前根据地测防治水科过老空通知单编制专项措施。","3.顶板管控：严禁空顶作业，帮顶破碎松软时先上后下施工，先扩刷上部、临时控顶、安装顶梁背严背实并闭帮后方可扩刷下部；顶板高冒无法背实接顶时，支架上方充填道木、荆芭等柔性材料充填高度不小于0.5m，并安装连锁梁加固；顶板破碎时超前压注马丽散加固，压注深度超前班进尺至少2m、封孔段深度不小于1.0m、钻孔间距不超过2.0m。","4.水害管控：每天对老空区域钻探探测，提前摸清老空残存积水及气体情况，及时疏放，所有钻孔完工无异常时立即黄土封堵严密；遇老巷遗留古木、铁器时优先人工回收，人工处理困难时采用掘进机钢丝绳拖拽，拖拽期间严禁人员进入掘进机周围及前方，处理完第一时间敲帮问顶。","5.防漏防火管控：沿空侧未塌实区域用煤袋充填、全程风布打帮封闭隔离；每周从油箱排污口排放冷凝水；瓦检员每天检测CO及温度，CO达到或超过5ppm且小于24ppm立即汇报分析处理，达到或超过24ppm立即停止作业、撤至安全地点；发现“水雾气”“出汗”、煤油味、温度逐渐升高等自燃预兆立即停止作业汇报。","6.高风险作业管控：沿空掘巷属高风险作业，每班严格执行开工安全确认（填写开工检查确认表）、跟班副队长及安检员现场盯守、班后检查确认无隐患后方可离开；作业人员无需请示有权第一时间撤人。","7.应急处置管控：落实灭、护、撤、躲、报程序，水灾向高处撤离，火灾、瓦斯、煤尘灾害迎风撤离，佩戴自救器，及时向调度室汇报。"]}]}],"w":2750,"cn":3,"sn":12},{"c":"JJ-A-07","n":"探放水","t":"JJ-A-07 探放水模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范探放水作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝透水、顶钻卡钻、涌水溃沙、设备伤人、有害气体超限等安全隐患，提升探放水作业安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有探放水全工序作业、现场管理全过程，包含钻探、封孔、试压、疏放水、隐患治理等工作。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先探后掘、先治后采；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长、探放班组长","成  员：安检员、钻机司机、辅助工、瓦斯检查员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责探放水模块化管理整体工作。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","探放班组长：探放水总体协调管理。","班组长：当班自检复检、问题上报、现场人员调配。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","钻机司机、辅助工：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。","瓦斯检查员：有害气体检测，气体异常及时预警、组织撤人。"]}]},{"t":"第三章  探放水模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-A-07","模块名称：探放水","所属专业：防治水","适用范围：探放水作业所有人员"]},{"t":"二、危险预知及防控","p":["1.透水涌水伤人：严格执行先探后掘，出现透水预兆立即停钻撤人，严禁拔杆","2.顶钻、卡钻、喷孔伤人：匀速规范钻进，专人观察钻杆状态，异常立即停机","3.机械起吊、运输伤人：规范使用吊具、轨道运输，严禁歪拉斜吊、超载作业","4.有害气体超限中毒：全程气体监测，浓度超标立即停工撤人","5.管路爆裂、积水漫巷：排水系统完善可靠，排水泵一用一备，管路连接牢固，水仓水沟保持畅通"]},{"t":"三、作业条件安全确认","p":["环境确认：巷道支护完好，敲帮问顶完成，退路畅通；排水沟、临时水仓清理到位；通讯、视频、照明到位。","气体确认：瓦斯、一氧化碳等有害气体浓度合规，通风系统正常。","设备确认：钻机、排水泵、手拉葫芦、管路阀门完好，风压水压正常。","材料确认：钻头、钻杆、止水套管、封孔材料、注浆材料、配件齐全合格。","人员确认：全员持证上岗，每班不少于 3 人配合作业，互保联保责任明确。","技术确认：专项设计、安全技术措施齐全，交底到位。"]},{"t":"四、作业现场人员安全站位","p":["1.站在支护完好、无危矸活岩的安全区域作业。","2.钻机作业时，人员严禁站在钻机正前方、钻杆延伸方向及旋转范围内。","3.起吊设备、拆装钻杆时侧身站位，避开吊具、管件摆动范围。","4.疏通管路、开关阀门时侧身操作，防止高压水喷溅伤人。","5.低洼积水区域作业人员站在高处，防止涌水围困"]},{"t":"五、标准化作业流程","p":["技术交底→现场标定孔位→场地清理+设备就位→开孔钻进→下入止水套管→注浆固结→水压耐压试验→正常分段钻进→终孔验收+孔口处置→积水疏放+动态观测→ 隐患排查治理→自检+清理现场"]},{"t":"六、作业质量标准","p":["1.开孔：孔位、方位角、倾角严格按照设计施工，偏差符合规范要求。","2.套管：孔口采用设计钻头开孔，下入设计要求止水套管，丝扣连接紧密，全长注浆固结。","3.试压：封孔凝固 24h 后试压，试验压力不小于设计值，稳压 30min 无渗漏为合格。","4.钻进：使用设计钻头，钻进压力≤20MPa，转速控制 50-250r/min，逐杆记录孔深。","5.钻孔：杜绝浅孔、虚孔、漏孔，所有钻孔统一编号、挂牌管理。","6.排水：排水设备一用一备，水沟、水仓无淤积，满足最大涌水排放要求。"]},{"t":"七、安全管控措施","p":["探放水刚性管控：严格落实 “预测预报、有疑必探、先探后掘、先治后采”，无设计、无措施、探水安全距离不足严禁掘进。","钻进作业管控：钻机严禁带病运转，操作人员持证上岗；出现顶钻、卡钻、水量骤增、煤壁挂红挂汗等透水预兆，立即停钻、固定钻杆、严禁拔杆，全员撤人并上报调度室。","气体监测管控：作业全程不间断检测瓦斯、一氧化碳，气体超限立即停工、切断电源、撤离人员。","起吊运输管控：钻机拆装、移位使用不小于3T 手拉葫芦，吊具定期检查，严禁超载、歪拉斜吊；轨道运输执行 “行人不行车、行车不行人”制度。","排水系统管控：每日观测水量、水压、水温并建立台账，定期清淤水仓、水沟，保证排水能力匹配涌水量。","人员行为管控：严禁单人开展钻探作业，作业人员配齐劳保用品，杜绝违章指挥、违章作业、违反劳动纪律。","验收闭环管控：执行班组自检、班长复检、业务科室验收三级验收；验收不合格严禁移交掘进作业，隐患问题当班整改、闭环。"]}]}],"w":1791,"cn":3,"sn":12},{"c":"JJ-A-08","n":"巷道修复机搬家","t":"JJ-A-08 巷道修复机搬家模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范WPZ-45/700L型煤矿用巷道修复机解体、装车、运输、卸车、组装、调试全流程作业行为，统一拆解封车、绞车运输、起吊组装标准，杜绝起吊坠落、跑车掉道、斜坡溜车、挤压触电事故，保障设备完好、运输安全、一次组装调试达标，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于巷道修复机回撤解体、井下转运、新地点组装调试全工序、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后拆解；先加固、再起吊；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：班组长、巷道修复机司机、电钳工、辅助工、安检员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责巷道修复机搬家全流程模块化管理。","机电副队长：解体组装方案技术指导、绞车运输验算把关、设备验收。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会专项交底、现场全过程组织协调、高风险起吊运输全程盯守。","班组长：运输线路、工器具、起吊地点支护安全确认，当班工序管控、自检复检。","巷道修复机司机：按操作规程完成上下车、开运操作，启动前点动确认。","电钳工：电源拆除接通、电缆敷设，严格执行停送电制度。","辅助工：配合起吊、封车、推运，服从统一指挥。","安检员：全流程安全条件确认、违章制止、起吊运输工序标准监督。"]}]},{"t":"第三章  巷道修复机搬家模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-A-08","模块名称：WPZ-45/700L巷道修复机拆装转运","所属专业：掘进、机电运输","适用范围：搬家全体作业人员"]},{"t":"二、危险预知及防控","p":["1.解体起吊部件坠落：吊点正确、捆绑牢固，吊物下方严禁站人","2.轨道运输掉道、跑车：绞车、钢丝绳、一坡三挡完好，规范连接","3.斜坡开运履带打滑溜车：停车断电闭锁、垫实履带","4.拖拽电缆拉断触电：专人监护电缆，长度不足及时停机","5.上下车平板车滑移：道木鞋板垫实背紧，衬垫防滑","6.电气作业触电：停电验电放电挂牌闭锁"]},{"t":"三、作业条件安全确认","p":["1.环境确认：运输线路巷道支护完好，轨道平整、轨距达标，绞车稳设牢固、声光信号灵敏、一坡三挡齐全，杂物清理干净，巷道两侧安全间隙满足通行。","2.设备确认：整机质量约7t、解体后最大件6t；3t及以上合格手拉葫芦、道木、鞋板、钢丝绳（直径不小于3mm）、垫木、方木齐全完好。","3.电气确认：上、下车地点电源（660V）满足要求，停送电制度落实，瓦斯浓度低于0.5%方可电气作业。","4.人员确认：司机、电钳工持证上岗，每班不少于6人（含副队长、班组长），互保联保分工明确。","5.技术确认：运输专项措施会审贯彻完毕，绞车牵引力验算合格（JSDB-6型双速绞车额定牵引力60kN大于运输最大拉力15.9kN，钢丝绳安全系数大于5），全员培训合格。"]},{"t":"四、作业现场人员安全站位","p":["1.开运期间严禁人员进入修复机周围5m以内。","2.斜坡运行严禁人员站在修复机两侧、正前方。","3.起吊作业人员站吊物两侧支护完好区，严禁吊物、索具受力区下方站立通行。","4.绞车运输绳道、三角区严禁站人，人员撤至躲避硐或巷道外侧。","5.人力推车人员站矿车后方，严禁站在两侧及手放突出部位。"]},{"t":"五、标准化作业流程","p":["班前专项交底→运输线路联合排查→修复机开运至装车点→解体（挖斗/破碎锤与大臂分离、大臂与本体分离）→断电、电缆回收→本体开上大平板车、大臂吊装中号平板车、挖斗及破碎锤装矿车（共3车）→封车捆绑（钢丝绳+压杠+方木衬垫）→绞车分段运输→到达下车点掩车→拆封车、道木鞋板搭设斜坡→大臂与本体组装→挖斗与大臂组装→接通电源→点动试车→空载动作试验→联合验收"]},{"t":"六、作业质量标准","p":["1.解体标准：先辅后主，挖斗（破碎锤）、大臂、本体三级分离，油口封堵防尘，高压油管接口防护，部件编号清楚。","2.封车标准：本体采用不少于3道钢丝绳配合2道压杠捆绑，履带不少于2道，履带两端头捆绑方木防滑；钢丝绳与车体棱角接触部位衬垫皮带；大臂不少于3道钢丝绳固定；矿车装载不超高、不超出车沿。","3.绞车标准：双速绞车与巷帮间距不小于0.8m、有效高度不低于1.8m；钢丝绳绳卡不少于2副、母绳不少于3圈、滚筒边缘高于最外层钢丝绳2.5倍绳径；闸带磨损剩余厚度不小于3mm；一个捻距内断丝面积不超过总面积10%。","4.组装标准：大臂与本体连接销轴安装到位、保险齐全，高压油管连接到位无渗漏，电气连接无失爆。","5.调试标准：电机点动确认转向正确，各手柄中位、警铃预警后试动作，大臂升降、回转、挖斗动作平稳无异响。"]},{"t":"七、安全管控措施","p":["1.上下车管控：上下车必须使用道木配合鞋板将平板车前后与地面间隙垫实背紧，一端搭设斜坡；修复机与平板车之间用木板或荆芭衬垫防滑；上下车期间除司机外平板车5m范围内严禁站人。","2.开运管控：启动前点动数次确认电机转向、液压充油，各手柄归中位；行走时大臂在正前方、挖斗底距地面200—300mm；拖拽电缆专人监护，电缆不足时停机闭锁后处理；斜坡行走铲斗贴近地面；斜坡停车必须停机、断电、闭锁，人员从修复机后方两侧将道木垫在履带前部支牢，严禁站正前方。","3.绞车运输管控：绞车经验收合格投入使用，严禁带病运转；挂车使用专用销子并闭锁；执行“一停、二拉、三松”信号，两部绞车配合时信号独立；严格执行“行车不行人、行人不行车”，起始端专人警戒设警戒绳；变坡点严禁松绳过长；非车辆经过时阻车器、保险档处于闭合状态。","4.起吊管控：起吊前检查起吊地点前后5m支护，吊链环固定在U型钢顶梁时两侧用单轨吊卡子固定防滑；重物离地0.1m暂停检查；严禁以手把、接线嘴为吊点，严禁用身体平衡起吊物；两台以上葫芦同时起吊均衡受力统一指挥；起吊必须一次完成，中途不得停吊离人。","5.人力推车管控：一次只准推1辆车，站矿车后方推，前方专人警戒；过风门严禁两道同时打开，专人开关风门并站安全位置；停放车辆用阻车器掩死。","6.电气管控：严格执行停电、验电、放电、闭锁、挂牌，瓦斯浓度低于0.5%方可作业；送电前由跟班副队长和施工负责人共同检查确认，专人监护试送电。","7.验收闭环管控：解体、封车、运输、组装、调试分阶段自检，机电运输科总验收，隐患当班整改闭环。"]}]}],"w":2434,"cn":3,"sn":12},{"c":"JJ-A-09","n":"液压挖掘机搬家","t":"JJ-A-09 液压挖掘机搬家模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范MWD2.0煤矿用液压挖掘机（电机版）解体、装车、运输、卸车、组装、调试全流程作业行为，统一拆解封车、绞车运输、起吊组装、电缆管理标准，杜绝起吊坠落、跑车掉道、斜坡溜车、电缆拉断触电事故，保障设备完好、运输安全、一次组装调试达标，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于液压挖掘机回撤解体、井下转运、新地点组装调试全工序、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后拆解；先加固、再起吊；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：班组长、液压挖掘机司机、电钳工、辅助工、安检员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责液压挖掘机搬家全流程模块化管理。","机电副队长：解体组装方案技术指导、绞车运输验算把关、设备验收。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会专项交底、现场全过程组织协调、高风险起吊运输全程盯守。","班组长：运输线路、工器具、起吊地点支护安全确认，当班工序管控、自检复检。","液压挖掘机司机：按操作规程完成上下车、开运操作，启动前点动确认电机转向。","电钳工：电源（660V）拆除接通、电缆敷设，严格执行停送电制度。","辅助工：配合起吊、封车、推运，服从统一指挥。","安检员：全流程安全条件确认、违章制止、起吊运输工序标准监督。"]}]},{"t":"第三章  液压挖掘机搬家模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-A-09","模块名称：MWD2.0液压挖掘机拆装转运","所属专业：掘进、机电运输","适用范围：搬家全体作业人员"]},{"t":"二、危险预知及防控","p":["1.解体起吊部件坠落：吊点正确、捆绑牢固，吊物下方严禁站人","2.轨道运输掉道、跑车：绞车、钢丝绳、一坡三挡完好，规范连接","3.斜坡开运履带打滑溜车：停车断电闭锁、垫实履带","4.拖拽电缆拉断触电：专人监护电缆，长度不足及时停机","5.上下车平板车滑移：道木垫实背紧，衬垫防滑","6.电气作业触电：停电验电放电挂牌闭锁"]},{"t":"三、作业条件安全确认","p":["1.环境确认：运输线路巷道支护完好，轨道平整、轨距达标，绞车稳设牢固、声光信号灵敏、一坡三挡齐全，杂物清理干净，巷道断面满足设备通行。","2.设备确认：3t及以上合格手拉葫芦、道木、鞋板、钢丝绳、垫木、方木齐全完好，绞车牵引力验算合格。","3.电气确认：上、下车地点电源（660V）满足要求，停送电制度落实，瓦斯浓度低于0.5%方可电气作业。","4.人员确认：司机、电钳工持证上岗，每班不少于6人（含副队长、班组长），互保联保分工明确。","5.技术确认：运输专项措施会审贯彻完毕，全员培训合格。"]},{"t":"四、作业现场人员安全站位","p":["1.开运期间严禁人员进入挖掘机周围5m以内。","2.斜坡运行严禁人员站在挖掘机两侧、正前方，人员站上方安全侧。","3.起吊作业人员站吊物两侧支护完好区，严禁吊物、索具受力区下方站立通行。","4.绞车运输绳道、三角区严禁站人，人员撤至躲避硐或巷道外侧。","5.人力推车人员站矿车后方，严禁站在两侧及手放突出部位。"]},{"t":"五、标准化作业流程","p":["班前专项交底→运输线路联合排查→挖掘机停机断电、电缆回收→解体（视巷道断面分离挖斗、大小臂与本体）→部件编号防护→装车（本体平板车居中、大件分车）→封车捆绑（钢丝绳+压杠衬垫）→绞车分段运输→到达下车点掩车→拆封车、道木搭设斜坡→下车→组装（臂架销轴、油管复原）→接通电源→点动试车（确认电机转向、充液压油）→空载动作试验→联合验收"]},{"t":"六、作业质量标准","p":["1.解体标准：先辅后主，拆解分步固定，油口、电缆接口封堵防尘，部件编号台账齐全。","2.封车标准：大件居中摆放、底部防滑衬垫（木板或荆芭），不少于3道钢丝绳配合压杠捆绑，棱角接触部位衬垫皮带，松紧适度。","3.绞车标准：钢丝绳绳卡不少于2副、母绳不少于3圈，闸带磨损剩余厚度不小于3mm，一个捻距内断丝面积不超过总面积10%，挂车销子闭锁可靠。","4.组装标准：销轴安装到位、保险齐全，高压油管连接到位无渗漏，电气连接无失爆，吊装部位连接安全可靠。","5.调试标准：电机点动数次确认转向正确、液压系统充满液压油；对连接部位销轴、油缸结合面注入润滑脂；各手柄中位、警铃预警后试动作，大臂、斗杆、挖斗、回转、行走动作平稳无异响。"]},{"t":"七、安全管控措施","p":["1.上下车管控：上下车必须用道木将平板车前后与地面间隙垫实背紧并搭设斜坡，挖掘机与平板车之间衬垫防滑；上下车期间除司机外5m范围内严禁站人。","2.开运管控：启动前点动确认电机转向、液压充油，各手柄归中位、鸣警铃清场；行走时大臂正前方、挖斗距地200—300mm；斜坡行走铲斗贴近地面；斜坡停车停机断电闭锁并垫实履带，人员严禁站正前方；拖拽电缆专人监护，电缆不足时停机闭锁后处理。","3.绞车运输管控：绞车严禁带病运转，执行“一停、二拉、三松”信号；严格执行“行车不行人、行人不行车”，专人警戒；变坡点严禁松绳过长；非车辆经过时阻车器、保险档处于闭合状态。","4.起吊管控：起吊前检查起吊地点前后5m支护及吊具完好，吊点严禁选手把、接线嘴；重物离地0.1m暂停检查；双葫芦均衡受力、统一指挥；起吊一次完成，严禁中途停吊离人；严禁用身体平衡起吊物。","5.人力推车管控：一次只准推1辆车，站矿车后方推，前方专人警戒；过风门严禁两道同时打开；停放车辆阻车器掩死。","6.电气管控：严格执行停电、验电、放电、闭锁、挂牌，瓦斯浓度低于0.5%方可作业；试送电专人监护。","7.验收闭环管控：解体、封车、运输、组装、调试分阶段自检，机电运输科总验收，隐患当班整改闭环。"]}]}],"w":2181,"cn":3,"sn":12},{"c":"JJ-A-10","n":"自移机尾安装","t":"JJ-A-10 自移机尾安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范DWZY1000/1200型带式输送机用自移机尾安装、调试全流程作业行为，统一部件运输、逐节组装、液压电控调试、联合试运转标准，杜绝起吊坠落、部件挤压、电气失爆、误启动伤人事故，实现安装一次达标、投产安全可靠，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于掘进工作面带式输送机用自移机尾安装、调试全工序、现场管理全过程（含二运转载机拆装配合）。符合MT/T820-2006《煤矿用带式输送机技术条件》、KA/T 1166-2019《可伸缩带式输送机自移机尾》及《煤矿安全规程》相关规定。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后拆装；先固定、再起吊；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：班组长、机电修工、电钳工、辅助工、安检员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责自移机尾安装全流程模块化管理。","机电副队长：安装方案技术指导、设备调试把关、机电运输科验收对接。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会专项交底、现场全过程组织协调、高风险起吊工序全程盯守。","班组长：作业地点安全确认，当班工序管控、自检复检、隐患上报。","机电修工：机械部件拆装、液压管路连接、电气信号装置安装调试，严格停送电制度，对安装质量、防爆性能负责。","辅助工：部件搬运、吊装、装车配合，检查确认起吊用具。","安检员：安全条件确认、违章制止、起吊拆装工序标准监督。"]}]},{"t":"第三章  自移机尾安装模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-A-10","模块名称：DWZY1000/1200自移机尾安装","所属专业：机电、掘进","适用范围：安装全体作业人员"]},{"t":"二、危险预知及防控","p":["1.起吊部件坠落挤压伤人：吊具检查合格，吊物下方严禁站人","2.单轨吊运输超载、掉道：限重运输，双人操作监护","3.带式输送机、掘进机误启动伤人：拆装前断电闭锁挂牌","4.电气作业触电、失爆：停电验电放电，隔爆面防护","5.液压系统带压喷溅：拆装管路先泄压","6.多部件组装磕碰：专人指挥，轻拿轻放"]},{"t":"三、作业条件安全确认","p":["1.环境确认：安装地点巷道支护完好，杂物清理、地面平整，备用设备部件摆放巷道一侧，退路畅通；巷道帮及设备间安全间隙、人行道宽度符合《煤矿安全规程》。","2.设备确认：DWZY1000/1200型自移机尾共12节（已编号，每节长3.0m，总长约38m，解体最大长度3.0m、最大宽度约2.0m、最大重量约1.5t）；3t、5t合格手拉葫芦，风炮、扳手、套筒及随机工具齐全完好。","3.运输确认：气动单轨吊最大运输能力经验算合格（4.57t），单次起吊不超过4.5t，风压0.4—0.6MPa，吊挂连接装置、轨道完好。","4.电气确认：带式输送机、掘进机、二运开关停电闭锁挂牌，作业地点瓦斯浓度小于0.5%方可作业。","5.人员确认：机电修工持证上岗，每班配跟班副队长1名、班组长1名、机电修工2名、辅助工若干，互保联保明确。","6.技术确认：安装措施贯彻完毕，自移机尾安装必须在厂家技术人员指导下进行，全员培训合格。"]},{"t":"四、作业现场人员安全站位","p":["1.起吊作业人员站吊物两侧支护完好区，严禁吊物正下方站立，身体任何部位严禁伸入狭小空间。","2.单轨吊运输平巷段操作工站在前方左侧或右侧，严禁站在单轨吊下方；斜巷段站上方操作。","3.组装对接期间人员避开部件滑移、翻转方向，销轴孔对位严禁手指探入。","4.试运转前所有人员撤离机尾、皮带运转范围，专人监护。"]},{"t":"五、标准化作业流程","p":["班前专项交底→作业地点安全确认→拆除二运转载机（闭锁掘进机、拆胶带、拆滚筒托辊、逐节拆机架）→拆除原带式输送机机尾（皮带松弛、闭锁、固定上下皮带、断开尾部皮带、拆托辊、逐节拆机尾架）→清理平整现场→确定机尾位置→安装机尾→依次向前逐节安装中间底座、机架（按编号顺序）→安装液压千斤顶（支撑缸、推移缸、调偏缸）→安装泵站→连接液压管路→液压系统调试→安装托辊→安装皮带→安装二运转载机→整机调试→联合试运转→班组自验、机电运输科验收"]},{"t":"六、作业质量标准","p":["1.安装顺序标准：各节段严格按编号顺序安装，头尾方向正确，节段间销轴铰接到位、防脱落措施齐全，连接件连接可靠。","2.液压标准：液压管路连接正确（各支撑千斤顶与推移千斤顶进回管路一致），参照液压系统图施工；额定工作压力18MPa，各接头无泄漏，动作平稳无卡滞冲击；系统压力严禁超调（出厂已调定）。","3.电气标准：紧固螺栓螺母规格一致、紧固后螺纹露出螺母1—3个螺距；防爆面防腐处理无损伤，喇叭口挡板挡圈装配齐全；控制电缆用阻燃橡套电缆（不小于1.5mm²），接线无漏接短路，接地牢靠；防爆合格率100%，各项保护整定符合规定、灵敏可靠。","4.机械标准：托辊转动灵活无卡阻，皮带张紧适度不打滑，行走轮组卡住轨道不掉道，轨道面无煤渣杂物。","5.试运转标准：先空载后负载，机架自移（升、推、降、拉）、调偏、纠偏动作正常，二运搭接转载顺畅，信号、语音预警、急停闭锁灵敏可靠。"]},{"t":"七、安全管控措施","p":["1.停电闭锁管控：拆除、安装期间必须断开带式输送机、掘进机、二运电源开关并闭锁挂牌，严格执行“谁停电、谁送电”，严禁约时送电；送电前确认接线腔内无杂物、部件装配齐全。","2.起吊管控：起吊前检查吊挂地点前后5m巷道支护并重新紧固起吊支架卡缆，链环用扣连接螺丝固定、螺丝出头不少于3丝；重物离地0.1m暂停检查吊绳、吊钩、吊链、锁具；严禁以手把、接线嘴为吊点；双葫芦均衡受力统一指挥；起吊、搬运期间无关人员严禁进入施工地点。","3.单轨吊运输管控：司机持证、双人操作（一人操作一人监护）；严禁超负荷运行（单次不超过4.5t）；起吊物与底板及周围设备安全距离不小于0.3m；平巷操作工跟随工件不得超过5m；斜坡停车做好防滑、下方严禁站人；轨道末端装阻车装置。","4.部件管理管控：小零件（销子、垫圈、螺母、U型卡子等）用专用存储工具存放，防止丢失造成安装中断；拆掉的配件及时清运，作业地点5m范围内不得堆放配件。","5.调试管控：设备调试必须在厂家技术人员指导下进行，确认安装标准、运行正常后汇报机电运输科；试运转前检查紧固件、传动部位、防护罩（未装防护罩严禁开机）、电源相序与电机转向、安全保护及电气闭锁。","6.验收闭环管控：安装结束试运行无问题、区队自验合格后向机电运输科申请验收，验收合格后方可投入使用；隐患当班整改闭环。"]}]}],"w":2535,"cn":3,"sn":12},{"c":"JJ-A-11","n":"自移机尾回撤","t":"JJ-A-11 自移机尾回撤模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范DWZY1000/1200型带式输送机用自移机尾停用回撤、拆解、装车、升井全流程作业行为，统一断电拆解、起吊装车、封车运输标准，杜绝起吊坠落、部件挤压、误启动伤人、运输事故，实现设备完好回撤、部件齐全回收，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于掘进工作面自移机尾回撤、拆解装车升井及二运转载机恢复全工序、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后拆解；先泄压、再拆管；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：班组长、机电修工、电钳工、辅助工、安检员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责自移机尾回撤全流程模块化管理。","机电副队长：回撤方案技术指导、设备清点验收。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会专项交底、现场全过程组织协调、高风险起吊工序全程盯守。","班组长：作业地点安全确认、当班工序管控、部件清点、自检复检。","机电修工：液压管路、泵站、电气拆解，严格停送电制度。","辅助工：部件搬运、吊装、装车封车配合。","安检员：安全条件确认、违章制止、起吊装车工序标准监督。"]}]},{"t":"第三章  自移机尾回撤模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-A-11","模块名称：DWZY1000/1200自移机尾回撤","所属专业：机电、掘进","适用范围：回撤全体作业人员"]},{"t":"二、危险预知及防控","p":["1.拆解期间误启动伤人：断电闭锁挂牌，严禁约时送电","2.起吊部件坠落挤压伤人：吊具检查合格，吊物下方严禁站人","3.液压管路带压喷溅：拆管前彻底泄压","4.机架、轨道笨重部件搬运挤压：多人配合统一指挥，同起同放","5.装车封车不牢运输滑移掉道：居中装载、衬垫防滑、捆绑牢固","6.小件丢失影响复用：专用器具存放、清点入账"]},{"t":"三、作业条件安全确认","p":["1.环境确认：回撤地点巷道支护完好，杂物清理，退路畅通，起吊点前后5m支护加固完毕。","2.设备确认：3t及以上合格手拉葫芦、绳套（链子）、道木、垫木、封车钢丝绳、专用车辆齐全完好；机架12节（已编号）状况清楚。","3.电气确认：自移机尾、配套泵站、带式输送机开关停电、验电、闭锁挂牌，专人看管；瓦斯浓度低于0.5%方可电气作业。","4.人员确认：机电修工持证上岗，每班不少于4人，互保联保分工明确。","5.技术确认：回撤措施贯彻完毕，部件编号、清点台账建立，全员培训合格。"]},{"t":"四、作业现场人员安全站位","p":["1.起吊作业人员站吊物两侧支护完好区，严禁吊物、索具受力区下方站立通行。","2.拆管人员侧身操作，避开高压油喷射方向。","3.搬运机架、轨道多人配合同起同放，避开部件滑移、翻转方向，手脚严禁伸入销轴孔。","4.人力推车人员站矿车后方，前方专人警戒。"]},{"t":"五、标准化作业流程","p":["班前专项交底→回撤地点安全确认→机尾停机、控制停止→逐级停电验电闭锁挂牌→液压系统泄压→拆除皮带（断开、卷收）→拆除托辊→拆除泵站、电缆及控制箱→拆除液压管路（封堵油口）→拆除液压千斤顶→逐节拆解机架及轨道（拔销轴、按编号拆卸）→部件分类清点→装车（居中、衬垫、防滑）→封车捆绑→运输升井→地面复验清点入库→二运转载机恢复→联合验收"]},{"t":"六、作业质量标准","p":["1.拆解标准：逆安装顺序拆解（先皮带托辊、后泵站管路、再逐节机架），节段按编号拆卸、按编号装车，销轴、防脱落件分类存放，液压件拆口封堵防污，小件（销子、垫圈、卡子等）专用器具存放不丢失。","2.装车标准：大件居中摆放、底部衬垫防滑，棱角胶皮防护，钢丝绳捆绑不少于3道、松紧适度，不超高超宽，符合“四超”车辆运输管理规定。","3.电气拆除标准：停电、验电、放电、闭锁、挂牌后作业；电缆拆除分段盘好、标识清楚，电气部件无损伤、隔爆面防护到位。","4.部件清点标准：机架12节、千斤顶、泵站、控制箱、托辊等按台账逐项清点，账物相符升井入库。","5.恢复标准：二运转载机恢复安装后试运转正常，皮带恢复张紧适度、保护齐全。"]},{"t":"七、安全管控措施","p":["1.停电闭锁管控：拆解全程严格执行“谁停电、谁送电”，严禁约时送电，专人看守开关，严禁任何人员操作机尾控制装置。","2.泄压管控：拆除泵站、管路、千斤顶前必须彻底泄压，拆开油口及时封堵，严禁污物进入液压系统。","3.起吊管控：起吊前检查起吊地点前后5m支护、重新紧固起吊支架卡缆，吊具索具检查合格；重物离地0.1m暂停检查；严禁以手把、接线嘴为吊点；多台葫芦起吊均衡受力、统一指挥；严禁用身体平衡起吊物。","4.搬运管控：搬运大件根据物件大小安排不少于2人，明确责任人和搬运路线，同起同放、轻拿轻放，严禁抛扔；发现巷道支护不良停止作业处理。","5.装车运输管控：装车前检查车辆完好，停稳防溜；装车后高度宽度符合“四超”管理规定，专用刹车棍配合钢丝绳固定；人力推车一次只准推1辆、站车后方，过风门严禁两道同时打开，停放车辆阻车器掩死。","6.验收闭环管控：部件升井后地面清点复验、入库建档；回撤地点现场清理干净、无遗留部件；二运恢复联合验收合格，隐患当班整改闭环。"]}]}],"w":1968,"cn":3,"sn":12}],"os":"一","rn":"高风险","rc":"红","rg":"A","n":11,"label":"高风险 · 红色 A段"},{"t":"二、中风险-橙色-B段（2项）","lv":"B","m":[{"c":"JJ-B-01","n":"交岔点施工","t":"JJ-B-01交岔点施工模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范掘进巷道交岔点施工作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝冒顶、片帮、支护失稳、高空坠落、构件倾倒等安全隐患，保障大断面、高应力区域巷道施工安全与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有巷道交岔点、三岔门、四岔门、贯通、开口等施工全工序、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先加固、后扩刷；先支护、后掘进；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、支护工、辅助工、测量员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责交岔点模块化管理整体工作。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、高风险作业全程监督。","班组长：当班自检复检、问题上报、人员及工序调配。","安检员：安全条件确认、风险防控监督、违章行为制止，高风险区域现场盯守。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。","延线员：监测顶板、围岩变形及矿压数据。"]}]},{"t":"第三章  交岔点施工模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-B-01","模块名称：掘进交岔点施工","所属专业：掘进","适用范围：交岔点施工作业所有人员"]},{"t":"二、危险预知及防控","p":["1.顶板冒顶、片帮伤人：分段小进尺施工，坚持敲帮问顶，超前控顶","2.高空作业坠落伤人：搭设牢固作业平台，配齐防护设施","3.棚体、门柱吊装倾倒伤人：多人协同作业，规范起吊，增设临时加固","4.巷道成型跑偏、支护失稳：实时校核中线腰线，严控支护参数","5.活矸危石掉落伤人：作业前彻底找顶，专人观山盯顶板"]},{"t":"三、作业条件安全确认","p":["1.环境确认：交岔点前后巷道支护加固完成，浮煤、矸石、杂物清理干净，退路畅通。","2.顶板确认：全面敲帮问顶，活矸危岩全部清理，围岩稳定无异常。","3.设施确认：作业平台、防护栏杆搭设牢固，电缆、管路做好防护，警戒区域设置到位。","4.材料确认：前探梁、U 型钢棚、锚杆锚索、门柱、点柱、联锁材料等齐全合格。","5.人员确认：每班配置到位，分工明确，高空、起吊作业人员技能达标，互保联保落实。","6.技术确认：施工图纸、专项措施齐全，中线、腰线标定完成，全员培训交底到位。"]},{"t":"四、作业现场人员安全站位","p":["1.全员站在支护完好、顶板稳定的安全区域，严禁在空顶区、应力集中区逗留。","2.高空作业人员站在作业平台内，严禁探头、探身作业，下方禁止站人。","3.架棚作业时，人员避开棚体倾倒、滑动范围。","4.起吊门梁、门柱时，人员站在机具及构件侧面，严禁站在吊物正下方。","5.处理片帮、活矸时，站在矸石滚落方向的侧面安全位置。"]},{"t":"五、标准化作业流程","p":["技术交底+现场标定中线腰线→前后巷道加固+场地清理→搭设作业平台+设置警戒→分段分层扩刷成型→敲帮问顶+临时支护架设→永久支护施工（架棚/锚网索）→门柱、门帘安装加固→矿压监测+围岩观测→班组自检+清理现场"]},{"t":"六、作业质量标准","p":["1.巷道成型：严格按照中线、腰线、曲率施工，无超挖、欠挖，线型规整。","2.棚体支护：常规棚距0.6m，应力集中段棚距 0.4~0.5m；卡缆扭矩、迎山角、下叉角符合设计，帮顶背严背实。","3.锚网索支护：间排距、孔深、锚固力、预紧力达标，按要求开展拉拔试验。","4.门帘门柱：安装垂直牢固，与主体支护紧密连接，增设点柱、联锁，整体稳定性达标。","5.临时支护：前探梁紧跟迎头，严格控制空顶距，严禁空顶作业。","6.矿压监测：顶板离层仪、矿压观测点布设规范，数据记录完整。"]},{"t":"七、安全管控措施","p":["1.施工管控：执行措施要求、由外向里、由上至下、小进尺原则，拆棚遵循 “拆一护一”，严禁大断面开挖、多棚连拆。","2.顶板管控：每班作业前、循环施工中、交接班前后全程敲帮问顶；顶板破碎地段采用撞楔、钎椽超前控顶，专人不间断观山。","3.高空与起吊管控：高空作业平台必须牢固，防护齐全；大件吊装统一指挥，吊具完好，严禁超载、歪拉斜吊。","4.支护质量管控：所有支护构件参数严格执行设计，扭矩、锚固力、预紧力逐项验收，不合格立即返工。","5.矿压管控：每日观测围岩变形、矿压数据，数值异常立即停工，撤离人员并补强支护。","6.人员行为管控：高风险作业管理人员、安检员双盯守，严禁违章指挥、冒险作业；全员配齐劳保用品，互保联保落实到位。","7.验收闭环管控：执行班组自检、副队长复检验收；图纸、观测数据等资料统一归档，隐患当班整改闭环。"]}]}],"w":1756,"cn":3,"sn":12},{"c":"JJ-B-02","n":"掘进机主要部件检修","t":"JJ-B-02 掘进机主要部件检修模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范EBZ-135掘进机截割部、铲板部、刮板输送机、行走部、液压系统、电气系统等主要部件的日常检修与专项检修作业行为，统一停电闭锁、液压泄压、部件拆装、试运转标准，杜绝触电、高压油喷溅、起吊坠落、部件挤压、试运转伤人事故，实现检修全过程风险可控、验收闭环，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于掘进机主要部件日常检修、周期性保养、部件更换、搬家前拆解检修全部工序。"]},{"t":"三、管理原则","p":["1.先停电闭锁、后检修；先泄压、后拆管；先固定、后起吊；不安全、不施工。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、检修有记录、试运转有监护、验收有闭环。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：机电班长、检修工、电钳工、掘进机司机、安检员"]},{"t":"二、核心职责","p":["队长、支部书记：检修计划、备件、人员统筹。","机电副队长：检修方案制定、技术指导、检修质量总验收。","安全技术副队长：检修模块化标准卡制定、隐患督办、考核落实。","跟班副队长：检修现场总负责，停电闭锁确认，大件起吊盯守。","机电班长：检修分工、备件管理、完工自检、试运转组织。","检修工、电钳工：按标准拆检、更换配件，规范泄压、停送电操作。","掘进机司机：配合试运转，日常巡检，异常立即停机汇报。","安检员：监督停电、起吊、试运转工序，查处违章检修。"]}]},{"t":"第三章  掘进机主要部件检修模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-B-02","模块名称：EBZ-135掘进机主要部件检修","所属专业：机电、掘进","适用范围：掘进机检修全体作业人员"]},{"t":"二、危险预知及防控","p":["1.未停电触电伤人：严格停电、验电、放电、挂牌闭锁，专人看管开关","2.液压管路高压油喷溅：拆管前彻底泄压，侧身操作避开喷射方向","3.起吊索具断裂大件坠落：吊具每班检查，严禁超载歪拉斜吊","4.截割部、行走部意外转动伤人：检修前插销固定、断电闭锁","5.部件拆装挤压夹手：隔离传动部位，多人配合统一指挥","6.试运转误操作伤人：点动先行，人员撤离运转范围"]},{"t":"三、作业条件安全确认","p":["1.环境确认：检修地点前后10m支护完好，顶板无活矸，设备两侧检修空间不小于0.8m，退路畅通。","2.电气确认：掘进机供电开关停电、验电、放电、闭锁，挂“有人工作，禁止送电”牌，专人看管。","3.液压确认：截割头落地、铲板落地，各操作手柄归零，系统泄压完毕，油缸卸载。","4.起吊确认：3t及以上合格手拉葫芦、钢丝绳、马蹄环，起吊点（U型钢棚梁）加固完好。","5.备件确认：截齿、密封件、高压胶管、滤芯、履带板、螺栓等备件及防爆工具、接油容器齐全。","6.人员确认：检修、电钳人员持证上岗，每班不少于3人，互保分工明确。","7.技术确认：检修项目、风险专项班前交底，模块化标准卡随身携带。"]},{"t":"四、作业现场人员安全站位","p":["1.停电、验电人员站干燥支护完好侧，严禁在积水、潮湿区域操作电气部件。","2.起吊作业人员全部站在吊物两侧支护完好区，严禁吊物正下方站立、通行。","3.拆卸液压管路侧身操作，避开高压油喷射方向。","4.拆装截割头、刮板链时人员避开部件下落、滑移方向，严禁将手脚伸入啮合部位。","5.试运转前所有人员撤离截割头、铲板、刮板运转范围，司机单人操作。"]},{"t":"五、标准化作业流程","p":["检修班前专项交底→掘进机停机、截割头落地→逐级停电验电放电闭锁挂牌→液压系统泄压卸载→机身支垫固定→检修区域警戒→截割部检修（截齿、齿座、喷雾、伸缩部）→铲板部及一运检修（刮板链、耐磨板、驱动装置）→行走部检修（履带张紧、支重轮、驱动轮润滑紧固）→液压系统检修（油位油质、滤芯、管路密封接头）→电气系统检修（防爆面、接线、保护整定、闭锁）→防护罩全部恢复→撤警戒、确认无人→分步点动试运转→空载全流程试机→班组自检、机电联合验收→记录检修台账"]},{"t":"六、作业质量标准","p":["1.截割部：截齿缺损、磨损超限当班更换，齿座焊缝无开裂，喷嘴畅通、雾化良好，伸缩部无渗漏。","2.铲板及一运：刮板链松紧适度、刮板无缺失变形，链轮磨损不超限，耐磨板、连接螺栓紧固齐全。","3.行走部：履带张紧适度（中部下挠度15—20mm），支重轮、引导轮、驱动轮无渗漏、润滑良好，履带板螺栓齐全紧固。","4.液压系统：液压油牌号符合规定、油位在液位计规定范围，各接头无渗漏，滤芯按周期更换，油温不超过80℃，系统压力不超过整定值。","5.电气系统：防爆面无损伤锈蚀并涂防锈油，接线无失爆、无“鸡爪子、羊尾巴、明接头”，接地牢固，保护整定符合规定、动作灵敏，急停闭锁可靠。","6.整机试运转：空载运行不少于30min，行走、截割、装载、运输、喷雾各系统运转无异响、无卡滞、无渗漏，油温、压力正常。"]},{"t":"七、安全管控措施","p":["1.停电闭锁管控：严格执行“谁停电、谁送电”，严禁约时送电，检修全程专人看守开关；瓦斯浓度超过0.5%严禁检修电气设备。","2.液压泄压管控：任何管路拆卸前必须泄压，未泄压严禁松动接头；拆开的油口及时封堵，严防脏物进入。","3.起吊管控：起吊前检查索具磨损、裂纹，吊点选在专用吊耳或棚梁加固点，严禁以手把、接线嘴作吊点；重物离地0.1m时停下检查确认；双葫芦起吊均衡受力、统一指挥。","4.截割头检修管控：检修截割部必须断电闭锁并将截割头落地，插好防转销，更换截齿时司机离开操作台并断电。","5.备件回收管控：废油、旧件集中回收升井，严禁随意丢弃污染巷道。","6.验收闭环管控：检修完工分步自检，电气、液压、传动全部合格方可交付使用，故障未消除严禁投产，检修记录当班归档。"]}]}],"w":2098,"cn":3,"sn":12}],"os":"二","rn":"中风险","rc":"橙","rg":"B","n":2,"label":"中风险 · 橙色 B段"},{"t":"三、低风险-蓝色-C段（18项）","lv":"C","m":[{"c":"JJ-C-01","n":"锚网支护","t":"JJ-C-01 锚网支护模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范掘进工作面锚网支护作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝空顶、片帮、钻机伤人、支护失效等安全隐患，提升掘进安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有掘进工作面锚网支护全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先支护、后掘进；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、作业人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章  掘进锚网支护模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-01","模块名称：锚网支护","所属专业：掘进","适用范围：掘进所有人员"]},{"t":"二、危险预知及防控","p":["1.空顶冒顶伤人：严禁空顶作业，先支后作业","2.钻机反弹伤人：扶牢站稳，避开旋转范围，规范操作","3.片帮掉矸伤人：作业全程敲帮问顶，及时清理活矸","4.锚固失效：严控孔深、搅拌时间、固化时间、扭矩、预紧力"]},{"t":"三、作业条件安全确认","p":["1.环境确认：顶板、煤壁稳定，敲帮问顶完成，瓦斯≤0.5%，通风正常，退路畅通","2.设备确认：锚杆钻机完好，风压 / 水压正常，工具齐全","3.材料确认：锚杆、锚索、托盘、锚固剂、网片等材料合格足量","4.人员确认：持证上岗，≥2 人配合作业，互保联保明确"]},{"t":"四、作业现场人员安全站位","p":["1.站在顶板完好，无危矸顶板下","2.紧握钻机，不准背对煤墙或帮部","3.拆风水管时侧身站，防止带压风水管伤人","4.不得骑凿岩机气腿，打钻期间钻机前方不得站人"]},{"t":"五、标准化作业流程","p":["敲帮问顶→挂网联网→标定眼位→钻孔（控制深度、角度）→清孔（吹/冲净岩粉）→装锚固剂→安装搅拌锚杆/锚索→等待固化→紧固扭矩/张拉预紧力→自检+清理现场"]},{"t":"六、作业质量标准","p":["1.锚杆间排距：误差±50mm；锚杆外露：10–50mm","2.锚索间排距：误差±50mm；锚索露头：150–300mm","3.网片搭接≥100mm，联网点间距≤200mm","4.搅拌≥30s，固化≥120s","5.锚杆预紧力不小于200N.m；锚索预紧力不小于30Mpa（200KN）","6.锚杆锚固力不小于157KN；锚索锚固力不小于38Mpa（250KN）"]},{"t":"七、安全管控措施","p":["1.空顶管控：严格执行 “先控顶、后支护” 规定，严禁超循环作业；临时支护必须紧跟迎头，空顶区严禁站人、严禁堆放物料、严禁任何人员逗留。","2.钻机作业管控：钻机操作人员必须持证上岗，严禁钻机带病运转；作业时人员站位必须规范，严禁站在钻机正前方、旋转范围内及气腿受力方向；扶机人员站稳扶牢，防止钻机反弹、倾倒伤人。","3.敲帮问顶管控：每班作业前、支护前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；作业过程中随时观察顶板变化，发现异常立即撤人。","3.支护质量管控：严格按设计控制锚杆、锚索间排距、角度、深度、扭矩、预紧力；严禁减少锚固剂数量、缩短搅拌时间、提前紧固；扭矩扳手、张拉仪必须定期校验，确保数据真实有效。","4.人员行为管控：严禁单人独立支护作业，必须2 人及以上配合作业、互保联保到位；作业人员必须佩戴齐全劳动保护用品，严禁违章指挥、违章作业、违反劳动纪律。","5.现场文明管控：作业现场物料分类堆放整齐，风水管路吊挂规范、无跑冒滴漏；工具、配件定点存放，通道保持畅通，无杂物、无浮矸、无积水。","6.验收闭环管控：支护作业完成后，必须执行班组自检、副队长复验验收程序；验收不合格严禁进入下一道工序，问题必须当班整改。"]}]}],"w":1538,"cn":3,"sn":12},{"c":"JJ-C-02","n":"抽放钻孔施工","t":"JJ-C-02 抽放钻孔施工模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范掘进工作面瓦斯抽放钻孔作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝瓦斯超限、喷孔顶钻、封孔漏气、管路积水、机械伤人等安全隐患，提升瓦斯治理效果与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井抽放孔施工全工序作业、现场管理全过程，包含钻孔施工、封孔、联网、抽放观测等工作。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先抽后掘、先抽后采；瓦斯不达标不生产；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长、探放班组长","成  员：安检员、钻机司机、辅助工、瓦斯检查员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责抽放钻孔模块化管理整体工作。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","探放班组长：抽放钻孔施工总体协调管理，质量监督。","班组长：当班自检复检、问题上报、现场人员调配。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","钻机司机、辅助工：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。","瓦斯检查员：监测瓦斯、一氧化碳浓度，异常立即处置。"]}]},{"t":"第三章 瓦斯抽放钻孔施工模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-02","模块名称：瓦斯抽放钻孔施工","所属专业：一通三防","适用范围：抽放钻孔施工作业所有人员"]},{"t":"二、危险预知及防控","p":["1.瓦斯超限爆炸、中毒：全程气体监测，浓度超标立即停工撤人","2.喷孔、顶钻伤人：低速钻进，配备防喷装置，异常及时停机处置","3.机械运转、钻杆伤人：规范操作钻机，避开设备运转范围","4.封孔注浆管路崩裂伤人：严控注浆压力，按配比搅拌浆液","5.电气失爆引发隐患：机电设备定期检查，杜绝失爆现象","6.粉尘危害：开启防尘设施，全员佩戴防尘劳保用品"]},{"t":"三、作业条件安全确认","p":["1.环境确认：巷道支护完好，敲帮问顶完成，作业区域杂物清理干净，通风正常；通讯、视频、照明到位。","2.气体确认：瓦斯浓度≤0.5%，一氧化碳浓度合规，无气体异常涌出。","3.设备确认：钻机及附属管路、阀门完好，风压正常，机电无失爆。","4.材料确认：钻头、钻杆、囊袋、注浆料、抽放管、筛管、三通阀门等材料合格、数量充足。","5.人员确认：全员持证上岗，每台钻机不少于 3 人配合作业，互保联保明确。","6.技术确认：瓦斯治理方案、专项措施齐全，培训交底全部完成。"]},{"t":"四、作业现场人员安全站位","p":["1.站在顶板、煤壁完好，无危矸活岩的支护区域内作业。","2.钻机钻进时，人员严禁站在钻杆正前方、后方、设备旋转及受力范围内。","3.拆装钻杆、设备分体运输时，避开管件、机具摆动方向。","4.封孔、注浆作业时侧身站立，严禁正对注浆口、管路接口。","5.开启、关闭管路阀门时侧身操作，防止高压气流、浆液喷溅伤人。"]},{"t":"五、标准化作业流程","p":["技术交底+现场标定孔位→场地规整+设备检修就位→警戒设置→开孔钻进→循环排渣+钻进至设计深度→两堵一注囊袋封孔注浆→稳压凝固→抽放管路联网安装→抽放参数动态观测→隐患排查整改→自检+清理现场"]},{"t":"六、作业质量标准","p":["1.孔位：开孔位置偏差≤200mm，倾角、偏角偏差≤1°。","2.钻进：浅孔、深孔选用对应钻机及钻具，软煤地段降速减压钻进，严禁施工虚孔、废孔。","3.封孔：采用两堵一注囊袋式封孔，封孔深度符合设计要求；注浆水灰比1:1~1.2，囊袋注浆压力≥1.0MPa，中段注浆压力≥1.5MPa，每段稳压 5min。","4.管路：主管采用 DN200 软管，分支使用 φ50mm 实管/筛管或φ32mm 筛管；管路吊挂平直、无弯折、无积水。","5.联网：钻孔完工及时接入抽放系统，三通、阀门启闭灵活，接口严密不漏气。","6.观测：定期检测抽放浓度、负压、流量，台账记录完整、数据真实。"]},{"t":"七、安全管控措施","p":["1.瓦斯管控：瓦斯浓度达到0.5%立即停工撤人；一氧化碳浓度超过规定，立即停钻并注水处置。","2.钻机作业管控：钻机分体运输、起吊严格执行措施，斜巷轨道运输落实“行人不行车、行车不行人”；作业全程使用孔口防喷装置，出现喷孔、瓦斯异常立即断电、停钻、撤人并上报。","3.封孔注浆管控：严格按照配比拌料，控制注浆压力，出现跑浆及时补封，严禁违规加压作业。","4.防爆防火管控：作业区域杜绝电气失爆、铁器撞击、明火，消防器材齐全完好。","5.综合防尘管控：作业点水幕、捕尘网、降尘装置正常开启，人员按规定佩戴防尘口罩。","6.人员行为管控：严禁单人独立操作钻机，作业人员配齐劳保用品，杜绝三违行为。","7.验收闭环管控：执行班组自检、业务科室两级验收；资料台账、视频记录完整归档，验收合格。"]}]}],"w":1829,"cn":3,"sn":12},{"c":"JJ-C-03","n":"喷浆施工","t":"JJ-C-03 喷浆施工模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"","p":["1.1 编制目的","为规范掘进巷道喷浆施工作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝堵管喷料、机械伤人、高空坠落、粉尘伤害、喷层开裂空鼓等安全及质量隐患，提升巷道封闭效果与工程质量，特制定本方案。","1.2 适用范围","本方案适用于矿井所有巷道初喷、复喷、围岩封闭、补强加固全工序作业、现场管理全过程。","1.3 管理原则","1.先确认、后作业；先处理隐患、后喷浆；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、喷浆机司机、喷浆工、拌料工、辅助工"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责喷浆模块化管理整体工作。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报、人员及工序调配。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","喷浆机司机、喷浆工、拌料工：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章  喷浆施工模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-03","模块名称：喷浆施工","所属专业：掘进","适用范围：喷浆作业所有人员"]},{"t":"二、危险预知及防控","p":["1.堵管喷料、高压风伤人：规范开停机顺序，处理堵管必须先泄压","2.粉尘吸入伤害：防尘设施正常开启，全员佩戴防尘防护用品","3.高空作业坠落伤人：搭设合格作业平台，严禁无防护高空作业","4.机电设备伤人、失爆隐患：设备定期检修，严格执行停送电制度","5.物料滚落、机具磕碰伤人：物料规范码放，作业区域秩序井然","6.喷层开裂、空鼓脱落：严格控制配比、厚度、养护周期"]},{"t":"三、作业条件安全确认","p":["1.环境确认：巷道浮煤、浮矸、松动岩块清理完毕，巷道支护完好，退路畅通。","2.设备确认：喷浆机、风水管路完好无破损、无漏风漏水，机电设备不失爆。","3.物料确认：水泥、砂、石子、速凝剂等原材料合格，无结块、失效现象。","4.防护确认：电缆、监控、抽放管路等设施全部遮挡防护，风流净化水幕、降尘装置正常。","5.人员确认：每班按要求安排人员配合作业，人员技能达标，互保联保责任明确。","6.技术确认：喷浆专项措施、技术交底到位，厚度、配比、养护标准全员熟知。"]},{"t":"四、作业现场人员安全站位","p":["1.站在支护完好、顶板无危矸的安全区域作业。","2.喷浆作业时，喷头前方严禁站人，人员站在喷头侧面。","3.处理堵管时，喷头及管路出口方向禁止正对人员。","4.高空喷浆作业人员站在作业平台内，下方设置警戒、禁止人员停留。","5.拌料、转运物料时，避开管路、机具旋转部位，防止磕碰受伤。"]},{"t":"五、标准化作业流程","p":["技术交底+安全确认→巷道基面清理+设施防护→设备管路检查+防尘设施开启→按配比拌料→开水→开风→送电→喂料（分层喷射）→循环喷射作业→停机收尾→现场清理+回弹料转运→自检+场地规整"]},{"t":"六、作业质量标准","p":["1.混凝土配比：强度等级 C20，水泥：砂：石子= 1:2:2，掺加合格速凝剂。","2.喷射厚度：常规地段平均厚度≥50mm，覆盖网体 / 锚杆处厚度≥20mm，单次喷射最大厚度≤100mm。","3.风压水压：正常风压≥0.5MPa，水压比风压高0.1MPa。","4.喷射工艺：喷头与受喷面间距 0.8～1.2m，喷射夹角≥70°；采用圈压螺旋喷射法，遵循先帮后顶、由下至上顺序。","5.分层喷射：顶部分层厚度≤50mm，帮部≤100mm，层间间隔不少于15min。","6.外观：喷层密实、平整，无空鼓、开裂、露网、大面积回弹。"]},{"t":"七、安全管控措施","p":["1.设备操作管控：严格执行 “开水→开风→送电→喂料” 开机顺序，停机顺序反向；设备严禁带病运转，机电设备执行停送电制度，杜绝失爆。","2.堵管处置管控：出现堵管必须先停料、彻底泄压后再疏通，全程严禁喷头正对人员。","3.高空作业管控：高空喷浆必须搭设牢固作业平台。","4.综合防尘管控：作业点下风侧水幕、降尘装置全程开启，作业人员必须佩戴防尘口罩、防护眼镜等劳保用品。","5.物料管控：物料分区码放、挂牌存放，堆放点距作业面不大于50m；随拌随用，严禁使用结块、过期水泥。","6.文明施工管控：喷浆完成后及时清理回弹料、落地浆料，做到工完料净、场地整洁。","7.质量管控：严格执行配合比、喷射厚度标准，对厚度不足、空鼓、开裂部位及时凿除修补。","8.验收闭环管控：执行班组自检、区队验收两级验收；施工记录、验收资料统一归档。"]}]}],"w":1770,"cn":3,"sn":10},{"c":"JJ-C-04","n":"带式输送机安装","t":"JJ-C-04 带式输送机安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下带式输送机安装作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝起重伤害、机械挤压、触电、物件滚落、支护失稳等安全隐患，保障设备安装质量与运行安全，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有掘进巷道带式输送机整机、部件安装、调试、试运转全工序作业及现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后检修；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：班组长、安检员、电钳工、辅助工"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责本模块模块化管理工作。","机电副队长：技术交底、技术指导、设备验收。","安全技术副队长：标准卡制定、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报、人员分工与工序管控。","安检员：安全条件确认、风险防控监督、制止违章、监督作业标准。","电钳工、辅助工：严格按标准作业，落实互保联保，自检自查、文明施工。"]}]},{"t":"第三章  带式输送机安装模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-04","模块名称：带式输送机安装","所属专业：掘进","适用范围：带式输送机安装全体作业人员"]},{"t":"二、危险预知及防控","p":["1.起重吊装物件坠落伤人：检查吊具、规范起吊，严禁超载、歪拉斜吊","2.设备、部件挤压夹伤：多人协同配合，手脚远离受力及对接部位","3.触电伤人：严格执行停送电、验电、挂牌闭锁制度","4.皮带跑偏、部件滑动伤人：安装找平找正，临时固定牢固","5.高空作业坠落伤人：搭设合格作业平台，落实防护措施","6.物料滚落、巷道落矸伤人：作业前全面敲帮问顶，物料码放规范"]},{"t":"三、作业条件安全确认","p":["1.环境确认：巷道支护完好，敲帮问顶完成，无活矸危岩，作业空间、安全退路畅通。","2.巷道确认：安装底板平整、夯实，巷道坡度、中线符合设计要求。","3.设备材料确认：机架、滚筒、托辊、皮带、电机、减速器、紧固件等配件齐全、检验合格。","4.工器具确认：手拉葫芦、钢丝绳、扳手、起重索具、测量工具完好可靠。","5.电气系统确认：供电线路、开关、保护装置完好，执行断电闭锁。","6.人员确认：全员持证上岗，作业人员配齐劳保用品，互保联保分工明确。","7.技术确认：安装措施、技术交底落实到位，安装尺寸、标准全员熟知。"]},{"t":"四、作业现场人员安全站位","p":["1.作业人员站在支护完好、无危矸的安全区域。","2.起吊作业时，人员严禁站在吊物正下方、吊具受力两侧。","3.设备对接、就位时，手脚不得伸入设备缝隙、对接面之间。","4.牵拉、展放皮带时，人员站在皮带侧面，禁止跨站、骑站皮带。","5.高处安装作业必须站在稳固平台内，下方设置警戒，禁止人员逗留。","6.转动部件安装调试时，远离滚筒、传动部位运转范围。"]},{"t":"五、标准化作业流程","p":["技术交底 + 现场放线标定中线 → 巷道清理 + 基础修整 → 停送电闭锁 + 设置警戒 → 起吊安装机头架、机尾架 → 铺设安装中间机架 → 安装滚筒、托辊、缓冲装置 → 展放、对接、张紧输送带 → 安装电机、减速器、防护装置 → 敷设接线、完善电气保护 → 人工试运转 + 逐项调试 → 空载试运转 → 自检 + 清理现场"]},{"t":"六、作业质量标准","p":["1.机架：整机中线与设计中线重合，机架连接牢固、平稳无晃动。","2.水平坡度：机架横向水平、纵向坡度符合设计，地脚螺栓紧固齐全。","3.托辊：托辊转动灵活、间距均匀，无缺失、卡阻，与皮带垂直。","4.输送带：皮带接头平整、接口对齐，张紧力度适宜，无跑偏、撕裂、划伤。","5.传动系统：电机、减速器连接同轴度达标，联轴器间隙合规，运转无异响、无渗漏油。","6.保护装置：跑偏、堆煤、烟雾、温度、防滑、急停等安全保护齐全、动作灵敏可靠。","7.防护设施：所有传动、转动部位护罩齐全牢固，防护栏、过桥安装到位。"]},{"t":"七、安全管控措施","p":["1.起吊作业管控：起吊点必须牢固，索具、葫芦定期检查，统一指挥、专人监护；严禁超载、歪拉斜吊，吊物悬空状态下人员禁止穿越。","2.停送电管控：严格执行 “停电、验电、放电、挂牌、闭锁、上锁” 制度，严禁带电作业。","3.部件安装管控：设备对接、对位专人指挥，严禁将手脚伸入结合面；大件挪移平稳缓慢，防止倾倒、滑动。","4.皮带展放管控：展放皮带统一口令、同步操作，禁止人员踩踏、跨越待对接皮带。","5.高空作业管控：高处安装必须搭设牢固平台，严禁徒手攀爬设备及巷道支护。","6.试运转管控：试运转前全面检查，确认无人在设备内部及运转范围内后方可送电；先点动、后空载试运行，发现异常立即停机断电。","7.人员行为管控：严禁单人开展大件安装、起吊作业，全员佩戴劳保用品，杜绝三违行为。","8.验收闭环管控：执行班组自检、区队复检、业务科室联合验收，验收不合格严禁投入使用，问题当班整改闭环。"]}]}],"w":1894,"cn":3,"sn":12},{"c":"JJ-C-05","n":"刮板输送机安装","t":"JJ-C-05 刮板输送机安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下刮板输送机安装作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝起重伤害、链条挤伤、设备倾倒、触电、部件弹崩等安全隐患，确保设备安装合格、运行稳定，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井掘进工作面及巷道内各类刮板输送机整机安装、部件组装、接链、调试、试运转全工序及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后安装；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：班组长、安检员、电钳工、辅助工"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责本模块模块化管理工作。","机电副队长：技术交底、技术指导、设备验收。","安全技术副队长：标准卡制定、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报、人员分工与工序管控。","安检员：安全条件确认、风险防控监督、制止违章、监督作业标准。","作业人员：严格按标准作业，落实互保联保，自检自查、文明施工。"]}]},{"t":"第三章  刮板输送机安装模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-05","模块名称：刮板输送机安装","所属专业：掘进","适用范围：刮板输送机安装全体作业人员"]},{"t":"二、危险预知及防控","p":["1.起吊大件坠落伤人：吊具完好，严禁超载，专人指挥监护","2.溜槽、机头机尾倾倒挤压伤人：临时支撑固定牢固，缓慢对位","3.刮板链条弹崩、夹手伤人：接链、紧链规范操作，避开链条受力方向","4.触电伤人：严格执行停电闭锁，禁止带电作业","5.零部件滚落、活矸伤人：敲帮问顶到位，物料堆放稳固","6.狭小空间磕碰伤人：作业空间保持畅通，协同配合有序"]},{"t":"三、作业条件安全确认","p":["1.环境确认：巷道支护完整，敲帮问顶完毕，无危矸活岩，作业空间、安全退路畅通。","2.基础确认：铺设区域底板平整、无积水浮矸，巷道坡度符合设计。","3.设备配件确认：机头、机尾、溜槽、刮板链、电机、减速器、连接件等齐全合格。","4.工器具确认：起重葫芦、紧链器、扳手、撬棍、吊具等工具完好有效。","5.电气设施确认：开关、电缆、保护装置完好，已执行断电、验电、挂牌闭锁。","6.人员确认：全员持证上岗，人员配置充足，互保联保明确，劳保用品佩戴齐全。","7.技术确认：专项措施、技术交底完成。"]},{"t":"四、作业现场人员安全站位","p":["1.全员站在支护完好的安全区域，不得在设备倾倒范围内停留。","2.起吊作业时，设置警戒，严禁站在吊物正下方及索具两侧受力位置。","3.对接溜槽、组装机头机尾时，手脚远离溜槽接缝、设备结合部位。","4.紧链、接链作业时，人员站在链条侧面，禁止正对链条受力方向。","5.试运转时，人员远离链轮、链条等转动部位。"]},{"t":"五、标准化作业流程","p":["技术交底 → 巷道清理 + 底板平整 → 断电闭锁 + 设置警戒 → 起吊安装机头总成 → 依次铺设对接中部溜槽、下链 → 安装机尾总成 → 铺设、对接刮板链条 → 调整链条张紧度 → 安装电机、减速器、传动部件 → 安装护罩 电气接线 → 空载试运转调试 → 自检 + 清理现场"]},{"t":"六、作业质量标准","p":["1.整机走向：沿巷道一侧铺设，整机平直。","2.溜槽：溜槽对接严密、平整，无错茬、松动。","3.链条刮板：链条松紧适度，刮板齐全、方向一致，无变形、缺件、卡阻。","4.传动系统：电机、减速器安装稳固，同轴度达标，运转无异响、无漏油。","5.机头机尾：固定牢靠，锚固装置按要求安装到位，无晃动、移位。","6.保护装置：过载、急停、漏电等保护齐全灵敏，试验合格。","7.防护设施：链轮、传动部位护罩齐全牢固，喷雾齐全灵敏。"]},{"t":"七、安全管控措施","p":["1.起吊管控：起吊机具、索具提前检查，统一指挥、专人监护，大件分次吊装。","2.设备组装管控：溜槽、机头机尾就位必须先做临时支撑固定，再进行连接，防止倾倒。","3.接链紧链管控：紧链时人员避开链条回弹范围。","4.电气管控：严格执行停送电制度，接线由持证电工操作，杜绝失爆、漏电隐患。","5.试运转管控：试运转前清理设备周边杂物，确认人员撤离至安全区域后方可送电；先点动、再空载运行。","6.现场管控：设备周边物料分类码放，通道保持畅通；狭小区域作业相互提醒，防止磕碰。","7.人员管控：多人协同作业口令统一、动作同步，严禁单人开展大件组装、紧链作业。","8.验收闭环管控：实行班组自检、联合验收，验收合格方可投用，问题逐项整改闭环。"]}]}],"w":1716,"cn":3,"sn":12},{"c":"JJ-C-06","n":"带式输送机拆除","t":"JJ-C-06 带式输送机拆除模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下带式输送机拆除作业行为，统一施工流程、安全风险防控、质量及物料管控标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝物件坠落、挤压伤人、触电、设备倾倒、皮带弹甩等隐患，做到安全拆除、物料完好、现场整洁，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井掘进巷道内带式输送机整机、部件、输送带拆除、拆解、转运全工序及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后拆除；先固定、后拆解；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：班组长、安检员、电钳工、起重工、辅助工"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责带式输送机拆除模块整体管理工作。","机电副队长：技术交底、技术指导、设备验收。","安全技术副队长：标准卡制定、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报、人员分工与工序管控。","安检员：安全条件确认、风险防控监督、制止违章、监督作业标准。","电钳工、辅助工：严格按标准作业，落实互保联保，自检自查、文明施工。"]}]},{"t":"第三章  带式输送机拆除模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-06","模块名称：带式输送机拆除","所属专业：掘进","适用范围：带式输送机拆除全体作业人员"]},{"t":"二、危险预知及防控","p":["1.设备部件坠落、倾倒伤人：拆解前临时固定，逐件稳妥下放转运","2.输送带弹甩、拖拽伤人：斜巷分段固定皮带，缓慢拖拽、卷收","3.触电伤人：断电闭锁，严禁带电拆解电气部件","4.零部件滚落、磕碰伤人：配件有序传递、码放，禁止抛掷","5.起吊索具断裂伤人：提前检查吊具，轻吊慢放，不超负荷","6.高空拆解坠落伤人：平台牢固，做好防坠防护"]},{"t":"三、作业条件安全确认","p":["1.环境确认：巷道支护完好，敲帮问顶完成，无活矸危岩，转运通道畅通。","2.设备确认：输送机已停止运行，断电、挂牌、闭锁、上锁完成。","3.固定措施确认：大件设备提前做好临时支撑、捆绑固定。","4.工器具确认：葫芦、索具、绳索、扳手、切割工具等完好齐全。","5.转运条件确认：运输车辆、轨道、巷道空间满足大件转运要求。","6.人员确认：人员配置充足、持证上岗，互保联保到位，劳保用品齐全。","7.技术确认：拆除措施、安全交底落实，拆解顺序、转运要求全员明确。"]},{"t":"四、作业现场人员安全站位","p":["1.站在支护完好、远离设备倾倒及坠落范围的安全区域。","2.拆解皮带时，人员站在皮带两侧，禁止跨立、正对皮带卷收方向。","3.起吊、下放部件时，严禁站在吊物正下方及摆动范围。","4.拆卸机头、机尾大件时，人员避开设备滑落、倾倒方向。","5.高处拆解作业，人员在平台内作业，下方设置警戒禁止通行。","6.传递零部件禁止正对他人，防止物件磕碰。"]},{"t":"五、标准化作业流程","p":["技术交底 + 现场安全警戒 → 整机断电闭锁 + 验电确认 → 拆除电气线路、开关及保护装置 → 拆除传动部件、电机、减速器 → 分段放松、捆绑、拆解输送带 → 逐段拆除托辊、附属防护设施 → 拆解中间机架并分类码放 → 起吊拆除机尾架或机头架 → 所有配件、部件分类清点、捆绑转运 → 全面自检 + 巷道清理"]},{"t":"六、作业质量标准","p":["1.拆解顺序：严格按照 “由上到下、由外到内、先附属后主体” 顺序拆解，严禁乱拆硬撬。","2.部件防护：零部件、螺栓、连接件分类收集、捆绑完好，无丢失、无变形、无损坏。","3.输送带：分段卷收、捆绑牢固，无撕裂、划伤、折损，摆放规整。","4.机架大件：拆解后平稳落地、临时固定，转运捆绑牢固，运输不超高、不超宽。","5.现场标准：拆除完毕后巷道无杂物、无浮矸，物料码放整齐，通道畅通。","6.电气配件：电缆、开关、接线盒整理盘放，绝缘层完好，无挤压破损。"]},{"t":"七、安全管控措施","p":["1.电气管控：全程执行断电闭锁制度，拆接线由持证电工操作，严禁带电作业。","2.皮带拆解管控：必须分段固定（斜巷）后再松放、拖拽，多人同步操作，禁止猛然松放皮带。","3.大件拆解管控：机头、机尾、机架拆解前必须确认牢固，使用葫芦缓慢下放，防止倾倒、滚落。","4.起吊转运管控：吊具每班班前检查，轻吊慢放，统一指挥；大件转运严格执行巷道运输规定。","5.部件管控：所有零配件专人收集、分类存放，严禁抛掷、踩踏设备部件。","6.高空管控：高处拆解必须使用合格作业平台，严禁无防护登高作业。","7.人员行为管控：多人作业口令统一，相互监护，严禁单独开展大件拆解、起吊作业。","8.验收闭环管控：拆除完成后班组、管理人员逐级验收，清点设备配件，现场隐患、杂物全部清理闭环。"]}]}],"w":1776,"cn":3,"sn":12},{"c":"JJ-C-07","n":"刮板输送机拆除","t":"JJ-C-07 刮板输送机拆除模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下刮板输送机拆除作业行为，统一施工流程、安全风险防控、设备物料管控标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝设备倾倒、链条弹崩、挤压夹伤、触电、部件坠落等安全隐患，保证设备完好、现场规范，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井掘进巷道内各类刮板输送机拆解、断链、拆溜槽、拆机头机尾、设备转运全工序及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后拆解；先固定、后拆卸；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：班组长、安检员、电钳工、起重工、辅助工"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责刮板输送机拆除模块化管理工作。","机电副队长：技术交底、技术指导、设备验收。","安全技术副队长：标准卡制定、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报、人员分工与工序管控。","安检员：安全条件确认、风险防控监督、制止违章、监督作业标准。","作业人员：严格按标准作业，落实互保联保，自检自查、文明施工。"]}]},{"t":"第三章  刮板输送机拆除模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-07","模块名称：刮板输送机拆除","所属专业：掘进","适用范围：刮板输送机拆除全体作业人员"]},{"t":"二、危险预知及防控","p":["1.机头机尾、溜槽倾倒挤压伤人：拆解前加固支撑，逐件缓慢拆解下放","2.刮板链条回弹、夹手伤人：断链、拆链使用专用工具，避开链条受力方向","3.电气触电伤人：断电闭锁，禁止带电拆解电器件","4.零部件、溜槽滚落伤人：部件临时固定，平稳传递、严禁抛掷","5.起吊索具失效坠落伤人：提前检查吊具，不超载、规范起吊","6.巷道活矸、杂物伤人：作业前敲帮问顶，及时清理周边杂物"]},{"t":"三、作业条件安全确认","p":["1.环境确认：巷道支护完好，敲帮问顶到位，无活矸危岩，转运通道畅通无障碍。","2.设备确认：输送机停机，执行断电、验电、挂牌、闭锁、上锁。","3.固定防护确认：机头、机尾、长段溜槽提前使用绳索、支撑件临时固定。","4.工器具确认：葫芦、索具、扳手、撬棍等工具完好、规格匹配。","5.转运设施确认：运输车辆、轨道、巷道空间满足大件转运要求。","6.人员确认：作业人员充足、持证上岗，互保联保明确，劳保用品佩戴齐全。","7.技术确认：拆除安全技术措施交底完毕，拆解顺序、风险要点全员掌握。"]},{"t":"四、作业现场人员安全站位","p":["1.全体人员站在支护完好区域，远离设备倾倒、滑落范围。","2.断链、拆链作业时，人员站在链条两侧，严禁正对链条回弹方向。","3.拆解溜槽、机头机尾时，手脚不得伸入设备间隙及对接面。","4.起吊、下放大件时，禁止站在吊物正下方、索具摆动范围内。","5.传递配件时错位站立，禁止面对面抛掷零部件。","6.设备解体后摆放平稳，人员不在部件倾斜侧逗留。"]},{"t":"五、标准化作业流程","p":["技术交底 + 设置安全警戒 → 整机停机 + 断电验电 + 挂牌闭锁 → 拆除电气线路、开关及保护装置 → 拆除电机、减速器、传动护罩 → 使用专用工具断链、拆除刮板链条 → 拆除挡煤板、附属装置 → 分段拆解中部溜槽、逐段落地码放 →拆解机尾总成 → 拆解机头总成 → 所有设备、配件分类清点、捆绑 → 设备大件及配件转运 → 全面自检 + 清理巷道现场"]},{"t":"六、作业质量标准","p":["1.拆解顺序：遵循 “先电器、后传动，先附属、后主体，先链条、后溜槽” 顺序拆解，不硬撬、不蛮拆。","2.链条刮板：拆解后链条、刮板分类摆放，无扭曲、无断裂、配件齐全。","3.溜槽部件：溜槽拆解后平稳摆放，连接螺栓统一收集。","4.机头机尾：解体构件捆绑牢固，重心平稳，转运不超限。","5.零配件：螺栓、销子、连接件分类存放，做到不丢失、不混用。","6.电气部件：电缆、开关盘放整齐，绝缘层完好，插头、接线端无损坏。","7.现场环境：拆除完成后巷道干净整洁，物料分区码放，通道畅通。"]},{"t":"七、安全管控措施","p":["1.断电闭锁管控：设备断电后必须验电、挂牌、专人监护，全程严禁带电作业。","2.断链拆链管控：必须使用专用紧链、断链工具，禁止使用锚杆、钢管等替代；作业时专人监护，防范链条回弹。","3.大件起吊管控：起吊机具每班检查，大件分次起吊、缓慢下放，统一指挥、专人监护。","4.转运管控：设备、配件捆绑牢固，井下运输严格执行运输管理规定，防止掉落。","5.部件管控：零部件禁止抛掷、踩踏，小型配件统一收集保管，防止丢失。","6.协同作业管控：多人拆解动作同步、口令统一，狭小空间作业相互提醒监护。","7.验收闭环管控：拆除工作完成后当班验收，清点设备及配件，现场隐患、杂物全部清理整改闭环。"]}]}],"w":1801,"cn":3,"sn":12},{"c":"JJ-C-08","n":"掘进架棚支护","t":"JJ-C-08 掘进架棚支护模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下钢棚架设、维护全工序作业行为，统一施工流程、顶板风险防控、架棚质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝空顶、棚梁倾倒、片帮砸伤、抬运挤伤等安全隐患，提升巷道支护稳定性，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有巷道掘进、开口、交岔点架棚、复棚维修全工序、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先控顶、后架棚；先临时、后永久；先确认、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、支护工、辅助工、安检员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责架棚模块化整体管理。","安全技术副队长：架棚标准卡制定、技术交底、质量隐患督办、方案优化。","跟班副队长：班前安全交底，迎头架棚现场监督。","班组长：当班循环管控、架棚自检、隐患即时上报。","支护工：按标准挑顶、立棚、背帮背顶，落实临时支护优先。","安检员：空顶、立棚风险监督，制止违章空顶、歪棚作业。","辅助工：协同抬运棚材，物料规整，做好文明施工。"]}]},{"t":"第三章  掘进架棚支护模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-08","模块名称：掘进工作面架棚施工","所属专业：掘进支护","适用范围：架棚全体作业人员"]},{"t":"二、危险预知及防控","p":["1.空顶冒顶伤人：前探梁紧跟迎头，严控空顶距，禁止空顶下站人","2.棚梁倾倒、歪棚砸伤：中线迎山达标，撑木拉杆齐全，帮顶打紧背实","3.片帮活矸掉落伤人：作业期间全程敲帮问顶，专人观山","4.抬运钢棚挤压砸伤：二人以上同步抬运，统一口令，同起同落，轻抬轻放","5.高空作业坠落：搭设牢固作业平台，正确使用保险设施"]},{"t":"三、作业条件安全确认","p":["1.环境确认：顶板两帮稳定，敲帮问顶完毕，瓦斯≤0.5%，通风、降尘正常，安全退路畅通，视频、照明、通讯、压风自救、供水施救等设施到位。","2.设备确认：风镐、手镐、力矩扳手、风炮完好，风压水压稳定。","3.材料确认：棚梁棚腿、背板、拉杆、撑木、木楔、木鞋规格合格，足量码放。","4.人员确认：持证上岗，每班≥6人配合作业，互保联保责任明确。","5.技术确认：架棚中线、棚距、迎山标准交底到位。"]},{"t":"四、作业现场人员安全站位","p":["1.全体人员站支护完好、无危矸安全区域，禁止空顶区停留。","2.抬运棚材避开倾倒滚落方向。","3.上棚梁、立棚腿时，人员远离棚架内侧、正下方。","4.打顶背帮侧身站立，防止落矸伤人。"]},{"t":"五、标准化作业流程","p":["开工安全确认→全断面敲帮问顶→超前控顶→前移前探梁→上棚梁→调整中线→背顶→刷帮→清理柱窝→立棚腿→打帮→安装拉杆撑木→循环自检 + 现场清理"]},{"t":"六、作业质量标准","p":["1.棚距：偏差不大于50mm；中线偏差≤100mm。","2.棚体：棚梁水平高低差≤40mm，棚腿倾斜偏差≤1°。","3.附属：拉杆、撑木齐全紧固，顶帮打紧背实。","4.临时支护：临时支护必须紧跟迎头，超前支护距离符合规程。"]},{"t":"七、安全管控措施","p":["1.空顶管控：严格执行先护顶后架棚，临时支护必须紧跟迎头，严禁空顶作业，空顶区域外设置警戒。","2.架棚操作管控：抬运棚体不少于2 人协同，同步起落；立棚先临时支撑，再紧固拉杆，防止歪棚倾倒。","3.敲帮问顶管控：每班开工、每循环、交接班必须全面敲帮问顶，作业期间随时敲帮问顶，动态观测顶板，掉渣立即处理。","4.质量管控：严格控制棚距、中线、迎山，严禁缺拉杆、撑木、空帮空顶，不合格立即返工。","5.人员管控：禁止单人开展抬运、立棚等作业，全员佩戴完整劳保用品。","6.文明管控：支护材料分类平稳堆放，管线吊挂规范，通道无浮矸积水。","7.验收闭环管控：班组自检、跟班副队长验收，架棚质量不合格不得进入下一循环，隐患当班整改闭环。"]}]}],"w":1412,"cn":3,"sn":12},{"c":"JJ-C-09","n":"掘进泵窝施工","t":"JJ-C-09 掘进泵窝施工模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["规范掘进工作面临时排水泵窝、永久积水仓开挖、支护、设备安装模块化施工，防止坑槽片帮、积水淹巷、水泵漏电、管路爆裂、物料滑落伤人，统一开挖尺寸、支护、排水设备配套、防淹管控标准，实现排水系统标准化建设。"]},{"t":"二、适用范围","p":["适用于所有掘进工作面配套临时泵窝、永久水仓开挖、浇筑、水泵安装、管路敷设、防淤设施施工全工序。"]},{"t":"三、管理原则","p":["1.先支护、后开挖；先备排水设备、再开挖；积水动态管控；不安全不施工。","2.流程一步不省、积水风险全程管控、标准一点不降。","3.班班交底、开挖全程监护、完工验收、淤积水患闭环整改。第二章 组织机构及职责"]},{"t":"一、组织架构","p":["组长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成员：班组长、掘工、电钳工、安检员、瓦斯检查工"]},{"t":"二、核心职责","p":["队长、书记：泵窝工程物料、人员统筹，风险研判与管控。","安全技术副队长：泵窝尺寸、支护、排水配套设计，风险辨识与管控措施确定，模块化标准编制。","跟班副队长：泵窝开挖现场盯守，安全风险现场管控。","班组长：现场安全确认、管控措施执行、开挖工序、坑槽临时支护、现场清淤。","掘  工：分层开挖，及时架设临时护帮。","电钳工：潜水泵、排水管路、防爆开关安装检修。","安检员：安全风险监督。"]}]},{"t":"第三章  泵窝施工模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-09","模块名称：掘进泵窝/水仓施工","所属专业：掘进、机电、地测防治水","适用范围：泵窝全体作业人员"]},{"t":"二、危险预知及防控","p":["1.泵窝坑槽片帮坍塌伤人：分层开挖、周边同步临时支护，深度超过1.5m编制专项施工措施","2.涌水突增淹巷、淹没设备：排水设施齐全可靠，排水能力满足现场需要","3.潜水泵漏电触电：设备可靠接地、开关防爆闭锁","4.压风伤人：管路连接规范，掐接管路先卸压，严禁正对出风口","5.坑外工具、矸石滑落砸人：坑边围挡防护，工具、物料远离坑口，开挖煤矸及时清理","6.人员失足跌落泵窝：人员上下设置专用爬梯、四周硬质防护栏杆、警示标识","7.淤泥堆积堵塞管路：及时清淤，预留沉淀池"]},{"t":"三、作业条件安全确认","p":["1.巷道确认：泵窝前后 10m支护完好，无漏顶片帮，安全通道畅通。","2.排水设备确认：按要求配备排水设备、配套管路、阀门、防爆开关、电缆齐全，接地完好。","3.支护材料确认：荆笆、钎椽、木板、挡土护板、锚杆、网片、泵窝/水仓支护材料充足。","4.坑口防护确认：钢管栏杆、警示带、警示牌提前备料。","5.环境确认：迎头涌水量探明，无突水预兆，通风气体达标。","6.人员确认：每班不少于4 人，措施培训到位。","7.技术确认：泵窝尺寸图纸、施工安全技术措施、排水系统布置交底完成。"]},{"t":"四、作业现场人员安全站位","p":["1.泵窝开挖人员保持安全距离，1人施工1人安全监护，不超过4人，坑外监护人员站坑口外侧安全位置，禁止站在坑沿。","2.将物料运至指定地点，防止物料滑落坑内伤人，递运物料时严禁乱扔乱抛，防止砸伤人员。","3.水泵接线、检修人员站干燥支护区域，禁止积水内操作电气设备。","4.坑口周边禁止扎堆停留，监护人员全程观测坑壁四周稳定情况。"]},{"t":"五、标准化作业流程","p":["标定泵窝尺寸边线→坑口防护栏杆预装→分层开挖（每层≤0.8m）→每分层周边架设临时护帮支护→开挖至设计深度→泵窝支护→安装双套排水泵、敷设主管路→接地、防爆开关接线→排水试运转→坑口永久防护、悬挂警示标识→班组自检"]},{"t":"六、作业质量标准","p":["1.尺寸：临时泵窝长 × 宽 × 深符合设计。","2.开挖：分层开挖，严禁一次深挖，周边垂直无活矸、伞檐。","3.支护：采用木支护时，由下往上逐层支护。","4.排水：至少 2 台排水设备，一用一备。","5.电气：水泵、开关全部防爆，接地装置可靠。","6.坑口：坑口上部采用木板严密。","7.沉淀：进水侧设置沉淀池，便于定期清淤。"]},{"t":"七、安全管控措施","p":["1.开挖管控：分层逐段施工，挖一层护一层，出现裂隙、片帮立即停工进行加固。","2.排水管控：泵窝成型前备用泵必须提前就位。","3.电气管控：积水区域禁止带电检修，水泵故障先断电再处理，杜绝失爆。","4.坑口管控：停工坑口设置警戒，防止人员跌落。","5.清淤管控：每班开工前清理沉淀淤泥，防止堵塞管路造成淹巷。","6.盯守管控：泵窝开挖期间跟班副队长现场监护。","7.验收闭环：支护、排水设备、防护全部达标方可投入使用，管路渗漏等立即整改。"]}]}],"w":1608,"cn":2,"sn":12},{"c":"JJ-C-10","n":"设备检修","t":"JJ-C-10 设备检修模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["规范掘进工作面掘进机、巷道修复机、刮板 / 带式输送机等设备井下日常检修、周检、年度检修模块化作业，统一停电闭锁、起吊、液压泄压、零部件拆装、试运转标准，杜绝触电、机械挤压、液压喷溅、起吊坠落、设备溜车伤人，实现检修全过程风险可控、验收闭环。"]},{"t":"二、适用范围","p":["适用于掘进工作面掘进机、巷道修复机、刮板输送机、皮带机、钻探钻机、液压设备等日常检修、专项大修、搬家前拆解检修所有工序。"]},{"t":"三、管理原则","p":["1.先停电闭锁、后检修；先泄压、再拆管路；先固定设备、再起吊；不安全不施工。","2.流程一步不省、机电风险逐项排查、检修标准不降。","3.检修专项班前交底、专人监护、检修后试运转、分级验收、问题闭环。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成员：机电班长、检修工、起重工、安检员、设备司机"]},{"t":"二、核心职责","p":["队长：检修计划、备件、人员统筹。","机电副队长：机电设备检修计划、方案制定，设备检修技术指导、验收。","安全技术副队长：检修模块化卡、检修标准、液压 / 电气安全措施、故障督办。","跟班副队长：检修现场总负责人，停电闭锁确认，大件起吊盯守。","机电班长：检修分工、备件管理、完工自检、试运转组织。","检修工：按标准拆检、更换密封、轴承、管路，规范泄压操作。","起重工：持证起吊，检查葫芦、索具，统一指挥。","安检员：监督停电、起吊、高空作业，查处违章检修。","设备司机：检修前后配合试运转，日常设备巡检。"]}]},{"t":"第三章  设备检修模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-10","模块名称：井下掘进设备检修","所属专业：机电、掘进","适用范围：所有设备检修人员"]},{"t":"二、危险预知及防控","p":["1.未停电触电伤人：严格停电、验电、挂牌、专人闭锁","2.液压管路高压油喷溅：拆管前彻底泄压","3.起吊索具断裂大件坠落：每班检查葫芦，严禁超载歪拉斜吊","4.设备溜车、滑移：检修前支垫、固定机身","5.齿轮、链条挤压夹手：检修时隔离传动部位","6.零部件滚落砸伤：备件分区码放，不堆放在设备两侧","7.试运转误操作伤人：试运转专人监护，人员撤离运转区"]},{"t":"三、作业条件安全确认","p":["1.环境确认：检修地点前后 10m 支护完好，顶板无活矸，设备两侧检修空间≥0.8m，退路畅通。","2.电气确认：设备高压开关、控制开关停电、闭锁、挂 “有人工作禁止送电” 牌，专人看管开关。","3.液压确认：所有操作手柄归零，管路泄压完毕，蓄能器释放压力。","4.起吊确认：5t 及以上合格手拉葫芦、钢丝绳、马蹄环，生根点加固完好。","5.备件工具确认：匹配密封、轴承、螺栓、防爆工具、接油容器齐全。","6.人员确认：检修人员持证，起重工专项持证，每班不少于 6 人，互保分工明确。","7.技术确认：检修项目、风险专项班前交底，模块化卡随身携带。"]},{"t":"四、作业现场人员安全站位","p":["1.停电、验电人员站干燥支护侧，禁止积水、潮湿区域操作高压部件。","2.起吊作业人员全部站在吊具、大件两侧，严禁吊物正下方站立。","3.拆卸液压管路侧身操作，避开油液喷射方向。","4.检修传动链条、齿轮时，人员远离啮合部位。","5.设备试运转前，所有人员撤离滚筒、截割部、刮板运转范围，司机单人操作。","6.高空检修站稳固平台，下方设置警戒区。"]},{"t":"五、标准化作业流程","p":["检修专项班前交底→设备停机操作→逐级停电、验电、闭锁挂牌→液压系统全部泄压→设备机身支垫固定→检修区域警戒布设→分部位拆检、更换损坏配件→密封 / 管路复原→零部件分类回收→拆除起吊机具→清理油污杂物→撤去警戒→专人确认无人员在设备内→分步点动试运转→空载全流程试机→班组自检、机电联合验收→记录检修台账"]},{"t":"六、作业质量标准","p":["1.电气检修：防爆面无损伤，间隙达标，接线无失爆，接地牢固，开关闭锁灵敏。","2.液压检修：全部密封更换新件，管路无扭曲，接头紧固，无渗漏油，压力调试符合设备铭牌。","3.传动部件：链条松紧适度，齿轮啮合无磨损，护罩齐全完整。","4.起吊检修：葫芦额定荷载以内，生根牢固，捆绑重心居中。","5.整机试运转：空载运行不少于 30min，无异响、无渗漏、各类保护（急停、跑偏、过载）动作灵敏可靠。","6.现场文明：废油、旧配件统一回收容器，巷道无油污杂物。"]},{"t":"七、安全管控措施","p":["1.停电闭锁刚性管控：执行 “谁停电、谁送电”，严禁约时送电，检修全程专人看守开关。","2.液压管控：任何管路拆卸必须先泄压，未泄压严禁松动接头。","3.起吊管控：起吊前检查索具裂纹磨损，大件双葫芦均衡受力，统一口令指挥。","4.设备固定管控：掘进机截割部落地、皮带 / 刮板机支垫防滑，防止滑移溜车。","5.检修隔离管控：传动部位检修必须拆除护罩后隔离，试运转前恢复防护。","6.试运转管控：点动先行，确认无卡滞再长时间运转，发现异常立即断电。","7.备件管控：废旧油、配件集中回收，禁止随意丢弃造成巷道滑腻伤人。","8.验收闭环：每项检修完工分步自检，保护、传动、液压、电气全部合格方可交付使用，故障未消除禁止投产。"]}]}],"w":1867,"cn":3,"sn":12},{"c":"JJ-C-11","n":"巷道修复机检修","t":"JJ-C-11 巷道修复机检修模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范WPZ-45/700L型煤矿用巷道修复机日常检修与周期保养作业行为，统一班检、50h、100h、200h、500h、1000h、2000h分级保养标准，杜绝触电、高压油喷溅、臂架下落、旋转部位伤人事故，实现检修全过程风险可控、验收闭环，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于巷道修复机班次保养、周期保养、部件更换及故障处理全部工序。"]},{"t":"三、管理原则","p":["1.先停电闭锁、后检修；先卸载、后拆管；先支撑、后作业；不安全、不施工。","2.流程一步不省、保养周期一项不漏、标准一点不降。","3.班班有交底、检修有记录、保养有台账、验收有闭环。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：机电班长、检修工、巷道修复机司机、安检员"]},{"t":"二、核心职责","p":["队长、支部书记：检修计划、备件、润滑材料统筹。","机电副队长：保养计划制定、检修技术指导、质量验收。","安全技术副队长：检修模块化标准卡制定、隐患督办、考核落实。","跟班副队长：检修现场总负责，停电闭锁确认，大件起吊盯守。","机电班长：保养分工、备件管理、完工自检、试运转组织。","检修工：按标准拆检、润滑、更换配件，规范泄压操作。","巷道修复机司机：每班开机前检查电路、油位、外观，配合试运转。","安检员：监督停电、卸载、起吊工序，查处违章检修。"]}]},{"t":"第三章  巷道修复机检修模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-11","模块名称：WPZ-45/700L巷道修复机检修保养","所属专业：机电、掘进","适用范围：巷道修复机检修保养全体人员"]},{"t":"二、危险预知及防控","p":["1.未停电触电伤人：严格停电、验电、放电、挂牌、闭锁","2.液压管路高压油喷溅：拆管前彻底泄压，侧身操作","3.臂架、油缸意外下落：检修前挖斗落地、油缸受力点设保护支撑","4.大小臂旋转半径内人员被挤压：旋转半径内严禁站人","5.起吊大件坠落：吊具检查，严禁超载歪拉斜吊","6.污物进入液压系统：拆开部件及时封堵防护"]},{"t":"三、作业条件安全确认","p":["1.环境确认：检修地点前后10m支护完好，退路畅通，瓦斯浓度低于0.5%。","2.电气确认：供电开关停电、验电、放电、闭锁挂牌，专人看管。","3.液压确认：挖斗落至地面，各操作手柄归零，系统卸载泄压完毕。","4.支撑确认：需要检修油缸、臂架时，油缸受力点设可靠保护支撑。","5.备件确认：二号二硫化钼锂基润滑脂、90号工业齿轮油（或15号双曲线油）、L-HV46抗磨液压油、滤芯、密封件、黄油枪、接油容器齐全。","6.人员确认：检修人员持证，每班不少于3人，互保分工明确。"]},{"t":"四、作业现场人员安全站位","p":["1.严禁在大、小臂旋转半径内站人、作业。","2.拆卸液压管路侧身操作，避开高压油喷射方向。","3.起吊部件人员站两侧支护完好区，严禁吊物下方站人。","4.试运转前人员撤离臂架、行走范围，司机单人操作并鸣铃预警。"]},{"t":"五、标准化作业流程","p":["检修班前交底→修复机停机→挖斗落地、手柄归零、系统卸载→停电验电放电闭锁挂牌→班检项目（油位、外观、螺栓软管、油缸漏油、行走系统）→黄油嘴润滑（各销轴、回转支撑）→周期保养项目（履带张紧、滤芯、油箱、减速机油位）→故障处理（现场换件为主）→防护恢复→撤警戒→点动试运转→空载动作试验→班组自检验收→记录保养台账"]},{"t":"六、作业质量标准","p":["1.班检标准（每8h）：液压油油位在液位计规定范围（不足时经回油过滤器过滤加入）；工作装置销轴、回转支撑、回转驱动黄油嘴加注润滑脂充满；外观无变形碰撞、管路无断裂；螺栓螺母无脱落、软管接头紧固；各油缸管路无漏油损坏；支重轮、引导轮、行走马达无渗漏，行走无异响；每班清理行走底盘泥土。","2.周期保养标准：每50h调整履带张紧度（下挠度不大于15—20mm）、润滑各销轴、检查变速箱油面；每100h检查空气滤清器、回油及吸油滤（更换滤芯）、更换液压油清洗油箱（首次100h，以后每500h）；每200h检查销轴磨损、润滑回转装置、支重轮、导向轮，更换回油滤芯；每500h按规定力矩紧固电机、履带板螺栓，检查轮齿、斗齿磨损更换，更换液压油清洗油箱；每1000h更换行走减速机、回转减速机润滑油，清洗回油和高压滤油器、油箱，更换老化破损油管；每2000h按部件大修保养。","3.润滑标准：各黄油嘴（回转支撑、各销轴）用二号二硫化钼锂基润滑脂，工作装置每天一次、其它部位每周一次；行走减速机、回转减速机用90号工业齿轮油或15号双曲线油；液压油箱用L-HV46抗磨液压油（环境温度低于-15℃时用L-HS46低凝抗磨液压油），严禁不同牌号液压油混用。","4.液压件检修标准：液压油缸、液压马达、液压泵和各种阀不准在工作现场拆卸，有故障现场整体更换部件；更换部件后排除混入空气。","5.试运转标准：电机点动确认转向（面向电动机后端盖排风扇顺时针），警铃预警，各动作平稳无异响、无渗漏，油温正常。"]},{"t":"七、安全管控措施","p":["1.停电闭锁管控：执行“谁停电、谁送电”，严禁约时送电，检修全程专人看守开关。","2.卸载支撑管控：检修前必须挖斗落地、系统卸载；检修油缸、臂架时油缸受力点必须设保护支撑，严禁在臂架悬空状态下检修。","3.旋转半径管控：安装、调试、使用、维修过程中大小臂旋转半径内严禁站人。","4.防污管控：更换胶管或接头时严禁脏物进入；加油必须经回油滤油器过滤；所有维护在清洁条件下进行；每周从油箱排污口排放冷凝水并补充液压油。","5.周期保养刚性管控：严格按使用维护说明书保养周期执行并做好记录，杜绝超期漏保。","6.文明检修管控：喷浆作业时修复机退出喷浆区域或严密遮盖，防止水泥浆喷溅设备；废油旧件集中回收，严禁随意丢弃。","7.验收闭环管控：保养完工班组自检、机电联合验收，未消除故障严禁投产，台账当班归档。"]}]}],"w":2188,"cn":3,"sn":12},{"c":"JJ-C-12","n":"液压挖掘机检修","t":"JJ-C-12 液压挖掘机检修模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范MWD2.0煤矿用液压挖掘机（电机版）日常检修与班次、月度、季度分级保养作业行为，统一停电卸载、润滑注脂、液压维护标准，杜绝触电、高压油喷溅、臂架下落、旋转部位伤人事故，实现检修全过程风险可控、验收闭环，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于液压挖掘机班次保养、月度保养、季度保养、部件更换及故障处理全部工序。"]},{"t":"三、管理原则","p":["1.先停电闭锁、后检修；先卸载、后拆管；先支撑、后作业；不安全、不施工。","2.流程一步不省、保养周期一项不漏、标准一点不降。","3.班班有交底、检修有记录、保养有台账、验收有闭环。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：机电班长、检修工、液压挖掘机司机、安检员"]},{"t":"二、核心职责","p":["队长、支部书记：检修计划、备件、润滑材料统筹。","机电副队长：保养计划制定、检修技术指导、质量验收。","安全技术副队长：检修模块化标准卡制定、隐患督办、考核落实。","跟班副队长：检修现场总负责，停电闭锁确认，大件起吊盯守。","机电班长：保养分工、备件管理、完工自检、试运转组织。","检修工：按标准拆检、润滑、更换配件，规范泄压操作。","液压挖掘机司机：班前检查电路、油位、动作，配合试运转。","安检员：监督停电、卸载、起吊工序，查处违章检修。"]}]},{"t":"第三章  液压挖掘机检修模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-12","模块名称：MWD2.0液压挖掘机检修保养","所属专业：机电、掘进","适用范围：液压挖掘机检修保养全体人员"]},{"t":"二、危险预知及防控","p":["1.未停电触电伤人：严格停电、验电、放电、挂牌、闭锁","2.液压管路高压油喷溅：拆管前彻底泄压，侧身操作","3.臂架、油缸意外下落：检修前挖斗落地、油缸受力点设保护支撑","4.大小臂旋转半径内人员被挤压：旋转半径内严禁站人","5.工作油温过高（超过80℃）：停机冷却，查明原因","6.起吊大件坠落：吊具检查，严禁超载歪拉斜吊"]},{"t":"三、作业条件安全确认","p":["1.环境确认：检修地点前后10m支护完好，退路畅通，瓦斯浓度低于0.5%。","2.电气确认：供电开关停电、验电、放电、闭锁挂牌，专人看管；检查瓦斯浓度低于0.5%方可电气作业。","3.液压确认：挖斗落至地面，断开电源，扳动各操作手柄、脚踏使液压系统卸载。","4.支撑确认：检修油缸、臂架时，油缸受力点设可靠保护支撑。","5.备件确认：锂基润滑脂1-3#、46号抗磨液压油、滤芯、密封件、黄油枪、接油容器齐全。","6.人员确认：检修人员持证，每班不少于3人，互保分工明确。"]},{"t":"四、作业现场人员安全站位","p":["1.严禁在大、小臂旋转半径内站人、作业。","2.拆卸液压管路侧身操作，避开高压油喷射方向。","3.起吊部件人员站两侧支护完好区，严禁吊物下方站人。","4.试运转前人员撤离臂架、行走范围，司机单人操作并预警。"]},{"t":"五、标准化作业流程","p":["检修班前交底→挖掘机停机→挖斗落至地面、断开电源→扳动手柄、脚踏卸载→停电验电放电闭锁挂牌→班次保养（电缆、油位、漏油、紧固、散热器清理、销轴润滑）→月度保养（油泵螺栓、密封防尘圈、滤清器散热器清洗、油箱清理）→季度保养（液压油取样、安全阀压力、销轴轴套、易损件更换）→故障处理→防护恢复→撤警戒→点动试运转→空载动作试验→班组自检验收→记录保养台账"]},{"t":"六、作业质量标准","p":["1.班次保养标准：检查电缆、接头有无破损，电气设备及连接线路无烧损松脱并修复更换；液压油箱油面高度符合规定（约占油箱总容积2/3至4/5）；油泵、油缸、分配阀、油管连接处无漏油；油管无弯折扭曲破漏；连接部件紧固件无松动丢失；清理整机积尘尤其是散热器；各润滑部位黄油嘴加注锂基润滑脂1-3#充满（挖斗连杆、斗杆摇臂铰接轴、各油缸杆端缸座、辅助臂油缸、大臂油缸、偏摆油缸、推铲油缸、回转支承、回转驱动装置每8h一次，加至溢出）；履带张紧装置每50h注脂，履带中间下挠度不大于15mm；检查链板松动并及时调节张紧弹簧。","2.月度保养标准：检查油泵固定螺栓并紧固；检查各液压元件密封件，尤其是油缸活塞杆防尘密封圈，损坏及时更换；清洗液压油滤清器、散热器；检查液压油箱，清理油污杂质并补加液压工作油。","3.季度保养标准：清洗液压系统，取样检查液压工作油变质情况、必要时更换新油；检查分配器安全阀压力有无变动；检查各部件销轴、轴套有无损坏；检查各安装螺栓松动情况；更换必要易损件。","4.油液标准：使用46号抗磨液压油，定期更换（首次300小时更换，以后每1000小时更换一次）；液压油回油滤芯定期更换（首次300小时、500小时必须更换）；工作油温不超过80℃。","5.试运转标准：电机点动确认转向正确、液压系统充油，各动作平稳无异响、无渗漏，异常杂音立即停车检查并切断总电源。"]},{"t":"七、安全管控措施","p":["1.停电闭锁管控：执行“谁停电、谁送电”，严禁约时送电，检修全程专人看守开关。","2.卸载支撑管控：保养前必须将挖斗落至地面、断开电源、扳动各手柄脚踏卸载；检修油缸、臂架时油缸受力点必须设保护支撑。","3.旋转半径管控：安装、调试、使用、维修过程中大小臂旋转半径内严禁站人。","4.油温管控：发现工作油温过高（超过80℃）或升温过快，立即停止工作查明原因（油量不足、滤清器堵塞、散热器积尘等），严禁带病运行。","5.防污管控：更换胶管或接头时严禁脏物进入液压系统；维护在清洁条件下进行。","6.故障处置管控：出现故障或异常杂音立即停车检查、切断总电源；作业或调试时挖斗所及范围内严禁站人、禁止接触转动部位。","7.验收闭环管控：保养完工班组自检、机电联合验收，未消除故障严禁投产，台账当班归档。"]}]}],"w":2131,"cn":3,"sn":12},{"c":"JJ-C-13","n":"自移机尾检修","t":"JJ-C-13 自移机尾检修模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范DWZY型带式输送机用自移机尾日常检修与周期保养作业行为，统一停电闭锁、液压件检修、电控维护标准，杜绝触电、高压油喷溅、误动作挤压、隔爆失效事故，实现检修全过程风险可控、验收闭环，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于自移机尾日常检修、周期保养、液压件及电控系统检修、故障处理全部工序。符合MT/T820-2006《煤矿用带式输送机技术条件》、KA/T 1166-2019及GB 3836系列标准相关规定。"]},{"t":"三、管理原则","p":["1.先停电闭锁、后检修；先泄压、后拆管；不安全、不施工。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、检修有记录、验收有闭环。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：机电副队长、安全技术副队长、跟班副队长","成  员：机电班长、检修工、电钳工、皮带司机、安检员"]},{"t":"二、核心职责","p":["队长、支部书记：检修计划、备件、人员统筹。","机电副队长：检修方案制定、技术指导、检修质量总验收。","安全技术副队长：检修模块化标准卡制定、隐患督办、考核落实。","跟班副队长：检修现场总负责，停电闭锁确认。","机电班长：检修分工、备件管理、完工自检、试运转组织。","检修工、电钳工：按标准拆检、更换密封管路，规范泄压、停送电操作。","皮带司机：检修前后配合停机、试运转，日常运行巡检。","安检员：监督停电、泄压、试运转工序，查处违章检修。"]}]},{"t":"第三章  自移机尾检修模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-13","模块名称：DWZY自移机尾检修保养","所属专业：机电、掘进","适用范围：自移机尾检修保养全体人员"]},{"t":"二、危险预知及防控","p":["1.未停电触电伤人：严格停电、验电、挂牌、闭锁","2.带电开盖引发事故：严禁带电开盖检修电气设备","3.液压管路高压油喷溅：拆管前彻底泄压","4.检修期间机架误动作挤压伤人：断电闭锁、人员撤离动作范围","5.隔爆面损伤失效：检修防止隔爆面碰伤，保持清洁涂防锈油","6.轨道残煤导致轮组掉道、行走卡阻：及时清理轨道浮煤"]},{"t":"三、作业条件安全确认","p":["1.环境确认：检修地点支护完好，照明充足，退路畅通，瓦斯浓度低于0.5%方可电气作业。","2.电气确认：自移机尾及配套泵站开关停电、验电、闭锁挂牌，控制模式切换至停止，专人看管开关。","3.液压确认：各操作阀手柄归零，系统泄压，机架落至稳定位置。","4.备件确认：千斤顶密封件、高压胶管、接头、阀组密封圈、轴承、润滑脂等备件齐全。","5.人员确认：检修人员持证上岗，每班不少于2人，互保分工明确。","6.技术确认：检修项目、风险班前交底，液压件升井维修流程明确。"]},{"t":"四、作业现场人员安全站位","p":["1.严禁站在机架、轨道动作范围内及上方、两侧检修。","2.拆卸液压管路侧身操作，避开高压油喷射方向。","3.起吊大件人员站两侧支护完好区，严禁吊物下方站人。","4.试运转前人员撤离机尾、皮带、轨道范围，操作人员与机尾架保持安全距离，身体（脚部）外撤防轨道压脚。"]},{"t":"五、标准化作业流程","p":["检修班前交底→停机→控制模式停止、泵站电机停→逐级停电验电闭锁挂牌→液压系统泄压→管路接头检查紧固→轨道浮煤清理、连接件检查→千斤顶、阀组检修（损坏件升井维修）→电控箱检修（断电开盖、隔爆面检查）→保护闭锁试验→防护恢复→送电→语音预警试验→空载动作试验（升、推、降、拉、调偏）→班组自检验收→记录检修台账"]},{"t":"六、作业质量标准","p":["1.管路标准：各管路及接头连接可靠，发现松动及时修复，损坏件及时更换；各接头处无泄漏。","2.轨道标准：两外侧轨道无残存煤渣，行走轮组转动灵活、无卡滞不掉道，轮组架两端轨道清扫装置完好。","3.连接件标准：各节段销轴铰接到位、防脱落装置齐全，机架连接件无松动损坏，发现松动损坏及时更换。","4.液压件标准：液压油缸、操纵阀等液压元件由专业人员检修，修复后进行空载运行、保压试验，达到要求方可使用；千斤顶密封损坏的升井维修，更换密封件后打压、保压试验；拆开液压件及时做好防护防止污物进入。","5.电控标准：严禁带电开盖；检修不得随意改变本安电路元器件规格型号及电路参数；隔爆面清洁无损伤、定期涂防锈油脂；接地装置牢靠；配接线后检查无漏接短路；PLC、遥控、语音预警、急停功能正常。","6.系统压力标准：额定工作压力18MPa，系统压力严禁超调（出厂已调定）。"]},{"t":"七、安全管控措施","p":["1.停电闭锁管控：严格执行“谁停电、谁送电”，严禁约时送电，检修全程专人看守开关；电气作业瓦斯浓度必须低于0.5%。","2.泄压管控：拆卸管路必须先泄压；拆开油口及时封堵防污。","3.误动作管控：检修期间控制模式置停止、断电闭锁，严禁任何人操作遥控器、控制箱；试运转执行语音预警确认人员撤离。","4.液压件专业化管控：液压油缸、操纵阀等液压元件严禁在井下随意拆解，由专业人员检修或升井维修，修复后空载运行、保压试验合格方可使用。","5.防爆管控：隔爆面检修防止损伤、保持清洁并定期涂防锈油脂；本安电路参数严禁擅自改动；严禁带电开盖。","6.验收闭环管控：检修完工班组自检、机电联合验收，保护动作、液压密封、行走轮组全部合格方可交付使用，检修记录当班归档。"]}]}],"w":1927,"cn":3,"sn":12},{"c":"JJ-C-14","n":"瓦斯抽放管路敷设","t":"JJ-C-14 瓦斯抽放管路敷设模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范矿井瓦斯抽放管路（支管、干管）井下敷设作业行为，统一吊挂固定、法兰连接、防滑、交叉隔离、气密性检验标准，杜绝登高坠落、管路滚落砸伤、法兰夹手、胶带机误启动卷入、抽放管路漏气失效等事故隐患，实现管路敷设一次达标、气密性合格、安全可控，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井各巷道瓦斯抽放管路（支管、干管）运输、吊挂敷设、法兰连接、气密性检验全工序、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先固定、后吊挂；先闭锁、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、辅助工、电钳工、安检员、瓦检员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责瓦斯抽放管路敷设模块化管理，物料、人员、运输统筹。","安全技术副队长：敷设措施编制贯彻、吊挂及防滑标准制定、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场全过程组织协调、登高及过胶带等高风险工序全程盯守。","班组长：开工安全确认、登高工具验收、安装质量自检复检、隐患上报。","辅助工：管路抬运、吊挂、法兰连接、防滑卡安装，落实互保联保，对安装质量负责。","电钳工：与电缆交叉处隔离处理，电气安全监护。","安检员：安全条件确认、违章制止、登高及吊装工序标准监督。","瓦检员：作业地点甲烷、二氧化碳浓度检测，异常立即通知停工处理。"]}]},{"t":"第三章  瓦斯抽放管路敷设模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-14","模块名称：瓦斯抽放管路敷设","所属专业：通防、掘进","适用范围：管路敷设全体作业人员"]},{"t":"二、危险预知及防控","p":["1.登高坠落、工具掉落砸人：登高工具平稳、专人扶稳、抓牢支护、禁止下方站人","2.管路滚落、弹起砸伤：抬运配合到位、缓慢下放、严禁乱扔乱抛","3.法兰夹手：严禁手指伸入法兰间隙及螺栓眼","4.带式输送机误启动卷入：过胶带前停机闭锁，管路从胶带上方通过必须停机","5.顶板掉矸片帮：敲帮问顶到位、支护完好方可作业","6.管路漏气失效：法兰平行、胶垫完好、气密性检验合格"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业地点顶板、支护完好，敲帮问顶完成，退路畅通，通风正常。","2.瓦斯确认：作业地点甲烷、二氧化碳浓度检查合格（瓦斯浓度小于0.5%）方可作业。","3.物料确认：管路（钢丝网骨架聚乙烯瓦斯抽放管SSPE-KW0.097 D200×10.5mm、抗静电阻燃、4m/根）、吊钩、防滑卡、法兰橡胶垫片、螺栓（φ20×110）等齐全完好。","4.工器具确认：登高用板凳、梯子平稳完好，扳手、套筒等工具齐全，严禁工具带病使用。","5.设备确认：作业地点带式输送机开关闭锁挂牌，拉线保护完好有效。","6.人员确认：作业人员持证上岗、班前精神状态确认合格，每班不少于5人（含班组长）。"]},{"t":"四、作业现场人员安全站位","p":["1.登高作业人员1人登高、1人扶梯（扶板凳），登高至预定位置后用一只手抓牢巷道支护。","2.有人高处作业时，其他人员严禁站在其下方或从其下方经过，严禁抛接工具物件。","3.抬运管路人员配合一致、步调统一，严禁站在管路两侧，防止管路滚动、弹起挤压。","4.过胶带、安装管路时人员站管路两端，严禁将手指伸入法兰间隙及螺栓眼。"]},{"t":"五、标准化作业流程","p":["班前会交底+开工安全确认→敲帮问顶→量测标定吊钩位置（距底板不小于1.8m、粉笔标记）→安装管路吊钩（登高作业专人扶稳）→抬运管路至吊钩内摆放→调整管路位置→法兰连接（安装橡胶垫片、穿螺栓紧固）→倾斜段安装防滑卡→低洼处及规定间距设置放水器→与电缆交叉处隔离处理→管路平直检查→气密性检验→班组自检验收"]},{"t":"六、作业质量标准","p":["1.管材标准：采用煤矿井下用钢丝网骨架聚乙烯瓦斯抽放管，型号SSPE-KW0.097 D200×10.5mm（抗静电、阻燃），直径200mm，4m/根，法兰连接。","2.吊挂标准：用专门制作吊钩将管路吊挂在巷道支架上，每节管子不少于1个吊钩；管路架设高度不小于1.8m，管件外缘距巷道壁不小于0.1m。","3.防滑标准：倾斜巷道内敷设的管路必须安装防滑卡，防滑卡间距15—20m，安装位置靠近管端法兰盘。","4.交叉隔离标准：瓦斯抽放管路不得与动力电缆敷设在巷道同一侧；与电缆不可避免相交时，必须隔开一定距离或用胶带分隔，不得与电缆直接接触。","5.法兰连接标准：两法兰盘平行、中间使用橡胶垫防止漏气，螺栓穿向一致、外露长度相等、紧固均匀、松紧适度。","6.放水器标准：在管路低洼处及管路适当位置（间距200—300m、最大不超过500m）设置放水器。","7.气密性检验标准：管路敷设到位后进行漏气检验，压风注气压力升至0.2MPa后关闭阀门，压力保持15min下降幅度不超过注入气压的5%（即0.01MPa）为气密性合格。"]},{"t":"七、安全管控措施","p":["1.登高管控：登高工具放置平稳，使用扶梯1人登高1人扶梯，登高人员一只手抓牢巷道支护；使用板凳1人登高1人扶板凳；高处作业严禁抛接工具物件，下方严禁站人、通行。","2.胶带机管控：班组长作业前通知当班带式输送机司机，作业地点带式输送机拉线保护完好有效；管路从胶带上方通过时必须停止输送机运行，严禁运行期间作业。","3.抬运管控：安装管路四人配合（一人安全监视、两人抬运管路至挂钩内扶好、一人安装胶垫及螺栓）；抬运配合到位，下放缓慢，严禁乱扔乱抛。","4.法兰连接管控：两法兰盘平行，螺栓穿向一致、外露长度相等、紧固均匀；严禁将手指插入两法兰盘间隙及螺栓眼之间。","5.环境管控：施工人员听从指挥、相互配合，清理作业地点杂物，地面潮湿时采取防滑措施；安装期间保护好现场机电设备、电缆。","6.验收闭环管控：管路敷设到位后气密性检验合格，班组自检、通风科组织验收，隐患当班整改闭环。"]}]}],"w":2229,"cn":3,"sn":12},{"c":"JJ-C-15","n":"瓦斯抽放管路拆、运","t":"JJ-C-15 瓦斯抽放管路拆、运模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范矿井瓦斯抽放管路井下拆卸、搬运、装运、运输全流程作业行为，统一管路固定、锈蚀螺栓处理、抬运搬运、带式输送机及绞车运输标准，杜绝管路滚落砸伤、锈蚀螺栓崩弹伤人、胶带机误启动卷入、运输滑移掉道等事故隐患，实现管路安全拆运、部件完好回收，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井各巷道瓦斯抽放管路（含D450干管、D200支管）拆卸、抬运、材料车装运、带式输送机及绞车运输全工序、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先固定、后拆除；先闭锁、后运输；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、辅助工、带式输送机司机、绞车司机、安检员、瓦检员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责瓦斯抽放管路拆运模块化管理，物料运输、人员统筹。","安全技术副队长：拆运措施编制贯彻、运输安全标准制定、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场全过程组织协调、拆卸及运输高风险工序全程盯守。","班组长：开工安全确认、拆卸工具检查、拆运质量自检、隐患上报。","辅助工：管路拆卸、抬运、装车、摆放挂牌，螺栓等材料收集上交，对拆运质量负责。","带式输送机司机：运输前检查试运行、按信号开停机、运输期间精力集中观察。","绞车司机：绞车完好检查、按信号规范操作，严禁放飞车。","安检员：安全条件确认、违章制止、拆卸运输工序标准监督。","瓦检员：作业地点甲烷浓度检测，剁斧作业前确认瓦斯浓度符合规定。"]}]},{"t":"第三章  瓦斯抽放管路拆运模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-15","模块名称：瓦斯抽放管路拆、运","所属专业：通防、机电运输","适用范围：拆运全体作业人员"]},{"t":"二、危险预知及防控","p":["1.管路滚落、弹起砸伤：先固定后拆除，抬运配合到位，缓慢下放","2.锈蚀螺栓崩弹伤人：剁斧劈螺帽一人操作、侧身、戴手套、用力适度","3.带式输送机误启动卷入：装运前停机闭锁、撤人警戒","4.运输滑移掉道：材料车捆绑牢固、绞车及轨道完好","5.胶带运输管路偏斜戗辊掉出：沿胶带中心摆放、不超边沿、专人跟踪观察","6.顶板掉矸片帮：敲帮问顶到位、支护完好方可作业"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业地点顶板、支护完好，敲帮问顶完成，地面平整，退路畅通。","2.瓦斯确认：作业地点甲烷浓度检查合格；使用剁斧劈螺帽前确认作业地点前后10m范围内瓦斯浓度不超过0.5%。","3.管路确认：待拆管路放置平稳可靠，不稳晃动管路衬垫道木、木鞋固定牢固后方可拆除。","4.工具确认：扳手、剁斧、锤子等拆卸工具完好齐全，严禁使用不完好工器具。","5.运输设备确认：带式输送机各保护齐全、试运行正常；绞车、钢丝绳、声光信号、保险装置完好；材料车及连接装置完好。","6.人员确认：作业人员持证上岗，每班不少于5人（含班组长），带式输送机司机、绞车司机持证上岗。"]},{"t":"四、作业现场人员安全站位","p":["1.抬运管路人员配合一致，严禁站在管路两侧，2m管路2人抬运、4m管路4人抬运，离地高度不超过0.5m。","2.剁斧劈螺帽人员侧身、站稳、戴手套，严禁正对螺栓崩出方向。","3.带式输送机装卸管路期间严禁人员站在输送机上作业。","4.弯道推车人员严禁站在运输车辆两侧，防止挤伤。"]},{"t":"五、标准化作业流程","p":["班前会交底+开工安全确认→敲帮问顶→固定管路（不稳处衬垫道木）→拆卸管路连接螺栓（锈蚀螺栓用剁斧劈螺帽）→卸下管路→拆卸管路吊钩→抬运管路至指定地点摆放挂牌（依次循环）→材料车装车捆绑→绞车/带式输送机分段运输→到达地点卸车摆放→班组自检验收→收尾清理"]},{"t":"六、作业质量标准","p":["1.拆卸顺序标准：由里向外、由上往下逐根拆除，或从中部掐断分段拆除；拆下的螺栓等材料收集到位，严禁乱扔乱放。","2.锈蚀螺栓处理标准：螺栓锈蚀无法正常拆除时采用剁斧劈开螺帽，一人操作（一手拿剁斧、一手拿锤），戴手套、侧身、站稳、不得用力过猛，防止打滑伤人。","3.抬运标准：2m管路2人抬运、4m管路4人抬运，配合一致、听从指挥，管路离地高度不超过0.5m；下放缓慢，严禁乱扔乱抛。","4.装车标准：使用材料车逐层摆放整齐，超出车沿以上部分最多摆放一层管路，钢丝绳捆绑牢固，每车沿车中部前后捆绑两道。","5.带式输送机运输标准：管路用尼龙绳捆绑固定，每组两根并列摆放、每次运三组连续摆放；沿胶带中心摆放不得偏向一侧、任一端不得超出胶带外沿；装卸前必须停机闭锁。","6.摆放回收标准：拆除管路堆放至指定地点，摆放整齐并采取防倒防滑措施、挂牌管理。"]},{"t":"七、安全管控措施","p":["1.拆卸管控：作业前检查作业地点20m范围内瓦斯浓度低于1.0%方可作业；拆卸管路一节一节进行，一人扶管一人拆螺栓，螺栓拆完后两人共同抬离挂钩。","2.胶带机运输管控：运输前拉空胶带上的煤、矸及杂物；运输期间撤出运输区域所有无关人员并设置警戒；司机严格执行一停二开信号，装卸管路前停机闭锁；最后一组管路后方约10m设专人跟踪观察，发现管路超出胶带边沿立即拉急停拉线停机。","3.绞车运输管控：司机持证上岗，开车前全面检查制动、声光信号、底座固定、保险杠、保险挡、保险绳、钢丝绳、运输线路、连接装置；信号为一停、二开、三回；严格执行开车不行人、行人不开车；严禁放飞车和坡度巷道人力推车。","4.抬运管控：提前清理抬运路线杂物，两人抬运步调一致；搬运人员避开管路滚动方向。","5.环境管控：施工人员听从指挥、相互配合，清理作业地点杂物，地面潮湿时采取防滑措施。","6.验收闭环管控：拆除管路摆放整齐挂牌、螺栓回收上交工具房，隐患当班整改闭环。"]}]}],"w":2163,"cn":3,"sn":12},{"c":"JJ-C-16","n":"瓦斯抽放管路改造施工","t":"JJ-C-16 瓦斯抽放管路改造施工模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范矿井瓦斯抽放管路改造（更换、续接、变径、移位）施工作业行为，统一管路气体排空、先固定后拆除、螺栓顺序拆除、法兰连接、登高作业、胶带机闭锁标准，杜绝管路内残留瓦斯泄漏超限、管路滚落砸伤、法兰夹手、登高坠落、胶带机误启动卷入等事故隐患，实现管路改造一次达标、安全可控，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井各巷道瓦斯抽放管路（DN200支管、DN450干管）改造施工全工序、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先排空、后拆除；先固定、后拆除；先闭锁、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、辅助工、运输队、通风队、安检员、瓦检员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责瓦斯抽放管路改造模块化管理，施工组织、物料运输统筹。","安全技术副队长：改造措施编制贯彻、作业平台及登高标准制定、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场全过程组织协调、管路拆除及登高作业全程盯守。","班组长：开工安全确认、作业平台验收、改造质量自检、隐患上报。","辅助工：管路抬运、拆除、安装、法兰连接，对安装质量负责。","运输队：将需改造管路运输至作业地点附近，并将拆除旧管运走。","通风队：改造前管路气体排空、拆除前管道瓦斯浓度检查、安装完成后验收。","安检员：安全条件确认、违章制止、拆除及登高工序标准监督。","瓦检员：作业地点甲烷浓度检测，异常立即通知停工处理。"]}]},{"t":"第三章  瓦斯抽放管路改造施工模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-16","模块名称：瓦斯抽放管路改造施工","所属专业：通防、掘进","适用范围：改造施工全体作业人员"]},{"t":"二、危险预知及防控","p":["1.管路内残留瓦斯泄漏：通风队排空彻底、拆除前检查管道瓦斯浓度、严禁启动抽采泵","2.管路坠落滚落砸伤：先固定后拆除、两侧顺序拆螺栓、站管路两端","3.法兰夹手：严禁手指伸入法兰间隙及螺栓眼","4.螺栓崩弹伤人：拆装螺栓用力均匀、锈蚀卡死规范处理","5.胶带输送机误启动卷入：停机闭锁挂牌、站胶带垫木板固定","6.登高坠落：登高工具专人扶稳、搭设工作平台验收合格"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业地点顶板、支护、通风良好，敲帮问顶完成，退路畅通。","2.排空确认：通风队完成管路气体排空，管道内不积存瓦斯及其他有害气体，作业期间严禁启动抽采泵。","3.瓦斯确认：通风队安排瓦斯检查工检查管道内瓦斯浓度，确认排空后方可拆除管路；作业地点甲烷浓度检查合格。","4.工具确认：扳手、套筒等工具及管路配件齐全完好，严禁工具带病使用、配件不齐全施工。","5.设备确认：带式输送机、相关开关停电闭锁挂牌，登高工具及作业平台牢固可靠并经验收合格。","6.人员确认：作业人员持证上岗，每班不少于5人（含班组长），互保联保分工明确。"]},{"t":"四、作业现场人员安全站位","p":["1.拆除螺栓期间严禁人员直接站在待拆管路两侧，应站在待拆管路两端，确保站位安全。","2.登高作业人员站在牢固平台或板凳、梯子上，专人扶稳；高处作业下方严禁站人。","3.抬运管路人员配合到位，下放缓慢，严禁乱扔乱抛，严禁站在管路两侧。","4.严禁将手指插入两法兰盘间隙及螺栓眼之间，防止夹伤。"]},{"t":"五、标准化作业流程","p":["班前会交底+开工安全确认→通风队排空管路气体→瓦斯检查工检查管道瓦斯浓度→先固定待拆管路两侧管路→按两侧顺序拆除旧管螺栓→拆除旧管（站管路两端）→抬运旧管运走→吊挂/支撑新管路（登高作业、作业平台）→法兰连接（平行、胶垫、螺栓）→二次吊挂固定（钢丝绳配合卡子）→安装质量检查→班组自检验收→收尾清理"]},{"t":"六、作业质量标准","p":["1.拆除标准：严格按照先固定后拆除原则，先固定待拆管路两侧抽采管路再拆除待拆管路；拆除旧管两侧顺序进行，严禁同时拆除两侧螺栓，防止管路滚落伤人。","2.法兰连接标准：两法兰盘平行，螺栓穿向一致、外露长度相等、紧固均匀、松紧适度；所有螺栓必须有平垫及弹簧垫。","3.吊挂标准：新敷设管路按标准使用挂钩逐根悬挂，并采用钢丝绳配合卡子二次吊挂固定，钢丝绳环间距不大于50m，防止管路脱钩脱落。","4.登高作业标准：登高工具放置平稳、专人扶稳；31采区运输机下山等改造需搭设工作平台，平台牢固可靠、满足施工需要，搭设完成后经现场班组长验收合格方可使用。","5.改造质量验收标准：管路改造完成后安装质量检查合格，经通风科组织验收合格后方可投入使用。"]},{"t":"七、安全管控措施","p":["1.排空管控：管路改造前通风队必须完成管路气体排空，确保管内不积存瓦斯及有害气体，作业期间严禁启动抽采泵；拆除前由通风队安排瓦斯检查工检查管道瓦斯浓度确认排空。","2.拆除管控：拆除旧管必须两侧顺序进行，严禁同时拆除两侧螺栓；拆除螺栓期间严禁人员站在待拆管路两侧，应站管路两端；拆除前固定待拆管路两侧管路。","3.胶带机管控：带式输送机巷改造前必须将带式输送机停机、闭锁并挂牌上锁；严禁人员直接站在胶带上作业，确需站胶带时必须在胶带上衬垫木板或浮煤、木板固定在胶带机架上防滑。","4.登高管控：登高作业选择合适工具，使用板凳或梯子时安排专人扶稳；搭设工作平台的必须牢固可靠并经验收合格后使用。","5.安装配合管控：安装管路不少于四人配合（一人安全监视、两人抬运或吊装管路至安装位置、一人安装胶垫及螺栓），听从指挥、相互配合。","6.环境管控：清理作业地点杂物，地面潮湿时采取防滑措施；每班作业完成物料摆放整齐、场地清洁。","7.验收闭环管控：改造完成后安装质量检查、通风科组织验收，隐患当班整改闭环。"]}]}],"w":2148,"cn":3,"sn":12},{"c":"JJ-C-17","n":"瓦斯抽放管路接地极安装","t":"JJ-C-17 瓦斯抽放管路接地极安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范矿井瓦斯抽放金属管路及附件（金属弯头、放水器、三通、孔板流量计、阀门等）接地极安装作业行为，统一钻孔、接地极埋设、接地线连接、法兰跨接标准，杜绝静电积聚引发瓦斯燃爆、钻孔机械火花引发瓦斯燃爆、顶板片帮、登高坠落等事故隐患，实现静电可靠泄放、接地性能达标、安全可控，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井各巷道瓦斯抽放金属管路及附件接地极安装、接地线连接、法兰跨接全工序、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先检测、后施工；先闭锁、后作业；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、辅助工、电钳工、安检员、瓦检员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责接地极安装模块化管理，施工组织及安全管理。","安全技术副队长：接地极安装措施编制贯彻、钻孔及接地工艺标准制定、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场全过程组织协调、钻孔及登高作业全程盯守。","班组长：开工安全确认、钻孔位置确定、施工记录填写、接地质量自检、隐患上报。","辅助工：接地钻孔施工、接地极安装、回填夯实，对接地极安装质量负责。","电钳工：接地线、跨接线连接安装，紧固到位，负责接地连接质量。","安检员：安全条件确认、违章制止、钻孔及登高工序标准监督。","瓦检员：钻孔作业地点甲烷浓度检测、专人监护，异常立即停工处理。"]}]},{"t":"第三章  瓦斯抽放管路接地极安装模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-17","模块名称：瓦斯抽放管路接地极安装","所属专业：通防、机电","适用范围：接地极安装全体作业人员"]},{"t":"二、危险预知及防控","p":["1.瓦斯燃爆：钻孔机具产生机械火花，作业区域瓦斯超限或局部积聚易引发燃烧爆炸","2.顶板片帮伤人：敲帮问顶不到位，活矸危岩掉落砸伤","3.机械伤害：皮带轨道设备未闭锁突然运转、风钻钻杆反弹飞矸伤人","4.高处坠落：登高作业无可靠设施、未系保险带，失足坠落、工具掉落伤人","5.静电隐患：法兰未跨接、接线虚接、接地极埋设不达标，静电无法正常泄放","6.瓦斯泄漏：作业时敲打撞击瓦斯管路及附件，造成管路破损漏气"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业地点通风良好、支护完好、顶板完好、退路畅通，检测瓦斯浓度小于0.5%方可施工，严格执行敲帮问顶制度。","2.工器具确认：ZQSJ-80/2.8气动手持钻机、YT-28型气腿式凿岩机、钻头、钻杆等完好；风钻、风管连接牢固，严禁风管泄压对人吹扫。","3.物料确认：直径不小于DN35×0.6m镀锌钢管接地极、25mm²多股铜芯接地线、镀锌螺栓、平垫、弹垫、铜垫片等齐全。","4.设备确认：带式输送机、辅助运输设备开关闭锁挂牌，严禁运行期间进入设备里侧施工。","5.人员确认：作业人员持证上岗，每班不少于3人（含班组长、电钳工），互保分工明确。"]},{"t":"四、作业现场人员安全站位","p":["1.钻孔作业人员站钻机侧方操作，专人监护瓦斯、洒水降尘，严禁正对钻杆反弹方向。","2.登高作业使用完好爬梯或板凳并专人扶稳，登高超过2.0m必须系保险带并高挂低用。","3.严禁在皮带、轨道运输设备运行期间进入其里侧施工。","4.作业过程严禁敲打、撞击瓦斯管路及附件，防止管路破损漏气。"]},{"t":"五、标准化作业流程","p":["班前会交底+开工安全确认→敲帮问顶→选定接地极安装位置（优先底板潮湿处、水沟侧边）→施工接地钻孔（气动钻机、专人监护瓦斯、洒水降尘）→清理孔内浮矸积水→安装镀锌钢管接地极（垂直植入、回填潮湿细土分层夯实）→接地线压接铜鼻子、连接接地极与附件法兰→法兰跨接线安装→接触面打磨除锈→接线配件紧固→接地线顺直固定→施工记录填写→班组自检验收→收尾清理"]},{"t":"六、作业质量标准","p":["1.钻孔标准：钻孔位置优先选择设备就近巷道底板潮湿处、水沟侧边潮湿地段，避开干燥浮煤、坚硬裸岩区域；钻孔深度不小于1.0m，孔径略大于接地极钢管外径，垂直底板、倾斜偏差不大于15°，钻孔完成后清理孔内浮矸积水。","2.接地极标准：采用标准镀锌钢管接地极，规格不小于DN35、长度不小于0.6m，管身均匀布设透水孔；垂直植入钻孔内、底部到底、扶正摆正，回填潮湿细土或煤粉分层夯实，严禁用矸石杂物回填；接地极上端露出底板75—100mm。","3.水沟接地极标准：水沟位置可采用5mm厚、0.6㎡镀锌钢板接地极，平铺于水沟底部，固定牢靠、贴合水体。","4.接地线标准：采用不小于25mm²多股铜芯软线，两端压接铜鼻子或制作线圈，压接紧实无松动、无断丝；一端连接接地极，另一端通过镀锌螺栓、铜垫片连接在附件紧固法兰螺栓上，接触面打磨除锈、去氧化皮。","5.法兰跨接标准：所有金属管路、阀门、伸缩节、流量计两端法兰必须加装同规格跨接线，杜绝绝缘垫片造成导电断点，实现管路全程等电位连通；接线配件配齐平垫、弹垫、镀锌螺栓，紧固到位。","6.敷设标准：接地线敷设顺直、无紧绷、无破损，沿巷道侧壁规整固定，杜绝拖地、挤压、磨损；所有接地极安装端正、稳固，无倾斜、松动、外露过长现象。"]},{"t":"七、安全管控措施","p":["1.瓦斯管控：接地极施工前检测瓦斯浓度小于0.5%方可施工；钻孔作业专人监护瓦斯、洒水降尘；严禁敲打、撞击瓦斯管路及附件，防止管路破损漏气。","2.顶板管控：施工前严格执行敲帮问顶制度，提前处理作业地点顶板隐患，确认安全后方可施工。","3.设备闭锁管控：带式输送机巷在输送机里侧施工时，提前将带式输送机开关闭锁并挂牌上锁；轨道顺槽作业应在非运输班次进行，否则将辅助运输设备开关闭锁并挂牌上锁。","4.登高管控：登高作业使用完好爬梯或板凳并专人扶稳，严禁单独登高；登高高度超过2.0m必须使用保险带并按高挂低用原则正确使用。","5.施工记录管控：接地极施工期间必须填写施工记录，详细记录当班施工班组长、接地极管路位置、编号等信息，确保施工有迹可查。","6.验收闭环管控：接地极安装完毕后由机电运输科安排人员检测接地电阻，通风科组织验收，静电泄放可靠、接地性能达标方可投入使用，隐患当班整改闭环。"]}]}],"w":2340,"cn":3,"sn":12},{"c":"JJ-C-18","n":"瓦斯抽放管路气密性试验","t":"JJ-C-18 瓦斯抽放管路气密性试验模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范矿井瓦斯抽放管路气密性试验作业行为，统一分段正压充气、堵板安装、注压保压、泄漏排查处理标准，杜绝高压气体喷溅伤人、带压掐断管路、泄漏点处理不到位导致抽采负压失效、瓦斯泄漏等事故隐患，实现管路气密性合格、抽采系统可靠、安全可控，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井新安装瓦斯抽放管路（Φ450×21mm、Φ200×10.5mm）气密性试验全工序、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先泄压、后处理；先隔离、后注压；不安全、不施工。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：掘进队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、主管抽放班组长、辅助工、安检员、瓦检员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责气密性试验模块化管理，人员、材料、劳动组织统筹。","安全技术副队长：试验措施编制贯彻、注压保压标准制定、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场全过程组织协调、注压及漏气处理高风险工序全程盯守。","主管抽放班组长：气密性试验现场技术负责人，负责试验方案现场落实及技术指导，确定单次试验范围。","班组长：当班现场施工管理安全第一责任人，安排人员按主管抽放班组长要求施工。","辅助工：堵板安装、注压、管路巡查、漏气点标记及处理，对试验质量负责。","安检员：安全条件确认、违章制止、注压及泄压工序标准监督。","瓦检员：作业地点甲烷浓度检测，异常立即通知停工处理。"]}]},{"t":"第三章  瓦斯抽放管路气密性试验模块","s":[{"t":"一、模块概述","p":["模块编号：JJ-C-18","模块名称：瓦斯抽放管路气密性试验","所属专业：通防、掘进","适用范围：气密性试验全体作业人员"]},{"t":"二、危险预知及防控","p":["1.高压气体喷溅伤人：注压前检查堵板、胶管连接牢固，泄压缓慢","2.带压掐断管路伤人：处理漏气期间不得带压掐断管路","3.管路泄漏瓦斯积聚：试验前清理浮煤杂物，瓦斯检查到位","4.堵板安装不到位气体泄漏：堵板与管路连接处安装相应垫圈","5.压力表超量程损坏伤人：使用正压压力表，量程0.8MPa或1.6MPa","6.泄压过快管路振动：试验结束缓慢打开阀门释放压力"]},{"t":"三、作业条件安全确认","p":["1.环境确认：试验地点顶板、支护完好，通风正常，退路畅通，试验地点管路附近浮煤、杂物清理干净。","2.管路确认：试验管路技术参数清楚（Φ450×21mm或Φ200×10.5mm，正压1.6MPa、负压0.097MPa，4m/根，法兰连接），分段范围确定。","3.仪器确认：堵板2个（1个预留控制阀门、压力表接口，1个带球阀挡板）、控制阀门1个、正压压力表1块（量程0.8MPa或1.6MPa）、高压胶管1根（直径16mm、长度10m）等齐全完好。","4.人员确认：施工人员持证上岗、熟练掌握仪器使用方法，每班配备班组长1名、辅助工3人，互保分工明确。","5.技术确认：主管抽放班组长结合方案根据现场条件确定单次试验范围，试验方案贯彻到位。"]},{"t":"四、作业现场人员安全站位","p":["1.注压操作人员站堵板及阀门侧方，避开压力气体可能喷出方向。","2.管路巡查人员沿敷设线路行走时注意脚下防滑，避开管路两侧。","3.泄压操作时缓慢打开阀门，人员避开泄压口方向。","4.漏气排查、处理期间严禁带压掐断管路，处理人员站安全位置。"]},{"t":"五、标准化作业流程","p":["班前会交底+开工安全确认→确定单次试验范围→清理试验地点浮煤杂物→断开管路（掐断）→安装堵板（一端三通阀门+压力表、一端球阀挡板，连接处安装垫圈）→高压胶管连接压风管路→注压至0.2MPa→关闭阀门、记录供气时间及压力→保压20min观察压力表→压力下降≤10%判定合格（超限则再次注压排查标记漏气点）→处理漏气点→重新注压检验至合格→缓慢泄压→恢复管路连接→下一段试验→班组自检验收"]},{"t":"六、作业质量标准","p":["1.注压标准：根据现场情况将抽放管路掐断，一端安装带三通阀门的挡板（能与压风管连接并安装压力表），另一端安设带球阀挡板将其它管路隔开；压力表必须为正压压力表，量程0.8MPa或1.6MPa。","2.堵板标准：堵板与管路连接处必须安装相应垫圈，保证密封可靠，防止注压期间气体泄漏。","3.保压判定标准：压风注气压力达到0.2MPa时关闭阀门，压力表数值保持20min，下降幅度不超过注入气压的10%（即0.02MPa），判定气密性合格。","4.泄漏处理标准：压力下降超过10%时判定气密性不合格，再次注压并保持0.2MPa，检验人员沿敷设线路排查漏气点并用粉笔标记，逐点处理（处理漏气期间不得带压掐断管路），重新检验至满足要求。","5.泄压标准：试验结束后缓慢打开管路末端控制阀门，将管道内压力气体全部泄压释放，再将管路按要求连接到位。"]},{"t":"七、安全管控措施","p":["1.范围确定管控：试验前由主管抽放班组长结合方案根据现场条件确定单次试验范围，严禁超范围、带病注压。","2.仪器管控：施工人员持证上岗、熟练掌握仪器使用方法；压力表使用正压压力表并核对量程，严禁使用损坏、超期未检仪表。","3.注压管控：高压胶管与压风管路连接牢固，注压时专人观察压力表，压力升至0.2MPa立即关闭阀门停止供气，严禁超压注气。","4.泄漏处理管控：压力下降超限后再次注压排查漏气点，严禁带压掐断管路；处理漏气点后重新注压检验至合格方可结束。","5.泄压管控：试验结束缓慢打开控制阀门泄压释放，严禁快速泄压造成管路振动、气体冲击。","6.环境管控：试验地点浮煤杂物清理干净，防止泄漏瓦斯积聚；作业中遇特殊情况及时处理并报告调度室。","7.验收闭环管控：分段试验全部合格后由通风科组织验收，抽采系统气密性达标方可投入运行，隐患当班整改闭环。"]}]}],"w":2177,"cn":3,"sn":12}],"os":"三","rn":"低风险","rc":"蓝","rg":"C","n":18,"label":"低风险 · 蓝色 C段"}],"no":"02","name":"掘进作业模块"},{"t":"第三部分 维修作业模块","g":[{"t":"一、高风险-红色-A段（7项）","lv":"A","m":[{"c":"WX-A-01","n":"沿空留巷维修","t":"WX-A-01 沿空留巷维修模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范沿空留巷维修作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝冒顶、片帮伤人、支护失效等安全隐患，提升巷道维修安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有沿空留巷维修全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先顶后帮、先上后下；先支护、后撤棚；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 沿空留巷维修模块","s":[{"t":"一、模块概述","p":["模块编号：WX-A-01","模块名称：沿空留巷维修","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["（一）片帮、冒顶、掉矸伤人：","1.临时支护不到位，顶板冒落，掉矸伤人。","2.作业前敲帮问顶执行不到位，活矸危岩掉落伤人；","（二）动压影响棚梁压弯变形：","1.受采空区动压影响，棚梁压弯；","2.侧向压力挤歪棚腿造成棚体倾倒。","（三）有毒有害气体超限风险：","1.维修期间片帮冒顶，风路堵塞，造成瓦斯超限；","2.采空区一氧化碳外泄。","（四）回旧棚、架新棚物料坠落伤人：","1.回撤旧棚，棚梁反弹伤人；","2.架新棚时，抬运棚梁、棚腿掉落伤人。","（五）高压管路伤人：","带压管路拆装过程中压力释放不到位，高压回弹伤人；","（六）手拉葫芦甩钩伤人：","回老棚使用手拉葫芦起吊，吊具损坏、断链、脱钩伤人。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：手拉葫芦、手镐、风镐、风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在无活矸危岩顶板支护良好下的空间下作业。","2.抬运物料避开倾倒滚落方向，禁止站重物正下方。","3.拆风水管时侧身站，防止带压风水管伤人。","4.上棚梁、立棚腿时，人员远离棚架内侧、正下方。","5.打楔、背帮侧身站立，防止落矸伤人。","6.拉老棚站在在断链、甩钩、脱钩波及不到的地方"]},{"t":"五、标准化作业流程","p":["风险辨识、隐患排查→安全确认→敲帮问顶→剔顶→临时支护→拉老棚→架设顶梁→背顶→刷帮→临时支护→挖柱窝→站棚腿→打帮→收尾→验收工程质量"]},{"t":"六、安全管控措施","p":["（一）空顶管控：","1.严格执行 “先控顶、后支护、先顶后帮、先上后下” 规定；","2.严禁超循环作业；临时支护必须紧跟迎头，空顶区严禁站人、严禁堆放物料、严禁任何人员逗留。","（二）敲帮问顶管控：","1.每班作业前、支护前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；","2.作业过程中随时观察顶板变化，发现异常立即撤人。","（三）输送机管控：","1.刮板输送机司机必须经培训考试合格，持证上岗，严格按照操作规程操作；","2.扩刷作业地点必须安装刮板输送机信号急停装置，出现问题立即停机。","3.安装运输机过桥，严禁人员跨越运行中的输送机。","（四）一通三防管控：","1.采用风布对采空区侧巷帮和顶部一半部分进行闭帮闭顶，防止向采空区漏风、一氧化碳涌出；","2.各转载点必须设置喷雾降尘装置，开机时正常使用；","3.加强瓦斯检查管理，甲烷浓度达到0.5％或波动范围大于0.2%时必须停止施工，报告生产调度室处理。","4.作业期间，作业地点悬挂多功能便携仪，随时检测一氧化碳、氧气等浓度。","（五）管路高压管控：","1.高压管路接头完好，杜绝破损、裂纹，严禁使用不合格软管；","2.拆装高压管路，必须先泄压，严禁带压拆卸。"]}]}],"w":1579,"cn":3,"sn":11},{"c":"WX-A-02","n":"液压支架安装","t":"WX-A-02 液压支架安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范液压支架安装作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝支架倒架、运输事故、机械伤害等安全隐患，提升液压支架安装安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有液压支架安装全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 维修模块","s":[{"t":"一、模块概述","p":["模块编号：WX-A-02","模块名称：液压支架安装","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["（一）支架调运作业伤人风险","1.回柱绞车钢丝绳磨损断丝，调架、运输时断绳、脱销，支架甩动、倾倒；","2.人员站在支架倾倒、钢丝绳弹射范围内受伤风险；","3.平板车转运支架，车辆跑车、支架滑落。","（二）支架挤、碰、压伤人风险","1.调架、旋转支架过程，支架摆动挤压人员；","2.支架侧护板、千斤顶误动作，挤夹作业人员；","3.支架与巷道帮部间隙狭小，人员滞留夹缝，挤夹作业人员。","（三）液压系统风险","1.高压油管爆裂、接头崩开，高压液喷射伤人；","2.阀组操作误动作，支架意外升降、摆动；","3.管路掐接，泄压不彻底，误喷高压液伤人。","（四）运输与通道环境风险","1.运输路线杂物堆积、浮煤浮矸多，通行受阻；","2.轨道铺设不牢，平板车掉道；","3.信号传递不清，绞车操作与现场人员配合失误。","（五）人员作业行为风险","1.多人协同作业口令不统一；","2.疲劳作业、违章指挥，简化安装工序。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：回柱绞车、支架调移装置，风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在顶板完好，无危矸顶板下。","2.拆风水管时侧身站，防止带压风水管伤人。","3.抬运物料避开倾倒滚落方向，禁止站重物正下方。","4.运输支架时，绳道范围内严禁有人行走或逗留，执行“行人不行车、行车不行人”原则。","5.设备调向、下车、合架作业时进行远程作业，与设备保持一定安全距离，人员必须站在顶板完好的地点作业。"]},{"t":"五、标准化作业流程","p":["风险辨识、隐患排查→安全确认→支架下车→连接管路→支架调向→支架合架→进行微调→升架接顶。"]},{"t":"六、安全管控措施","p":["（一）顶板安全防控","1.安装前对切眼顶板、煤帮全面评估，顶板破碎段采用单体柱配π型钢梁加强支护；","2.严禁空顶作业；严禁人员进入未支护空顶区。","3.严格执行敲帮问顶制度，及时除掉帮顶活矸危岩。","（二）支架调运安全防控","1.绞车、钢丝绳、连接销每班开工前检查，断丝、变形、裂纹立即更换，严禁带病使用；钢丝绳安全系数满足规程要求。","2.绞车拉架期间严禁人员站在钢丝绳两侧、支架倾倒回转范围之内。","3.调架、拉架统一口令，专人指挥；支架装车固定牢固，平板车封车牢靠，防窜动、防滚落。","4.轨道检修完好，阻车器、挡车装置齐全有效，严防跑车、掉道。","（三）防挤压碰撞安全防控","1.调架、旋转支架时，所有人员撤离支架摆动、挤压范围，确认无人后方可操作；","2.支架夹缝、危险区域设置警示，严禁人员停留穿行；","3.阀组操作专人专岗，杜绝无关人员操作液压手柄。","（四）液压系统安全防控","1.高压管路接头完好，杜绝破损、裂纹，严禁使用不合格软管；","2.拆装液压管路，必须先泄压，严禁带压拆卸；","3.液压阀件损坏及时更换，防止误动作造成支架意外动作。","（五）现场管理与人员安全管控","1.编制安装专项安全技术措施，组织全员培训、考试，未培训不得上岗；每班开工前开展风险预知，讲清当班风险和注意事项。","2.严格限员管理，作业点控制现场作业人数，无关人员严禁进入作业区域。","3.严禁违章指挥、冒险作业；出现顶板异常、设备异常，第一时间停止作业，人员撤至安全地点。","4.明确岗位分工、联络信号，指挥、绞车司机、支架操作工岗位固定，口令清晰。"]}]}],"w":1793,"cn":3,"sn":11},{"c":"WX-A-03","n":"液压支架回撤","t":"WX-A-03 液压支架回撤模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范液压支架回撤作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝支架倒架、运输事故、机械伤害、冒顶伤人等安全隐患，提升液压支架回撤安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有液压支架回撤全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 液压支架回撤模块","s":[{"t":"一、模块概述","p":["模块编号：WX-A-03","模块名称：液压支架回撤","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["（一）顶板垮落、片帮冒顶风险","1.回撤通道顶板破碎、煤壁片帮，支架抽架后顶板瞬间失稳，发生冒顶、砸伤作业人员、损坏设备；","2.回撤通道支护强度不足，顶板离层，未及时观测，回撤过程顶板下沉压死支架；","3.调架、拉架过程扰动围岩，顶板、煤帮崩块飞矸伤人。","（二）支架调运作业伤人风险","1.回柱绞车钢丝绳磨损断丝，抽架、调架、上车时断绳、脱销，支架甩动、倾倒；","2.人员站在支架倾倒、钢丝绳弹射范围内受伤风险；","3.平板车转运支架，车辆跑车、支架滑落。","（三）支架挤、碰、压伤人风险","1.调架、抽架、旋转支架过程，支架摆动挤压人员；","2.支架侧护板、千斤顶误动作，挤夹作业人员；","3.支架与巷道帮部间隙狭小，人员滞留夹缝，挤夹作业人员。","（四）液压系统风险","1.高压油管爆裂、接头崩开，高压液喷射伤人；","2.阀组操作误动作，支架意外升降、摆动；","3.管路掐接，泄压不彻底，误喷高压液伤人。","（五）瓦斯、粉尘、火灾风险","1.回撤扰动煤体，瓦斯异常涌出，局部瓦斯积聚；","2.落架、抽架、移架产生大量煤尘，防尘不到位；","（六）运输与通道环境风险","1.回撤通道杂物堆积、浮煤浮矸多，通行受阻；","2.轨道铺设不牢，平板车掉道；","3.信号传递不清，绞车操作与现场人员配合失误。","（七）人员作业行为风险","1.作业人员未执行“先支护、后回撤”，冒险进入无支护区域；","2.多人协同作业口令不统一；","3.疲劳作业、违章指挥，简化回撤工序。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：回柱绞车、支架调移装置、上车平台，风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在无活矸危岩顶板支护良好下的空间下作业。","2.禁止站在待回撤支架倾倒、滑动方向的前方。","3.抬运物料避开倾倒滚落方向，禁止站重物正下方。","4.运输支架时，绳道范围内严禁有人行走或逗留，执行“行人不行车、行车不行人”原则。","5.支架抽架、调向、上车作业时进行远程作业，与设备保持一定安全距离。"]},{"t":"五、标准化作业流程","p":["风险辨识、隐患排查→安全确认→作业地点加固→降架→出架→调向→拉支架→装车→外运。"]},{"t":"六、安全管控措施","p":["（一）顶板安全防控","1.回撤前对回撤通道顶板、煤帮全面评估，顶板破碎段采用单体柱配π型钢梁加强支护；","2.坚持先护后回，抽架后及时对空顶区域采取挡矸、护顶措施；严禁人员进入未支护空顶区。","3.严格执行敲帮问顶制度，及时除掉帮顶活矸危岩。","（二）支架调运安全防控","1.绞车、钢丝绳、连接销每班开工前检查，断丝、变形、裂纹立即更换，严禁带病使用；钢丝绳安全系数满足规程要求。","2.绞车拉架期间严禁人员站在钢丝绳两侧、支架倾倒回转范围之内。","3.调架、拉架统一口令，专人指挥；支架装车固定牢固，平板车封车牢靠，防窜动、防滚落。","4.轨道检修完好，阻车器、挡车装置齐全有效，严防跑车、掉道。","（三）防挤压碰撞安全防控","1.调架、旋转支架时，所有人员撤离支架摆动、挤压范围，确认无人后方可操作；","2.支架夹缝、危险区域设置警示，严禁人员停留穿行；","3.阀组操作专人专岗，杜绝无关人员操作液压手柄。","（四）液压系统安全防控","1.高压管路接头完好，杜绝破损、裂纹，严禁使用不合格软管；","2.拆装液压管路，必须先泄压，严禁带压拆卸；","3.液压阀件损坏及时更换，防止误动作造成支架意外动作。","（五）瓦斯粉尘火灾安全防控","1.回撤期间加强瓦斯巡检，瓦斯超限立即停机撤人，处置合格后方可复工；","2.回撤全过程开启喷雾降尘，冲洗巷道浮煤，做好个体防尘防护；","（六）现场管理与人员安全管控","1.编制专项回撤安全技术措施，组织全员培训、考试，未培训不得上岗；每班开工前开展风险预知，讲清当班风险和注意事项。","2.严格限员管理，回撤作业点控制现场作业人数，无关人员严禁进入回撤作业区域。","3.严禁违章指挥、冒险作业；出现顶板异常、设备异常，第一时间停止作业，人员撤至安全地点。","4.明确岗位分工、联络信号，指挥、绞车司机、支架操作工岗位固定，口令清晰。"]}]}],"w":2110,"cn":3,"sn":11},{"c":"WX-A-04","n":"液压支架组装","t":"WX-A-04 液压支架组装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范液压支架组装作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝支架倒架、运输事故、机械伤害、吊装伤害等安全隐患，提升液压支架组装安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有液压支架组装全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 液压支架组装模块","s":[{"t":"一、模块概述","p":["模块编号：WX-A-04","模块名称：液压支架组装","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["（一）吊装风险","1.起吊葫芦、起吊索具破损、超负荷起吊，构件坠落砸人；","2.人员站在重物下方、吊件摆动范围内。","（二）对接装配挤压伤害风险","1.推移千斤顶、销轴对接时手脚伸入销孔、结合面夹缝，被挤伤；","2.大件对接时受力偏移，构件突然窜动伤人。","（三）液压系统高压伤人风险","1.管路未泄压强行拆装，高压液体喷射伤人；","2.接头松动、胶管老化爆裂，高压冲击人员。","（四）顶板、围岩及环境安全风险","1.组装区域空顶、支护不到位，顶板掉矸、片帮伤人；","2.巷道底板湿滑，重型部件倾倒伤人；","3.多人作业扎堆，应急撤离通道堵塞。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：支架组装机器人、调运机车，风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在无活矸危岩顶板支护良好下的空间下作业。","2.禁止站在支架倾倒、滑动方向的前方。","3.抬运物料避开倾倒滚落方向，禁止站重物正下方。","4.起吊大件时，人员要站在葫芦断链、脱钩影响不到的安全位置。","5.起吊件下方和起吊件掉落后涉及的区域严禁有人。"]},{"t":"五、标准化作业流程","p":["风险辨识、隐患排查→安全确认→起吊顶梁→将底座推向顶梁下→连接底座→起吊尾梁→连接尾梁"]},{"t":"六、安全管控措施","p":["（一）吊装风险安全管控","1.开工前检查葫芦、起吊链子、起吊索具，严禁使用裂纹索具，严格核定载荷；","2.吊装全程重物下方严禁站人，专人统一指挥，吊件摆动区域设置警戒。","（二）对接装配挤压安全管控","1.销轴对位使用导向工具，禁止徒手探入销孔、结合缝隙内；","2.液压顶推对接时，人员侧身站立，避开构件窜动方向；","3.配合人员相互呼应，动作统一，严禁单人盲目操作液压阀组。","（三）液压系统高压安全管控","1.拆装液压管路前，彻底释放系统残余压力；","2.更换破损油管，接头紧固到位，试压确认无渗漏；","3.检修、插拔接头时侧身站位，禁止正对出液口。","（四）顶板、围岩及环境管控","1.作业区域先进行敲帮问顶，补齐临时支护，严禁空顶作业；","2.平整作业场地，大件放置采取防倾倒固定措施；","3.划分作业区与避险通道，作业人员保持安全间距，严禁堵塞避险路线。"]}]}],"w":1369,"cn":3,"sn":11},{"c":"WX-A-05","n":"超前液压支架拆除","t":"WX-A-05 超前液压支架拆除模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范综采工作面超前液压支架拆卸作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝支架倾倒、管路喷液、构件坠落、吊装失稳等安全隐患，提升超前液压支架拆卸施工质量与现场安全管理水平，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采工作面超前液压支架拆卸全过程作业及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先支护、后拆卸；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 维修模块","s":[{"t":"一、模块概述","p":["模块编号：WX-A-05","模块名称：综采工作面超前液压支架拆除","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["1.支架倾倒、滑移伤人。","2.液压管路爆管、喷液伤人。","3.构件坠落、磕碰伤人。","4.销轴、连接件弹出伤人。","5.起重吊装设备损坏、起吊设备失稳伤人。","6.顶板掉矸、片帮伤人。","7.机械挤压、夹伤。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：手拉葫芦、注液枪，风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.支架动作、吊装作业时，人员站在安全侧，避开支架倾倒、构件滑落、管路喷液方向。","2.拆装液压管路、销轴时，侧身站位，面部、身体严禁正对接口、销孔位置。","3.撬动、拆卸连接件时，双脚站稳，禁止站在构件受力、回弹范围内。","4.大件起吊、挪移期间，全员撤离吊装半径及危险区域，只留专职指挥人员。","5.调整支架位置、收放千斤顶时，手脚不得伸入架体间隙。"]},{"t":"五、标准化作业流程","p":["风险辨识→隐患整改→安全确认→使用单体液压支柱加固→下落液压支架→固定起吊工具→在顶梁前后销轴孔内固定刮板链→使用单体液压支柱对顶梁进行加固→拆前后立柱→外运前后立柱→拆顶梁销轴→卸载临时加固单体液压支柱→外运超前支架底座→下落超前支架顶梁→装车外运"]},{"t":"六、安全管控措施","p":["1.顶板围岩管控：作业前、作业中全程敲帮问顶，发现顶板破碎、片帮立即停工处理。","2.液压系统管控：所有油缸、管路必须完全卸压后方可拆卸，严禁带压检修、拆管。","3.吊装作业管控：吊具每班班前检查，严禁超载、统一指挥、口令清晰。","4.防倒防滑管控：支架未完全固定、未加装防倒装置，严禁开展拆卸作业。","5.现场警戒管控：作业区域设专人警戒，严禁无关人员进入作业范围。","6.工具使用管控：使用专用工具作业，严禁乱撬、硬砸，禁止违规使用非专用器具。"]}]}],"w":1223,"cn":3,"sn":11},{"c":"WX-A-06","n":"大件设备更换","t":"WX-A-06 大件设备更换模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下大件设备（电机、减速机、滚筒、水泵等）更换作业行为，统一施工流程、安全风险防控、质量及物料管控标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝物件坠落、挤压伤人、触电、设备倾倒等隐患，做到安全拆除、安装物料完好、现场整洁，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于井下大件设备（电机、减速机、滚筒、水泵等）更换、转运全工序及现场管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先断电、后拆除；先拆除、后安装；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 大件设备更换模块","s":[{"t":"一、模块概述","p":["模块编号：WX-A-06","模块名称：大件设备（电机、减速机、滚筒、水泵等）更换","所属专业：维修","适用范围：维修所有人员"]},{"t":"二、危险预知","p":["1.片帮掉矸伤人。","2.触电伤人。","3.大件设备起吊坠落、摆动伤人。","4.设备、部件挤压夹伤。","5.狭小空间磕碰伤人。"]},{"t":"三、作业条件安全确认","p":["1.人员确认：作业人员安全技术措施贯彻学习到位，精神良好，持证上岗，≥2 人配合作业，互保联保明确；","2.设备确认：手拉葫芦、风炮、风压 / 水压正常，工具完好齐全；","3.环境确认：顶板、围岩稳定，敲帮问顶执行到位，瓦斯浓度≤0.5%，通风正常，退路畅通。"]},{"t":"四、作业现场人员安全站位","p":["1.站在支护完好、远离设备倾倒及坠落范围的安全区域。","2.起吊、下放部件时，严禁站在吊物正下方及摆动范围。","3.拆卸大件时，人员避开设备滑落、倾倒方向。","4.高处拆解作业，人员在平台内作业，下方设警戒禁止通行。","5.传递零部件禁止正对他人，防止物件磕碰。"]},{"t":"五、标准化作业流程","p":["技术交底 + 现场安全警戒 → 设备断电闭锁  → 起吊牵引更换件→ 拆除连接螺丝 → 下放更换大件→ 运走更换大件 → 运来新设备 → 起吊新设备 → 连接安装新设备 → 全面自检"]},{"t":"六、安全管控措施","p":["1.敲帮问顶管控：每班作业前、交接班前后必须进行全断面敲帮问顶，活矸、危石必须清理干净，确认顶板、煤壁稳定后方可作业；作业过程中随时观察顶板变化，发现异常立即撤人。","2.电气管控：全程执行断电闭锁制度，拆接线由持证电工操作，严禁带电作业。","3.大件拆解管控：设备拆解前必须捆绑加固，使用葫芦缓慢下放，防止倾倒、滚落。","4.起吊转运管控：吊具每班班前检查，轻吊慢放，统一指挥；大件转运严格执行巷道运输规定。","5.部件管控：所有零配件专人收集、分类存放，严禁抛掷、踩踏设备部件。","6.高空管控：高处拆解必须使用合格作业平台，严禁无防护登高作业。"]}]}],"w":1182,"cn":3,"sn":11},{"c":"WX-A-07","n":"水仓清挖","t":"WX-A-07 水仓清挖模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范水仓清挖作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝冒顶、片帮伤人、机械伤害、窒息等安全隐患，提升水仓清挖安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有水仓清挖全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：维修队队长、支部书记","副组长：安全技术副队长、跟班副队长","成  员：班组长、安检员、操作人员"]},{"t":"二、核心职责","p":["队长、支部书记：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","跟班副队长：班前会交底、现场组织协调、作业过程监督。","班组长：当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","作业人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 水仓清挖模块","s":[{"t":"一、模块概述","p":["模块编号：WX-
