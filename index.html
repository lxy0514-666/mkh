,"3.掏槽时容易发生片帮伤人：应从下向上进行做到先底后帮，采用前后掏梁窝的方式对帮顶进行临时支护，防止掏槽期间发生冒顶或片帮。","4.风门安装伤人：安装风门时风门两端要用牵引绳进行牵引，防止风门倾倒伤人。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：支护完好、无离层掉矸、无片帮、安全退路畅通。","2.有毒有害气体确认：甲烷以及二氧化碳不能超过规定。","3.工具确认：瓦斯检测仪完好，瓦刀、泥抹、脚手架、卷尺、线绳。","4.材料确认：砖、沙、水泥。"]},{"t":"四、作业现场人员安全站位","p":["1.站在支护完好、无危岩片帮的安全位置作业。","2.构筑墙体时，高空作业人员必须站在牢固作业平台上，严禁站在架板边缘运输、传递物料，严禁踩踏不稳定平台。","3.作业平台下方无关人员严禁逗留、围观，设置警戒区，杜绝物体打击伤人。"]},{"t":"五、标准化作业流程","p":["安全确认→掏底槽→铺底→掏帮槽→砌筑墙体→搭建平台→封顶→粉刷→安装风门→安装风门连锁装置→进行调校→配置风门传感器→清理杂物→悬挂管理牌板"]},{"t":"六、作业质量标准","p":["1.墙体厚度标准：风门墙体厚度不小于0.8m。","2.掏槽标准：墙体周边必须进行掏槽，掏槽深度不小于0.5m。岩体可以不掏槽，但应将松动岩体刨除，见硬岩体。","3.墙面平整度标准：墙面1㎡内凹凸不大于10mm。"]},{"t":"七、安全管控措施","p":["1.墙体施工管控：参与风门构筑人员必须认真学习本方案，熟悉方案有关规定。施工期间，由通风队安排人员监督墙体构筑质量，安检员监督落实。","2.瓦斯管控：施工期间，施工地点必须悬挂便携式甲烷检测报警仪，甲烷以及二氧化碳不能超过规定。","3.风镐使用管控：确保风镐的滤网无堵塞，缸体与阀体间风道畅通无阻，镐体及其与钢套固定可靠，阻塞阀灵活。","4.墙体周边掏槽管控：应从下向上进行做到先底后帮，采用前后掏梁窝的方式对帮顶进行临时支护，防止掏槽期间发生冒顶或片帮。","5.风门安装管控：班组长现场指挥协调，安装风门时风门两端要用牵引绳进行牵引，防止风门倾倒伤人。","6.验收环节管控：由矿领导组织进行验收，不符合构筑标准的要推倒重建。"]}]}],"w":1243,"cn":3,"sn":12},{"c":"TF-B-04","n":"风筒吊挂","t":"TF-B-04 风筒吊挂模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范风筒吊挂行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生人员跌落、瓦斯超限等安全隐患，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有地点需要风筒吊挂作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先贯彻、后作业；先确认、后施工；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：通风队队长","副组长：通风队安全技术副队长、班组长","成  员：瓦斯检查工、通风工"]},{"t":"二、核心职责","p":["队长：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","班组长：班前会交底、现场组织协调、作业过程监督。当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章  风筒吊挂模块","s":[{"t":"一、模块概述","p":["模块编号：TF-B-04","模块名称：风筒吊挂","所属专业：通风","适用范围：通风队所有人员"]},{"t":"二、危险预知及防控","p":["1.人员掉落的风险：作业前平台搭建牢固、平台高度超过2m时要系好保险绳。","2.风筒脱节导致瓦斯超限风险：风筒对接牢固。","3.风筒受力不均有落地风险： 风筒必须逢环必挂。","4. 风距超限的风险：风筒距工作面距离必须符合规定。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：支护完好、无离层掉矸、无片帮、安全退路畅通。","2.有毒有害气体确认：甲烷以及二氧化碳不能超过规定。","3.工具材料确认：工作平台、钳子、风筒、钢丝绳、铁丝、保险绳。"]},{"t":"四、作业现场人员安全站位","p":["1.站在支护完好、无危岩片帮的安全位置作业，退路通畅。","2.高空作业人员必须站在牢固作业平台上，平台高度超过2m时要系保险绳，严禁站在平台边缘。","3.多人配合作业，高空作业下方严禁无关人员逗留、围","观，防止物体掉落伤人。"]},{"t":"五、标准化作业流程","p":["安全确认→搭建平台→固定钢丝绳→掐接吊挂风筒→末端加固→完工检查"]},{"t":"六、作业质量标准","p":["1.风筒掐、接标准：风筒之间接口严密不漏风，风筒对接时要顺接。反压边要符合规定。","2.风筒吊挂管标准：风筒吊挂必须靠近顶板、靠近巷帮、整条风筒成一条直线。平、直、稳、牢，缝环必挂，拐弯处要有弯头，要缓慢拐弯，不准拐死弯，不准有挤压。风筒实行编号管理。"]},{"t":"七、安全管控措施","p":["1.日常巡检管控：每班检查风筒吊挂状况，重点排查脱节、破口、坠落隐患，通风管理人员定期专项检查，发现隐患要立即进行整改。","2.现场作业管理管控：掐、接挪移风筒作业前落实安全措施，掐接风筒时无关人员严禁入内。","3.人员培训管控：对作业工开展培训，明确风筒吊挂规范以及风筒漏风、脱节带来瓦斯积聚风险，杜绝人为损坏风筒。","4.考核管控：将风筒标准化纳入班组考核，对随意破坏、不按标准吊挂、隐患逾期不整改的人员进行追责。"]}]}],"w":1055,"cn":3,"sn":12},{"c":"TF-B-05","n":"隔爆水袋安装","t":"TF-B-05 隔爆水袋安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范隔爆水袋安装行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生人员跌落、物品坠落伤人等安全隐患，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有地点隔爆水袋安装作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先贯彻、后作业；先确认、后施工；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：通风队队长","副组长：通风队安全技术副队长、班组长","成  员：瓦斯检查工、通风工"]},{"t":"二、核心职责","p":["队长：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","班组长：班前会交底、现场组织协调、作业过程监督。当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章  隔爆水袋安装模块","s":[{"t":"一、模块概述","p":["模块编号：TF-B-05","模块名称：隔爆水袋安装","所属专业：通风","适用范围：通风队所有人员"]},{"t":"二、危险预知及防控","p":["1.人员掉落的风险：作业平台搭建牢固。","2.物体坠落伤人风险：严格按措施施工，做好警戒。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：顶板完好、无离层掉矸、无片帮、安全退路畅通。甲烷以及二氧化碳不能超过规定。","2.工具材料确认：瓦斯检测仪完好，保险绳、工作平台、铁丝、隔爆水袋、水袋杆。"]},{"t":"四、作业现场人员安全站位","p":["1.站在支护完好、无危岩片帮的安全位置作业。","2.作业人员必须站在牢固作业平台上，作业平台超过2m时，平台上作业人员要佩戴安全带。严禁站在架板边缘运输、传递物料，严禁踩踏不稳定平台。","3.作业平台下方无关人员严禁逗留、围观，设置警戒区，杜绝物体打击伤人。"]},{"t":"五、标准化作业流程","p":["安全措施贯彻学习→现场安全确认→搭建平台→安装水袋钩→吊挂水袋→水袋编号→水袋加水→拆除平台→清理杂物→悬挂水袋管理牌板"]},{"t":"六、作业质量标准","p":["1.安装地点标准：在安装地点前后10m范围内设置警戒，确保安装现场安全。","2.水量和距离标准：主要隔爆水棚：用水量400L/m²,棚区长度≥30m,辅助隔爆水棚：用水量200L/m²,棚区长度≥20m,设置位置：直线巷道内，棚区前后20 m断面一致。距工作面：60～160 m。距交叉口/转弯/变坡：50～75 m。 距风门：\u003e25 m。","3.悬挂高度与间隙标准：排内两个水袋之间的间隙应为0.1m～1.2m,水袋外边缘与巷壁(两帮)、支架、构筑物之间的垂直距离不应小于0.1m，水袋之间的间隙与水袋同支架或巷壁之间的间隙之和不应大于1.5m。水袋底部距顶板(梁)的垂直距离不应大于1m;水袋底部至巷道轨面的垂直距离不应低于巷道高度的1/2，且不应小于1.8m。每排水袋高度一致，每列相邻两排水袋的间距为1.0m-3m且排间距相同，每排相邻两列水袋间距根据巷道实际情况确定并保持一致。","4.平台标准：安装前必须根据现场情况搭设工作平台。平台搭建后由班组长对平台牢固情况进行检查，经确认安全后方可进行作业。"]},{"t":"七、安全管控措施","p":["1.瓦斯管控：安装过程中瓦斯超限等异常，立即停止作业，人员撤离至安全地点并汇报生产调度室。","2.标准管控：严格按照规定间距、数量、高度吊挂水袋，保证安装牢固，无破损漏水。","3.顶板管控：作业前排查顶板围岩状况，防止掉矸伤人，高空作业规范使用防护设施。","4.巡检管控：加强巡检，损坏、缺水水袋立即整改，严禁随意拆除隔爆设施。"]}]}],"w":1318,"cn":3,"sn":12},{"c":"TF-B-06","n":"自动隔爆安装","t":"TF-B-06 自动隔爆安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范自动隔爆安装行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生人员跌落、误爆等安全隐患，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有地点自动隔爆安装作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先贯彻、后作业；先确认、后施工；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：通风队队长","副组长：通风队安全技术副队长、班组长","成  员：瓦斯检查工、通风工"]},{"t":"二、核心职责","p":["队长：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","班组长：班前会交底、现场组织协调、作业过程监督。当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章  自动隔爆安装模块","s":[{"t":"一、模块概述","p":["模块编号：TF-B-06","模块名称：自动隔爆安装","所属专业：通风","适用范围：通风队所有人员"]},{"t":"二、危险预知及防控","p":["1.人员掉落的风险：作业平台搭建牢固。","2.物体坠落伤人风险：严格按措施施工，做好警戒。","3.冲击伤人风险：安装前确认保险装置处于关闭状态。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：顶板、煤壁稳定，敲帮问顶完成，退路畅通。","2.有毒有害气体确认：甲烷以及二氧化碳不能超过规定。","3.工具、材料确认：瓦斯检测仪，保险绳、工作平台、扳子、底座。","4.保险装置确认：自动隔爆装置保险处于关闭状态。"]},{"t":"四、作业现场人员安全站位","p":["1.站在支护完好、无危岩片帮的安全位置作业。","2.作业人员必须站在牢固作业平台上，作业平台超过2m时，平台上作业人员要佩戴安全带。","3.作业平台下方无关人员严禁逗留、围观，设置警戒区，杜绝物体打击伤人。"]},{"t":"五、标准化作业流程","p":["选址→安全确认→搭建平台→固定底座→起吊主体→安装传动杆→解除保险装置→清理杂物→悬挂管理牌板"]},{"t":"六、作业质量标准","p":["1.安装地点标准：在安装地点前后30m范围内设置警戒，确保自动隔爆安装完成后方可解除警戒，自动隔爆装置与掘进工作面和采煤工作面距离应控制在60-160m，两组隔爆装置之间的距离不大于160m。","2.起吊标准：必须使用能承受足够重量的尼龙绳子进行起吊，缓慢起吊，严禁抛掷。","3.安装标准：安装隔爆装置时，严禁拆除触发机构锁紧部件，防止因安装发生意外碰撞造成装置误触发，严格按照隔爆装置安装说明书执行。"]},{"t":"七、安全管控措施","p":["1.瓦斯管控：安装过程中发现瓦斯超限，立即停止作业，人员撤离至安全地点并汇报生产调度室。","2.顶板管控：作业前排查顶板围岩状况，防止掉矸伤人，高空作业规范使用防护设施。","3.日常巡检管控：加强日常巡检，压力降低，覆膜有煤尘，必须立即整改。","4.安装管控：安装完成后检查组件完好性，确认隔爆装置处于工作状态。"]}]}],"w":1066,"cn":3,"sn":12},{"c":"TF-B-07","n":"自动隔爆拆除","t":"TF-B-07 自动隔爆拆除模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范自动隔爆拆除行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生人员跌落、误爆等安全隐患，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有地点自动隔爆拆除作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先贯彻、后作业；先确认、后施工；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：通风队队长","副组长：通风队安全技术副队长、班组长","成  员：瓦斯检查工、通风工"]},{"t":"二、核心职责","p":["队长：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","班组长：班前会交底、现场组织协调、作业过程监督。当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章  自动隔爆拆除模块","s":[{"t":"一、模块概述","p":["模块编号：TF-B-07","模块名称：自动隔爆安装","所属专业：通风","适用范围：通风队所有人员"]},{"t":"二、危险预知及防控","p":["1.人员掉落的风险：作业平台搭建牢固。","2.物体坠落伤人风险：严格按措施施工，做好警戒。","3.冲击伤人风险：拆除前确认保险装置处于关闭状态。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：顶板、煤壁稳定，敲帮问顶完成，退路畅通。","2.有毒有害气体确认：甲烷以及二氧化碳不能超过规定。","3.工具、材料确认：瓦斯检测仪，保险绳、工作平台、扳子、尼龙绳。","4.设备确认：自动隔爆装置保险处于关闭状态。"]},{"t":"四、作业现场人员安全站位","p":["1.站在顶板完好、无危岩片帮的安全位置作业。","2.作业人员必须站在牢固作业平台上，作业平台超过2m时，平台上作业人员要佩戴安全带。","3.作业平台下方无关人员严禁逗留、围观，设置警戒区，防止物体坠落伤人。"]},{"t":"五、标准化作业流程","p":["安全确认→关闭闭锁装置→拆除传动杆→起吊主体→拆除底座→下落主体→清理杂物→回收管理牌板"]},{"t":"六、作业质量标准","p":["1.拆除地点要求：在拆除地点前后30m范围内设置警戒，确保自动隔爆拆除完成后方可解除警戒。","2.起吊标准：必须使用能承受足够重量的绳子进行起吊，缓慢下放，严禁抛掷。","3.拆除标准：拆除隔爆装置时，严禁拆除触发机构锁紧部件，防止因安装发生意外碰撞造成装置误触发。"]},{"t":"七、安全管控措施","p":["1.瓦斯管控：拆除过程中发现瓦斯超限，立即停止作业，人员撤离至安全地点并汇报生产调度室。","2.作业地点管控：作业前排查支护状况，防止掉矸伤人，高空作业规范使用防护设施。","3.拆除过程管控：拆除过程必须轻拿轻放，避免撞击，防止装置零部件损坏、失效。","4.闭环管控：拆除完毕后及时运到安全地点，不得在巷道内随意堆放。"]}]}],"w":996,"cn":3,"sn":12}],"os":"二","rn":"中风险","rc":"橙","rg":"B","n":7,"label":"中风险 · 橙色 B段"}],"no":"06","name":"通风作业模块"}]};

<script>
(function(){
'use strict';
var parts = DATA.parts;

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ============ 扁平索引 ============ */
var MODS = [], byCode = Object.create(null);
parts.forEach(function(P, pi){
  P.g.forEach(function(G, gi){
    G.m.forEach(function(M){
      M.pi = pi; M.gi = gi; M.i = MODS.length; M.lv = G.lv;
      M.pn = P.name; M.pno = P.no; M.gl = G.label;
      MODS.push(M); byCode[M.c] = M;
    });
  });
});

/* ============ 目录 ============ */
var partsEl = document.getElementById('parts');
var catalog = document.getElementById('catalog');
var docEl = document.getElementById('doc');
var fab = document.getElementById('fab');
var dirCount = document.getElementById('dirCount');

function buildCatalog(){
  var frag = document.createDocumentFragment();
  parts.forEach(function(P, pi){
    var part = document.createElement('div');
    part.className = 'part';
    part.dataset.open = '0';
    part.dataset.p = pi;

    var total = P.g.reduce(function(a, g){ return a + g.n; }, 0);
    var hd = document.createElement('button');
    hd.type = 'button';
    hd.className = 'part-hd';
    hd.setAttribute('aria-expanded', 'false');
    hd.innerHTML = '<span class="part-no">' + P.no + '</span>' +
      '<span class="p-main"><span class="p-name">' + esc(P.name) + '</span>' +
      '<span class="p-meta">' + P.g.length + ' 级风险 · ' + total + ' 个模块</span></span>' +
      '<span class="p-ico" aria-hidden="true"></span>';

    var body = document.createElement('div');
    body.className = 'part-body';
    var inner = document.createElement('div');
    inner.className = 'pb-inner';

    P.g.forEach(function(G){
      var grp = document.createElement('div');
      grp.className = 'grp';
      grp.dataset.open = '0';

      var ghd = document.createElement('button');
      ghd.type = 'button';
      ghd.className = 'grp-hd';
      ghd.dataset.lv = G.lv;
      ghd.setAttribute('aria-expanded', 'false');
      ghd.innerHTML = '<span class="grp-rail" aria-hidden="true"></span>' +
        '<span class="grp-name">' + esc(G.label) + '</span>' +
        '<span class="grp-n">' + G.n + ' 项</span>' +
        '<span class="chev" aria-hidden="true"></span>';

      var gbody = document.createElement('div');
      gbody.className = 'grp-body';
      var list = document.createElement('ul');
      list.className = 'mod-list';

      G.m.forEach(function(M){
        var li = document.createElement('li');
        li.className = 'mod';
        li.dataset.lv = G.lv;
        var a = document.createElement('a');
        a.href = '#/m/' + encodeURIComponent(M.c);
        a.innerHTML = '<span class="mod-code">' + esc(M.c) + '</span>' +
          '<span class="mod-name">' + esc(M.n) + '</span>' +
          '<span class="mod-go" aria-hidden="true">›</span>';
        li.appendChild(a);
        list.appendChild(li);
      });

      gbody.appendChild(list);
      grp.appendChild(ghd);
      grp.appendChild(gbody);
      inner.appendChild(grp);
    });

    body.appendChild(inner);
    part.appendChild(hd);
    part.appendChild(body);
    frag.appendChild(part);
  });
  partsEl.appendChild(frag);
  dirCount.textContent = MODS.length + ' 个模块';
}

partsEl.addEventListener('click', function(e){
  var ph = e.target.closest('.part-hd');
  if (ph){
    var part = ph.parentElement;
    var open = part.dataset.open === '1';
    part.dataset.open = open ? '0' : '1';
    ph.setAttribute('aria-expanded', String(!open));
    return;
  }
  var gh = e.target.closest('.grp-hd');
  if (gh){
    var grp = gh.parentElement;
    var gopen = grp.dataset.open === '1';
    grp.dataset.open = gopen ? '0' : '1';
    gh.setAttribute('aria-expanded', String(!gopen));
  }
});

/* ============ 搜索 ============ */
var qInput = document.getElementById('q');
var qClear = document.getElementById('qClear');
var searchTip = document.getElementById('searchTip');
var resultsEl = document.getElementById('results');
var searchTimer = null;

function fullText(M){
  if (M._s) return M._s;
  var buf = [M.c, M.n, M.t, M.pn, M.gl];
  M.ch.forEach(function(C){
    buf.push(C.t);
    C.s.forEach(function(S){
      buf.push(S.t);
      S.p.forEach(function(x){ buf.push(x); });
    });
  });
  M._s = buf.join('\n');
  M._sl = M._s.toLowerCase();
  return M._s;
}

function snippet(M, qLower){
  var arr = [];
  M.ch.forEach(function(C){
    C.s.forEach(function(S){
      S.p.forEach(function(x){ arr.push(x); });
    });
  });
  for (var i = 0; i < arr.length; i++){
    if (arr[i].toLowerCase().indexOf(qLower) > -1){
      var t = arr[i];
      var at = t.toLowerCase().indexOf(qLower);
      var start = Math.max(0, at - 22);
      var end = Math.min(t.length, at + qLower.length + 40);
      return (start > 0 ? '…' : '') + t.slice(start, end) + (end < t.length ? '…' : '');
    }
  }
  return '';
}

function highlight(text, q){
  if (!q) return esc(text);
  var lower = text.toLowerCase(), ql = q.toLowerCase();
  var out = '', idx = 0, hit = lower.indexOf(ql);
  while (hit > -1){
    out += esc(text.slice(idx, hit)) + '<mark>' + esc(text.slice(hit, hit + q.length)) + '</mark>';
    idx = hit + q.length;
    hit = lower.indexOf(ql, idx);
  }
  return out + esc(text.slice(idx));
}

function doSearch(raw){
  var q = raw.trim();
  if (!q){
    resultsEl.hidden = true;
    resultsEl.innerHTML = '';
    partsEl.hidden = false;
    qClear.classList.remove('on');
    searchTip.textContent = '输入编号（如 CM-A-01）或作业名称，可直接定位';
    dirCount.textContent = MODS.length + ' 个模块';
    return;
  }
  qClear.classList.add('on');
  partsEl.hidden = true;
  resultsEl.hidden = false;

  var ql = q.toLowerCase();
  var hits = [];
  for (var i = 0; i < MODS.length; i++){
    var M = MODS[i];
    var s = fullText(M);
    if (M._sl.indexOf(ql) > -1){
      var score = M.c.toLowerCase().indexOf(ql) === 0 ? 0
        : (M.c.toLowerCase().indexOf(ql) > -1 ? 1
        : (M.n.toLowerCase().indexOf(ql) > -1 ? 2 : 3));
      hits.push({ M: M, score: score });
    }
  }
  hits.sort(function(a, b){ return a.score - b.score; });

  dirCount.textContent = '命中 ' + hits.length + ' 个模块';
  searchTip.textContent = hits.length ? '按匹配程度排序，点击进入模块'
    : '换个编号或关键词，例如“支架”“停送电”“瓦斯”';

  if (!hits.length){
    resultsEl.innerHTML = '<div class="empty"><span class="big">没有找到“' + esc(q) + '”</span>' +
      '可尝试模块编号（如 JJ-A-01）、设备名（采煤机）或作业名称（闭帮、喷浆）。</div>';
    return;
  }

  var shown = hits.slice(0, 50);
  var html = '';
  var lastPi = -1;
  shown.forEach(function(h){
    var M = h.M;
    if (M.pi !== lastPi){
      if (lastPi !== -1) html += '</div>';
      html += '<div class="res-group">';
      html += '<div class="res-bc"><span>第' + M.pno + '部分 ' + esc(M.pn) + '</span>' +
        '<span class="rv" data-lv="' + M.lv + '">' + esc(M.gl) + '</span></div>';
      lastPi = M.pi;
    }
    var sn = snippet(M, ql);
    html += '<a class="res-item" href="#/m/' + encodeURIComponent(M.c) + '">' +
      '<div class="rn"><span class="rc">' + esc(M.c) + '</span>' +
      '<span class="rt">' + highlight(M.n, q) + '</span></div>' +
      (sn ? '<div class="rx">' + highlight(sn, q) + '</div>' : '') +
      '</a>';
  });
  if (lastPi !== -1) html += '</div>';
  if (hits.length > 50){
    html += '<div class="empty">结果较多，仅显示前 50 个，请输入更具体的关键词。</div>';
  }
  resultsEl.innerHTML = html;
}

qInput.addEventListener('input', function(){
  var v = qInput.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){ doSearch(v); }, 120);
});
qClear.addEventListener('click', function(){
  qInput.value = '';
  doSearch('');
  qInput.focus();
});
resultsEl.addEventListener('click', function(e){
  if (e.target.closest('a')) qInput.blur();
});

/* ============ 正文 ============ */
var docTitle = document.getElementById('docTitle');
var docMeta = document.getElementById('docMeta');
var docNav = document.getElementById('docNav');
var docBody = document.getElementById('docBody');
var docFoot = document.getElementById('docFoot');
var heroEl = document.querySelector('.hero');
var docBadge = document.getElementById('docBadge');
var docBarCode = document.getElementById('docBarCode');
var LV_NAME = {A:'高风险', B:'中风险', C:'低风险'};

function shortChap(t){
  var m = t.match(/^第[一二三四五六七八九十]+章[\s\u3000]*(.*)$/);
  return (m && m[1]) ? m[1] : (t || '正文');
}

function paraEl(text){
  var p = document.createElement('p');
  p.className = 'p';
  var li = text.match(/^(\d{1,2}[.．、]|（\d{1,2}）|\(\d{1,2}\))/);
  var rest = text;
  if (li){
    p.classList.add('li');
    var no = document.createElement('span');
    no.className = 'no';
    no.textContent = li[1];
    p.appendChild(no);
    rest = text.slice(li[1].length);
  }
  var ci = rest.indexOf('：');
  if (ci > 0 && ci <= 14 && !/[。，；、？！（）()]/.test(rest.slice(0, ci))){
    var b = document.createElement('span');
    b.className = 'lead';
    b.textContent = rest.slice(0, ci + 1);
    p.appendChild(b);
    p.appendChild(document.createTextNode(rest.slice(ci + 1)));
  } else {
    p.appendChild(document.createTextNode(rest));
  }
  if (text.indexOf('→') > -1) p.classList.add('flow');
  return p;
}

function renderDoc(M){
  docTitle.innerHTML = '';
  var code = document.createElement('span');
  code.className = 'code';
  code.textContent = M.c;
  docTitle.appendChild(code);
  docTitle.appendChild(document.createTextNode(M.n));

  docBadge.dataset.lv = M.lv;
  docBadge.textContent = LV_NAME[M.lv];
  docBarCode.textContent = M.c;

  docMeta.textContent = '第' + M.pno + '部分 ' + M.pn + ' · ' + M.gl +
    ' · ' + M.cn + ' 章 ' + M.sn + ' 节 · 约 ' + M.w.toLocaleString() + ' 字';

  docNav.innerHTML = '';
  M.ch.forEach(function(C, i){
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (i === 0 ? ' on' : '');
    chip.dataset.i = i;
    chip.textContent = '第 ' + (i + 1) + ' 章 · ' + shortChap(C.t);
    docNav.appendChild(chip);
  });
  docNav.hidden = M.ch.length < 2;

  docBody.innerHTML = '';
  M.ch.forEach(function(C, i){
    var chapter = document.createElement('div');
    chapter.className = 'chapter';
    chapter.dataset.open = '1';
    chapter.dataset.i = i;

    var hd = document.createElement('button');
    hd.type = 'button';
    hd.className = 'chap-hd';
    hd.setAttribute('aria-expanded', 'true');
    var ct = document.createElement('span');
    ct.className = 'ct';
    ct.textContent = C.t || ('第 ' + (i + 1) + ' 章');
    var cn = document.createElement('span');
    cn.className = 'cn';
    cn.textContent = C.s.length + ' 节';
    hd.appendChild(ct);
    hd.appendChild(cn);

    var body = document.createElement('div');
    body.className = 'chap-body';
    C.s.forEach(function(S){
      var sec = document.createElement('div');
      sec.className = 'sec';
      if (S.t){
        var sh = document.createElement('div');
        sh.className = 'sec-hd';
        var mk = document.createElement('span');
        mk.className = 'mark';
        mk.setAttribute('aria-hidden', 'true');
        var st = document.createElement('span');
        st.className = 'st';
        st.textContent = S.t;
        sh.appendChild(mk);
        sh.appendChild(st);
        sec.appendChild(sh);
      }
      var ps = document.createElement('div');
      ps.className = 'paras';
      S.p.forEach(function(x){ ps.appendChild(paraEl(x)); });
      sec.appendChild(ps);
      body.appendChild(sec);
    });

    chapter.appendChild(hd);
    chapter.appendChild(body);
    docBody.appendChild(chapter);
  });

  var footFrag = document.createDocumentFragment();
  [[MODS[M.i - 1], 'prev', '上一模块'], [MODS[M.i + 1], 'next', '下一模块']].forEach(function(it){
    var a = document.createElement('a');
    a.className = it[1];
    if (it[0]){
      a.href = '#/m/' + encodeURIComponent(it[0].c);
      a.innerHTML = '<span class="k">' + it[2] + '</span>' +
        '<span class="v">' + esc(it[0].c) + ' ' + esc(it[0].n) + '</span>';
    } else {
      a.className = it[1] + ' dis';
      a.innerHTML = '<span class="k">' + it[2] + '</span><span class="v">已是边界</span>';
    }
    footFrag.appendChild(a);
  });
  docFoot.innerHTML = '';
  docFoot.appendChild(footFrag);
}

/* ============ 视图切换与路由 ============ */
var lastScroll = 0;
var BASE_TITLE = document.title;

function openDoc(code){
  var M = byCode[code];
  if (!M) return;
  if (docEl.hidden) lastScroll = window.scrollY;
  renderDoc(M);
  catalog.hidden = true;
  heroEl.hidden = true;
  docEl.hidden = false;
  fab.hidden = false;
  document.title = M.c + ' ' + M.n + ' · 作业模块化手册';
  window.scrollTo(0, 0);
}

function closeDoc(restore){
  if (docEl.hidden) return;
  docEl.hidden = true;
  catalog.hidden = false;
  heroEl.hidden = false;
  fab.hidden = true;
  document.title = BASE_TITLE;
  if (restore) window.scrollTo(0, lastScroll);
}

function route(){
  var h = location.hash;
  if (h.indexOf('#/m/') === 0){
    var code = decodeURIComponent(h.slice(4));
    openDoc(code);
  } else if (h === '#catalog'){
    closeDoc(false);
    var el = document.getElementById('catalog');
    if (el) el.scrollIntoView();
  } else {
    closeDoc(true);
  }
}

window.addEventListener('hashchange', route);

/* 章导航点击 */
docNav.addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if (!chip) return;
  var i = chip.dataset.i;
  var target = docBody.querySelector('.chapter[data-i="' + i + '"]');
  if (!target) return;
  var top = target.getBoundingClientRect().top + window.scrollY - 62;
  window.scrollTo({top: top, behavior: 'smooth'});
});

/* 章折叠 */
docBody.addEventListener('click', function(e){
  var hd = e.target.closest('.chap-hd');
  if (!hd) return;
  var ch = hd.parentElement;
  var open = ch.dataset.open === '1';
  ch.dataset.open = open ? '0' : '1';
  hd.setAttribute('aria-expanded', String(!open));
});

/* 滚动高亮当前章 */
var tick = false;
window.addEventListener('scroll', function(){
  if (docEl.hidden || tick) return;
  tick = true;
  requestAnimationFrame(function(){
    tick = false;
    var chapters = docBody.querySelectorAll('.chapter');
    if (!chapters.length) return;
    var y = window.scrollY + 140;
    var cur = 0;
    for (var i = 0; i < chapters.length; i++){
      var t = chapters[i].getBoundingClientRect().top + window.scrollY;
      if (t <= y) cur = i;
    }
    var chips = docNav.querySelectorAll('.chip');
    for (var j = 0; j < chips.length; j++){
      chips[j].classList.toggle('on', j === cur);
    }
  });
}, {passive: true});

/* 初始化 */
buildCatalog();
route();
})();
</script>
