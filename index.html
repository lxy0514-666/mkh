:"二、适用范围","p":["本方案适用于煤矿监测监控设备的安装、拆除、检修、调校、维护及现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、安检员、现场操作人员"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责检修管理的组织实施、人员调配及考核落实，检修工作总体安排。","主管副队长：负责检修计划编制、现场作业组织协调、检修质量管控、进度把控。","安全技术副队长：负责检修标准制定、安全技术措施编制、技术交底、现场隐患督办、模块修订优化。","班组长：当班自检复检、问题上报、班组人员管理、现场安全管控。","安检员：安全条件确认、风险防控监督、违章行为制止、","作业标准过程监督。","现场操作人员：严格按标准作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 监测监控设备检修模块","s":[{"t":"一、模块概述","p":["模块编号：JD-C-04","模块名称：监测监控设备检修","所属专业：机电","适用范围：适用于参与井下监测监控设备安装、拆除、检修、调校、维护等所有人员"]},{"t":"二、危险预知及防控","p":["1.断电闭锁失效：检修或安装过程中如误操作导致闭锁功能失效，瓦斯超限时不能自动断电，可能引发瓦斯爆炸事故。检修与安全监控设备关联的电气设备，需要监控设备停止运行时，必须制定安全措施，并报矿总工程师审批。严禁在闭锁功能不完善的情况下投入运行。","2.触电伤害：监测监控设备涉及井上下供电，安装检修前必须切断相关电源，严格执行停送电制度。操作电气设备时，操作人员必须戴绝缘手套、穿绝缘靴或站在绝缘台上。安全监控设备的供电电源必须取自被控开关的电源侧或者专用电源，严禁接在被控开关的负荷侧。","3.监测数据失真：传感器安装位置不当、未按规定调校、零点漂移等可能导致监测数据失真，掩盖安全隐患。传感器调校必须严格按照标准调校。","4.误报警：传感器安装、检修、调校操作不当，或线缆受潮、破损、屏蔽不良，可能引发误报警。安装检修过程中应规范操作，避免因施工振动、碰撞等原因触发误报警。","5.登高坠落伤害：安装检修过程中涉及登高作业等，可能发生高处坠落等伤害。高处作业时，必须使用稳固的梯子或搭建可靠的操作平台，系好安全带，安全带应悬挂在牢固构件上。","6.窒息及有害气体伤害：在密闭巷道、硐室或靠近采掘工作面安装检修传感器时，必须先检查作业区域瓦斯、氧气等有害气体浓度，确认安全后方可作业。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：瓦斯浓度≤1.0%，通风良好；作业区域顶板稳定、无淋水，作业平台稳固，照明充足。","2.设备确认：检修前必须认真核对待检修设备的编号，严格执行停送电制度。调校传感器时，确认进入调校模式后，方可进行气样调校作业。","3.人员确认：所有作业人员均已现场在岗，且经培训交底合格。","4.技术确认：检修技术交底工作已完成，各项工作具备施工条件。"]},{"t":"四、作业现场人员安全站位","p":["1.操作电气设备时，操作人员必须戴绝缘手套，穿绝缘靴或站在绝缘台上。停送电操作时，站在开关侧面操作，严禁正对开关正面操作，防止电弧伤人。","2.登高安装传感器、摄像机及敷设线缆时，操作人员必须系好安全带（高挂低用），登高工具放置稳固，下方设专人监护，严禁立体交叉作业。","3.安装传感器时，操作人员站在稳固的平台上，严禁踩踏管线、电缆桥架等不稳固设施。","4.搬运分站、电源箱等重型设备时，操作人员协同配合，防止砸伤手脚。","5.使用扳手、螺丝刀等工具时，操作人员应保持身体平衡，防止用力过猛造成滑脱摔倒。"]},{"t":"五、标准化作业流程","p":["检修前准备→现场安全确认→准备工作→安装分站铺设线缆→接通设备→调试系统→收尾工作→填写记录"]},{"t":"六、作业质量标准","p":["1.监控分站安装标准：分站应安设在便于人员观察、调试、检验及支护良好、无滴水、无杂物的进风巷道或硐室内。分站电源必须取自被控开关的电源侧或专用电源，严禁接在被控开关的负荷侧。安装断电控制系统时，必须根据断电范围提供断电条件，并接通井下电源及控制线。","2.甲烷传感器安装标准：甲烷传感器应垂直悬挂在巷道上方风流稳定的位置。距顶板（顶梁）不得大于300mm，距巷道侧壁不小于200mm。掘进工作面的甲烷传感器，不得悬挂在风筒的同一侧。采煤工作面：在距工作面10—15m安设甲烷传感器；距上隅角小于3—5m安设甲烷传感器。","3.一氧化碳传感器安装标准：一氧化碳传感器应垂直悬挂，距顶板（顶梁）不得大于300mm，距巷壁不得小于200mm。开采容易自燃、自燃煤层的采煤工作面必须至少设置一个一氧化碳传感器，地点可设置在上隅角、工作面或工作面回风巷。进风巷中的带式输送机机头和机尾滚筒下风侧10m—20m范围内应当设置一氧化碳传感器。","4.温度传感器安装标准：采煤工作面回风巷、掘进工作面回风流、采区回风巷和总回风巷应当设置温度传感器。压风机应设置温度传感器。","5.风速、粉尘及其他传感器安装标准：风速传感器应设置在巷道风速稳定断面，安装位置符合设计要求。粉尘传感器按设计要求安装在产尘点回风侧适当位置。设备开停传感器、风门开关传感器、风筒传感器、馈电传感器按设计位置安装。","6.线缆敷设标准：煤矿安全监控设备之间必须使用专用阻燃电缆或光缆连接。严禁安全监控系统与图像监视系统共用同一芯光纤。线缆悬挂整齐，间距符合要求，严禁与动力电缆在同一侧无间距敷设。入井线缆的入井口处必须具有防雷措施。","7.视频监视设备安装标准：摄像机安装位置应覆盖关键作业区域，角度合理，固定牢靠。视频信号传输线路应与安全监控系统线路分开敷设。","8.断电闭锁功能标准：安全监控系统必须具备甲烷电闭锁和风电闭锁功能。当主机或者系统线缆发生故障时，必须保证实现甲烷电闭锁和风电闭锁的全部功能。系统必须具有断电、馈电状态监测和报警功能。安全监控设备必须具有故障闭锁功能。甲烷电闭锁和风电闭锁功能每15天至少测试1次。"]},{"t":"七、安全管控措施","p":["1.审批流程管控：监测监控设备安装前必须有经通风科批准的安装设计方案，严禁无设计安装。","2.关联设备检修管控：改接或者拆除与安全监控设备关联的电气设备、电源线和控制线时，必须与安全监控管理部门共同处理。检修与安全监控设备关联的电气设备，需要监控设备停止运行时，必须制定安全措施。","3.故障处理管控：安全监控设备发生故障时，必须及时处理，在故障处理期间必须采用人工监测等安全措施，并填写故障记录。","4.停送电管控：监测监控设备安装检修过程中，严禁带电开盖、带电作业。井下开盖前必须检测甲烷浓度≤1.0%。","5.验收闭环管控：检修结束后，清点作业用的工具、用具，及时清理现场物料、工具，保持设备整洁。检修记录、调校记录数据要准确、完整，归档保存。"]}]}],"w":2813,"cn":3,"sn":12},{"c":"JD-C-05","n":"带式输送机电气部分安装","t":"JD-C-05 带式输送机电气部分安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿井下带式输送机电控部分安装作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生触电、电气火灾、瓦斯爆炸、误送电伤人等安全隐患，提升安装效率与工程质量，确保带式输送机电控系统安全可靠运行，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿井下及地面带式输送机电动机、电控箱、开关、变频器（软启动器）、电缆敷设、接地系统等电气部分的安装、接线、调试及验收全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、安检员、现场操作人员"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责带式输送机电气安装作业整体统筹、人员调配及考核落实，检修工作总体安排。","主管副队长：负责安装计划编制、现场作业组织协调、安装质量管控、进度把控，组织班前安全交底。","安全技术副队长：负责电气安装安全技术措施编制、技术交底、现场隐患督办、模块修订优化。","班组长：负责当班安装任务分配、班组人员管理、现场安全条件确认、安装质量复检、停送电管理及问题上报","安检员：负责作业期间安全巡查监督，制止违章行为，闭环隐患，监督停送电及各项安全措施的落实。","现场操作人员：严格按照标准作业，落实互保联保要求，执行安全确认，开展自检自查，规范填写记录，落实文明施工要求。"]}]},{"t":"第三章 带式输送机电气部分安装模块","s":[{"t":"一、模块概述","p":["模块编号：JD-C-05","模块名称：带式输送机电气部分安装","所属专业：机电","适用范围：适用于参与带式输送机电气部分安装所有人员"]},{"t":"二、危险预知及防控","p":["1.触电伤害：安装电控开关、控制箱，进行接线、调试作业时，操作人员必须严格执行停送电制度，切断电源并闭锁，悬挂“有人工作 不准送电”警示牌，并上锁。严禁带电作业，作业前必须完成验电、放电、挂接地线流程。","2.误送电伤人：安装作业前必须切断带式输送机及相关设备电源，严格执行停送电制度，将前一级开关电源分闸，闭锁，挂“有人工作 不准送电”警示牌，并上锁。严禁约时停送电，严格执行“谁停电、谁送电”的原则。","3.电气火灾及瓦斯爆炸：电缆接线必须规范，严禁出现“羊尾巴”“鸡爪子”、明接头。防爆电气设备入井前必须检查“产品合格证”“防爆合格证”“煤矿矿用产品安全标志”。安装过程中严禁失爆，接线腔、接线盒密封良好，紧固件齐全。开盖检修前必须检测瓦斯浓度≤1.0%。","4.高处坠落伤害：安装高处电控箱、控制按钮、传感器时，距离坠落基准面2米及以上登高作业必须系好安全带，高挂低用。登高作业时，必须使用梯子或脚手架，并安排专人扶梯监护。","5.工具使用不当伤人：正确使用电工工具，绝缘手柄完好无损。使用后应将其放入工具包或置于安全位置，防止工具高空坠落。使用的电气仪表必须经校验合格。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：瓦斯浓度≤1.0%，通风良好；作业区域无淋水、积水，顶板稳定，照明充足；巷道支护完好，无片帮掉矸风险。","2.人员确认：所有作业人员精神状态良好，且经培训交底合格，持证上岗；熟悉安装图纸、设备性能及接线方式。","3.工器具确认：电工工具、验电笔、兆欧表等完好，满足作业要求。","4.技术确认：安装图纸、设备说明书、专项措施审批贯彻到位，安装位置、设备型号与设计一致。","5.设备确认：待安装设备外观完好，无变形、裂纹；防爆面完好；设备编号与设计一致；电缆规格、长度满足设计要求。"]},{"t":"四、作业现场人员安全站位","p":["1.班组长：站在作业现场退路畅通的安全区域，全程统筹作业流程，监督安全措施执行情况。","2.安检员：站在能够全面观察作业现场的安全区域，与带电设备保持安全距离，全程监督作业人员安全操作行为、安全措施落实情况，发现违章立即制止并纠正。","3.电工：进行设备接线、电缆头制作作业时，应站在稳固可靠、无设备倾倒或侧翻风险的位置；搬运设备时，要注意脚下防滑，做好协同配合；在有轨道运输的巷道内作业时，必须在作业区域两端设置警戒标志，防止车辆误入。"]},{"t":"五、标准化作业流程","p":["（一）前期准备工作","（1）班组长根据安装计划提出停电申请，明确安装设备编号、安装内容及计划时间，报主管副队长审批。","（2）安全技术副队长编制安全技术措施，组织全体参与人员贯彻学习并签字确认。","（3）参与安装电工核对安装图纸、设备清单，确认安装位置、设备型号与设计一致。","（4）安装电工检查验电笔、兆欧表等工器具，确认外观完好。","（5）班组长、安检员、安装电工共同完成现场安全确认，确认顶板支护完好、瓦斯浓度合格、上级电源已停电闭锁挂牌。","（二）电气设备安装作业步骤","1.电动机安装：","（1）安装电工确认停电、验电、接地可靠后，组织开始安装。","（2）检查电动机外观无损伤、无裂纹，风扇罩完好，接线盒无变形，防爆面完好。","（3）使用起吊设备将电动机平稳吊运至安装位置，调整水平度及同轴度，紧固地脚螺栓。","（4）电动机与减速器对轮连接时，调整间隙及同心度，安装防护罩。","（5）电动机接线腔清洁无杂物，接线端子紧固，相序正确，接地线连接可靠。","2.开关、变频器（软启动器）安装：","（1）检查开关、变频器外壳无变形、无裂纹，隔爆面完好；安装位置符合设计要求，基础稳固、水平度合格。","（2）开关进出线喇叭口密封良好，电缆引入装置符合防爆要求，密封圈、挡板、垫圈齐全完好。","（3）设备内部元器件完好，接线端子无松动、无过热变色；二次回路接线正确、紧固，线号标识清晰。","（4）保护装置型号、规格与设计一致，安装牢固；保护定值按审批后的整定通知单整定，不得随意更改。","3.电缆敷设与接线：","（1）电缆敷设前进行绝缘测试，绝缘电阻值符合规定。","（2）电缆悬挂规范，使用专用电缆钩吊挂，吊挂间距不大于3m；电缆弯曲半径符合规定，不得有机械损伤。","（3）电缆接线盒制作符合防爆工艺要求，密封可靠，吊挂牢固；芯线连接采用压接，接触良好，绝缘包扎规范。","（4）电缆标志牌在拐弯处、分支点、接线盒两端及每隔200m设置，注明编号、用途、电压、截面。","4.接地系统安装：","（1）主接地极、局部接地极设置位置符合设计要求，材质、规格满足《煤矿安全规程》规定。","（2）接地线连接可靠，螺栓连接牢固，无锈蚀；接地电阻值符合规定。","（三）调试与送电作业步骤","（1）安装负责人确认全部安装工作完毕、人员撤离、工具材料清点齐全、临时接地线全部拆除，向班组长申请送电调试。","（2）班组长现场验收，确认设备安装质量合格、安全措施全部拆除、现场无遗留物。","（3）送电前，安装电工全面检查设备接线、紧固件、防爆面、接地线，确认无异常。","（4）按停送电制度申请送电，逐级送电，观察设备运行状态，检查电压、电流、温度等参数是否正常。","（5）进行空载试运行，检查电动机转向、转速、振动、温升是否正常；检查开关、变频器（软启动器）参数设置、启停控制是否正常。","（6）带载试运行，检查带式输送机运行平稳，无异常声响，电气保护装置动作灵敏可靠。","（7）调试完成后，安装负责人整理安装记录、试验数据，班组长审核后归档。"]},{"t":"六、作业质量标准","p":["1.电控开关、变频器：开关型号、容量符合设计要求，安装位置便于操作、检修，与巷道帮部距离符合规定。开关上架，平稳牢固，无歪斜晃动。防爆外壳无变形、无裂纹、无锈蚀，隔爆面符合标准，紧固件齐全、紧固可靠，密封圈、挡板、金属垫圈完好，无失爆现象。","2.电缆敷设：电缆选用符合《煤矿安全规程》要求。电缆悬挂使用专用电缆钩，间距不超过3米，悬挂高度不低于1.6米（采掘工作面除外），悬挂整齐、弧度一致，不交叉、不落地、不受力。电缆标志牌齐全，注明编号、用途、电压、截面等信息。","3.接线工艺：接线正确、紧固，无毛刺、无松动。导线绝缘无破损，芯线裸露长度适当。接地线连接可靠，接地电阻≤2Ω。接线腔清洁，无杂物、无积水。绝缘恢复良好，相序正确。不同相序导线间保持足够电气间隙。","4.保护装置：短路、过负荷、漏电闭锁、欠压等保护齐全，整定值符合设计，动作灵敏可靠。","5.接地系统：接地极材质、规格、埋深符合设计要求，接地线连接牢固，导电良好。所有电气设备金属外壳、构架均可靠接地。","6.绝缘性能：动力电缆绝缘电阻值符合要求。送电前必须逐回路进行绝缘检测，合格后方可送电。","7.安装现场：安装现场无积煤、浮煤及杂物堆积。设备整洁，无油污。剩余材料、工具摆放整齐，及时回收归位。接线腔盖板、防爆面螺栓紧固到位。"]},{"t":"七、安全管控措施","p":["1.停送电管控：严格执行停送电制度。安装前必须切断带式输送机及关联设备电源，将前一级开关电源分闸，闭锁，挂“有人工作 不准送电”警示牌，并上锁。严格执行“谁停电、谁送电”的原则，严禁约时停送电。送电前必须清点人数，确认人员全部撤离作业点，由停电负责人亲自送电或在其监护下送电。","2.验放电管控：停电后必须检查瓦斯，在巷道风流中甲烷浓度低于1.0%时，再用与电源电压相适应的验电笔逐相验电，确认无电后，方可对地放电。","3.防爆管控：井下电气设备安装严禁失爆。开盖作业前必须检测瓦斯浓度≤1.0%。接线完成后必须清理接线腔杂物，恢复隔爆面，涂抹适量防锈油脂，紧固螺栓齐全、紧固到位，弹簧垫圈压平。","4.绝缘检测管控：电缆敷设、接线完成后，送电前必须进行绝缘电阻检测和通断试验，确认接线正确、绝缘合格后方可申请送电。严禁在绝缘不合格情况下强行送电。","5.作业区域隔离管控：安装期间，电控设备安装区域设警戒，非作业人员严禁入内。停送电操作区域设专人监护，防止无关人员误操作开关。","6.试运转管控：电控部分安装完成后，必须全面检查各部位接线紧固情况、防爆面完好情况、保护装置整定情况、接地系统连接情况、巷道内有无遗留工器具及导体。确认无误后，方可申请送电进行空载试运转。试运转时，所有人员撤离至转动部位、输送带外侧安全位置，由专人操作、专人监护，观察电流、电压、保护动作及传感器信号是否正常。","7.验收闭环管控：安装完成后，清点作业用的工具、用具，及时清理现场物料、工具，保持设备整洁。由班组长、安检员确认防爆及安全设施齐全有效，形成验收记录，实现闭环管理。"]}]}],"w":4009,"cn":3,"sn":12},{"c":"JD-C-06","n":"带式输送机保护装置安装","t":"JD-C-06 带式输送机保护装置安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿井下带式输送机保护装置安装作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生误动作、保护失效、触电、高处坠落等安全隐患，确保带式输送机各类保护装置灵敏可靠、动作准确，保障运输系统安全运行，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿井下及地面带式输送机跑偏保护、拉线急停、防打滑保护、堆煤保护、撕裂保护、张紧力下降和张紧行程限位保护、温度保护、烟雾监测装置及自动洒水装置的安装、接线、调试及验收全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、安检员、现场操作人员"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责安装管理的组织实施、人员调配及考核落实，检修工作总体安排。","主管副队长：负责安装计划编制、现场作业组织协调、安装质量管控、进度把控。","安全技术副队长：负责安装标准制定、安全技术措施编制、技术交底、现场隐患督办、模块修订优化。","班组长：当班自检复检、问题上报、班组人员管理、现场安全管控。","安检员：负责作业期间安全巡查监督，制止违章行为，闭环隐患，监督停送电及各项安全措施的落实。","现场操作人员：严格按标准作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 带式输送机保护装置安装模块","s":[{"t":"一、模块概述","p":["模块编号：JD-C-06","模块名称：带式输送机保护装置安装","所属专业：机电","适用范围：适用于参与带式输送机保护装置安装所有人员"]},{"t":"二、危险预知及防控","p":["1.触电伤害：安装保护装置需接入电控系统时，操作人员必须严格执行停送电制度，切断电源并闭锁，悬挂“有人工作 不准送电”警示牌，并上锁。严禁带电作业，作业前必须完成验电、放电流程。","2.高处坠落伤害：安装烟雾保护等高处传感器时，距离坠落基准面2米及以上登高作业必须系好安全带，高挂低用。登高作业时，必须使用专用梯子或脚手架，并安排专人扶梯监护。","3.工具使用不当伤人：正确使用电工工具，绝缘手柄完好无损。使用后应将其放入工具包或置于安全位置，防止工具高空坠落。使用的电气仪表必须经校验合格。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：瓦斯浓度≤1.0%，通风良好；作业区域顶板稳定、无淋水，作业平台稳固，照明充足。","2.人员确认：所有作业人员精神状态良好，且经培训交底合格；登高作业人员身体健康，无妨碍作业的疾病。","3.工器具确认：电工工具、验电笔、万用表完好，安全带、梯子、脚手架等登高器具完好可靠。","4.技术确认：安装图纸、保护装置说明书、专项措施审批贯彻到位；保护装置型号、规格与设计一致，安装位置、数量已核实。","5.设备确认：待安装保护装置外观完好，无损坏；防爆型保护装置\"三证\"齐全；电缆规格、长度满足设计要求；上级电源已停电闭锁挂牌。"]},{"t":"四、作业现场人员安全站位","p":["1.班组长：站在作业现场退路畅通的安全区域，全程统筹作业流程，监督安全措施执行情况。","2.安检员：站在能够全面观察作业现场的安全区域，全程监督作业人员安全操作行为、安全措施落实情况，发现违章立即制止并纠正。","3.电工：进行保护装置安装、接线时，站在机架侧面或平台稳固位置，与转动部位保持安全距离。登高作业时，人员站稳扶牢。在有轨道运输的巷道内作业时，必须在作业区域两端设置警戒标志，防止车辆误入。"]},{"t":"五、标准化作业流程","p":["（一）前期准备工作","（1）班组长根据安装计划，明确安装地点、保护装置类型及数量、计划时间，汇报调度室。","（2）安全技术副队长编制安装安全技术措施，组织全体参与人员贯彻学习并签字确认。","（3）参与安装电工核对安装图纸，确认保护装置安装位置、数量、型号与设计一致。","（4）安装电工检查验电笔、万用表等工器具，确认完好。","（5）班组长、安检员、安装电工共同完成现场安全确认，确认顶板支护完好、瓦斯浓度合格、上级电源已停电闭锁挂牌、机架稳固。","（二）保护装置安装作业步骤","1.根据当班工作任务安排，安装跑偏保护、拉线急停、防打滑保护、堆煤保护、撕裂保护、张紧力下降和张紧行程限位保护、温度保护、烟雾监测装置及自动洒水装置。","2.保护装置主机安装：","（1）综合保护主机安装在控制箱内或专用保护柜中，固定牢固，接地可靠。","（2）各保护传感器信号线接入正确，线号标识清晰；参数设置与整定通知单一致，不得随意更改。","（3）通电调试，逐项试验各保护功能，确认动作灵敏、显示正确、故障记忆及闭锁功能正常。","（三）调试与验收作业步骤","（1）安装负责人确认全部保护装置安装完毕、人员撤离、工具材料清点齐全，向班组长申请送电调试。","（2）班组长现场验收，确认安装位置、数量、固定方式、接线质量符合标准，安全措施全部拆除、现场无遗留物。","（3）送电后，安装电工检查综合保护装置显示正常，各传感器信号稳定。","（4）逐项进行保护试验，每项试验不少于3次，确认动作灵敏、可靠，动作值与整定值一致，声光报警及闭锁停机功能正常。","（5）试验完成后，恢复设备至正常状态。（班组长确认）"]},{"t":"六、作业质量标准","p":["1.堆煤保护：①煤仓处堆煤保护装置传感器应安装在机头下输送带水平200mm以下，其平面位置以能及时控制堆高为准。②两部带式输送机顺直搭接时，煤位传感器应在卸载滚筒前方吊挂，传感器触头水平位置应在落煤点正上方，距下部胶带带面最高点的距离应不大于500mm，且吊挂高度应不高于卸载滚筒下沿。③两部带式输送机倾斜或垂直搭接时，煤位传感器安装在卸载滚筒一侧，传感器触头位置不得高于卸载滚筒下沿，水平位置距卸载滚筒外沿不大于200mm。④带式输送机与刮板机搭接时，堆煤保护装置传感器触头可安装在卸载滚筒一侧，触头或测控点吊挂高度应不高于卸载滚筒下沿，水平位置距卸载滚筒外沿应不大于200mm。","2.跑偏保护：防跑偏保护装置应用支架成对、对称安装在带式输送机机架上，不得使用铁丝捆绑，摆杆居中位置应与托辊轴线和带面垂直，距托辊外边缘不超过20mm。带式输送机机头、机尾10m～15m范围内上输送带应各安装一对防跑偏保护装置。带式输送机长度超过300m时，中间段至少设置一对防跑偏保护装置。对于易出现托辊不转或跑偏的区段，应安装一对防跑偏保护装置。","3.防打滑保护：滚轮式防打滑保护装置的滚轮速度传感器应安装在带式输送机回程输送带上表面，并保证输送带与滚轮有足够的摩擦力，要求固定牢固，偏离输送带中心线不超过±100 mm。","4.温度保护：热电偶式温度监测装置应制作规范的支架安装，对驱动滚筒表面中部（轴向）位置进行监测，传感器与驱动滚筒表面距离通常为10—15mm（保护动作值通常为42℃±2℃）。每一个驱动滚筒处至少安装一个温度传感器。","5.烟雾保护：烟雾监测装置应安装在驱动滚筒的下风侧，使其能正处于滚筒出现摩擦时产生的“烟流”中，通常距驱动滚筒10m～15m，吊挂高度距顶板应不大于300mm。当带式输送机为同一点多滚筒驱动时，应以靠近机头处滚筒为准装设烟雾监测装置，若带式输送机为多点驱动，且间距超过15m时，每处驱动滚筒附近应装设一套烟雾监测装置。","6.防撕裂保护：防撕裂保护装置安装时，应制作规范的托架固定在接料点沿顺煤流方向向前不大于15m的上、下（回程）输送带之间的带式输送机机架上。","7.张紧力下降保护：张紧力传感器或行程开关安装于张紧装置处，安装位置能准确反映张紧力或张紧行程变化。张紧力下降保护动作值符合设计，动作可靠。","8.沿线急停：沿线急停闭锁保护装置应安装在带式输送机行人侧机架上，间距不大于50m。连接电缆应在机架上可靠固定，有效避免磕碰、砸挂等。","9.安装现场：安装现场无积煤、浮煤及杂物堆积。传感器及支架表面清洁，无油污。剩余材料、工具摆放整齐，及时回收归位。接线腔盖板、防爆面螺栓紧固到位。"]},{"t":"七、安全管控措施","p":["1.停送电管控：严格执行停送电制度。安装前必须切断带式输送机及关联设备电源，将前一级开关电源分闸，闭锁，挂“有人工作 不准送电”警示牌，并上锁。严格执行“谁停电、谁送电”的原则，严禁约时停送电。送电前必须清点人数，确认人员全部撤离作业点，由停电负责人亲自送电或在其监护下送电。","2.验放电管控：停电后必须检查瓦斯，在巷道风流中甲烷浓度低于1.0%时，再用与电源电压相适应的验电笔逐相验电，确认无电后，方可对地放电。","3.登高作业管控：距离坠落基准面2米及以上登高作业必须系好安全带，高挂低用。登高作业时，必须使用专用梯子或脚手架，并安排专人扶梯监护。严禁在无防护措施情况下攀爬设备或管线。","4.防爆管控：井下电气设备安装严禁失爆。开盖作业前必须检测瓦斯浓度≤1.0%。接线完成后必须清理接线腔杂物，恢复隔爆面，涂抹适量防锈油脂，紧固螺栓齐全、紧固到位。","5.作业区域隔离管控：安装期间，机头、机尾及高处作业区域设置警戒，非作业人员严禁入内。停送电操作区域设专人监护，防止无关人员误操作开关。","6.试运转管控：保护装置安装接线完成后，必须逐台进行模拟试验，验证各保护装置动作值、动作方向及闭锁功能正确可靠。严禁在保护装置未调试合格、功能未验证的情况下投入运行。试验时所有人员撤离至安全位置，由专人操作、专人监护。","7.验收闭环管控：安装调试完成后，清点作业用的工具、用具，及时清理现场物料、工具，保持设备整洁。由班组长、安检员确认保护装置齐全有效、动作可靠，形成验收记录及保护试验记录，实现闭环管理。"]}]}],"w":3740,"cn":3,"sn":12},{"c":"JD-C-07","n":"带式输送机试运行","t":"JD-C-07 带式输送机试运行模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿带式输送机试运行作业行为，统一试运转流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生机械伤害、电气伤害、跑偏撕裂、堆煤埋压、误启动伤人等安全隐患，验证带式输送机机械、电气及保护系统安装质量，确保设备投运后安全可靠运行，特制订本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿所有带式输送机安装完毕后的试运行作业、现场管理全过程，包括空载试运行、加载试运行及重载试运行等各阶段。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、安检员、现场操作人员"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责试运行管理的组织实施、人员调配及考核落实，检修工作总体安排。","主管副队长：负责试运行计划编制、现场作业组织协调、安装质量管控、进度把控。","安全技术副队长：负责试运行标准制定、安全技术措施编制、技术交底、现场隐患督办、模块修订优化。","班组长：当班自检复检、问题上报、班组人员管理、现场安全管控。","安检员：安全条件确认、风险防控监督、违章行为制止、","作业标准过程监督。","现场操作人员：严格按标准作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 带式输送机试运行模块","s":[{"t":"一、模块概述","p":["模块编号：JD-C-07","模块名称：带式输送机试运行","所属专业：机电","适用范围：适用于参与带式输送机试运行所有人员"]},{"t":"二、危险预知及防控","p":["1.机械伤害：试运行前必须全面检查机头、机尾及所有转动部位防护罩、防护栏是否齐全牢固。试运行时，所有人员严禁接触驱动滚筒、导向滚筒、托辊等转动部位。发现异常必须停机处理，严禁在设备运行中调整、维修。调整胶带跑偏可在带式输送机运行状态下开展，作业人员使用专用工具对纠偏托辊调节机构进行调整；严禁手及工具直接接触运动的胶带。调整时观察胶带运行状态，逐步微调，直至胶带运行恢复正常。","2.误启动伤人：试运行前必须确认所有安装、检修人员已撤离至安全位置，清点人数无误后方可送电启动。","3.火灾事故：试运转过程中必须密切监测滚筒、轴承、减速器等转动部位的温度，发现温度异常升高必须立即停机检查。烟雾监测装置和自动洒水装置必须在试运转前试验合格。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：巷道通风良好，瓦斯浓度≤1.0%；巷道内无杂物、无积水、无大块煤矸；照明充足，沿线无人员逗留；消防器材齐全有效。","2.人员确认：参与试运行人员精神状态良好，机头、机尾、沿线各岗位人员已到位；班前安全交底完成，通讯方式及应急处置方案已明确。","3.技术确认：安装/检修作业已全部完工，质量验收合格；试运行方案贯彻到位；各保护装置整定值核对无误。","4.设备确认：机械部分安装完毕，润滑良好，紧固件齐全；电气接线正确，绝缘电阻合格；各保护装置安装齐全、试验合格、全部投入运行；制动器、逆止器、张紧装置处于正常状态。"]},{"t":"四、作业现场人员安全站位","p":["1.带式输送机司机：站在控制开关或操作台处，视线可及驱动部及机头卸载点，随时观察仪表指示及设备运行状态，操作期间严禁离开岗位。","2.机头处、机尾处巡检工：站在安全护栏外，与滚筒、联轴器保持安全距离，观察运转情况及胶带卸载状态。机修工可在保障安全的前提下，通过手触方式检查滚筒轴端部、轴承架等部位，判断设备的振动与温升状况；触摸检查时，严禁身体靠近转动部位，必须避开旋转构件，防止衣物、手套被卷入，发现异常振动、温度过热等情况应当及时停机处置。","3.班组长：站在机头退路畅通的安全区域，通过语音装置统一指挥，全程统筹试运行流程，监督安全措施执行及人员站位，不得擅自离岗。","4.安检员：站在能够全面观察机头驱动部及人员站位的安全区域，监督试运行期间人员安全行为及设备运行状态，发现违章立即制止。"]},{"t":"五、标准化作业流程","p":["（一）试运行前准备","（1）班组长组织召开试运行前会议，明确分工、通讯方式、汇报程序及应急处置方案。","（2）安装/检修负责人确认安装/检修工作全部完成，人员已撤离，工具材料已清点齐全，现场无遗留物。（班组长确认）","（3）电工全面检查电气系统：接线紧固，绝缘电阻合格，接地可靠；各保护装置投入运行且试验正常。（班组长确认）","（4）机头、机尾及沿线各岗位人员到位，通过带式输送机沿线急停语音装置进行通讯试验，确认通讯畅通。","（5）检查制动器、逆止器、张紧装置、清扫器、导料槽，确认处于正常可用状态。","（二）空载试运行","（1）带式输送机司机发出预警信号（声光信号），确认沿线无人员后，方可启动。","（2）点动启动，观察电动机转向是否正确，制动器开闭是否灵活，发现异常立即停机。","（3）正式空载启动，观察电流、电压、转速是否正常，倾听驱动部、减速器、滚筒运转声音。","（4）机头巡检工检查驱动滚筒、减速器、联轴器运转是否平稳，有无异响、异常振动、轴承温升过高现象。","（5）机尾巡检工检查机尾改向滚筒、托辊运转是否正常，胶带是否跑偏，拉紧装置动作是否灵活。","（6）沿线巡检工逐段检查托辊转动、胶带运行状态，发现异常立即拉绳停机并汇报。","（7）空载运行期间，观察电流、电压等是否正常。","（三）负载试运行","（1）空载试运行各项参数正常、无异常后，班组长确认具备负载试运行条件。","（2）巡检工观察胶带运行是否打滑、跑偏，张紧装置行程是否满足要求，清扫器、导料槽工作状态是否正常。","（3）电工检查各保护装置在负载工况下是否误动作，动作值与整定值是否一致，综合保护主机显示是否正常。","（4）负载试运行时，观察电压、电流、运行速度正常，无异常声响及振动后方可投入正式运行。"]},{"t":"六、作业质量标准","p":["1.空载试运行：点动试车正常后，空载连续运行。电机、减速器、滚筒轴承温升正常，滚动轴承温度≤75℃，滑动轴承温度≤65℃，减速器油温≤90℃。电机电流平稳，不超过额定电流的30%。输送带运行平稳，不跑偏或跑偏量不超过带宽的5%（使用上调心托辊调整后）。托辊转动灵活，无卡涩、无异响，与输送带接触良好。各部位连接螺栓无松动，防护罩、防护栏无振动移位。","2.加载试运行：逐步加载至额定负荷。电机电流不超过额定电流，三相电流不平衡度≤10%。减速器无异常振动。输送带不打滑，张紧适度，不撒煤、不跑偏。机头卸载顺畅，无堆煤、无堵塞。清扫器清扫效果良好，输送带表面无黏附积煤。","3.保护装置动作验证：试运行期间，堆煤保护、跑偏保护、防打滑保护、温度保护、烟雾监测装置、撕裂保护、张紧力下降保护、沿线急停等保护装置动作灵敏可靠，信号准确传输至控制室或操作台。模拟试验时，各保护动作后带式输送机应能自动停机并发出报警信号。","4.试运行现场：试运行现场无积煤、浮煤及杂物堆积。设备整洁，无油污。工具、仪器摆放整齐。"]},{"t":"七、安全管控措施","p":["1.停送电管控：试运行前，所有安装、检修作业必须结束。试运行期间如需处理故障，必须将带式输送机控制开关分闸，闭锁，挂“有人工作 不准送电”警示牌，并上锁。送电前必须清点人数，确认人员全部撤离至安全区域。","2.试运行分级管控：严格执行“先点动、后空载、再加载”的试运行程序。点动试车每次持续时间不超过10秒，确认电机转向、滚筒运转正常后方可进行下一步。严禁未经点动直接连续启动。","3.人员清场与警戒管控：启机前必须由班组长清点人数，确认机头、机尾、沿线及转动部位无人员滞留。试运行期间，机头、机尾及可能危及区域设置警戒，非试运行人员严禁入内。","4.信号联络管控：启机前必须发出声光预警信号。机头、机尾及沿线各岗位之间保持通信畅通，统一指挥、统一信号。无联络信号或信号不清严禁启机。","5.应急停机管控：试运行期间发现异常声响、剧烈振动、严重跑偏、打滑、冒烟、异味等情况时，立即拉沿线急停开关或按下停机按钮，切断电源，闭锁，挂警示牌并上锁，查明原因、处理完毕后方可重新试车。","6.验收闭环管控：试运行合格后，清点作业用的工具、用具，及时清理现场物料，保持设备整洁。由班组长检查验收，确认安全设施齐全有效、运行正常，试运行结束。"]}]}],"w":3174,"cn":3,"sn":12},{"c":"JD-C-08","n":"带式输送机日常检修","t":"JD-C-08 带式输送机日常检修模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿带式输送机日常检修作业行为，统一巡检维护流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生设备误启动伤人、机械伤害、触电、高处坠落、物体打击等安全隐患，及时发现并消除设备缺陷，保障带式输送机连续、稳定、安全运行，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿所有在用带式输送机日常检修、巡检、维护保养作业及现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、安检员、现场操作人员"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责日常检修管理的组织实施、人员调配及考核落实，检修工作总体安排。","主管副队长：负责日常检修计划编制、现场作业组织协调、安装质量管控、进度把控。","安全技术副队长：负责日常检修标准制定、技术交底、现场隐患督办、模块修订优化。","班组长：当班自检复检、问题上报、班组人员管理、现场安全管控。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","现场操作人员：严格按标准作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 带式输送机日常检修模块","s":[{"t":"一、模块概述","p":["模块编号：JD-C-08","模块名称：带式输送机日常检修","所属专业：机电","适用范围：适用于参与带式输送机日常检修所有人员"]},{"t":"二、危险预知及防控","p":["1.设备误启动伤人：检修带式输送机时，严格执行停送电制度。检修前必须切断带式输送机控制开关电源，将开关分闸，闭锁，挂“有人工作 不准送电”警示牌，并上锁。严禁约时停送电。严格执行“谁停电、谁送电，谁上锁、谁解锁”规定。","2.触电伤害：严禁带电检修、搬迁电气设备。检修或搬迁前，必须切断上级电源，检查瓦斯，在其巷道风流中甲烷浓度低于1.0%时，再用与电源电压相适应的验电笔检验，检验无电后，方可进行导体对地放电。","3.机械伤害：检修滚筒、托辊、联轴器等转动部件时，必须使用专用工具，严禁用手直接探入设备内部或触摸转动部位。更换托辊、调整输送带时，必须确认设备已停电、闭锁、挂牌、上锁，输送带完全停稳后方可作业。","4.高处坠落伤害：更换、检修高处设备部件时，距离坠落基准面2米及以上必须系好安全带。登高作业时，必须使用梯子或脚手架，并安排专人扶梯监护，严禁在无防护措施的情况下登高作业。","5.起吊作业伤害：吊运减速机、滚筒、胶带等重物时，必须使用经检查确认合格的起重设备及吊具，由专人指挥，严禁在起吊物下方站立或作业。","6.物体打击伤害：搬运、更换托辊、H架等部件时，操作人员应站在安全位置，防止部件、工具坠落伤人。使用大锤、撬棍调整机架或拆卸卡阻部件时，周围严禁站人。多人共同搬运较大部件时，专人指挥，动作协调，同起同落。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：瓦斯浓度≤1.0%，通风良好；作业区域顶板稳定、无淋水，照明充足；巷道内无积水、无杂物，运输通道畅通。","2.人员确认：检修人员精神状态良好；班前会安全交底完成，分工明确。","3.工器具确认：检修工具、起吊工具、验电笔、兆欧表、万用表等完好，满足检修要求。","4.技术确认：检修方案和检修项目贯彻到位，检修质量标准、工期要求明确。","5.设备确认：控制开关电源已分闸，闭锁，悬挂\"有人工作，不准送电\"警示牌并上锁；确认胶带已完全停止运行。"]},{"t":"四、作业现场人员安全站位","p":["1.检修电工：验电、放电时站在设备侧后方，严禁正对带电方向。处理机头驱动部电气故障时，与转动部位保持安全距离。","2.机械检修工：站在机架稳固位置，处理胶带下方部件时，确认胶带已固定或支撑可靠。更换托辊时，站在机身两侧。检修中需起吊部件时，避开起吊物坠落半径，专人指挥，严禁站在起吊物下方。","3.班组长：站在作业现场退路畅通的安全区域，全程统筹检修流程，监督安全措施执行及检修质量。","4.安检员：站在能够全面观察作业现场的安全区域，监督检修人员安全操作行为、停送电及各项安全措施落实情况，发现违章立即制止并纠正。"]},{"t":"五、标准化作业流程","p":["（一）停机与安全确认","（1）班组长根据检修计划提出停机申请，明确检修设备编号、检修内容及计划时间，汇报调度室。","（2）检修工进入操作现场，核对设备双重名称，分闸带式输送机控制开关，闭锁，悬挂\"有人工作，不准送电\"警示牌，并上锁。","（3）电工使用与电压等级相符的验电器验电，确认无电后对导体逐相放电，方可开始作业。","（二）机械部分检修","（1）检查驱动滚筒、改向滚筒：有无磨损、裂纹、粘煤；轴承温度、声响是否正常；紧固连接螺栓。","（2）检查托辊：转动是否灵活，有无异响、卡阻、缺失、磨损；更换损坏托辊，补充缺失托辊。","（3）检查胶带：有无划伤、撕裂、接头开胶、跑偏磨损；调整跑偏，必要时重新做接头。","（4）检查清扫器、导料槽：清扫器与胶带接触是否良好，刀头是否磨损；导料槽挡皮是否完好，有无漏煤。","（5）检查张紧装置：钢丝绳、滑轮、配重或张紧小车是否完好，行程是否满足要求，有无卡阻。","（6）检查制动器、逆止器：闸瓦间隙、制动力矩是否符合要求，动作是否灵敏可靠，有无异常磨损。","（7）检查机架、护网、护栏：有无变形、开焊、松动；连接螺栓是否紧固，及时修复或更换。","（三）电气部分检修","（1）检查电动机：接线紧固，绝缘良好，风扇罩完好，轴承润滑正常，无异常温升。","（2）检查开关：隔爆面完好，接线腔内无杂物；接线端子紧固无松动、无过热变色；保护装置正常。","（3）检查电缆：吊挂规范，无损伤、无过热，接线盒密封良好，标志牌清晰。","（4）检查接地系统：接地线连接可靠，无锈蚀、断裂；接地电阻值符合规定。","（5）检查各保护装置：跑偏、拉线急停、防打滑、堆煤、撕裂、温度、烟雾监测装置等保护外观完好，安装位置正确，接线可靠，动作试验正常。","（四）送电与试运转","（1）检修负责人确认全部工作完毕、人员撤离、工具材料清点齐全、临时接地线全部拆除。","（2）班组长现场验收，确认检修质量合格，现场无遗留物。","（3）摘除停电期间悬挂的\"有人工作，不准送电\"警示牌，解除闭锁，申请送电。","（4）发出信号及通过语音喊话，通知人员撤离至安全区域。点动试车，确认电动机转向正确，各部件运转正常，无异常声响。","（5）正式试运转，观察电流、电压、胶带运行情况。","（6）试运转正常后，填写检修记录，班组长签字确认，主管副队长审核后归档。"]},{"t":"六、作业质量标准","p":["1.滚筒：驱动滚筒无严重磨损、包胶脱落，导向滚筒、机尾滚筒表面无严重磨损、无裂纹，滚筒轴承转动灵活，无异响，温度正常。滚筒与机架间隙均匀，轴承座螺栓紧固无松动。","2.托辊：上、下托辊齐全完好，转动灵活，无卡涩、无异响。缺失、损坏托辊及时更换。槽形托辊槽角符合设计要求，托辊与输送带接触良好，无异常磨损。","3.输送带：输送带接头完好，无开胶、无裂口、无台阶。带面无划伤、无撕裂、无纵向裂纹。输送带张紧适度，空载运行时不打滑、不跑偏。","4.张紧装置：张紧小车或重锤滑道无卡阻，运行灵活。张紧钢丝绳无断丝、无锈蚀、无扭结，绳卡紧固。配重块排列整齐，无晃动、无脱落风险。张紧行程在设计调整范围内。","5.清扫器：头部清扫器、中段清扫器、尾部清扫器与输送带接触均匀，清扫有效，无严重磨损。清扫器架体牢固，无变形，螺栓紧固。","6.机架及连接：H架、纵梁无变形、无开焊，连接螺栓齐全紧固。机头架、机尾架稳固，无晃动、无窜动。防护罩、防护栏齐全牢固。","7.减速器及联轴器：减速器油位在标尺刻度范围内，油质清洁，无渗漏。运转平稳，无异常振动、无异响。联轴器间隙、同轴度符合标准，弹性圈完好，柱销无松动，护罩齐全紧固。","8.制动器：制动器闸瓦与制动轮接触均匀，间隙符合规定，制动可靠，动作灵敏。液力推动器油位正常，无泄漏。","9.电控及保护：开关、电缆、接线盒外观完好，无失爆。电缆悬挂整齐，无挤压、无破损。保护装置安装牢固，位置正确，动作灵敏可靠，信号传输正常。","10.润滑系统：各注油点润滑良好，油质清洁，油量适当。润滑管路畅通，无泄漏。润滑记录完整。","11.检修现场：检修现场无积煤、浮煤及杂物堆积。设备整洁，无油污、无煤尘。工具、配件摆放整齐，使用后及时归位。"]},{"t":"七、安全管控措施","p":["1.停送电管控：严格执行停送电制度。检修前必须切断带式输送机控制开关电源，将开关分闸，闭锁，挂“有人工作 不准送电”警示牌，并上锁。严禁约时停送电。严格执行“谁停电、谁送电，谁上锁、谁解锁”规定。","2.验放电管控：电气检修停电后必须检查瓦斯，在巷道风流中甲烷浓度低于1.0%时，再用与电源电压相适应的验电笔逐相验电，确认无电后，方可对地放电。","3.转动部位管控：检修滚筒、托辊、联轴器等转动部位前，必须确认设备已可靠停电、闭锁、挂牌、上锁，输送带完全停稳。调整胶带跑偏可在带式输送机运行状态下开展，作业人员使用专用工具对纠偏托辊调节机构进行调整；严禁手及工具直接接触运动的胶带。调整时观察胶带运行状态，逐步微调，直至胶带运行恢复正常。机修工在保障安全的前提下，可以通过手触方式检查滚筒轴端部、轴承架等部位，判断设备的振动与温升状况；触摸检查时，严禁靠近转动部位，必须避开旋转构件，防止衣物、手套被卷入，发现异常振动、温度过热等情况应当及时停机处置。","4.登高作业管控：距离坠落基准面2米及以上登高作业必须系好安全带。登高作业时，必须使用梯子或脚手架，并安排专人扶梯监护。","5.作业区域隔离管控：检修期间，机头、机尾及高处作业区域设置警戒，非作业人员严禁入内。","6.验收闭环管控：检修完成后，清点作业用的工具、用具，及时清理现场物料、工具，保持设备整洁。由班组长组织自检，形成检修记录及验收记录，实现闭环管理。"]}]}],"w":3839,"cn":3,"sn":12},{"c":"JD-C-09","n":"强力带式输送机胶带硫化","t":"JD-C-09 强力带式输送机胶带硫化模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范煤矿井下钢丝绳芯强力带式输送机胶带硫化作业行为，统一硫化工艺流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生高温灼伤、触电、火灾爆炸、有毒有害气体中毒、机械伤害等安全隐患，确保硫化接头强度满足设计要求，保障带式输送机安全运行，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于煤矿井下钢丝绳芯强力带式输送机及织物芯带式输送机胶带接头的硫化制作、修补及更换作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；先防护、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：机电队队长、支部书记","副组长：主管副队长、安全技术副队长","成  员：班组长、安检员、现场操作人员"]},{"t":"二、核心职责","p":["机电队队长、支部书记：负责硫化作业管理的组织实施、人员调配及考核落实，检修工作总体安排。","主管副队长：负责硫化作业计划编制、现场作业组织协调、安装质量管控、进度把控。","安全技术副队长：负责硫化作业标准制定、安全技术措施编制、技术交底、现场隐患督办、模块修订优化。","班组长：负责当班硫化任务分配、班组人员管理、现场安全条件确认、硫化质量监督及问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","现场操作人员：严格按标准作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 强力带式输送机胶带硫化模块","s":[{"t":"一、模块概述","p":["模块编号：JD-C-09","模块名称：强力带式输送机胶带硫化","所属专业：机电","适用范围：适用于参与钢丝绳芯强力带式输送机胶带硫化所有人员。"]},{"t":"二、危险预知及防控","p":["1.触电伤害：硫化机、电热板等电气设备接入电源时，必须严格执行停送电制度。接线、拆线前必须切断电源，将前一级开关电源分闸，闭锁，挂警示牌，并上锁。电缆、插头、开关必须绝缘完好。","2.高温灼伤：硫化板工作温度通常为145℃±5℃，硫化过程中及刚停机时表面温度极高。操作人员严禁徒手触碰硫化板、加热模板及刚硫化的接头。硫化完成后必须自然冷却至40℃以下方可拆除硫化机。","3.火灾爆炸：硫化使用的溶剂等属于易燃易爆物品，必须单独存放，远离电气设备、高温热源。","4.机械伤害：打磨胶带台阶、剥钢丝绳时，必须使用专用刀具，严禁用手直接按压在刀刃前方。使用角磨机、钢丝轮打磨时必须佩戴护目镜和防尘口罩。","5.起吊作业伤害：吊运胶带等重物时，必须使用经检查确认合格的起重设备及吊具，由专人指挥，严禁在起吊物下方站立或作业。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：瓦斯浓度≤1.0%，通风良好；作业区域顶板稳定、无淋水，照明充足；巷道内无积水、无杂物，运输通道畅通。","2.人员确认：硫化作业人员熟悉硫化工艺参数及操作规程，精神状态良好，穿戴齐全劳动防护用品。","3.工器具确认：硫化机（水压板、加热板、隔热板、横梁）完好无变形、无裂纹；电控箱、电缆绝缘良好，接地可靠；打压泵、压力表、温控仪完好；角磨机、刀具完好。","4.技术确认：安全技术措施审批贯彻到位；胶带型号、强度等级、芯胶/面胶规格与原胶带匹配；硫化温度（145℃±5℃）、压力（1.5MPa~1.8MPa）、时间参数明确。","5.设备确认：带式输送机控制开关分闸，闭锁，悬挂\"有人工作，不准送电\"警示牌，并上锁；胶带张力已完全释放，两端用专用夹具固定；硫化机完好，供电正常。"]},{"t":"四、作业现场人员安全站位","p":["1.硫化作业人员：处理接头时，站在胶带侧面及上风侧，剥头、打磨时避开角磨机旋转方向，与转动工具保持安全距离，佩戴防护眼镜、防尘口罩。硫化过程中，站在硫化机侧面，与加热板保持安全距离（≥0.5m）。","2.班组长：站在作业现场上风侧、退路畅通的安全区域，全程统筹硫化流程，监督工艺参数执行及安全措施落实情况，不得擅自离岗。","3.安检员：站在能够全面观察硫化作业、电气设备及消防器材的安全区域，监督人员防护穿戴、停送电措施落实，发现违章立即制止并纠正。"]},{"t":"五、标准化作业流程","p":["（一）前期准备工作","（1）班组长根据更换计划提出硫化作业申请，明确硫化地点、数量及计划时间，报主管副队长审批。","（2）安全技术副队长编制安全技术措施，组织全体参与人员贯彻学习并签字确认。","（3）硫化作业人员检查硫化机各部件：加热板、水压板、隔热板、横梁无变形、无裂纹；紧固件齐全；电控箱、电缆无破损，接地线连接可靠。","（4）硫化作业人员检查打压泵、压力表、温控仪，确认量程匹配、指示准确。","（5）硫化作业人员检查胶料：胶浆、芯胶、面胶在保质期内，无变质、无硬化；型号、规格与原胶带匹配；清洁剂、粘合剂齐全。（班组长确认）","（6）班组长、安检员、硫化作业人员共同完成现场安全确认：顶板支护完好、瓦斯浓度合格、通风良好、消防器材到位、带式输送机控制开关已停电闭锁挂牌、胶带张力已释放并固定。","（二）接头制作与硫化操作步骤","1.接头定位与划线：","（1）根据胶带运行方向及接头形式，确定接头位置，避开滚筒及托辊集中区域。","（2）硫化作业人员使用直角尺、钢卷尺准确划线，标明阶梯层数、切口角度及搭接长度，划线清晰准确。","2.剥头：","（1）硫化作业人员使用专用刀具沿划线逐层剥除覆盖胶、芯胶，露出钢丝绳芯。","（2）剥头切口平直，阶梯长度误差不大于2mm；严禁损伤钢丝绳镀层；钢丝绳表面附胶保留0.3mm~0.5mm。（班组长确认）","3.打磨：","（1）硫化作业人员使用角磨机配专用砂轮或钢丝轮，打磨待粘合表面，去除氧化层及残胶，露出新鲜胶面。","（2）硫化作业人员打磨纹路均匀，深度适宜；打磨后使用专用清洁剂彻底清洁，去除粉尘、油污及水分，表面干燥无杂质。（班组长确认）","4.涂胶浆：","（1）硫化作业人员均匀涂刷胶浆或粘合剂，涂刷方向一致，不得漏涂、积胶。","（2）涂刷均匀，胶浆干燥至微粘手时进行合模。（班组长确认）","5.铺胶与排绳：","（1）硫化作业人员在接头阶梯面及钢丝绳间隙均匀铺设芯胶，厚度满足设计要求，无气泡、无杂质。","（2）钢丝绳芯胶带需对钢丝绳进行排布、固定，确保间距均匀、平行顺直，不得交叉、重叠、弯曲。（班组长确认）","（3）覆盖接头铺设面胶，厚度与原胶带一致，边缘超出接头边缘不少于20mm。","6.合模：","（1）硫化作业人员放置下横梁、隔热板、水压板，将制作好的接头放入硫化机下加热板中心位置，对正胶带中心线，偏差不大于5mm。","（2）硫化作业人员铺设上加热板、隔热板，安装上横梁，对角均匀紧固螺栓，确保上下加热板平行、压力分布均匀。（班组长确认）","7.升温升压：","（1）硫化作业人员接通硫化机电源，设定温控仪温度为145℃，开始升温；同时启动打压泵，向水压板注入压力水。","（2）升温过程中逐步升压，当温度达到设定值时，压力应达到工艺要求（一般1.5MPa~1.8MPa）。（班组长确认）","8.恒温恒压：","（1）达到设定温度、压力后，开始计时。钢丝绳芯胶带一般不少于40分钟。","（2）硫化作业人员硫化期间查看温度、压力，观察温控仪、压力表指示，发现温度波动超过±5℃或压力下降时，及时调整。","（3）严禁在恒温恒压期间打开硫化机或拆卸螺栓。（班组长监督）","9.降温卸压：","（1）达到硫化时间后，切断电源，关闭打压泵，自然降温。","（2）温度自然降至40℃以下方可卸压、拆除硫化机；严禁洒水强制冷却，严禁带压拆卸螺栓。（班组长确认）","10.质量检查：","（1）硫化作业人员拆除硫化机后，检查接头外观：无气泡、无脱层、无裂口、边缘整齐，表面平整。（班组长确认）","（2）使用壁纸刀在接头边缘轻划，胶料应呈柔性撕裂状，不得有硬块、生胶或分层现象。（班组长确认）","（3）测量接头厚度及宽度，应与原胶带基本一致，中心线偏差不大于5mm。","（三）收尾与记录","（1）硫化作业人员清理硫化现场，清点工具、材料，回收剩余胶料及边角料，严禁遗留杂物。","（2）班组长现场验收接头质量，整理填写记录。"]},{"t":"六、作业质量标准","p":["1.接头长度：钢丝绳芯胶带接头搭接长度符合设计或厂家规定，一般为1200mm，且不小于规范最小值。","2.钢丝绳处理：钢丝绳排列均匀、平行，间距符合要求，无交叉、无扭曲。钢丝绳表面清洁、干燥，打磨后露出新鲜金属光泽，无油污、无锈蚀、无旧胶残留。每根钢丝绳涂刷胶浆均匀，浸透良好。","3.胶料铺设：未硫化芯胶、面胶铺设平整，厚度均匀，无气泡、无杂质、无褶皱。覆盖胶厚度不低于原胶带标准。边缘整齐，多余胶料在硫化前修整完毕。","4.硫化过程要求：硫化温度控制在145℃±5℃，升温过程平稳，无超温。硫化压力控制在1.5~1.8MPa，压力稳定，无泄漏。加压过程中发现压力下降及时补压。恒温恒压时间保持40分钟。","5.接头外观：硫化接头表面平整，无气泡、无裂口、无烧焦。边缘整齐，厚度与带体基本一致，接头中心线与胶带中心线重合，偏差≤2mm。","6.接头强度：硫化接头强度不低于带体强度的85%。接头通过滚筒时无异常冲击、无异响。","7.温控与压力记录：硫化全过程观察温度、压力，符合工艺要求。","8.作业现场：作业现场无积煤、浮煤及杂物堆积。剩余胶料、溶剂密封回收，严禁遗留在井下。设备整洁，无油污。工具摆放整齐，及时归位。"]},{"t":"七、安全管控措施","p":["1.停送电管控：严格执行停送电制度。硫化作业前必须分闸、闭锁带式输送机控制开关，挂牌，并上锁。接通、拆除硫化设备电源时，将前一级开关电源分闸，闭锁，挂“有人工作 不准送电”警示牌，并上锁。","2.高温灼伤管控：硫化过程中及停机后2小时内，严禁徒手触碰硫化板、加热模板及接头。自然冷却至40℃以下方可拆模，严禁泼水或强制风冷。","3.易燃易爆管控：溶剂等易燃品限量领用，单独存放于阴凉通风处，远离电热板、电气设备及高温热源。使用时应控制挥发量，容器随用随盖。","4.加压系统管控：水压系统管路、接头、压力表完好，无泄漏。打压泵操作平稳，严禁超压。升压过程中人员避开高压管路及接头正面，防止爆裂喷溅伤人。保压期间定时巡检压力表，发现压降及时补压并查明原因。","5.作业区域隔离管控：硫化作业期间，作业区域设警戒，非作业人员严禁入内。","6.验收闭环管控：硫化完成后，清点作业用的工具、用具，剩余胶料、溶剂密封回收，及时清理现场物料及杂物，保持设备整洁。由班组长自检，试运行正常，实现闭环管理。"]}]}],"w":4010,"cn":3,"sn":12}],"os":"三","rn":"低风险","rc":"蓝","rg":"C","n":7,"label":"低风险 · 蓝色 C段"}],"no":"04","name":"机电作业模块"},{"t":"第五部分 运输作业模块","g":[{"t":"一、高风险-红色-A段（2项）","lv":"A","m":[{"c":"YS-A-01","n":"架空乘人装置安装","t":"YS-A-01 架空乘人装置安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下架空乘人装置主机、驱动部、尾轮、托压绳轮、钢丝绳、电控系统等全套安装施工作业行为，统一施工工序流程、安全风险防控、安装质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝钢丝绳弹甩伤人、设备倾覆挤压、高空构件坠落、物体打击、高空摔伤、电气触电、机械夹手等安全事故，全面提升架空乘人装置安装施工安全保障能力与整体施工质量，特制定本模块化作业方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有架空乘人装置整机及配套构件安装拆除全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：班组长、机修工、电修工、辅助工、安检员、运输技术员"]},{"t":"二、核心职责","p":["队长：安装工程整体统筹、人员调配、考核管理。","安全技术副队长：安装措施编制、技术交底、隐患督办、模块优化。","跟班副队长：安装期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","机修工/电修工/辅助工：严格遵照模块化流程完成机架（横梁）安装、设备吊装、机械装配、电气接线、设备调试、现场清理作业，规范佩戴劳保用品，杜绝违章操作。","安检员：作业期间巡查监督，制止违章、闭环隐患。","瓦斯检查员：巡查作业地点瓦斯，超限立即撤人。","运输技术员：现场技术指导、过程监督。"]}]},{"t":"第三章 架空乘人装置安装模块","s":[{"t":"一、模块概述","p":["模块编号：YS-A-01","模块名称：架空乘人装置安装","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊重物挤压、坠落伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.设备部件、工具等高空坠落伤人：分段吊装、固定，各部件临时支撑牢固后方可松卸吊具；设备下方设置警戒隔离区，工具小件手递手传递，严禁抛掷物料。","5.钢丝绳张拉弹甩、绳头滑脱伤人：绳头使用专用卡扣锁紧，禁止人员正对钢丝绳走向。","6.电气接线漏电触电伤人：作业前切断设备供电电源，挂牌上锁，验电放电后方可施工。","7.机械转动部件夹手、绞伤：驱动滚筒、托压轮安装调试阶段禁止徒手触碰转动部位，完工前加装防护盖板。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：安装全程巷道顶板、两帮支护完好，无浮矸危岩；巷道通风正常，作业区域照明充足；作业区域设置警戒设施，禁止无关人员通行逗留。","2.设备（工具）确认：手拉葫芦、扳手、撬棍、安全带、吊具、卡扣、钢丝绳、吊椅等齐全完好；吊具无裂纹、断丝、变形，油管无破损老化。","3.人员确认：瓦检员、安检员、班组长、运输技术员现场在岗，作业人员培训交底合格。","4.技术确认：专项措施审批、贯彻到位。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场视野开阔的安全主控区域，远离设备起吊、钢丝绳牵引、弹甩路径，全程统筹作业流程，不得擅自离岗、进入作业危险区。","2.安全监护人：定点站在作业核心危险区域旁，无视线遮挡，全程紧盯设备起吊固定、轮组安装环节，及时制止和纠正“三违”行为。","3.机修工/辅助工/电工：站在安全区域，与设备起吊区域保持安全距离，严禁站在起吊物正下方；多人抬运、起吊时人员两侧错开站位。","作业人员及管理人员站支护完好区域，远离起吊物下方。"]},{"t":"五、标准化作业流程","p":["1.前期准备工作：","（1）备用工具准备：班组长负责准备5T/3T/1T手拉葫芦各1个、扳手1套、大锤1个、安全带1个、吊具2套、卡扣、风动及其他专用工具等。","（2）所有参与人员贯彻学习安全技术措施。","（3）安全确认：班组长负责第三大项（作业条件安全确认）内容。","（4）班组长负责隐患整改闭环。","2.安装作业步骤：","（1）现场负责人指定专人负责现场封闭警戒。","（2）现场负责人指定专人负责现场敲帮问顶。","跟班副队长负责按照设计要求安装机头、机尾承重钢梁和拖压轮组横梁 → 起吊安装主机机头框架 → 吊装固定驱动部、尾轮及主机设备 → 依次安装托绳轮、压绳轮 → 敷设钢丝绳，绳头插接固定 → 安装各类开关、保护装置 → 敷设电控、电力线缆、安装控制柜、设备接线 → 空载试运转调试 → 全面自检复检 → 现场清理、设备清点、闭环验收"]},{"t":"六、作业质量标准","p":["1.主机架、横梁：主体无变形、开焊，螺栓紧固无松动，钢梁水平、间距符合设计要求。","2.驱动轮、尾轮：底座找平垫实，螺栓齐全紧固，滚筒同轴度达标，减速机油位正常无渗漏。","3.托压绳轮：轮体转动灵活，间距统一，钢丝绳对绳槽中心，无卡绳、磨绳现象。","4.钢丝绳：无扭结、断丝、锈蚀超标，插接长度符合要求，绳头插接牢靠，张紧度均匀一致。","5.保护装置：超速、打滑、全程急停、防脱绳、变坡点防掉绳、张紧力下降、防反转、越位保护等保护安装到位，动作灵敏可靠。","6.电气系统：线缆敷设整齐，防爆密封完好，接地保护规范，电控系统信号、声光报警功能正常。","7.空载试运行：空载试运行使钢丝绳充分释放应力后，方可乘人。"]},{"t":"七、安全管控措施","p":["1.电气作业管控：严格执行 “先断电、再验电、后作业” 流程，供电开关上锁挂牌，完工前禁止送电。","2.高空登高管控：高空作业必须搭设稳固作业平台，登高超过2米时全程佩戴安全带；扳手、绳卡等小件工具严禁抛掷。","3.钢丝绳张紧管控：张紧区域全封闭警戒，张紧装置专人操作，缓慢张紧，张紧时钢丝绳两侧禁止站人。","4.起吊作业管控：吊装吊点提前检查确认完好，吊具每次作业前检查，严禁超载吊装；多台葫芦同步起吊必须同起同落，防止零部件偏斜滑落。","5.现场警戒管控：安装全程封闭作业区域，前后巷道设置警戒设施，非作业人员禁止进入。","6.试运转管控：安装完成后先空载试运行，沿线逐段检查有无磨绳、卡阻、异响；试运转时沿线分段安排专人监护，发现异常立即停机。","7.验收闭环管控：安装试运行完成后，班组、安监、管理科室持表联合验收，所有隐患当日清零归档。"]}]}],"w":2418,"cn":3,"sn":12},{"c":"YS-A-02","n":"综采支架、掘进机等大型设备运输","t":"YS-A-02 综采支架、掘进机等大型设备运输模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下综采液压支架、掘进机、转载机、破碎机等大型采掘设备地面装车、井下轨道转运、巷道倒车、卸车转运全工序作业行为，统一运输工序流程、安全风险防控、车辆固定、轨道防护、运输验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝大件倾倒挤压、绞车钢丝绳弹甩、平板车跑车、设备滑落砸人、巷道片帮掉矸伤人等安全事故，全面提升井下大型采掘设备运输作业安全保障能力与运输标准化水平，特制定本模块化作业方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有综采支架、掘进机及配套大件设备地面装车、入井轨道运输、工作面顺槽转运现场全过程安全管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：各提升运输设备司机、信号工、把钩工、跟车工、班组长、安检员、运输技术员"]},{"t":"二、核心职责","p":["队长：大型设备运输工作整体统筹、人员调配、考核管理。","安全技术副队长：大型设备运输工作措施编制、技术交底、隐患督办、模块优化。","跟班副队长：大型设备运输期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","各提升运输设备司机/信号工/把钩工/跟车工：严格执行各岗位操作规程、规范传递信号、运输前安全检查，规范劳保用品穿戴，杜绝违章操作。","安检员：作业期间巡查监督，制止违章、闭环隐患。","运输技术员：现场技术指导、过程监督。"]}]},{"t":"第三章 综采支架、掘进机等大型设备运输模块","s":[{"t":"一、模块概述","p":["模块编号：YS-A-02","模块名称：综采支架、掘进机等大型设备运输","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.设备固定不牢脱落伤人：综采支架必须用不少于4条地脚螺栓固定，规则设备必须用不少于两道压杠固定，不规则设备必须用不少于4道钢丝绳固定。","3.车辆选择不合理、重型设备倾覆、平板车掉道、翻车挤压伤人：装车重心居中对称，使用合格螺栓、压杠多点紧固，提前整修轨道，轨道不合格禁止运输，运输期间人员严禁站在运输车辆两侧。","4.提升机断绳、斜巷跑车、挡车装置失效：每班检查钢丝绳磨损、锈蚀、断丝情况，试验“一坡三挡”完好，斜巷严格执行 “行车不行人、行人不行车”规定和警戒制度；每次运输前检查车辆连接销、防脱销齐全可靠，设备固定牢固，制动装置完好有效。","5.设备超高超宽剐蹭巷道支护、管线、风门造成卡堵、设备失稳：运输前重新确认运输巷道高度、宽度与车辆情况，提前清理沿途障碍物，拆除影响通行的管线，运输设备封车后整体尺寸必须小于巷道尺寸100mm以上。","6.零部件滑落、小件物料坠落打击行人：设备小件统一拆解分体运输，外露尖锐部件加装防护。","7.车辆复道人员站位不当存在伤人风险：复道前必须由跟班队长及班组长现场指挥；起吊掉道车辆时，人员严禁站在车辆两侧。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：运输全程巷道顶板、两帮支护完整牢固，无活矸、片帮、冒顶隐患；低洼积水淤泥提前清理、路面垫平；符合巷道有效通行高度、宽度，满足设备外形尺寸通行要求；沿途电缆、风水管、风门、管线托架提前拆除或防护。","2.轨道及运输设备确认：运输轨道全线平整夯实，轨距、水平、高低符合车辆运输标准，无悬空轨枕、松动扣件，道岔开合灵活、锁闭可靠；平板车完好，轮对、连接销、防脱销无变形裂纹，承载吨位满足设备重量要求；钢丝绳无严重锈蚀、断丝、硬弯；挡车栏、跑车防护装置齐全、动作正常。","3.人员确认：作业人员必须持证上岗，身体状态良好，无疲劳作业、酒后作业、带病作业情况，情绪稳定，劳动防护用品穿戴到位，具备现场作业条件。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["斜巷运输时，人员全部撤离至上下车场躲避硐室内，巷道中间禁止停留行人；平巷跟车人员必须在车辆前方5m以上距离时刻巡查路线前方情况，严禁与设备车并排行走。"]},{"t":"五、标准化作业流程","p":["大型设备运输前对绞车、轨道及“一坡三挡”等设备设施进行验收→安排经验丰富人员持证上岗 → 运输设备司机、信号工、把钩工、跟车工提前对保护装置、信号装置、“一坡三挡”、连接装置、钢丝绳完好情况安全确认 → 确认车辆封车完好→设置警戒 → 进行挂钩作业 → 撤至安全地点打点运输信号 → 按照操作规程运行设备 → 时刻观察车辆运行情况 → 到位停车后进行摘钩作业→转运前重新对封车情况进行确认→运往下一个转载点"]},{"t":"六、作业质量标准","p":["1.轨道线路：轨枕底部全部垫实无悬空；轨道水平、高低、方向符合车辆运输要求，道岔提前转辙闭合到位。","2.装车封车：设备重心与平板车中心重合，左右、前后无偏重，禁止单侧超载；封车采用四角螺栓或配合压杠固定，螺栓全部紧固到位。","3.平（斜）巷运输：运输设备牵引力、钢丝绳直径、容绳量、满足设备总重运输要求；车辆连接销、防脱保险销齐全插牢，禁止使用杂物替代保险装置；绞车信号清晰规范，无信号禁止开车；“一坡三挡”动作灵敏可靠。","4.巷道通行防护：运输沿途影响通行的电缆、风水管提前回撤或吊挂抬高；拐弯、风门、三岔口设专人定点监护，及时处理剐蹭卡阻隐患。"]},{"t":"七、安全管控措施","p":["1.巷道顶板帮部管控：每班作业前必须敲帮问顶，危岩活矸处理完毕方可施工。","2.斜巷运输红线管控：严格落实 “行车不行人、行人不行车”，斜巷运输期间巷道全线封闭警戒；车辆未停稳、挡车栏未关闭，人员不得靠近车辆；严禁放飞车、空绳松车。","3.封车质量验收管控：车辆运行至各转载点后，重新检查封车情况，封车不牢固、重心偏移、防护不到位一律禁止发车，整改合格签字后方可运输。","4.沿途监护管控：超高、超宽、重型设备运输全程配备1名及以上专职监护人员，分别跟车前后观察，遇剐蹭、松动、轨道变形立即发停车信号处置。","5.验收闭环管控：作业完成后，班组自检、验收，所有隐患当日清零归档。"]}]}],"w":2364,"cn":3,"sn":12}],"os":"一","rn":"高风险","rc":"红","rg":"A","n":2,"label":"高风险 · 红色 A段"},{"t":"二、中风险-橙色-B段（7项）","lv":"B","m":[{"c":"YS-B-01","n":"提升机钢丝绳更换","t":"YS-B-01 提升机钢丝绳更换模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范提升机钢丝绳更换作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝钢丝绳弹甩伤人、设备起吊砸伤人员等安全隐患，提升施工期间安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有提升机钢丝绳更换全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：提升机司机、信号把钩工、机修工、辅助工、班组长、安检员、运输技术员"]},{"t":"二、核心职责","p":["队长：换绳作业整体统筹、人员调配、考核管理。","安全技术副队长：换绳措施编制、技术交底、隐患督办、模块优化。","跟班副队长：换绳期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","提升机司机/信号把钩工/机修工/辅助工：严格执行模块化流程要求进行作业。","安检员：作业期间巡查监督，制止违章、闭环隐患。","运输技术员：现场技术指导、过程监督。"]}]},{"t":"第三章 提升机钢丝绳更换模块","s":[{"t":"一、模块概述","p":["模块编号：YS-B-01","模块名称：提升机钢丝绳更换","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊钢丝绳挤压、砸伤伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.钢丝绳弹甩、断裂伤人：严禁站在钢丝绳受力内侧、弯曲方向。","5.提升机误动作伤人：安排专职提升机司机和信号把钩工配合作业；“检修模式”下运行提升机，速度不得大于1m/s。","6.钢丝绳张紧盘绳时跑车：重新试验跑车防护装置，确保灵敏可靠；严格执行“行人不行车、行车不行人”规定及警戒制度。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业现场无杂物、无积水、无油污，作业平台、高空作业通道、扶梯牢固可靠，防护栏杆齐全完好；巷道顶板、两帮支护完好，无浮矸危岩；起吊环境完好；巷道通风正常，作业区域照明充足；作业区域设置警戒设施，禁止无关人员随意通行逗留。","2.设备（工具）确认：新钢丝绳规格、型号、直径、抗拉强度符合设备要求，外观无锈蚀、断丝、变形、松股等质量缺陷，具备产品合格证、检测报告；手拉葫芦、扳手、安全带、吊具、卡扣、圆环链（直径不小于18mm）等齐全完好；吊具无裂纹、变形。","3.人员确认：作业人员必须持证上岗，身体状态良好，情绪稳定，无疲劳作业、酒后作业、带病作业情况，劳动防护用品穿戴到位，具备现场作业条件。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场退路畅通的安全区域，无视线遮挡，远离顶板巷帮离层掉落、钢丝绳牵引、弹甩路径，全程统筹作业流程，紧盯钢丝绳拆装、起重牵引、高空作业等环节，不得擅自离岗，及时制止和纠正“三违”行为。","2.提升机司机/信号把钩工：固定在设备操作区域安全站位，操作期间专注设备操控，严禁探头观望、离岗操作，严格听从指挥员统一指令，杜绝误操作。","3.机修工/辅助工：严禁站在钢丝绳摆动、回弹危险区域，严禁站在钢丝绳直线受力方向、绳头正前方。"]},{"t":"五、标准化作业流程","p":["（一）副井提升机更换钢丝绳流程","1.前期准备工作：","（1）备用工具准备：跟班队长负责准备专用放绳车1辆，导向轮1个，安全带2个，扳手1套，新保险绳2根，φ22新绳卡10个等。","（2）所有参与人员贯彻学习安全技术措施。","（3）安全确认：跟班队长、班组长、安检员负责第三大项（作业条件安全确认）内容。","（4）跟班队长、班组长负责隐患整改闭环。","2.更换作业步骤：","（1）现场负责人指定专人负责现场封闭警戒。","（2）提升机司机负责将提升机调至“检修”模式。","（3）第一根旧钢丝绳拆除：拆除提升绳头及保险绳→用麻绳将提升绳头捆绑固定→将提升绳头从防护网和天轮架上剥离→将旧绳全部盘放至副井口工业广场→旧绳放完后，绞车操作台断电闭锁，滚筒机械闭锁→拆除滚筒旧绳压板，将旧绳头抽出。","（4）第一根新钢丝绳穿装与展放：先将新绳绳盘放至在放绳车，并将放绳车固定在副井口阻车器处→将新绳绳头穿至提升机房（不用通过防护网及天轮），通过压板固定在滚筒上（班组长负责确认）→打点提升运行提升机，将新绳全部缠绕到滚筒上固定，缠绕新绳同步拆除第二根旧绳，操作步骤与第一根旧绳拆除流程一致。","（5）提升机司机负责打开滚筒离合。","（6）机修工负责将已盘新绳滚筒制动闸锁死，按照第一根新钢丝绳穿装与展放流程穿装第二根新钢丝绳（班组长负责确认）。","（7）第二根新钢丝绳张紧与调试校验：将第二根新钢丝绳绳头通过天轮及防护网放至副井井口，制作提升绳头并锁至天轮架下方固定点→通过导向轮将钢丝绳固定在矿车上（重车两辆）→打点启动提升机，将重车下放至副斜井中间位置→重新将重车提升至副斜井上部车场→将天轮下方钢丝绳头拆除→连接重车4辆（安装保险绳），并下放至副斜井底停车处（跟班队长负责确认）。","（8）提升机司机配合机修工闭合滚筒离合。","（9）将第一根新钢丝绳按照第二根新钢丝绳张紧与调试校验步骤操作（跟班队长负责确认）。","（10）提升机司机配合信号把钩工调整两根新钢丝绳绳头位置至正常停车位（跟班队长负责确认）。","（11）提升机司机解除提升机“检修”模式，双码重载重新试运行至正常状态（跟班队长负责确认）。","（12）现场清理、工具清点、现场验收（跟班队长负责确认）。","（二）暗副井提升机、31采区提升机、22采区提升机更换钢丝绳流程","1.前期准备工作：","（1）备用工具准备：跟班队长负责准备5T手拉葫芦1个，专用吊装链2套，导向轮1个，扳手1套，新保险绳1根，φ22（φ28）新绳卡5个等。","（2）所有参与人员贯彻学习安全技术措施。","（3）安全确认：跟班队长、班组长、安检员负责第三大项（作业条件安全确认）内容。","（4）跟班队长、班组长负责隐患整改闭环。","2.更换作业步骤：","（1）现场负责人指定专人负责现场封闭警戒。","（2）提升机司机负责将提升机调至“检修”模式。","（3）旧钢丝绳拆除：拆除提升绳头及保险绳→将旧绳全部盘放至上部车场矿车内→旧绳放完后，绞车操作台断电闭锁，滚筒机械闭锁→拆除滚筒旧绳压板，将旧绳头抽出。","（4）新钢丝绳穿装与展放：先将新绳绳盘吊挂在上部车场架空乘人装置横梁上→将新绳绳头穿至提升机房，通过压板固定在滚筒上（班组长负责确认）→打点提升运行提升机，将新绳全部缠绕到滚筒上。","（5）重新制作提升绳头和保险绳→用圆环链将提升绳头固定至天轮架前方固定点上（班组长负责确认）。","（6）通过导向轮将钢丝绳固定在矿车上（重车两辆）→打点启动提升机，将重车下放至斜井中间位置→重新将重车提升至斜井上部车场→将固定在固定点上的钢丝绳头拆除→连接重车4辆，并下放至斜井底停车处（跟班队长负责确认）。","（7）重新将4辆重车拉至上部车场正常停车点→提升机司机配合信号把钩工调整新钢丝绳绳头位置（跟班队长负责确认）。","（8）提升机司机解除提升机“检修”模式，重载重新试运行至正常状态（跟班队长负责确认）。","（9）现场清理、工具清点、现场验收（跟班队长负责确认）。"]},{"t":"六、作业质量标准","p":["1.新钢丝绳：必须经第三方机构检验合格且在有效期内。","2.滚筒处钢丝绳：绳头必须用压板固定在滚筒上，用记号标明初始绳头位置；滚筒钢丝绳必须排列整齐，滚筒上至少缠绕六圈钢丝绳。","3.提升绳头：直径21.5mm钢丝绳绳卡数量为4个（不包含缓冲绳绳卡），直径26mm钢丝绳绳卡数量为5个（不包含缓冲绳绳卡）；U型螺栓扣在钢丝绳的尾段上，钢丝绳卡不得在钢丝绳上交替布置；15.5mm钢丝绳（保险绳）绳卡间距在95mm—105mm之间，21.5mm钢丝绳绳卡间距在130mm—150mm之间，26mm钢丝绳绳卡间距在160mm—180mm之间，最后一个绳卡距绳头长度不得小于140mm，并于铁丝缠绕固定；安全弯长度不得小于500mm。","4.绳衬：（1）天轮绳槽衬垫磨损达到1根钢丝绳直径深度，或者沿侧面磨损达到钢丝绳直径的1/2必须进行更换；（2）摩擦轮绳槽衬垫磨损剩余厚度小于钢丝绳直径，绳槽磨损深度超过70mm必须进行更换。"]},{"t":"七、安全管控措施","p":["1.提升作业管控：严格按照信号把钩工指令运行车辆，车辆运行期间严格执行“行人不行车、行车不行人”制度。","2.高空吊装管控：高空作业必须搭设稳固作业平台，登高超过2米时全程佩戴安全带（高挂低用）；扳手、绳卡等工具小件手递手传递，严禁抛掷物料。","3.起吊作业管控：吊装吊点提前检查确认完好，吊具每次使用前检查，严禁超载吊装。","4.现场警戒管控：换绳全程封闭作业区域，上、下车场入口处设置警戒设施，非作业人员禁止进入。","5.试运转管控：换绳完成后试运行，确保钢丝绳排列整齐，全部压在绳槽内；试运行时安排专人监护，发现异常立即急停处理。","6.验收闭环管控：作业完成后，班组与运输技术员持表联合验收，所有隐患当日清零归档。"]}]}],"w":3662,"cn":3,"sn":12},{"c":"YS-B-02","n":"架空乘人装置钢丝绳更换","t":"YS-B-02 架空乘人装置钢丝绳更换模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范架空乘人装置钢丝绳更换作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝作业过程中高空坠落、物体打击、钢丝绳弹甩、设备误启动等安全事故，提升施工期间安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有架空乘人装置钢丝绳更换全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：架空乘人装置司机、提升机司机、信号把钩工、机修工、辅助工、班组长、安检员、运输技术员"]},{"t":"二、核心职责","p":["队长：换绳作业整体统筹、人员调配、考核管理。","安全技术副队长：换绳措施编制、技术交底、隐患督办、模块优化。","跟班副队长：换绳期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","架空乘人装置司机/提升机司机/信号把钩工/机修工/辅助工：严格执行模块化流程要求。","安检员：作业期间巡查监督，制止违章、闭环隐患。","运输技术员：现场技术指导、过程监督。"]}]},{"t":"第三章 架空乘人装置钢丝绳更换模块","s":[{"t":"一、模块概述","p":["模块编号：YS-B-02","模块名称：架空乘人装置钢丝绳更换","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊钢丝绳挤压、砸伤伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.钢丝绳弹甩、断裂伤人：严禁站在钢丝绳受力内侧、弯曲方向；托绳轮退绳时，按照从机尾到机头方向进行；托绳轮上绳时，按照从机头到机尾方向进行。","5.钢丝绳掉轮人员摔伤：钢丝绳更换完毕后必须经空载试运行合格后方可乘人。","6.尾轮张紧钢丝绳挤压，导致尾轮不与钢丝绳同步移动造成尾轮突然移动伤人：松尾轮钢丝绳时，安排专人观察尾轮运行情况。","7.放绳速度与提升机速度不同步造成钢丝绳挤压受损：严格控制提升机运行速度与绳盘放绳速度一致。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业现场无杂物、无积水、无油污，作业平台、高空作业通道、扶梯牢固可靠，防护栏杆齐全完好；巷道顶板、两帮支护完好，无浮矸危岩；起吊环境完好；巷道通风正常，作业区域照明充足；作业区域设置警戒设施，禁止无关人员随意通行逗留。","2.设备（工具）确认：新钢丝绳规格、型号、直径、抗拉强度符合设备要求，外观无锈蚀、断丝、变形、松股等质量缺陷，具备产品合格证、检测报告；手拉葫芦、扳手、安全带、吊具、卡扣、圆环链（直径不小于18mm）、钢丝绳等齐全完好；吊具无裂纹、变形。","3.人员确认：作业人员必须持证上岗，身体状态良好，情绪稳定，无疲劳作业、酒后作业、带病作业情况，劳动防护用品穿戴到位，具备现场作业条件。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场退路畅通的安全区域，无视线遮挡，远离顶板巷帮离层掉落、钢丝绳牵引、弹甩路径，全程统筹作业流程，紧盯钢丝绳拆装、起重牵引、高空作业等环节，不得擅自离岗，及时制止和纠正“三违”行为。","2.架空乘人装置司机/信号把钩工：固定在设备操作区域安全站位，操作期间专注设备操控，严禁离岗操作，严格听从班组长或指定的专人统一指令，杜绝误操作。","3.机修工/辅助工：严禁站在钢丝绳摆动、回弹危险区域，严禁站在钢丝绳直线受力方向、绳头正前方。"]},{"t":"五、标准化作业流程","p":["1.前期准备工作：","（1）备用工具准备：跟班队长负责准备5T手拉葫芦2个、吊链4根、导向轮1个，安全带2个，扳手1套，φ22（φ20）新绳卡10个，空矿车4辆、插绳工具1套、电胶布6盘、白布带10盘等。","（2）所有参与人员贯彻学习安全技术措施。","（3）安全确认：跟班队长、班组长、安检员负责第三大项（作业条件安全确认）内容。","（4）跟班队长、班组长负责隐患整改闭环。","2.更换作业步骤：","（1）现场负责人指定专人负责现场封闭警戒。","（2）现场负责人指定专人负责停电、闭锁、挂牌、上锁架空乘人装置电源。","（3）释放旧钢丝绳张紧力：班组长指定专人搭设工作平台→拆除驱动轮、尾轮护罩→将张紧推车松至导轨前端尽头（同时配重块落地）→拆除旧15.5mm张紧钢丝绳→班组长负责安全确认。","（4）拆除旧钢丝绳：班组长指定专人搭设工作平台→用麻绳将驱动轮处钢丝绳双向捆绑固定在横梁上→双向同时从机尾到机头方向下放旧钢丝绳，并将旧钢丝绳摆放至轨道中心托绳轮上→解除双向捆绑麻绳，缓慢下放驱动轮处旧钢丝绳并截断→班组长负责安全确认。","（5）在机尾处回收旧钢丝绳：将4辆空矿车停放在井底车场并掩护到位→人工逐根将旧钢丝绳盘至空矿车内并捆绑牢固。","（6）铺设新钢丝绳：班组长指定专人将装有钢丝绳盘的车辆推至吊挂点并掩护到位→人员站至钢丝绳绳盘上吊挂手拉葫芦→先试吊、再起吊钢丝绳盘使其离地约20cm→提升机至少悬挂两辆重车，最后一辆重车悬挂导向轮→将新钢丝绳绳头穿过导向轮固定在井底车场轨道上→班组长负责安全确认→打点信号启动提升机缓慢将新钢丝绳铺设至机头处（通过跑车防护装置时，停止提升机运行→人员将钢丝绳从导向轮中摘除→拆除跑车防护装置牵引钢丝绳→将跑车防护装置下方新钢丝绳调整至从跑车防护装置上方→重新将新钢丝绳固定在导向轮上→重新恢复跑车防护装置牵引钢丝绳）。","（7）安装新钢丝绳：班组长指定专人搭设工作平台→人工将新钢丝绳套在驱动轮上，并用麻绳双向固定→安排专人双向同时从机头到机尾方向铺设新钢丝绳至托绳轮上→采用两个5T手拉葫芦将两侧钢丝绳（绳头前端约30m处）张紧固定在横梁上→将预留两侧钢丝绳进行插接→班组长指定专人搭设工作平台→将插接后钢丝绳套在尾轮上。","（8）张紧装置恢复：铺设新直径为15.5mm钢丝绳，一端固定在张紧重锤上，另一端通过轮组缠绕固定在张紧滚筒上。","（9）张紧新钢丝绳：班组长指定专人搭设工作平台→旋转张紧轮使重锤离地30cm以上→拆除张紧钢丝绳两侧的手拉葫芦。","（10）试运行：拆除驱动轮上两侧固定麻绳→安装驱动轮、尾轮防护网→班组长负责对运行巷道环境及架空乘人装置进行安全确认→恢复送电→打点启动架空乘人装置至少空载运行30min→确认空载试运行无异常后，班组长和机修工乘坐吊椅对架空乘人装置运行情况再次确认。","（11）现场清理、工具清点、现场验收（跟班队长负责确认）。"]},{"t":"六、作业质量标准","p":["1.新钢丝绳：外观无断丝、弯曲、锈蚀等现象，具备产品合格证，经第三方机构检验合格并在有效期内；钢丝绳全线张紧均匀，无局部松弛、过紧、下垂现象；设备运行时钢丝绳无跑偏、无剧烈抖动、无摩擦设备壳体及巷道支护；钢丝绳完全贴合驱动轮、托轮、压轮卡槽，无脱槽、偏移现象。","2.插接段：钢丝绳插接长度不小于钢丝绳直径的1000倍，插接紧密、平整、无松股、无错股。","3.收尾：作业区域整洁无遗留工具、废料。"]},{"t":"七、安全管控措施","p":["1.提升作业管控：严格按照信号把钩工指令运行车辆，车辆运行期间严格执行“行人不行车、行车不行人”制度。","2.高空吊装管控：高空作业必须搭设稳固作业平台，登高超过2米时全程佩戴安全带；扳手、绳卡等工具小件手递手传递，严禁抛掷物料。","3.起吊作业管控：吊装吊点提前检查确认完好，吊具每班作业前检查，严禁超载吊装。","4.现场警戒管控：换绳全程封闭作业区域，上、下车场入口处设置警戒设施，非作业人员禁止进入。","5.试运转管控：换绳完成后空载试运行，确保钢丝绳全部放置在每个拖压轮上；试运行时安排专人监护，发现异常立即急停处理。","6.验收闭环管控：作业完成后，班组自检、验收，所有隐患当日清零归档。"]}]}],"w":3145,"cn":3,"sn":12},{"c":"YS-B-03","n":"无极绳绞车钢丝绳更换","t":"YS-B-03 无极绳绞车钢丝绳更换模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范无极绳绞车钢丝绳更换作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝作业过程中高空坠落、物体打击、钢丝绳弹射、设备误启动等安全事故，提升施工期间安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有无极绳绞车钢丝绳更换全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：无极绳绞车司机、跟车（信号）工、机修工、辅助工、班组长、安检员、运输技术员"]},{"t":"二、核心职责","p":["队长：换绳作业整体统筹、人员调配、考核管理。","安全技术副队长：换绳措施编制、技术交底、隐患督办、模块优化。","跟班副队长：换绳期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","无极绳绞车司机/跟车（信号）工/机修工/辅助工：严格执行模块化流程要求。","安检员：作业期间巡查监督，制止违章、闭环隐患。","运输技术员：现场技术指导、过程监督。"]}]},{"t":"第三章 无极绳绞车钢丝绳更换模块","s":[{"t":"一、模块概述","p":["模块编号：YS-B-03","模块名称：无极绳绞车钢丝绳更换","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊钢丝绳挤压、砸伤伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.钢丝绳弹甩、断裂伤人：严禁站在钢丝绳受力内侧、弯曲方向。","5.行人侧杂物堆积、通道不畅，跟车时造成人员摔伤：换绳前进行巡道作业，清理行人通道杂物。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业现场无杂物、无积水、无油污，作业平台牢固可靠；巷道顶板、两帮支护完好，无浮矸危岩；起吊环境完好；巷道通风正常，作业区域照明充足；作业区域设置警戒设施，禁止无关人员随意通行逗留。","2.设备（工具）确认：新钢丝绳规格、型号、直径、抗拉强度符合设备要求，外观无锈蚀、断丝、变形、松股等质量缺陷，具备产品合格证，检测报告有效期内；手拉葫芦、扳手、安全带、吊具、卡扣、圆环链（直径不小于18mm）等齐全完好；吊具无裂纹、变形。","3.人员确认：作业人员必须持证上岗，身体状态良好，情绪稳定，无疲劳作业、酒后作业、带病作业情况，劳动防护用品穿戴到位，具备现场作业条件。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场退路畅通的安全区域，无视线遮挡，远离顶板巷帮离层掉落、钢丝绳牵引、弹甩路径，全程统筹作业流程，紧盯钢丝绳拆装、起重牵引、高空作业等环节，不得擅自离岗，及时制止和纠正“三违”行为。","2.无极绳绞车司机/跟车（信号）工：固定在设备操作区域安全站位，操作期间专注设备操控，严禁离岗操作，严格听从班组长或指定的专人统一指令，杜绝误操作。","3.机修工：站在钢丝绳侧面安全区域，与钢丝绳摆动、回弹区域保持安全距离，严禁站在钢丝绳直线受力方向、绳头正前方、起吊物正下方。"]},{"t":"五、标准化作业流程","p":["（1）现场负责人指定专人负责现场封闭警戒。","（2）现场负责人指定专人负责停电、闭锁、挂牌、上锁无极绳绞车电源。","（3）释放旧钢丝绳张紧力：班组长指定专人将板车使用圆环链固定在轨道上→释放梭车液压缸→拆除板车绳扣、松开桃形环→将钢丝绳从桃形环内抽出落地→班组长指定专人将装有钢丝绳盘的车辆推至吊挂点并掩护到位→人员站至钢丝绳绳盘上吊挂手拉葫芦→先试吊、再起吊钢丝绳盘使其离地约20cm→班组长负责安全确认。","（4）更换钢丝绳：班组长指定专人将绕尾旧钢丝绳绳头与新钢丝绳绳头插接→将提前预留的4辆空矿车停放在指定地点并掩护到位→无极绳绞车恢复供电→将绕机头滚筒的旧钢丝绳绳头使用人工盘放至空旷车内→班组长指定专人拿手持电台跟插接绳头→打信号启动无极绳绞车→回收旧绳同时缓慢的将新绳铺设在绞车轨道内→旧绳全部回收完毕的同时新绳也已铺设到位→停电、闭锁、挂牌、上锁无极绳绞车电源→将一侧绳头穿过板车穿绳梭子、保险插、桃形环→将一侧桃形环锁紧→将绳盘上余留的新绳全部抽出盘放地面上→然后将绳头穿过板车穿绳梭子、保险插、桃形环→将绳头使用压板固定在储绳滚筒上→将余绳盘在储绳滚筒上→使用手拉葫芦将里侧钢丝绳张紧→将桃形环锁紧→将两侧钢丝绳绳头用绳扣交叉锁紧→拆除手拉葫芦、拆除板车固定圆环链→班组长负责现场安全确认。","（5）试运行：班组长负责对运行巷道环境及无极绳绞车进行安全确认→恢复送电→班组长指定专人拿手持电台全程试运行至少运行一趟→确认空载试运行无异常后，班组长和机修工无极绳绞车运行情况再次确认。","（6）现场清理、工具清点、现场验收（跟班队长负责确认）。安全确认 → 隐患整改 → 现场封闭警戒 → 吊挂新绳 → 拆除旧绳接头 → 新绳与旧绳插接 → 启动车辆，缓慢将新绳运行一圈（同时将旧绳盘起） → 重新将新绳固定在梭车上 → 试运行 → 现场清理、设备清点、闭环验收"]},{"t":"六、作业质量标准","p":["1.新钢丝绳：外观无断丝、锈蚀现象，具备产品合格证并经第三方机构检验合格；钢丝绳全线张紧均匀，无局部松弛、过紧、下垂现象；钢丝绳全部在拖、压轮组内，无脱轮、偏移。","2.钢丝绳固定：钢丝绳绳头与梭车连接固定必须齐全牢固，防止紧绳时松脱。","3.收尾：作业区域整洁无遗留工具、废料。"]},{"t":"七、安全管控措施","p":["1.跟车作业管控：时刻观察新、旧钢丝绳插接段无断裂、松股且全部铺设在压轮辊下；跟车人员全程在行人侧跟车慢行跟车，防止滑倒、绊倒摔伤。","2.高空吊装管控：高空作业必须搭设稳固作业平台，登高超过2米时全程佩戴安全带；扳手、绳卡等工具小件手递手传递，严禁抛掷工具、物料。","3.起吊作业管控：吊装吊点提前检查确认完好，吊具每班作业前检查，严禁超载吊装。","4.现场警戒管控：换绳全程封闭作业区域，上、下车场入口及联巷口处设置警戒设施，非作业人员禁止进入。","5.试运转管控：换绳完成后空载试运行，确保钢丝绳全部放置在每个拖压轮上；试运行时安排专人监护，发现异常立即急停处理。","6.验收闭环管控：作业完成后，班组自检、验收，所有隐患当日清零归档。"]}]}],"w":2562,"cn":3,"sn":12},{"c":"YS-B-04","n":"气动单轨吊安装","t":"YS-B-04 气动单轨吊安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下气动单轨吊轨道、主机、管路、配套附件安装全流程作业行为，统一施工工序、风险防控手段、安装质量与验收标准，实现安装流程标准化、现场操作规范化、安全风险可控化、完工验收闭环化，有效防范顶板落矸、起重坠落、挤压伤人、高压风管崩脱、机械夹伤、高空坠落等安全事故，全面提升井下单轨吊安装施工安全管控水平与工程施工质量，特编制本模块化管理方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有气动单轨吊安装全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：机修工、辅助工、班组长、安检员、运输技术员"]},{"t":"二、核心职责","p":["队长：安装作业整体统筹、人员调配、考核管理。","安全技术副队长：安装措施编制、技术交底、隐患督办、模块优化。","跟班副队长：安装期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组安装自检、班前风险告知、现场人员分工。","机修工/辅助工：严格遵照模块化流程完成轨道拼接、单轨吊主机吊装、高压风管敷设、整机调试、现场清理作业，规范佩戴劳保用品，杜绝违章操作。","安检员：作业期间安全巡查监督，制止违章、闭环隐患。","运输技术员：现场技术指导、过程监督。"]}]},{"t":"第三章 气动单轨吊安装模块","s":[{"t":"一、模块概述","p":["模块编号：YS-B-04","模块名称：气动单轨吊安装","设备型号：DQ30/0.5、DQ20/0.5","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊重物挤压、坠落伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.棚梁变形、断裂轨道坠落伤人：选择完好的棚梁作为轨道固定点。","5.高压风管崩脱伤人：管路安装前关闭压风总阀门，泄压后再拆装接头；管路U型卡紧固到位，试压时人员避开管路正前方。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业现场无杂物、无积水、无油污，作业平台牢固可靠；巷道顶板、两帮支护完好，无浮矸危岩；巷道通风正常，作业区域照明充足；作业区域设置警戒设施，安全退路畅通，禁止无关人员通行逗留。","2.设备（工具）确认：3T手拉葫芦、扳手、安全带、U型卡、卸扣、连接销轴等齐全完好；吊具无裂纹、变形，高压风管无破损鼓包。","3.人员确认：作业人员必须持证上岗，身体状态良好，无疲劳作业、酒后作业、带病作业情况，情绪稳定，劳动防护用品穿戴到位，具备现场作业条件。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场退路畅通的安全区域，无视线遮挡，远离顶板巷帮离层掉落、吊轨、单轨吊主机正下方、吊件摆动范围、高压风管接头正对方向区域，全程统筹作业流程，紧盯起重牵引、高空作业等环节，不得擅自离岗，及时制止和纠正“三违”行为。","2.机修工/辅助工：严禁站在顶板巷帮离层掉落、吊轨、单轨吊主机正下方、吊件摆动范围、高压风管接头正对方向区域，严格听从班组长或指定的专人统一指令，杜绝误操作。","标准化作业流程","1.前期准备工作：","（1）备用工具准备：班组长负责准备3T手拉葫芦2个、脚手架2套、扳手1套、安全带1个、吊具2套、卸扣等。","（2）所有参与人员贯彻学习绞车设计审批单。","（3）安全确认：班组长负责第三大项（作业条件安全确认）内容。","（4）班组长负责隐患整改闭环。","2.安装作业步骤：","（1）现场负责人指定专人负责现场设置警戒。","（2）现场负责人指定专人负责现场敲帮问顶。","（3）班组长负责单轨吊主机固定工作。","①单轨吊主机安装步骤：班组长安排专人找好起吊点→安装两根单轨吊横梁→安装2台手拉葫芦并使用圆环链兜住单轨吊主机→试吊并起吊主机→对接横梁固定牢靠→班组长负责检查确认主机固定情况。","（4）安装承载小车步骤：两人配合托举安装→连接连杆并使用销轴固定→两人配合托举气吊葫芦并使用销轴固定在承载小车上→将主机与气动葫芦连接→安装主机和气动葫芦操作阀→班组长负责检查确认主机固定情况。","（5）试运行：连接主机气动管路→调试气动葫芦升降正常→调试主机驱动和制动装置灵敏可靠→班组长负责现场安全确认","（6）班组长负责对单轨吊整体安装运行情况进行验收。","（7）试运行正常后由机电运输科组织验收，验收合格方可使用。"]},{"t":"六、作业质量标准","p":["1.轨道系统：轨道平直无扭曲变形，连接销轴齐全紧固，轨道接缝间隙均匀、无错茬；吊链垂直受力，无斜拉歪吊。","2.单轨吊主机行走机构：行走轮与轨道贴合紧密，无卡阻、偏磨；驱动马达、传动部件装配到位，销轴、开口销齐全不缺失。","3.制动防护系统：制动动作灵敏可靠，闸瓦间隙均匀；轨道首尾安装刚性挡车器，限位装置齐全有效。","4.气动管路系统：高压风管吊挂平直、固定卡箍间距符合标准，无拖地、挤压破损；接头密封完好无漏气，阀门开关灵活；管路按规定加装过滤器。","5.收尾：作业区域整洁无遗留工具、废料。"]},{"t":"七、安全管控措施","p":["1.高压管路安装管控：安装管路前关闭压风总闸，完全释放管路余压后方可施工；管路试压分段进行，缓慢升压，试压期间管路前后40米禁止站人，出现漏气立即泄压处理。","2.高空吊装管控：高空作业必须搭设稳固作业平台，登高超过2米时全程佩戴安全带；扳手、绳卡等工具小件手递手传递，严禁抛掷工具、物料。","3.起吊作业管控：吊装吊点提前检查确认完好，吊具每次作业前检查，严禁超载吊装。","4.现场警戒管控：作业区域前后10m范围设置警戒设施，非作业人员禁止随意进入。","5.试运转管控：安装完成后空载试运行，全程检查有无异响、脱轨、漏气、制动失灵等问题；调试时轨道下方禁止站人，发现异常立即关闭压风、停机处置。","6.验收闭环管控：作业完成后，班组自检、验收，所有隐患当日清零归档。"]}]}],"w":2388,"cn":3,"sn":11},{"c":"YS-B-05","n":"架空乘人装置拆除","t":"YS-B-05 架空乘人装置拆除模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下在用架空乘人装置电控系统、钢丝绳、托压绳轮、尾轮、驱动部、主机、主机架等全套设备拆除施工作业行为，统一拆除工序流程、安全风险防控、设备拆解转运、物料回收验收标准，实现拆除作业流程标准化、操作规范化、风险可控化、物料回收闭环化，杜绝钢丝绳回弹弹甩伤人、重型设备倾倒挤压、高空构件坠落、物体打击、高空失足摔伤、电气触电、机械剐蹭伤人、巷道片帮掉矸等安全事故，降低拆除过程设备磕碰损坏、零部件丢失损耗，全面提升架空乘人装置拆除施工安全保障能力与物料回收管控水平，特制定本模块化拆除作业方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有架空乘人装置整机及配套构件拆除全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：班组长、机修工、电修工、辅助工、安检员、瓦斯检查员、运输技术员"]},{"t":"二、核心职责","p":["队长：拆除工程整体统筹、人员调配、考核管理。","安全技术副队长：拆除措施编制、技术交底、隐患督办、模块优化。","跟班副队长：拆除期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","机修工/电修工/辅助工：严格遵照模块化流程完成电控设施拆解、钢丝绳回收、各部件吊装拆除、吊椅及托压绳轮回收转运、现场清理作业，规范佩戴劳保用品，杜绝违章操作。","安检员：作业期间巡查监督，制止违章、闭环隐患。","瓦斯检查员：巡查作业地点瓦斯，超限立即撤人。","运输技术员：现场技术指导、过程监督。"]}]},{"t":"第三章 架空乘人装置拆除模块","s":[{"t":"一、模块概述","p":["模块编号：YS-B-05","模块名称：架空乘人装置拆除","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊重物挤压、坠落伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.电气拆线漏电触电伤人：作业前切断设备供电电源，挂牌上锁，验电放电后方可施工。","5.钢丝绳松绳弹甩伤人：钢丝绳松放前提前使用专用绳卡一侧固定锁死，缓慢释放张紧力，严禁一次性快速松绳；人员避开钢丝绳回弹、甩动范围。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：安装全程巷道顶板、两帮支护完好，无浮矸危岩；巷道通风正常，作业区域照明充足；设备安装下方设置警戒，悬挂警示牌，禁止无关人员通行逗留。","2.设备（工具）确认：手拉葫芦、扳手、绳卡、安全带、吊具、钢丝绳等齐全完好；吊具无裂纹、断丝、变形。","3.人员确认：作业人员必须持证上岗，身体状态良好，无疲劳作业、酒后作业、带病作业情况，情绪稳定，劳动防护用品穿戴到位，具备现场作业条件。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场视野开阔的安全主控区域，无视线遮挡，远离钢丝绳弹甩、设备构件摆动风险的安全区域，全程统筹作业流程，全程紧盯钢丝绳拆装、起吊、环节不得擅自离岗，及时制止和纠正“三违”行为。","2.机修工/辅助工/电工：站在钢丝绳侧面安全区域，与钢丝绳摆动、回弹区域保持安全距离，严禁站在钢丝绳直线受力方向、绳头正前方、起吊物正下方；多人抬运、起吊时人员两侧错开站位；释放钢丝绳张紧力时人员不得站在钢丝绳内侧。"]},{"t":"五、标准化作业流程","p":["1.前期准备工作：","（1）备用工具准备：班组长负责准备5T/3T/1T手拉葫芦各1个、扳手1套、大锤1个、安全带1个、吊具2套、卡扣、钢丝绳、风动工具、运输车辆等。","（2）所有参与人员贯彻学习安全技术措施。","（3）安全确认：跟班队长、班组长负责第三大项（作业条件安全确认）内容。","（4）班组长负责隐患整改闭环。","2.拆除作业步骤：","（1）现场负责人指定专人负责现场封闭警戒。","（2）现场负责人指定专人负责现场敲帮问顶。","（3）架空乘人装置停电、闭锁、挂牌、上锁、检查瓦斯、验电、放电 → 拆除线缆、电器设备并分类回收。","（4）拆除全部吊椅集中回收","（5）钢丝绳缓慢释放张紧力、卷绳回收 → 搭设高空作业平台 →  平稳吊装、下放驱动、尾轮设备至转运车辆捆绑固定 → 分段拆除托压绳轮 → 轮组分段下放转运装车 → 清点全部零部件分类码放","（6）现场清理、工具清点、现场验收（跟班队长负责确认）。"]},{"t":"六、作业质量标准","p":["1.电气系统拆除：线缆分段规整盘卷，防爆接线盒密封配件单独收纳，接地扁铁完整回收，线缆严禁随意剪断、丢弃；开关、电控设备避免磕碰损坏。","2.钢丝绳：钢丝绳分段盘绕回收。","3.托压绳轮、吊椅构件：拆解时轻拆轻卸，轮体、吊椅挂钩无磕碰变形。","4.驱动部、尾轮主机：平稳吊装下放，严禁撬砸、磕碰，电机、减速机、制动装置无碰撞损坏。","5.承重钢梁：拆解避免暴力敲击造成变形开焊，弯曲。","6.螺栓、卡扣、小型配件：按规格分类存放，杜绝丢失、遗落巷道。"]},{"t":"七、安全管控措施","p":["1.电气作业管控：严格执行上级供电开关停电、闭锁、挂牌、上锁，检查瓦斯，并进行验电、放电后拆除线缆。","2.高空作业管控：高空作业必须搭设稳固作业平台，登高超过2米时全程佩戴安全带；扳手、绳卡等小件工具严禁抛掷物料。","3.起吊作业管控：吊装吊点提前检查确认完好，吊具每次作业前检查，严禁超载吊装；多台葫芦同步起吊必须同起同落，防止零部件偏斜滑落。","4.钢丝绳松放管控：松绳前使用不少于 2 道专用绳卡锁死钢丝绳，安排专人观察绳体状态，松放速度均匀缓慢。","5.现场警戒管控：拆除全程封闭作业区域，设置警戒栏，严禁无关人员随意进入作业区域。","6.构件转运堆放管控：驱动、尾轮主机落地后直接放置专用材料车，使用钢丝绳捆绑牢固；横梁、轮组沿巷道一侧分层码放，配套防倒绳固定，防止滚动、倾倒伤人。","7.验收闭环管控：作业完成后，班组自检、验收，所有隐患当日清零归档。"]}]}],"w":2397,"cn":3,"sn":12},{"c":"YS-B-06","n":"无极绳绞车安装","t":"YS-B-06 无极绳绞车安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下无极绳绞车整套设备安装作业行为，统一主机、张紧装置、梭车、轮组、尾轮、电控系统全工序施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝起重伤害、设备倾倒、钢丝绳弹甩、跑车挤压、触电、物体打击、片帮掉矸等安全事故，提升井下无极绳运输系统安装施工安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有无极绳绞车安装全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：机修工、辅助工、电工、班组长、安检员、运输技术员"]},{"t":"二、核心职责","p":["队长：安装作业整体统筹、人员调配、考核管理。","安全技术副队长：安装措施编制、技术交底、隐患督办、模块优化。","跟班副队长：安装期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","机修工/电工/辅助工：严格遵照模块化流程完成地基开挖（浇筑）、设备吊装、机械装配、电气接线、设备调试、现场清理作业，规范佩戴劳保用品，杜绝违章操作。","安检员：作业期间巡查监督，制止违章、闭环隐患。","运输技术员：现场技术指导、过程监督。"]}]},{"t":"第三章 无极绳绞车安装模块","s":[{"t":"一、模块概述","p":["模块编号：YS-B-06","模块名称：无极绳绞车安装","设备型号：SQ32/30Y、SQ80/75B","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊重物挤压、坠落伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.电源接线漏电触电伤人：接线前切断上级供电电源，执行停电、闭锁、挂牌、上锁后方可开展接线施工。","5.主机、张紧装置、尾轮固定不牢倾倒伤人：底座地脚螺栓、地锚安装齐全紧固，安装完成后复检稳固性，未确认固定到位严禁穿绳试运转。","6.压绳轮、托绳轮安装错位导致钢丝绳脱槽弹甩伤人：轮组严格按设计间距、高度定位，安装完成逐组检查限位装置。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业现场无杂物、无积水、无油污，作业平台牢固可靠；巷道顶板、两帮支护完好，无浮矸危岩；巷道通风正常，作业区域照明充足；作业区域设置警戒隔离栏，禁止无关人员通行逗留。","2.设备（工具）确认：手拉葫芦、扳手、安全带、吊具、钢丝绳等齐全完好；吊具无裂纹、变形。","3.人员确认：作业人员必须持证上岗，身体状态良好，无疲劳作业、酒后作业、带病作业情况，情绪稳定，劳动防护用品穿戴到位，具备现场作业条件。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场视野开阔的安全主控区域，远离钢丝绳牵引、弹甩路径，全程统筹作业流程，不得擅自离岗、进入作业危险区。","2.安全监护人：定点站在作业核心危险区域旁，无视线遮挡，全程紧盯钢丝绳拆装、起吊牵引、地锚固定环节，及时制止和纠正“三违”行为。","3.无极绳绞车司机/跟车（信号）工：固定在设备操作区域安全站位，操作期间专注设备操控，严禁离岗操作，严格听从班组长或指定的专人统一指令，杜绝误操作。","4.机修工/辅助工：站在钢丝绳侧面安全区域，与钢丝绳摆动、回弹区域保持安全距离，严禁站在钢丝绳直线受力方向、绳头正前方、起吊物正下方；多人抬运、起吊尾架时人员两侧错开站位，禁止正面相对；张紧调试阶段人员远离绳道两侧，不得站在钢丝绳内侧。"]},{"t":"五、标准化作业流程","p":["1.前期准备工作：","（1）备用工具准备：班组长负责准备5T/3T/1T手拉葫芦各1个、扳手1套、大锤1个、安全带1个、吊具2套、卡扣、钢丝绳、风动工具、建工材料、地基预埋件、主机底盘等。","（2）所有参与人员贯彻学习安全技术措施。","（3）安全确认：班组长负责第三大项（作业条件安全确认）内容。","（4）班组长负责隐患整改闭环。","2.安装作业步骤：","（1）30梭车安装步骤","①现场负责人指定专人负责现场封闭警戒。","②现场负责人指定专人负责现场敲帮问顶。","③班组长负责标定主机、张紧装置、压绳轮、尾轮等地基位置→按照设计标准逐个开挖地基坑→逐个稳好主机、张紧装置、压绳轮、尾轮并进行浇筑→根据巷道实际情况安装拖压绳轮装置→稳机尾尾轮装置。","④安装控制开关、保护装置、信号装置等电控设备。","⑤主机试运行确认信号装置、保护装置、制动装置灵敏可靠。","⑥敷设钢丝绳:班组长负责确认起吊设备完好，找好起吊点挂好吊具→将钢丝绳盘试吊、起吊离地10—20cm→人工拉钢丝绳全部盘至储绳滚筒（根据巷道长度预留需用钢丝绳）→将预留的钢丝绳绳头穿过板车梭子往机尾方向铺设→绕过尾轮后将钢丝绳拉至机头并在滚筒上缠绕3圈→通过张紧轮反向缠绕滚筒另一侧3圈→绳头通过主压绳轮至板车前方穿绳梭子、穿过保险叉、桃形环并进行固定→班组长负责重新进行确认。","⑦紧绳：采用手拉葫芦一侧固定在板车上，另一侧用圆环链、绳卡固定住里侧钢丝绳→缓慢拉动手拉葫芦使钢丝绳张紧并将绳头穿过桃形环进行固定→使用绳卡（不少于4个）将板车上两侧绳头进行交叉固定→安装无人跟车视频监控系统→安装防护装置、消防设施、制度牌板→班组长负责重新进行确认。","⑧试运行：试验保护装置、信号装置确认灵敏可靠→打点运行车辆→班组长通过无人跟车视频监控系统观察车辆运行情况→试运行全程将板车停至正常停车位→跟班队长负责重新进行确认。","⑨机电运输科组织进行验收，验收合格后下发准运证。","（2）80梭车安装步骤","①现场负责人指定专人负责现场封闭警戒。","②现场负责人指定专人负责现场敲帮问顶。","③班组长负责标定主机、张紧装置、尾轮等地基位置→按照设计标准逐个开挖地基坑→逐个稳好主机、张紧装置、尾轮并进行浇筑→根据巷道实际情况安装拖压绳轮装置→稳机尾尾轮装置。","④安装控制开关、保护装置、信号装置等电控设备。","⑤主机试运行确认信号装置、保护装置、制动装置灵敏可靠。","⑥敷设钢丝绳:班组长负责确认起吊设备完好，找好起吊点挂好吊具→将钢丝绳盘试吊、起吊离地10—20cm→人工拉钢丝绳全部盘至储绳滚筒（根据巷道长度预留需用钢丝绳）→将预留的钢丝绳绳头穿过板车梭子往机尾方向铺设→绕过尾轮后将钢丝绳拉至机头穿过张紧装置一侧，并在滚筒上缠绕3圈→通过主滚筒将绳头穿过张紧装置另一侧至板车前方穿绳梭子、穿过保险叉、桃形环并进行固定→班组长负责重新进行确认。","⑦紧绳：采用手拉葫芦一侧固定在板车上，另一侧用圆环链、绳卡固定住里侧钢丝绳→缓慢拉动手拉葫芦使钢丝绳张紧并将绳头穿过桃形环进行固定→使用绳卡（不少于4个）将板车上两侧绳头进行交叉固定→安装无人跟车视频监控系统→安装防护装置、消防设施、制度牌板→班组长负责重新进行确认。","⑧试运行：试验保护装置、信号装置确认灵敏可靠→打点运行车辆→班组长通过无人跟车视频监控系统观察车辆运行情况→试运行全程将板车停至正常停车位→跟班队长负责重新进行确认。","⑨机电运输科组织进行验收，验收合格后下发准运证。"]},{"t":"六、作业质量标准","p":["1.绞车底座与机体：底座无变形开裂，机体无磕碰损伤，减速机、制动器、液压站无渗漏；机体水平度符合要求。","2.地基：地基尺寸按说明书要求开挖、浇筑；预埋件、地脚螺栓、连接螺栓齐全紧固无松动。","3.轮组：托绳轮、压绳轮间距（确保钢丝绳距轨面高度不得超过20cm），变坡点处压绳轮不得少于4套，转动灵活，钢丝绳不磨巷道、不脱槽。","4.钢丝绳：绳卡数量、间距符合措施要求，无扭结、锈蚀、断丝；张紧力度均匀，无松弛现象。","5.电气系统：线缆敷设整齐吊挂，防爆外壳密封完好，无失爆；设备接地保护规范，操作按钮、声光报警信号、视频监控功能正常。","6.收尾：作业区域整洁无遗留工具、废料。"]},{"t":"七、安全管控措施","p":["1.电气作业管控：严格执行上级供电开关停电、闭锁、挂牌、上锁，整体验收合格前严禁送电。","2.高空吊装管控：高空作业必须搭设稳固作业平台，登高超过2米时全程佩戴安全带；扳手、绳卡等工具小件手递手传递，严禁抛掷工具、物料。","3.起吊作业管控：吊装吊点提前检查确认完好，吊具每班作业前检查，严禁超载吊装。","4.现场警戒管控：安装、试运行全程封闭作业区域，上、下车场入口及联巷口处设置警戒设施，非作业人员禁止进入。","5.试运转管控：安装完成后空载试运行，全程观察制动、轮组、钢丝绳、视频监控运行状态，出现异响、脱绳、视频卡顿等立即停机处置，故障未消除不得继续试车。","6.验收闭环管控：作业完成后，班组自检、验收，所有隐患当日清零归档。"]}]}],"w":3492,"cn":3,"sn":12},{"c":"YS-B-07","n":"无极绳绞车拆除","t":"YS-B-07无极绳绞车拆除模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下无极绳绞车主机、张紧装置、梭车、压绳轮组、尾轮等全套设施拆除作业行为，统一施工工序、风险防控、设备回收及验收标准，实现拆除作业流程标准化、操作规范化、风险全过程可控、隐患验收闭环管理，有效防范巷道片帮掉矸、起重挤压、设备倾倒、触电、跑车、钢丝绳弹甩、物体打击等安全事故，全面提升机电运输拆除作业安全管控水平与设备回收完好率，特编制本模块化管理方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有无极绳绞车拆除全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：辅助工、机修工、电工、班组长、安检员"]},{"t":"二、核心职责","p":["队长：拆除作业整体统筹、人员调配、考核管理。","安全技术副队长：拆除措施编制、技术交底、隐患督办、模块优化。","跟班副队长：拆除期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","电工/辅助工/机修工：严格按照模块化流程执行停电、验电、拆解、起吊、设备转运、现场清理作业，规范佩戴劳保用品，杜绝违章操作。","安检员：作业期间巡查监督，制止违章、闭环隐患。","运输技术员：现场技术指导、过程监督。"]}]},{"t":"第三章 无极绳绞车拆除模块","s":[{"t":"一、模块概述","p":["模块编号：YS-B-07","模块名称：无极绳绞车拆除","设备型号：SQ32/30Y、SQ80/75B","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊重物挤压、坠落伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.钢丝绳弹甩伤人：拆除前先对钢丝绳缓慢卸载张紧力，严禁快速松绳；松绳、拆绳时人员避开绳头回弹方向。","5.电气拆除触电伤人：先切断上级供电电源，执行闭锁、挂牌、上锁，验电、放电完成后方可拆解线缆。","6.轮组小件滚落伤人：拆解托绳轮、压绳轮时轻拿轻放，小件统一摆放。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业现场无杂物、无积水、无油污，作业平台牢固可靠；巷道顶板、两帮支护完好，无浮矸危岩；巷道通风正常，作业区域照明充足；作业区域设置警戒栏，禁止无关人员通行逗留。","2.设备（工具）确认：手拉葫芦、扳手、安全带、吊具、卡扣、钢丝绳等齐全完好；吊具无裂纹、变形；车辆完好、捆绑固定牢固。","3.人员确认：作业人员必须持证上岗，身体状态良好，无疲劳作业、酒后作业、带病作业情况，情绪稳定，劳动防护用品穿戴到位，具备现场作业条件。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场视野开阔的安全主控区域，远离钢丝绳牵引、弹甩路径，全程统筹作业流程，不得擅自离岗、进入作业危险区。","2.安全监护人：定点站在作业核心危险区域旁，无视线遮挡，全程紧盯钢丝绳拆装、起吊、环节，及时制止和纠正“三违”行为。","3.机修工/辅助工/电工：站在钢丝绳侧面安全区域，与钢丝绳摆动、回弹区域保持安全距离，严禁站在钢丝绳直线受力方向、绳头正前方、起吊物正下方；多人抬运、起吊时人员两侧错开站位；释放钢丝绳张紧力时人员不得站在钢丝绳内侧。","4.所有作业、管理人员必须站在支护完好、无坠物风险区域，严禁站立于起吊绞车正下方、钢丝绳受力绳道正前方、重物摆动范围之内。"]},{"t":"五、标准化作业流程","p":["1.前期准备工作：","（1）备用工具准备：班组长负责准备5T/3T/1T手拉葫芦各1个、扳手1套、大锤1个、安全带1个、吊具2套、卡扣、钢丝绳、风动工具、运输车辆等。","（2）所有参与人员贯彻学习安全技术措施。","（3）安全确认：班组长负责第三大项（作业条件安全确认）内容。","（4）班组长负责隐患整改闭环。","2.拆除作业步骤：","（1）30梭车拆除步骤","①现场负责人指定专人负责现场封闭警戒。","②现场负责人指定专人负责现场敲帮问顶。","③释放无极绳绞车钢丝绳张紧力","④拆除无极绳绞车供电电源","⑤回收板车：拆除板车两侧钢丝绳绳头→将钢丝绳全部盘至板车储绳滚筒内→拆除板车梭子→将板车推离作业区域。","⑥拆除主机：将地基螺栓全部拆除→利用风镐破除主机与地面贴合面→选择起吊点，悬挂起吊工具→使用圆环链兜住主机进行试吊→起吊设备并装车→班组长确认设备装车、捆绑固定完好情况。","⑦其他附属设施拆除：逐个拆除液压站、氮气包、压绳轮、张紧轮等→人工搬运至运输车辆并进行捆绑固定→班组长确认设备装车、捆绑固定完好情况。","（2）80梭车拆除步骤","①现场负责人指定专人负责现场封闭警戒。","②现场负责人指定专人负责现场敲帮问顶。","③使用道木将配重块支起释放无极绳绞车钢丝绳张紧力","④拆除无极绳绞车供电电源","⑥回收板车：拆除板车两侧钢丝绳绳头→将钢丝绳全部盘至板车储绳滚筒内→拆除板车梭子→将板车推离作业区域。","⑦拆除张紧装置：将配重块抬运至指定地点→选择起吊点，悬挂起吊工具→使用圆环链兜住张紧架进行试吊（从上往下拆除）→起吊设备并装车→班组长确认设备装车、捆绑固定完好情况。","⑧拆除主机：将地基螺栓全部拆除→逐个拆除减速机、电机、滚筒与底座之间固定螺栓→选择起吊点，悬挂起吊工具→使用圆环链兜住设备各部件进行试吊→起吊设备并装车→利用风镐破除主机底座与地面贴合面→起吊底座并装车→班组长确认设备装车、捆绑固定完好情况。","⑨逐个拆除拖压轮组。","⑩现场清理、设备清点、闭环验收。"]},{"t":"六、作业质量标准","p":["1.电气部件拆除：线缆整齐盘绕，防爆接线盒、开关保护好防爆面，无磕碰划伤。","2.固定设施拆除：托压绳轮、尾轮分类码放；梭车、绞车底座无强制撬砸变形，连接销轴、螺栓统一收集，无丢失损坏。","3.地基处理：拆除地锚、地脚螺栓后，及时平整地基，保证巷道地面平整。","4.钢丝绳回收：均匀盘卷，去除杂物，绳头固定牢固，无乱绳、散丝散落。","5.收尾：作业区域整洁无遗留工具、废料。"]},{"t":"七、安全管控措施","p":["1.电气作业管控：严格执行上级供电开关停电、闭锁、挂牌、上锁，并进行验电、放电后拆除线缆。","2.高空作业管控：高空作业必须搭设稳固作业平台，登高超过2米时全程佩戴安全带；扳手、绳卡等工具小件手递手传递，严禁抛掷工具、物料。","3.起吊作业管控：吊装吊点提前检查确认完好，吊具每班作业前检查，严禁超载吊装。","4.现场警戒管控：作业区域前后10m范围设置警戒设施，非作业人员禁止随意进入。","5.设备转运管控：装车前车辆前后固定牢固，设备主机及其附属设施捆绑不得少于2道，且绞紧上劲。","6.验收闭环管控：作业完成后，班组自检、验收，所有隐患当日清零归档。"]}]}],"w":2694,"cn":3,"sn":12}],"os":"二","rn":"中风险","rc":"橙","rg":"B","n":7,"label":"中风险 · 橙色 B段"},{"t":"三、低风险-蓝色-C段（5项）","lv":"C","m":[{"c":"YS-C-01","n":"回柱（双速）绞车安装","t":"YS-C-01 回柱（双速）绞车安装模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范回柱（双速）绞车安装作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝作业过程中高空坠落、物体打击、设备倾倒、起重伤害等安全事故，提升施工期间安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有回柱（双速）绞车安装全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：轨道工、双速（回柱）绞车司机、信号工、辅助工、电工、班组长、安检员"]},{"t":"二、核心职责","p":["队长：安装作业整体统筹、人员调配、考核管理。","安全技术副队长：安装措施编制、技术交底、隐患督办、模块优化。","跟班副队长：安装期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","轨道工/双速（回柱）绞车司机/信号工/电工/辅助工：严格遵照模块化流程完成设备固定（地基开挖与浇筑、地锚穿丝固定、四压两戗固定）、设备吊装、机械装配、电气接线、设备调试、现场清理作业，规范佩戴劳保用品，杜绝违章操作。","安检员：作业期间巡查监督，制止违章、闭环隐患。"]}]},{"t":"第三章 回柱（双速）绞车安装模块","s":[{"t":"一、模块概述","p":["模块编号：YS-C-01","模块名称：回柱（双速）绞车安装","设备型号：JSDB-6、JH-8、JH-12、JH-14、JSDB-16、JH-20","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊重物挤压、坠落伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.地基开挖距离巷道底帮低于0.3m造成棚腿不实下沉：提前对地基波及区域内棚腿进行联锁加固。","5.电源接线漏电触电伤人：接线前切断上级供电电源，执行停电、闭锁、挂牌、上锁后方可开展接线施工。","6.绞车固定不牢伤人：底座地脚螺栓、地锚、压柱、戗柱安装齐全紧固，安装完成后复检稳固性，未加固到位严禁试运转。","7.气动管路连接不规范甩伤人员：气管连接必须用专用工具进行连接。","8.保险设施动作不灵敏造成车辆掉道：每班运行前重新逐个试验保险设备，做到不完好不运行。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业现场无杂物、无积水、无油污，作业平台牢固可靠；巷道顶板、两帮支护完好，无浮矸危岩；起吊环境完好；巷道通风正常，作业区域照明充足；起吊环境完好；作业区域设置警戒，禁止无关人员随意通行逗留。","2.设备（工具）确认：手拉葫芦、扳手、安全带、吊具、卡扣、钢丝绳等齐全完好；吊具无裂纹、变形。","3.人员确认：作业人员必须持证上岗，身体状态良好，无疲劳作业、酒后作业、带病作业情况，情绪稳定，劳动防护用品穿戴到位，具备现场作业条件。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场退路畅通的安全区域，无视线遮挡，远离顶板巷帮离层掉落、钢丝绳牵引、弹甩路径，全程统筹作业流程，紧盯起重牵引、高空作业等环节，不得擅自离岗，及时制止和纠正“三违”行为。","2.双速（回柱）绞车司机/信号工：固定在设备操作区域安全站位，操作期间专注设备操控，严禁探头观望、离岗操作，严格听从指挥人员统一指令，杜绝误操作。","3.轨道工/辅助工/电工：严禁站在起重物下方及摆动范围内、地基坑附近危险区域。"]},{"t":"五、标准化作业流程","p":["1.前期准备工作：","（1）备用工具准备：班组长负责准备5T/3T手拉葫芦1个、地锚4根、穿丝2根、压柱4根、戗柱2根、扳手1套、安全带1个、吊具2套、岩石钻1台、钻杆1根、卡扣、钢丝绳等。","（2）所有参与人员贯彻学习绞车设计审批单。","（3）安全确认：班组长负责第三大项（作业条件安全确认）内容。","（4）班组长负责隐患整改闭环。","2.安装作业步骤：","（1）现场负责人指定专人负责现场封闭警戒。","（2）现场负责人指定专人负责现场敲帮问顶。","（3）班组长负责绞车固定工作。","①浇筑地基固定方式安装步骤：班组长负责加固巷帮→开挖地基（按照绞车尺寸开挖地基）→人工搬运固定底座→浇筑地基→起吊、固定主机→班组长负责检查确认主机固定情况。","②地锚穿丝固定方式安装步骤：班组长负责起吊、摆放绞车→采用岩石钻打设地锚孔→安装地锚、穿丝→班组长负责检查确认主机固定情况。","③四压两戗固定方式安装步骤：班组长负责起吊、摆放绞车→逐个安装压柱、戗柱→班组长负责检查确认主机固定情况。","（4）由班组长指定信号装置、控制箱安装位置","（5）电工负责连接绞车电源、安装信号装置。","（6）班组长指定专人空载启动绞车将钢丝绳缠绕至绞车滚筒→制作提升绳头和保险绳→安装防护网→班组长负责对绞车整体安装情况进行验收。","（7）班组长负责“一坡三挡”安装工作。","①U型刚巷道“一坡三挡”安装步骤：","安装保险档：开挖保险档安装坑→将保险档放至在安装坑内→采用压板螺栓固定在轨道上→安装保险档控制箱→连接气动管路（一段连接在主气管路上，另一端连接在保险档上）→班组长负责对安装情况进行确认。","安装保险杠：班组长负责确定横梁安装位置→指定专人搭设工作平台→利用风镐或手稿掏槽→安装横梁并使用u型螺栓固定→将保险杠用u型螺栓固定在横梁上→安装保险杠控制箱→连接气动管路（一段连接在主气管路上，另一端连接在保险杠上）→班组长负责对安装情况进行确认","②工字钢巷道“一坡三挡”安装步骤：","安装保险档：开挖保险档安装坑→将保险档放至在安装坑内→采用压板螺栓固定在轨道上→安装保险档控制箱→连接气动管路（一段连接在主气管路上，另一端连接在保险档上）","安装保险杠：指定专人搭设工作平台→使用u型螺栓将保险杠固定在工字钢梁上→安装保险杠控制箱→连接气动管路（一段连接在主气管路上，另一端连接在保险杠上）→班组长负责对安装情况进行验收","③锚喷巷道“一坡三挡”安装步骤：","安装保险档：开挖保险档安装坑→将保险档放至在安装坑内→采用压板螺栓固定在轨道上→安装保险档控制箱→连接气动管路（一段连接在主气管路上，另一端连接在保险档上）","安装保险杠：班组长负责确定横梁安装位置→指定专人搭设工作平台→利用风镐或手稿掏槽→安装横梁并使用混凝土固定→将保险杠用u型螺栓固定在横梁上→安装保险杠控制箱→连接气动管路（一段连接在主气管路上，另一端连接在保险杠上）→班组长负责对安装情况进行确认","（8）由班组长负责重新对绞车、“一坡三挡”、信号装置进行试验确认。","（9）由班组长负责现场清理、设备清点、闭环验收。"]},{"t":"六、作业质量标准","p":["1.绞车底座与机体：底座无变形、开裂，机体无磕碰损伤，防护设施齐全完好，机体水平度符合要求；绞车滚筒中心与轨道中心相同。","2.地基：地基尺寸按说明书要求开挖、浇筑；地脚螺栓、连接螺栓齐全紧固无松动。","3.压柱、戗柱：四压两戗齐全，顶紧顶板无间隙，柱头加防滑木垫，支撑牢固可靠，无歪柱、虚顶现象；四压两戗安装防倒绳。","4.地锚：地锚垂直固定在巷道地板上，地锚深度不得小于1.2m。","5.钢丝绳：滚筒处钢丝绳绳头必须用压板固定在滚筒上；滚筒钢丝绳必须排列整齐，滚筒上至少缠绕三圈钢丝绳；提升绳头钢丝绳直径15.5mm钢丝绳绳卡数量为3个（不包含缓冲绳绳卡），提升绳头钢丝绳直径18.5mm或21.5mm钢丝绳绳卡数量为4个（不包含缓冲绳绳卡）；直径26mm钢丝绳绳卡数量为5个（不包含缓冲绳绳卡）；U型螺栓扣在钢丝绳的尾段上，钢丝绳卡不得在钢丝绳上交替布置；15.5mm钢丝绳绳卡间距在95mm—105mm之间，18.5mm钢丝绳绳卡间距在115mm—125m之间，21.5mm钢丝绳绳卡间距在130mm—150mm之间，26mm钢丝绳绳卡间距在160mm—180mm之间，最后一个绳卡距绳头长度不得小于140mm；安全弯长度不得小于500mm；","6.一坡三挡：全部为远程气动控制，齐全（1个保险档，两个保险杠）、完好且动作灵敏可靠；保险档安装在上部车场变坡点处，上部保险杠安装在距上变坡点一列车长度位置，下部保险杠安装在距下变坡点2m位置。","7.信号装置：齐全（两个信号操作按钮、至少两个行车红灯）完好且灵敏可靠；操作按钮加装闭锁装置。","8.电气系统：线缆敷设整齐吊挂，防爆外壳密封完好，无失爆；设备接地保护规范，操作按钮、声光报警信号功能正常。","9.收尾：作业区域整洁无遗留工具、废料。"]},{"t":"七、安全管控措施","p":["1.电气作业管控：严格执行上级供电开关停电、闭锁、挂牌、上锁，整体验收合格前严禁送电。","2.高空吊装管控：高空作业必须搭设稳固作业平台，登高超过2米时全程佩戴安全带；扳手、绳卡等工具小件手递手传递，严禁抛掷工具、物料。","3.起吊作业管控：吊装吊点提前检查确认完好，吊具每次作业前检查，严禁超载吊装。","4.现场警戒管控：作业区域前后10m范围设置警戒设施，非作业人员禁止随意进入。","5.试运转管控：安装完成后空载试运行，专人检查滚筒、制动有无异响、卡阻、磨绳等，发现异常立即停机处理。","6.验收闭环管控：作业完成后，运输队班组长与使用单位管理人员、安检员持表联合验收，所有隐患当日清零归档。"]}]}],"w":3737,"cn":3,"sn":12},{"c":"YS-C-02","n":"回柱（双速）绞车拆除","t":"YS-C-02 回柱（双速）绞车拆除模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范回柱（双速）绞车拆除作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝作业过程中高空坠落、物体打击、设备倾倒、起重伤害等安全事故，提升施工期间安全保障能力与工程质量，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有回柱（双速）绞车拆除全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：轨道工、辅助工、电工、班组长、安检员"]},{"t":"二、核心职责","p":["队长：拆除作业整体统筹、人员调配、考核管理。","安全技术副队长：拆除措施编制、技术交底、隐患督办、模块优化。","跟班副队长：拆除期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","电工/辅助工：严格按照模块化流程执行停电、验电、拆解、起吊、设备转运、现场清理作业，规范佩戴劳保用品，杜绝违章操作。","安检员：作业期间巡查监督，制止违章、闭环隐患。"]}]},{"t":"第三章 回柱（双速）绞车拆除模块","s":[{"t":"一、模块概述","p":["模块编号：YS-C-02","模块名称：回柱（双速）绞车拆除","设备型号：JSDB-6、JH-8、JH-12、JH-14、JSDB-16、JH-20","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊重物挤压、坠落伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.压柱、戗柱拆除瞬间倾倒伤人：安排两人配合作业，一人扶好单体柱，一人进行卸压工作，作业期间保持退路通畅。","5.电气拆除触电伤人：先切断上级供电电源，执行闭锁、挂牌、上锁，验电、放电完成后方可拆解线缆。","6.设备装车重心偏载、封车不牢设备脱落伤人：设备运输前及到达每个转载点后，重新确认设备固定情况，确认完好后方可运输。","7.提升绳头固定不牢运输期间剐蹭沿途车辆及设备造成车辆掉道：运输前及到达每个转载点后重新确认提升绳头固定情况，确认完好后方可运输。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业现场无杂物、无积水、无油污，作业平台牢固可靠；巷道顶板、两帮支护完好，无浮矸危岩；起吊环境完好；巷道通风正常，作业区域照明充足；作业区域设置警戒栏，禁止无关人员通行逗留。","2.设备（工具）确认：手拉葫芦、扳手、安全带、吊具、卡扣、钢丝绳等齐全完好；吊具无裂纹、变形；车辆完好、捆绑固定牢固。","3.人员确认：作业人员必须持证上岗，身体状态良好，无疲劳作业、酒后作业、带病作业情况，情绪稳定，劳动防护用品穿戴到位，具备现场作业条件。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场退路畅通的安全区域，无视线遮挡，远离顶板巷帮离层掉落、起吊设备坠落区域，全程统筹作业流程，紧盯起重牵引、高空作业等环节，不得擅自离岗，及时制止和纠正“三违”行为。","2.轨道工/辅助工/电工：严禁站在起重物下方及摆动范围内、地基坑附近危险区域。"]},{"t":"五、标准化作业流程","p":["1.前期准备工作：","（1）备用工具准备：班组长负责准备5T/3T/1T手拉葫芦1个、扳手1套、大锤1个、安全带1个、吊具2套、卡扣、钢丝绳等。","（2）所有参与人员贯彻学习零星工程作业台账。","（3）安全确认：班组长负责第三大项（作业条件安全确认）内容。","（4）班组长负责隐患整改闭环。","2.拆除作业步骤：","（1）现场负责人指定专人负责现场封闭警戒。","（2）现场负责人指定专人负责现场敲帮问顶。","（3）现场负责人指定专人负责将钢丝绳盘好。","（4）现场负责人指定专人负责拆除电源、信号装置。","（5）班组长负责绞车拆除工作。","①浇筑地基方式拆除步骤：班组长负责搭设工作平台→悬挂吊具→逐个拆除绞车底座固定螺栓→用圆环链（直径不小于15.5mm钢丝绳圈）兜住绞车重心并试吊→起吊主机、底座装车→固定绳头→班组长负责检查确认主机装车、封车情况。","②地锚穿丝方式拆除步骤：班组长负责搭设工作平台→悬挂吊具→逐个拆除穿丝、地锚→用圆环链（直径不小于15.5mm钢丝绳圈）兜住绞车重心并试吊→起吊主机装车→固定绳头→班组长负责检查确认主机装车、封车情况。","③四压两戗方式拆除步骤：班组长负责搭设工作平台→拆除单体柱防倒绳→逐个拆除单体柱→悬挂吊具→用圆环链（直径不小于15.5mm钢丝绳圈）兜住绞车重心并试吊→起吊主机装车→固定绳头→班组长负责检查确认主机装车、封车情况。","（6）班组长负责“一坡三挡”拆除工作。","①U型钢巷道、锚喷巷道“一坡三挡”拆除步骤：","拆除保险档：关闭气源并进行泄压→拆除、回收气动管路→拆除保险档控制箱→开挖保险档安装坑→拆除保险档压板螺栓→将保险档移出→平整地面→班组长负责对拆除、回收情况进行确认。","拆除保险杠：关闭气源并进行泄压→班组长负责搭设工作平台→拆除、回收气动管路→拆除保险杠控制箱→拆除保险杠连接柱销→将保险杠落地→拆除保险杠u型固定螺栓→拆除保险杠固定架→班组长负责对拆除、回收情况进行确认。","②工字钢巷道“一坡三挡”拆除步骤：","拆除保险档：关闭气源并进行泄压→拆除、回收气动管路→拆除保险档控制箱→开挖保险档安装坑→拆除保险档压板螺栓→将保险档移出→平整地面→班组长负责对拆除、回收情况进行确认。","拆除保险杠：关闭气源并进行泄压→班组长负责搭设工作平台→拆除、回收气动管路→拆除保险杠控制箱→拆除保险杠连接柱销→将保险杠落地→逐个拆除气缸、牵引钢丝绳、滑轮组→拆除保险杠u型固定螺栓→拆除保险杠固定架→班组长负责对拆除、回收情况进行确认。","（7）班组长负责现场清理、设备清点、闭环验收。"]},{"t":"六、作业质量标准","p":["1.电气部件拆除：线缆整齐盘绕；防爆接线盒、开关、信号装置外观无磕碰划伤。","2.固定设施拆除：单体柱、穿丝、地锚逐根拆卸，轻放转运，无丢失、无折断损坏。","3.地基处理：拆除地锚、地脚螺栓、保险档后，及时平整地面，保证巷道地面平整。","4.钢丝绳回收：均匀盘卷，去除杂物，绳头固定牢固，无乱绳、散落。","5.保险设施回收：拆除后平整摆放在巷道合适位置，不得影响行人、行车。","6.收尾：作业区域整洁无遗留工具、废料。"]},{"t":"七、安全管控措施","p":["1.电气作业管控：严格执行上级供电开关停电、闭锁、挂牌、上锁，并进行验电、放电后拆除线缆。","2.高空作业管控：高空作业必须搭设稳固作业平台，登高超过2米时全程佩戴安全带；扳手、绳卡等工具小件手递手传递，严禁抛掷工具、物料。","3.起吊作业管控：吊装吊点提前检查确认完好，吊具每次作业前检查，严禁超载吊装。","4.现场警戒管控：作业区域前后10m范围设置警戒设施，非作业人员禁止随意进入。","5.设备转运管控：装车前车辆前后固定牢固，设备主机捆绑不少于3道（8吨及以下绞车捆绑不少于2道），且绞紧上劲。","6.验收闭环管控：作业完成后，班组自检、验收，所有隐患当日清零归档。"]}]}],"w":2851,"cn":3,"sn":12},{"c":"YS-C-03","n":"轨道（道岔）铺设、拆除","t":"YS-C-03 轨道（道岔）铺设、拆除模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为矿井轨道（道岔）铺设及拆除作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝重物挤压、轨道滑移、钢轨（道岔）倾倒、物体打击、滑倒摔伤、顶板片帮伤人等安全事故，全面提升轨道工程施工安全保障能力与铺设质量，特制定本模块化作业方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有轨道（道岔）铺设及拆除全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：班组长、轨道工、辅助工、安检员、运输技术员"]},{"t":"二、核心职责","p":["队长：铺设、拆除工程整体统筹、人员调配、考核管理。","安全技术副队长：铺设、拆除工程措施编制、技术交底、隐患督办、模块优化。","跟班副队长：铺设、拆除期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","轨道工/辅助工：严格按照模块化流程路基修整、轨枕铺设、道岔对接、紧固扣件、杂物清理，规范佩戴全套劳保用品，杜绝违章操作。","安检员：作业期间安全巡查监督，制止违章、闭环隐患。","运输技术员：现场技术指导、过程监督。"]}]},{"t":"第三章 轨道（道岔）铺设、拆除模块","s":[{"t":"一、模块概述","p":["模块编号：YSC-03","模块名称：轨道（道岔）铺设、拆除","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊重物挤压、坠落伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.钢轨抬运绊倒伤人：钢轨码放平稳；多人抬运统一口令、同步起落，禁止单人搬运重型钢轨。","5.撬杠、起道器等机具使用不当碰伤手脚：起道器对准轨道固定牢固，人员避开机具回弹方向，多人配合作业保持安全间距。","6.路基松软、轨枕悬空造成轨道变形、车辆掉道：铺设必须平整夯实路基，轨枕下方垫实无悬空，重载运行后，重新进行支实。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业现场无杂物、无积水，作业平台完好；巷道顶板、两帮支护完好，无浮矸危岩；巷道通风正常，作业区域照明充足；作业区域设置警戒设施，禁止无关人员通行逗留。","2.设备（工具）确认：不小于3T手拉葫芦、捏轨器、起道器、扳手、风动工具、安全带、吊具、卡扣、圆环链（直径不小于18mm）等齐全完好；吊具无裂纹、变形。","3.人员确认：作业人员劳保穿戴整齐，必须持证上岗，身体状态良好，无疲劳作业、酒后作业、带病作业情况，情绪稳定。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场退路畅通的安全区域，无视线遮挡，远离顶板巷帮离层掉落、道岔起吊正下方、斜巷下坡侧、撬杠回弹方向、两车缝隙之间区域，全程统筹作业流程，紧盯起重牵引、高空作业等环节，不得擅自离岗，及时制止和纠正“三违”行为。","2.轨道工/辅助工：严禁站在道岔起吊正下方、斜巷下坡侧、撬杠回弹方向、两车缝隙之间；多人抬运钢轨时两侧人员错开站位，禁止正面相对，严格听从班组长或指定的专人统一指令，杜绝误操作。"]},{"t":"五、标准化作业流程","p":["1.前期准备工作：","（1）备用工具准备：跟班队长负责准备不小于3T手拉葫芦1个、捏轨器1个、起道器1个、扳手1套、风动工具1套、安全带1个、吊具、卡扣、圆环链（直径不小于18mm）等齐全完好；吊具无裂纹、变形等。","（2）所有参与人员贯彻学习安全技术措施或零星工程台账。","（3）安全确认：跟班队长、班组长、安检员负责第三大项（作业条件安全确认）内容。","（4）跟班队长、班组长负责隐患整改闭环。","2.轨道铺设作业步骤：","（1）现场负责人指定专人负责现场设置警戒。","（2）现场负责人指定专人连接风镐，班组长负责对风镐连接完好情况进行确认→安排人员清理轨道地基。","（3）抬运轨道，巷道内散轨道及枕木→按照巷道中腰线规范摆放轨道→按照标准固定枕木→安装道夹板及螺栓→多根轨道铺设完毕后重新进行校正→班组长负责验收。","3.轨道拆除作业步骤：","（1）现场负责人指定专人负责现场设置警戒。","（2）拆除道夹板及螺栓→采用起道器逐根将轨道顶起→抬运轨道并装车班组长负责验收。","（3）班组长负责平整路面，现场清理、设备清点、闭环验收。","4.道岔铺设作业步骤：","（1）现场负责人指定专人负责现场设置警戒。","（2）现场负责人指定专人连接风镐，班组长负责对风镐连接完好情况进行确认。","（3）现场负责人安排人员清理道岔地基。","（4）选取起吊点、连接吊具→用圆环链兜住道岔、试吊找平衡→起吊道岔距车辆高度约10-20cm→撤走车辆→平稳下放道岔至地面→拆除顶部吊具→重新选取吊点→调整道岔至安装位置并支撑牢固→轨道打眼、连接→安装气动拨道装置，确认控制器操作方向与尖轨开合方向一致→班组长负责验收。","5.道岔拆除作业步骤：","（1）现场负责人指定专人负责现场设置警戒。","（2）现场负责人指定专人连接风镐，班组长负责对风镐连接完好情况进行确认。","（3）关闭气动装置气源，气动装置泄压→拆除气动拨道装置→断开与普通轨连接→选取起吊点、连接吊具→用圆环链兜住道岔→将道岔平移至装车点→重新选取起吊点、连接吊具→试吊找平衡→起吊道岔距车辆高度约10-20cm→装车、固定→班组长负责确认道岔固定情况。","（4）班组长负责平整路面，现场清理、设备清点、闭环验收。"]},{"t":"六、作业质量标准","p":["1.路基基础：路基平整夯实，无淤泥、空洞、积水。","2.轨道：平直无扭曲、破损、开焊。","3.轨道连接：道道夹板完好无破损，采用专用螺栓固定，螺栓方向交叉布置，螺母固定牢固。","4.枕木：枕木完好无开焊、破损，枕木间距为600mm，误差不得超过±50mm。","5.道岔安装质量：道岔整体无变形，尖轨与基本轨密贴无间隙；道岔所有螺栓、扣件紧固齐全，无缺失松动；护轨、辙岔安装位置准确。","6.控制系统：道岔控制箱安装位置合理，控制器操作方向与尖轨开合方向一致，动作灵敏可靠，气动管路敷设平直，无漏气、开裂现象。","7.巷道现场：作业完成后无散落螺栓配件，作业区域浮矸杂物全部清理干净；零部件码放整齐，不堵塞通风、行人通道。"]},{"t":"七、安全管控措施","p":["1.巷道顶板帮部管控：每班作业前必须敲帮问顶，危岩活矸处理完毕方可施工。","2.风动工具管控：气管连接必须用U型卡及开口销固定牢固，先连接，再使用，先排气，后拆除。","3.高空吊装管控：高空作业必须搭设稳固作业平台，登高超过2米时全程佩戴安全带；工具小件手递手传递，严禁抛掷物料。","4.起吊作业管控：吊装吊点提前检查确认完好，吊具每班作业前检查，严禁超载吊装。","5.现场警戒管控：作业区域前后巷道设置警戒栏，严禁人员、车辆随意进入。","6.验收闭环管控：作业完成后，班组自检、验收，所有隐患当日清零归档。"]}]}],"w":2779,"cn":3,"sn":12},{"c":"YS-C-04","n":"气动单轨吊拆除","t":"YS-C-04 气动单轨吊拆除模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下气动单轨吊轨道、机车、悬吊组件拆除作业行为，统一施工工序流程、安全风险防控、拆除质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝重物坠落挤压、起吊构件滑落、管路高压伤人、顶板失效坠梁、物体打击、高空摔伤、气动元件爆裂伤人等安全事故，全面提升气动单轨吊拆除施工安全保障能力与整体安装质量，特制定本模块化作业方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有气动单轨吊拆除全工序作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：机修工、辅助工、班组长、安检员"]},{"t":"二、核心职责","p":["队长：拆除作业整体统筹、人员调配、考核管理。","安全技术副队长：拆除措施编制、技术交底、隐患督办、模块优化。","跟班副队长：拆除期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","机修工/辅助工：严格遵照模块化流程完成管路泄压拆卸、主机下放、轨道拆解、构件转运回收、现场清理作业，规范佩戴劳保用品，杜绝违章操作。","安检员：作业期间巡查监督，制止违章、闭环隐患。"]}]},{"t":"第三章 气动单轨吊安装模块","s":[{"t":"一、模块概述","p":["模块编号：YS-C-04","模块名称：气动单轨吊拆除","设备型号：DQ30/0.5、DQ20/0.5","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊重物挤压、坠落伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.轨道、主机拆卸后悬空坠落挤压伤人：拆解轨道、主机前提前搭设可靠起吊承载点，使用合格手拉葫芦预先兜吊固定，再拆解连接件。","5.高压风管泄压不到位崩脱伤人：拆卸管路前关闭压风总阀门，充分释放管路余压，严禁带压拆卸接头、U 型卡。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：作业现场无杂物、无积水、无油污，作业平台牢固可靠；巷道顶板、两帮支护完好，无浮矸危岩；巷道通风正常，作业区域照明充足；作业区域设置警戒隔离栏，禁止无关人员通行逗留。","2.设备（工具）确认：手拉葫芦、扳手、安全带、U型卡、连接销轴等齐全完好；吊具无裂纹、变形，高压风管无破损鼓包。","3.人员确认：作业人员必须持证上岗，身体状态良好，无疲劳作业、酒后作业、带病作业情况，情绪稳定，劳动防护用品穿戴到位，具备现场作业条件。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场退路畅通的安全区域，无视线遮挡，远离顶板巷帮离层掉落、无坠物、无构件摆动风险的安全侧方区域；全程统筹作业流程，紧盯起重牵引、高空作业等环节，不得擅自离岗，及时制止和纠正“三违”行为。","2.机修工/辅助工：严禁站在待拆轨道、单轨吊主机正下方、构件下放摆动范围、高压风管接头正对方向、拆解物料滚落路径内，严格听从班组长或指定的专人统一指令，杜绝误操作。"]},{"t":"五、标准化作业流程","p":["1.前期准备工作：","（1）备用工具准备：跟班队长负责准备不小于3T手拉葫芦2个、扳手1套、风动工具1套、安全带1个、吊具、卡扣、圆环链（直径不小于18mm）等齐全完好。","（2）所有参与人员贯彻学习安全技术措施或零星工程台账。","（3）安全确认：跟班队长、班组长、安检员负责第三大项（作业条件安全确认）内容。","（4）跟班队长、班组长负责隐患整改闭环。","拆除作业步骤：","（1）现场负责人指定专人负责现场设置警戒。","（2）现场负责人指定专人关闭气动装置气源，气动装置泄压，班组长负责对卸压情况进行确认。","（3）分段拆卸高压气动管路、分类收纳 → 搭建工作平台 → 预先兜吊固定单轨吊主机，拆除连接销轴 → 缓慢下放主机至转运车辆上稳固摆放 → 分段拆解轨道吊链、轨道节段 → 轨道分段下放转运。","（4）班组长负责平整路面，现场清理、设备清点、闭环验收。"]},{"t":"六、作业质量标准","p":["1.气动管路：所有风管分段拆解，U型卡、过滤器完好回收；管路无暴力撕扯破损，盘卷整齐，分类装车转运。","2.单轨吊主机：主机平稳落地，不得磕碰、摔砸造成设备二次损坏。","3.轨道系统：逐节拆解轨道连接销轴、吊链，不得强行撬砸扭曲轨道；轨道节段分段下放，避免弯折变形；吊链、吊挂螺栓、U 型卡全部清点回收。","4.收尾：作业区域整洁无遗留工具、废料。"]},{"t":"七、安全管控措施","p":["1.高压管路拆除管控：拆装管路前关闭压风总闸，完全释放管路余压后方可施工；严禁带压撬动风管 U 型卡；拆解管路时人员避开接头正对方向，防止余风带碎屑喷射伤人。","2.高空吊装管控：高空作业必须搭设稳固作业平台，登高超过2m时全程佩戴安全带；扳手、绳卡等工具小件手递手传递，严禁抛掷工具、物料。","3.起吊作业管控：吊装吊点提前检查确认完好，吊具每班作业前检查，严禁超载吊装。","4.现场警戒管控：作业区域前后10m范围设置警戒设施，非作业人员禁止随意进入。","5.构件转运堆放管控：下放后的主机直接摆放在材料车上，捆绑固定牢固，轨道按标准摆放在巷道一侧，使用防倒绳进行固定，防止滚动滑移。","6.验收闭环管控：作业完成后，班组自检、验收，所有隐患当日清零归档。"]}]}],"w":2153,"cn":3,"sn":12},{"c":"YS-C-05","n":"无极绳绞车移尾","t":"YS-C-05 无极绳绞车移尾模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下无极绳绞车尾轮装置拆除、移位、重新安装、张紧调试等工序作业行为，统一移尾工序操作流程、安全风险防控、基础固定、钢丝绳防护、安装验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝尾轮倾倒挤压、钢丝绳弹甩崩人、轨道跑车、基础锚固失效等安全事故，全面提升无极绳绞车移尾作业安全保障能力与运输标准化水平，特制定本模块化作业方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井井下所有无极绳绞车移尾现场安全管理。"]},{"t":"三、管理原则","p":["1.先确认、后作业；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。","3.班班有交底、班班有验收、班班有闭环、月月有考核。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：运输队队长","副组长：安全技术副队长、跟班副队长","成  员：无极绳绞车司机、跟车工（信号工）、机修工、辅助工、班组长、安检员"]},{"t":"二、核心职责","p":["队长：无极绳绞车移尾工作整体统筹、人员调配、考核管理。","安全技术副队长：无极绳绞车移尾工作措施编制、技术交底、隐患督办、模块优化。","跟班副队长：无极绳绞车移尾作业期间组织协调、人员站位及作业过程监督、突发险情应急处置。","班组长：当班工序分段管控、班组自检、班前风险告知、现场人员分工。","无极绳绞车司机/跟车工（信号工）：严格执行各岗位操作规程、规范传递信号、运输线路安全检查、保护试验、规范劳保用品穿戴，杜绝违章操作。","机修工/辅助工：板车固定、起吊移尾、打设地锚固定、紧固各部连接件，规范劳保用品穿戴，杜绝违章操作。","安检员：作业期间巡查监督，制止违章、闭环隐患。"]}]},{"t":"第三章 无极绳绞车移尾模块","s":[{"t":"一、模块概述","p":["模块编号：YS-C-05","模块名称：无极绳绞车移尾","所属专业：辅助运输","适用范围：全体作业人员"]},{"t":"二、危险预知及防控","p":["1.巷道片帮、顶板掉矸伤人：施工前敲帮问顶，处理危岩活矸。","2.高空作业人员失足摔伤：规范搭设稳固作业平台，超过2m时，作业人员佩戴安全带。","3.起吊重物挤压、坠落伤人：起吊前认真检查起吊点、起吊设备完好情况，严禁超负荷使用起吊工具，起吊时统一专人指挥，严禁生拉硬拽，人员远离重物摆动、受力、下坠区域。","4.尾轮装置固定不牢，挤压伤人：全煤底板运输大件时尾轮固定采用混凝土浇筑，斜巷段固定尾轮时，采用地锚固定。","5.板车松绳前未释放钢丝绳张力弹甩伤人：松绳前重新确认张紧液压缸缸体全部伸出（30型无极绳绞车）采用道木将配重块下部支实防止落地（80型无极绳绞车），板车前后严禁站人。","6.人员横穿轨道、站于钢丝绳受力区间被挤压、弹伤：移尾作业全程封闭作业巷道，严格执行警戒制度，禁止人员在钢丝绳两侧、轨道中间逗留。","7.移尾完毕后钢丝绳张紧力度不均，运行中脱槽、跳绳甩动伤人：移尾完毕后缓慢张紧钢丝绳，专人观察绳槽贴合状态，禁止一次性大行程张紧。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：移尾全程巷道顶板、两帮支护完整，无片帮、浮矸危岩；巷道通风稳定，作业沿线照明充足；移尾区域前后设置警戒绳，严禁无关人员随意进入作业区域。","2.工具、车辆确认：梭车、手拉葫芦、吊装吊链完好无裂纹；地锚、绳夹、螺栓配件齐全；液压张紧装置油量充足、无渗漏；张紧滑杠灵活无卡顿。","3.人员确认：作业人员必须持证上岗，身体状态良好，无疲劳作业、酒后作业、带病作业情况，情绪稳定，劳动防护用品穿戴到位，具备现场作业条件。","4.技术确认：所有作业人员完成安全技术交底，熟知作业流程、风险点、管控措施及应急处置方法，签字确认。"]},{"t":"四、作业现场人员安全站位","p":["1.管理人员：站在作业现场视野开阔的安全主控区域，远离钢丝绳牵引、弹甩路径，全程统筹作业流程，不得擅自离岗、进入作业危险区。","2.安全监护人：定点站在作业核心危险区域旁，无视线遮挡，全程紧盯钢丝绳拆装、起吊牵引、地锚固定环节，及时制止和纠正“三违”行为。","3.无极绳绞车司机/跟车（信号）工：固定在设备操作区域安全站位，操作期间专注设备操控，严禁离岗操作，严格听从班组长或指定的专人统一指令，杜绝误操作。","4.机修工/辅助工：站在钢丝绳侧面安全区域，与钢丝绳摆动、回弹区域保持安全距离，严禁站在钢丝绳直线受力方向、绳头正前方、起吊物正下方；多人抬运、起吊尾架时人员两侧错开站位，禁止正面相对；张紧调试阶段人员远离绳道两侧，不得站在钢丝绳内侧。"]},{"t":"五、标准化作业流程","p":["开车前设置警戒→指定司机、信号工进行保护试验并开车前安全确认→把板车运行至机尾合适位置使用圆环链固定牢固→将前段钢丝绳使用圆环链绳卡锁至轨道上→松开张紧液压缸并停电闭锁、挂牌上锁→松开板车上的固定绳卡→钢丝绳从桃形环松开→用手拉葫芦将地锚拉出→拆除尾轮固定横杠→将尾轮移至指定位置→安装尾轮横杠并打设地锚→用手拉葫芦张紧钢丝绳→将桃形环收紧使用绳卡将钢丝绳两端锁紧→拆除手拉葫芦和固定圆环链→恢复送电并张紧液压缸（拆除配重块下方道木）→班组长安全确认→试运行→将板车停放至正常停车位→拆除警戒"]},{"t":"六、作业质量标准","p":["1.无极绳牵引系统：绞车制动灵敏可靠，声光信号、急停闭锁动作正常；液压张紧装置无渗漏，张紧行程均匀，钢丝绳松紧适度，无跳绳、脱槽隐患。","2.尾轮固定标准：新基础底板夯实平整，地锚不得少于4根、深度不得小于1.2m。","3.钢丝绳及绳夹标准：钢丝绳无扭结、断丝、锈蚀超标；尾轮处绳夹数量、间距符合规范，U 型扣压在钢丝绳副绳侧，紧固无松动；钢丝绳完全贴合尾轮绳槽，无挤压、扭折。","4.吊装工具：手拉葫芦、吊链逐件检查，变形、裂纹、锈蚀严重工具禁止投入使用。"]},{"t":"七、安全管控措施","p":["1.巷道顶板帮部管控：作业前必须敲帮问顶，危岩活矸处理完毕方可施工。","2.钢丝绳管控：释放张紧力缓慢操作，严禁快速泄压造成钢丝绳弹蹦。","3.起吊作业管控：起吊设专职统一指挥，吊具每班开工前外观检查，严禁超载起吊；吊物摆动、正下方严禁站人，工具手递手传递，禁止抛掷。","4.地锚质量管控：地锚打设深度、数量符合要求，未验收合格不得穿绳张紧。","5.试运行监护管控：空载试运行安排专人全程观察绳道、尾轮、轨道运行状态，出现跳绳、磨绳、底座晃动立即停机重新调整。","6.验收闭环管控：作业完成后，班组自检、验收，所有隐患当日清零归档。"]}]}],"w":2369,"cn":3,"sn":12}],"os":"三","rn":"低风险","rc":"蓝","rg":"C","n":5,"label":"低风险 · 蓝色 C段"}],"no":"05","name":"运输作业模块"},{"t":"第六部分 通风作业模块","g":[{"t":"一、高风险-红色-A段（1项）","lv":"A","m":[{"c":"TF-A-01","n":"排放瓦斯现场","t":"TF-A-01 排放瓦斯现场模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范排放瓦斯作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生人员窒息、瓦斯爆炸等安全隐患，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有地点排放瓦斯作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先贯彻、后作业；先确认、后施工；不安全、不生产。","2.流程一步不省、标准一点不降、风险一项不漏。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：通风队队长","副组长：通风队安全技术副队长、班组长","成  员：救护队员、瓦斯检查工、通风工"]},{"t":"二、核心职责","p":["队长：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","班组长：班前会交底、现场组织协调、作业过程监督。当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章 排放瓦斯模块","s":[{"t":"一、模块概述","p":["模块编号：TF-A-01","模块名称：排放瓦斯","所属专业：通风","适用范围：通风队所有人员"]},{"t":"二、危险预知及防控","p":["1.人员窒息的风险：当班无关人员全部安全撤离、设置警戒，确认无误后报生产调度室。","2.停电落实不到位，有可能引起瓦斯爆炸的风险：排放瓦斯前确保排放瓦斯所流经区域所有机电设备断电后报生产调度室。","3.瓦斯超限的风险：如果有局部瓦斯超限必须先处理到位后，方可排放瓦斯。","4.片帮、掉顶伤人风险：有片帮冒顶或有矸石掉落情形，及时上报生产调度室和现场负责人，采取措施后方可继续作业。"]},{"t":"三、作业条件安全确认","p":["1.环境确认：对作业地点前后10m范围内进行安全确认，重点检查作业范围的支护是否牢固完好、安全退路是否畅通。","2.有毒有害气体确认：甲烷以及二氧化碳不能超过规定，施工地点通风正常。","3.仪器及设备确认：瓦斯检测仪完好，铜锤、铜钎子齐全，局部通风机完好。","4.人员确认：警戒人员全部到位，救护队员到位，瓦斯检查工及机电检修工全部到位。"]},{"t":"四、作业现场人员安全站位","p":["1.站在支护完好，无片帮或积水的地方。","2.站在新鲜风流处。"]},{"t":"五、标准化作业流程","p":["瓦斯排放措施贯彻到位→安全确认→警戒→断电→撤人→→排放瓦斯→检查有害气体→恢复正常"]},{"t":"六、作业质量标准","p":["1.排放瓦斯方法：依据排放瓦斯安全技术措施中规定的排放瓦斯方法执行，严禁“一风吹”，确保排放瓦斯巷道回风流中瓦斯浓度不超过0.5%。","2.排放瓦斯前的瓦斯要求：打开栅栏或启封密闭前，首先检查栅栏外或密闭外有害气体浓度，甲烷浓度不超过0.5%时，方可拆除栅栏或启封密闭。","3.局部通风机要求：局部通风机运行前，由瓦斯检查工检查局部通风机前进风流中甲烷浓度，当甲烷浓度不超过0.5%时，并在排放瓦斯与全风压风流汇合处悬挂便携式甲烷检测报警仪以及一氧化碳检测报警仪后，报现场负责人。局部通风机排放瓦斯时，先检查作业地点栅栏外的甲烷浓度，经检查栅栏外的甲烷浓度不超过0.5%时，方可进行瓦斯排放。","4.排放瓦斯标准：排放瓦斯巷道内风流中甲烷浓度小于0.5%，二氧化碳浓度小于0.5%。同时，受影响的巷道风流中甲烷浓度在0.5%以下。没有局部瓦斯聚积现象（体积大于0.5 m3，甲烷浓度达到2%）。","5.排放时间标准：排放巷道及回风流中瓦斯、二氧化碳浓度达到以上标准，且稳定时间在30分钟以上。"]},{"t":"七、安全管控措施","p":["1.措施管控：由总工程师组织排放瓦斯专项安全风险辨识后编制专项排放瓦斯措施，严格履行审批手续，严禁无措施排放瓦斯。","2.瓦斯管控：排放瓦斯前，瓦斯检查工必须检查全风压进风流中的甲烷浓度，只有当甲烷浓度不超过0.5%时，方可进行排放瓦斯。","3.风量管控：控制风量进行排放瓦斯，严禁“一风吹”。","4.闭环管控：排放完成后全面检查，确认巷道内有害气体浓度符合规定，方可解除警戒、汇报生产调度室。"]}]}],"w":1447,"cn":3,"sn":12}],"os":"一","rn":"高风险","rc":"红","rg":"A","n":1,"label":"高风险 · 红色 A段"},{"t":"二、中风险-橙色-B段（7项）","lv":"B","m":[{"c":"TF-B-01","n":"密闭构筑现场","t":"TF-B-01 密闭构筑现场模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范密闭构筑作业行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生人员跌落、片帮等安全隐患，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有地点密闭构筑作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先贯彻、后作业；先确认、后施工；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：通风队队长","副组长：通风队安全技术副队长、班组长","成  员：瓦斯检查工、通风工"]},{"t":"二、核心职责","p":["队长：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","班组长：班前会交底、现场组织协调、作业过程监督。当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章  密闭构筑模块","s":[{"t":"一、模块概述","p":["模块编号：TF-B-01","模块名称：密闭构筑","所属专业：通风","适用范围：密闭施工所有作业人员"]},{"t":"二、危险预知及防控","p":["1.片帮冒顶砸伤 ：作业前安排专人进行敲帮问顶，施工地点前后10m范围内进行安全确认。掏槽时应从下向上进行做到先底后帮，采用前后掏梁窝的方式对帮顶进行临时支护，防止掏槽期间发生冒顶或片帮。","2.作业平台不牢固伤人：必须专用材料搭建作业平台。","3.掏槽时容易发生片帮伤人：作业前要检查作业地点的甲烷及二氧化碳进行检查，作业地点进风流前要悬挂甲烷便携式检测仪。"]},{"t":"三、作业条件安全确认","p":["1.有毒有害气体确认：甲烷以及二氧化碳不能超过规定，施工地点通风正常。","2.工具确认：检测仪器完好，瓦刀、泥抹、脚手架、卷尺、线绳。"]},{"t":"四、作业现场人员安全站位","p":["1.严格执行敲帮问顶制度，站在支护完好、无危岩片帮的安全位置作业。","2.构筑墙体时，作业人员必须站在牢固平台上作业，严禁站在架板边缘运输、传递物料，身体重心稳定，严禁踩踏临时搭设的不稳定结构。","3.施工地点作业平台超过2m时，平台上作业人员要佩戴安全带。"]},{"t":"五、标准化作业流程","p":["安全确认→掏底槽→铺底→掏帮槽→砌筑墙体→搭建平台→封顶→清理杂物→通风科组织验收"]},{"t":"六、作业质量标准","p":["1.密闭位置：密闭距巷道口4m-5m。","2.密闭裙边：墙体四周抹有不小于0.1m的裙边，确保墙体周边不漏风。","3.墙面平整度：墙面1m2内凹凸不大于10mm。","4.三管安装：观测管、措施管与采空区连通，伸入采空区密闭墙500mm，管口的控制阀门必须引至密闭墙体外。观测管直径不小于25mm，设在墙高的2/3处，措施管直径不小于100mm，安设在密闭顶部，反水管直径不小于50mm距底板不大于300mm。"]},{"t":"七、安全管控措施","p":["1.墙体施工管控：参与密闭构筑人员必须认真学习本方案，熟悉方案有关规定。施工期间，由通风队安排人员监督墙体构筑质量，安检员监督落实。","2.有毒有害气体管控：施工期间，施工地点必须悬挂便携式甲烷检测报警仪，由该区域瓦斯检查员检查施工地点的甲烷和二氧化碳浓度，当施工地点风流甲烷以及二氧化碳浓度超过规定时，必须停止作业，并汇报生产调度室。","3.风镐使用管控：使用前应认真检查，确保风镐的滤网无堵塞，缸体与阀体间风道畅通无阻，镐体及其与钢套固定可靠，阻塞阀灵活。工作时应检查镐体等部件完好情况，防止镐钎歪偏或卡死。","4.墙体周边掏槽管控：施工前检查，班组长应对作业地点支护进行检查，对作业地点存在的烂帮烂顶及时进行处理，确保作业地点支护牢固可靠。掏槽时，应从下向上进行做到先底后帮，采用前后掏梁窝的方式对帮顶进行临时支护，防止掏槽期间发生冒顶或片帮。若作业地点帮顶松软，应采取排钎椽的方法，边排钎椽边剔顶或刷帮，确保施工期间帮顶稳固。","5.验收环节管控：由矿领导组织进行验收，不符合构筑标准的要推倒重建。"]}]}],"w":1446,"cn":3,"sn":12},{"c":"TF-B-02","n":"风路调整","t":"TF-B-02 风路调整模块化作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范风路调整行为，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生人员窒息、瓦斯超限等安全隐患，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有地点风路调整作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先贯彻、后作业；先确认、后施工；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：通风队队长","副组长：通风队安全技术副队长、班组长","成  员：瓦斯检查工、测风工"]},{"t":"二、核心职责","p":["队长：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","班组长：班前会交底、现场组织协调、作业过程监督。当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章  风路调整模块","s":[{"t":"一、模块概述","p":["模块编号：TF-B-02","模块名称：风路调整","所属专业：通风","适用范围：通风队所有人员"]},{"t":"二、危险预知及防控","p":["1.通风设施不完好：加强对通风设施检查以及维护。","2.通风短路风流紊乱：确保作业地点有足够风量、发现瓦斯浓度升高及时撤出人员，汇报生产调度室，采取进行处理后方可作业。"]},{"t":"三、作业条件安全确认","p":["1.通风设施确认：要对涉及区域内通风设施进行检查，发现问题及时进行处理，确保通风设施可靠。","2.风路调整时间确认：风路调整时，要请示矿生产调度室影响区域内停止作业后方可进行。","3.工具确认：风速表、钢尺、秒表、便携式瓦斯检测仪。"]},{"t":"四、作业现场人员安全站位","p":["1.站在支护完好、选择巷道平直、无危岩片帮的安全位置作业。","2.斜巷测风时作业人员要注意防滑。","3.测风时确认前后十米范围内无行人及巷道无堆放杂物。"]},{"t":"五、标准化作业流程","p":["安全确认→测量巷道断面积→核算断面积→进行测量→数据核算→记录数据→填写牌板"]},{"t":"六、作业质量标准","p":["1.测风条件标准：测风地点前后10m范围内无行人、巷道无杂物。","2.测风数据标准：按操作流程进行测风，同一地点连续测3次，单次读数差值不超过规定范围，取平均值。根据表速、巷道面积，结合风表校正系数，计算实际风量，填写数据，且数据真实可靠。","3.风流路线标准：按照风路调整方案进行风路调整。"]},{"t":"七、安全管控措施","p":["1.通风设施管控：通风队提前安排人员按要求检查或者构筑通风设施，并检查所涉及区域内的通风设施完好情况。","2.人员管控：测风人员按时到达作业地点，根据调风指令对分管地点的风量进行测定，并将所测数据及时汇报通风科。","3.有毒有害气体管控：在风路调整期间瓦斯检查员和监测监控值班人员密切关注该区域内瓦斯变化情况，确保甲烷以及二氧化碳不能超过规定。"]}]}],"w":1007,"cn":3,"sn":12},{"c":"TF-B-03","n":"风门构筑","t":"TF-B-03 风门构筑模块作业流程及管控措施","ch":[{"t":"第一章 方案总则","s":[{"t":"一、编制目的","p":["为规范井下各地点风门构筑，统一施工流程、安全风险防控、质量验收标准，实现流程标准化、操作规范化、风险可控化、验收闭环化，杜绝发生人员跌落、片帮等安全隐患，特制定本方案。"]},{"t":"二、适用范围","p":["本方案适用于矿井所有地点风门构筑作业、现场管理全过程。"]},{"t":"三、管理原则","p":["1.先贯彻、后作业；先确认、后施工；不安全、不作业。","2.流程一步不省、标准一点不降、风险一项不漏。"]}]},{"t":"第二章 组织机构及职责","s":[{"t":"一、组织架构","p":["组  长：通风队队长","副组长：通风队安全技术副队长、班组长","成  员：瓦斯检查工、构筑风门施工人员"]},{"t":"二、核心职责","p":["队长：全面负责模块化管理。","安全技术副队长：标准卡制定、技术交底、隐患督办、考核落实、模块修订优化。","班组长：班前会交底、现场组织协调、作业过程监督。当班自检复检、问题上报。","安检员：安全条件确认、风险防控监督、违章行为制止、作业标准过程监督。","操作人员：严格按模块标准卡作业、落实互保联保、自检自查、文明施工。"]}]},{"t":"第三章  风门构筑模块","s":[{"t":"一、模块概述","p":["模块编号：TF-B-03","模块名称：风门构筑","所属专业：通风","适用范围：通风队所有人员"]},{"t":"二、危险预知及防控","p":["1.片帮冒顶砸伤 ：作业前敲帮问顶，施工地点前后10m范围内进行安全确认。","2.作业平台不牢固伤人：必须专用材料搭建作业平台。"
